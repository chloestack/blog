<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="2026-10-11-dd544fa0-01-cursor-rules-title 2026-10-11-dd544fa0-01-cursor-rules-desc">
  <title id="2026-10-11-dd544fa0-01-cursor-rules-title">Cursor Rules 없이 반복되는 컨텍스트 소모 문제</title>
  <desc id="2026-10-11-dd544fa0-01-cursor-rules-desc">개발자가 매번 AI 채팅창에 컨텍스트를 설명하고, AI가 생성한 코드가 컨벤션과 맞지 않아 코드 리뷰 반려로 이어지는 반복 흐름을 보여주는 플로우차트.</desc>

  <defs>
    <marker id="2026-10-11-dd544fa0-01-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
    <marker id="2026-10-11-dd544fa0-01-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="300" fill="#f8fafb"/>

  <!-- ── Connectors (drawn before boxes) ── -->

  <!-- Dev → Chat -->
  <line x1="200" y1="128" x2="304" y2="128" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-11-dd544fa0-01-arrow-muted)"/>
  <!-- label mask + text -->
  <rect x="218" y="108" width="68" height="14" rx="2" fill="#f8fafb"/>
  <text x="252" y="119" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">매번 설명</text>

  <!-- Chat → Code -->
  <line x1="456" y1="128" x2="560" y2="128" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-11-dd544fa0-01-arrow-muted)"/>
  <rect x="462" y="108" width="88" height="14" rx="2" fill="#f8fafb"/>
  <text x="506" y="119" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">컨텍스트 소모</text>

  <!-- Code → Review -->
  <line x1="712" y1="128" x2="756" y2="128" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-11-dd544fa0-01-arrow-muted)"/>
  <rect x="706" y="108" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="736" y="119" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">불일치</text>

  <!-- ── Node: 개발자 (Input) ── -->
  <rect x="60" y="96" width="140" height="64" rx="6" fill="#f8fafb"/>
  <rect x="60" y="96" width="140" height="64" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <!-- tag -->
  <rect x="68" y="104" width="32" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="84" y="113" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <!-- name -->
  <text x="130" y="137" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">개발자</text>

  <!-- ── Node: AI 채팅창 (focal) ── -->
  <rect x="304" y="96" width="152" height="64" rx="6" fill="#f8fafb"/>
  <rect x="304" y="96" width="152" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- tag -->
  <rect x="312" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="326" y="113" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
  <!-- name -->
  <text x="380" y="131" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">AI 채팅창</text>
  <!-- sublabel -->
  <text x="380" y="148" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">컨텍스트 소모</text>

  <!-- ── Node: 생성된 코드 (Backend) ── -->
  <rect x="560" y="96" width="152" height="64" rx="6" fill="#f8fafb"/>
  <rect x="560" y="96" width="152" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- tag -->
  <rect x="568" y="104" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="586" y="113" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
  <!-- name -->
  <text x="636" y="131" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">생성된 코드</text>
  <!-- sublabel -->
  <text x="636" y="148" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">컨벤션 불일치</text>

  <!-- ── Node: 코드 리뷰 반려 (Store/State — outcome) ── -->
  <rect x="756" y="96" width="144" height="64" rx="6" fill="#f8fafb"/>
  <rect x="756" y="96" width="144" height="64" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <!-- tag -->
  <rect x="764" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="784" y="113" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW</text>
  <!-- name -->
  <text x="828" y="128" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">코드 리뷰</text>
  <text x="828" y="148" fill="#3f545c" font-size="13" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">반려</text>

  <!-- ── Legend strip ── -->
  <line x1="32" y1="228" x2="928" y2="228" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend: 입력 -->
  <rect x="32" y="240" width="14" height="14" rx="3" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="52" y="251" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">입력</text>

  <!-- legend: AI / 핵심 단계 -->
  <rect x="112" y="240" width="14" height="14" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="132" y="251" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">핵심 단계</text>

  <!-- legend: 처리 단계 -->
  <rect x="236" y="240" width="14" height="14" rx="3" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="256" y="251" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">처리 단계</text>

  <!-- legend: 결과 -->
  <rect x="356" y="240" width="14" height="14" rx="3" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="376" y="251" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">결과</text>
</svg>
</body>
