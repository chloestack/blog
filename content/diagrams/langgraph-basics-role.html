<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangGraph가 앉는 자리</title>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f8fafb; --ink:#122127; --muted:#3f545c; --soft:#6c8188; --accent:#0d5763;
      --sans:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: 'Gothic A1', var(--sans); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · LangGraph 입문</p>
    <h1>LangGraph는 LLM을 대신하지 않는다 — 앱과 도구 사이에 앉는다</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lg-role-title lg-role-desc">
      <title id="lg-role-title">LangGraph가 앉는 자리</title>
      <desc id="lg-role-desc">사용자 질문을 받은 LangGraph가 지금까지 쌓인 상태를 들고 LLM 호출과 검색·DB·API 실행을 차례로 지시하고, 그 결과를 되돌려받아 다시 다음 단계를 정한 뒤 최종 답변을 내보내는 구조를 보여준다.</desc>
      <defs>
        <marker id="lg-role-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f545c"/></marker>
        <marker id="lg-role-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d5763"/></marker>
        <marker id="lg-role-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6c8188"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafb"/>

      <!-- arrows first, boxes after -->
      <!-- 사용자 질문 -> LangGraph -->
      <line x1="192" y1="224" x2="296" y2="224" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-role-arrow)"/>
      <!-- LangGraph -> LLM 호출 (out, upper) -->
      <path d="M540,188 H616 Q624,188 624,180 V112 Q624,104 632,104 H696" fill="none" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-role-arrow)"/>
      <!-- LLM 호출 -> LangGraph (return, dashed) -->
      <path d="M700,128 H656 Q648,128 648,136 V204 Q648,212 640,212 H544" fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#lg-role-arrow-soft)"/>
      <!-- LangGraph -> 검색·DB·API (out, lower) -->
      <path d="M540,236 H616 Q624,236 624,244 V272 Q624,280 632,280 H696" fill="none" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-role-arrow)"/>
      <!-- 검색·DB·API -> LangGraph (return, dashed) -->
      <path d="M700,312 H656 Q648,312 648,304 V268 Q648,260 640,260 H544" fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#lg-role-arrow-soft)"/>
      <!-- LangGraph -> 최종 답변 -->
      <line x1="420" y1="280" x2="420" y2="360" stroke="#0d5763" stroke-width="1.4" marker-end="url(#lg-role-arrow-accent)"/>

      <!-- nodes -->
      <!-- 사용자 질문 (input) -->
      <rect x="40" y="192" width="152" height="64" rx="6" fill="#f8fafb"/>
      <rect x="40" y="192" width="152" height="64" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="116" y="229" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">사용자 질문</text>

      <!-- LangGraph (focal) -->
      <rect x="300" y="168" width="240" height="112" rx="6" fill="#f8fafb"/>
      <rect x="300" y="168" width="240" height="112" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
      <rect x="312" y="180" width="72" height="16" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
      <text x="348" y="192" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRAPH</text>
      <text x="420" y="228" fill="#122127" font-size="16" font-weight="600" font-family="'Gothic A1', 'IBM Plex Sans KR', sans-serif" text-anchor="middle">LangGraph</text>
      <text x="420" y="252" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">상태 보관 · 다음 단계 결정</text>

      <!-- LLM 호출 -->
      <rect x="700" y="72" width="180" height="64" rx="6" fill="#f8fafb"/>
      <rect x="700" y="72" width="180" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="790" y="109" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">LLM 호출</text>

      <!-- 검색 · DB · API (store) -->
      <rect x="700" y="264" width="180" height="64" rx="6" fill="#f8fafb"/>
      <rect x="700" y="264" width="180" height="64" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
      <text x="790" y="301" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">검색 · DB · API</text>

      <!-- 최종 답변 -->
      <rect x="300" y="360" width="240" height="64" rx="6" fill="#f8fafb"/>
      <rect x="300" y="360" width="240" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="420" y="397" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">최종 답변</text>

      <!-- legend -->
      <line x1="40" y1="460" x2="920" y2="460" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
      <text x="40" y="484" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="480" x2="172" y2="480" stroke="#3f545c" stroke-width="1.2"/>
      <text x="180" y="484" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">지시</text>
      <line x1="248" y1="480" x2="280" y2="480" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="288" y="484" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">결과 반환</text>
      <rect x="400" y="472" width="16" height="16" rx="4" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
      <text x="424" y="484" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">오케스트레이션 계층</text>
    </svg>
  </div>
</body>
</html>
