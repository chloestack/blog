<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreadLocal vs Scoped Values</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg
  viewBox="0 0 960 480"
  xmlns="http://www.w3.org/2000/svg"
  role="img"

>
  <title id="2026-09-23-742bf48b-06-sv-title">ThreadLocal vs Scoped Values 패턴 비교</title>
  <desc id="2026-09-23-742bf48b-06-sv-desc">ThreadLocal 패턴은 set → get → remove 단계를 수동으로 관리해야 하며 remove를 잊으면 누수·오염이 발생한다. Scoped Values 패턴은 where(K,V).run()으로 스코프를 시작하면 get이 스코프 안에서만 동작하고 스코프 종료 시 자동 해제된다.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-09-23-742bf48b-06-sv-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-23-742bf48b-06-sv-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- warn 화살표 -->
    <marker id="2026-09-23-742bf48b-06-sv-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="480" fill="#f8fafb"/>

  <!-- ── 레인 배경 ── -->
  <!-- ThreadLocal 레인 -->
  <rect x="20" y="32" width="920" height="168" rx="8" fill="rgba(18,33,39,0.03)" stroke="#c3d0d4" stroke-width="0.8"/>
  <!-- 레인 라벨 -->
  <text x="36" y="52" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" font-weight="500" letter-spacing="0.14em">THREAD LOCAL</text>

  <!-- Scoped Values 레인 -->
  <rect x="20" y="224" width="920" height="196" rx="8" fill="rgba(13,87,99,0.04)" stroke="#0d5763" stroke-width="0.8" stroke-dasharray="4,4"/>
  <!-- 레인 라벨 -->
  <text x="36" y="244" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" font-weight="500" letter-spacing="0.14em">SCOPED VALUES</text>

  <!-- ══════════════════════════════════════════════════════
       ARROWS — drawn before boxes
       ══════════════════════════════════════════════════════ -->

  <!-- ThreadLocal: TL → S1 (set) -->
  <path d="M 228,116 L 320,116" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-06-sv-arrow)"/>

  <!-- S1 → G1 (get) -->
  <path d="M 504,116 L 588,116" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-06-sv-arrow)"/>

  <!-- G1 → R1 (remove) -->
  <path d="M 760,116 L 820,116" fill="none" stroke="#a96a08" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-06-sv-arrow-warn)"/>

  <!-- Scoped Values: SV → B (where run) -->
  <path d="M 228,312 L 320,312" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-23-742bf48b-06-sv-arrow-accent)"/>

  <!-- B → G2 (get — 위로 분기) -->
  <path d="M 504,296 L 504,276 L 588,276" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-06-sv-arrow-accent)"/>

  <!-- B → E2 (스코프 종료 — 아래로 분기) -->
  <path d="M 504,328 L 504,348 L 588,348" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-06-sv-arrow-accent)"/>


  <!-- ══════════════════════════════════════════════════════
       NODES — ThreadLocal 레인
       ══════════════════════════════════════════════════════ -->

  <!-- TL: ThreadLocal 패턴 (입력 노드) -->
  <rect x="60" y="84" width="168" height="64" rx="6" fill="#f8fafb"/>
  <rect x="60" y="84" width="168" height="64" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <rect x="68" y="90" width="36" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="86" y="99" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">패턴</text>
  <text x="144" y="121" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">ThreadLocal</text>
  <text x="144" y="138" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">패턴</text>

  <!-- S1: set() -->
  <rect x="320" y="84" width="184" height="64" rx="6" fill="#f8fafb"/>
  <rect x="320" y="84" width="184" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="328" y="90" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="342" y="99" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">단계</text>
  <text x="412" y="118" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">set()</text>
  <text x="412" y="133" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">어디서든 값 변경 가능</text>

  <!-- G1: get() -->
  <rect x="588" y="84" width="172" height="64" rx="6" fill="#f8fafb"/>
  <rect x="588" y="84" width="172" height="64" rx="6" fill="rgba(40,109,80,0.10)" stroke="#286d50" stroke-width="1"/>
  <rect x="596" y="90" width="28" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="610" y="99" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">단계</text>
  <text x="674" y="121" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">get() 호출</text>

  <!-- R1: remove() — warn -->
  <rect x="820" y="84" width="100" height="64" rx="6" fill="#f8fafb"/>
  <rect x="820" y="84" width="100" height="64" rx="6" fill="rgba(169,106,8,0.10)" stroke="#a96a08" stroke-width="1"/>
  <rect x="828" y="90" width="28" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="842" y="99" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">주의</text>
  <text x="870" y="116" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">remove()</text>
  <text x="870" y="131" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">잊으면 누수·오염</text>

  <!-- ══════════════════════════════════════════════════════
       NODES — Scoped Values 레인
       ══════════════════════════════════════════════════════ -->

  <!-- SV: Scoped Values 패턴 (focal) -->
  <rect x="60" y="280" width="168" height="64" rx="6" fill="#f8fafb"/>
  <rect x="60" y="280" width="168" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="68" y="286" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="86" y="295" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">패턴</text>
  <text x="144" y="317" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Scoped Values</text>
  <text x="144" y="334" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">패턴</text>

  <!-- B: where(K,V).run() (focal) -->
  <rect x="320" y="280" width="184" height="64" rx="6" fill="#f8fafb"/>
  <rect x="320" y="280" width="184" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="328" y="286" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="346" y="295" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">시작</text>
  <text x="412" y="310" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">where(K, V).run()</text>
  <text x="412" y="326" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스코프 시작·바인딩</text>

  <!-- G2: get() — 스코프 안 (ok) -->
  <rect x="588" y="248" width="172" height="56" rx="6" fill="#f8fafb"/>
  <rect x="588" y="248" width="172" height="56" rx="6" fill="rgba(40,109,80,0.10)" stroke="#286d50" stroke-width="1"/>
  <rect x="596" y="254" width="28" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="610" y="263" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">단계</text>
  <text x="674" y="278" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">get() 호출</text>
  <text x="674" y="293" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스코프 안에서</text>

  <!-- E2: 스코프 종료 (ok) -->
  <rect x="588" y="320" width="172" height="56" rx="6" fill="#f8fafb"/>
  <rect x="588" y="320" width="172" height="56" rx="6" fill="rgba(40,109,80,0.10)" stroke="#286d50" stroke-width="1"/>
  <rect x="596" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="610" y="335" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">종료</text>
  <text x="674" y="350" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스코프 종료</text>
  <text x="674" y="365" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자동 해제</text>

  <!-- ══════════════════════════════════════════════════════
       LEGEND
       ══════════════════════════════════════════════════════ -->
  <line x1="30" y1="432" x2="930" y2="432" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- 범례 항목들 -->
  <rect x="30" y="444" width="12" height="12" rx="2" fill="rgba(40,109,80,0.10)" stroke="#286d50" stroke-width="1"/>
  <text x="48" y="454" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">정상 흐름</text>

  <rect x="150" y="444" width="12" height="12" rx="2" fill="rgba(169,106,8,0.10)" stroke="#a96a08" stroke-width="1"/>
  <text x="168" y="454" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">주의 필요</text>

  <rect x="270" y="444" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="288" y="454" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Scoped Values 핵심 단계</text>

  <rect x="480" y="444" width="12" height="12" rx="2" fill="rgba(18,33,39,0.03)" stroke="#c3d0d4" stroke-width="0.8"/>
  <text x="498" y="454" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">ThreadLocal 레인</text>

  <rect x="640" y="444" width="12" height="12" rx="2" fill="rgba(13,87,99,0.04)" stroke="#0d5763" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="658" y="454" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Scoped Values 레인</text>

</svg>
