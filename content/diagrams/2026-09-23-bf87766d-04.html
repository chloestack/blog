<!DOCTYPE html>
<html lang="ko">
<head>

<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-23-bf87766d-04-semantic-cache-title 2026-09-23-bf87766d-04-semantic-cache-desc">
  <title id="2026-09-23-bf87766d-04-semantic-cache-title">Semantic Cache LLM 요청 흐름</title>
  <desc id="2026-09-23-bf87766d-04-semantic-cache-desc">애플리케이션 서버가 L1 인메모리 캐시, L2 Semantic Cache, LLM API 순으로 요청을 처리하는 3단계 캐시 계층 흐름도. 각 단계에서 히트 시 즉시 반환하고 미스 시 다음 단계로 넘어간다.</desc>

  <defs>
    <!-- Arrow markers -->

      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-23-bf87766d-04-sc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-23-bf87766d-04-sc-arrow-hit" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-09-23-bf87766d-04-sc-arrow-miss" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>

         L2   = 480
         MED  = 720   (hit branch, right)
         LLM  = 480
         STORE= 480

         APP   = 76
         L1    = 172
         FAST  = 172
         L2    = 288
         MED   = 288
         LLM   = 404
         STORE = 504
  ══════════════════════════════════════════════ -->

  <text x="472" y="229" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">미스</text>

  <rect x="370" y="148" width="220" height="48" rx="6" fill="#f8fafb"/>
  <rect x="370" y="148" width="220" height="48" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>

  <text x="720" y="188" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">5–20 ms</text>

  <rect x="370" y="264" width="220" height="48" rx="6" fill="#f8fafb"/>
  <rect x="370" y="264" width="220" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="378" y="270" width="20" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="388" y="279" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
  <text x="480" y="290" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">L2 Semantic Cache</text>
  <text x="480" y="304" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Redis · Qdrant</text>

  <rect x="620" y="264" width="200" height="48" rx="6" fill="#f8fafb"/>

  <rect x="628" y="270" width="36" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.4)" stroke-width="0.8"/>

  <text x="720" y="290" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">캐시 응답 반환</text>
  <text x="720" y="304" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">100–200 ms</text>

  <rect x="380" y="380" width="200" height="48" rx="6" fill="#f8fafb"/>
  <rect x="380" y="380" width="200" height="48" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>

  <text x="400" y="495" fill="rgba(18,33,39,0.45)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="480" y="508" fill="#3f545c" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">L1 · L2 동시 저장</text>

  <text x="142" y="570" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">캐시 계층 (핵심)</text>

  <text x="442" y="570" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">응답 반환</text>

  <!-- External swatch -->

  <text x="582" y="570" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">외부 API</text>

  <!-- Optional/dashed swatch -->
  <rect x="680" y="560" width="16" height="12" rx="2" fill="rgba(18,33,39,0.02)" stroke="rgba(18,33,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="702" y="570" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">저장 (비동기)</text>

  <!-- Miss arrow swatch -->
  <line x1="820" y1="565" x2="850" y2="565" stroke="#6c8188" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="856" y="570" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">미스</text>

</svg>
