<body>
<svg

  <title id="2026-09-29-67f67d8d-06-cache-flowchart-title">Prompt Caching 전략 선택 흐름도</title>
  <desc id="2026-09-29-67f67d8d-06-cache-flowchart-desc">서비스 패턴 분석에서 시작해 트래픽 안정성, Prefix 토큰 수, 일일 호출 횟수를 순서대로 확인하여 Anthropic 명시적 캐싱 또는 OpenAI 자동 캐싱을 권장하는 의사결정 흐름도.</desc>

  <defs>

    <marker id="2026-09-29-67f67d8d-06-cf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </marker>
    <marker id="2026-09-29-67f67d8d-06-cf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Label: 아니오 -->
  <rect x="302" y="310" width="44" height="16" rx="2" fill="#f8fafb"/>
  <text x="324" y="321" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- Q1 → Q2 (예 / horizontal) -->

  <rect x="390" y="184" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="402" y="194" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <polygon points="708,168 760,200 708,232 656,200" fill="#f8fafb"/>
  <!-- styled diamond — accent tint -->

  <!-- styled box -->
  <rect x="648" y="296" width="120" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- type tag -->
  <rect x="656" y="302" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="672" y="311" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PICK</text>
  <!-- label -->
  <text x="708" y="334" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Anthropic</text>
  <text x="708" y="350" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">명시적 캐싱</text>
