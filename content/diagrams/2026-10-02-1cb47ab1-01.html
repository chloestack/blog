<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티모달 RAG 파이프라인</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-02-1cb47ab1-01-rag-pipeline-title 2026-10-02-1cb47ab1-01-rag-pipeline-desc">
  <title id="2026-10-02-1cb47ab1-01-rag-pipeline-title">멀티모달 RAG 파이프라인</title>
  <desc id="2026-10-02-1cb47ab1-01-rag-pipeline-desc">PDF 문서에서 텍스트·이미지·표를 분리하고 각각 임베딩하여 벡터 DB에 저장하는 멀티모달 RAG 인덱싱 파이프라인.</desc>

  <defs>

    <marker id="2026-10-02-1cb47ab1-01-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </marker>
    <!-- 강조 화살표 -->
    <marker id="2026-10-02-1cb47ab1-01-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ────────────────────────────────────────────
       화살표 (노드보다 먼저 그림)
  ──────────────────────────────────────────── -->

  <!-- PDF → 파서 -->
  <path d="M 480 92 L 480 120" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-02-1cb47ab1-01-arrow)"/>

  <!-- 파서 → 이미지 크롭 (아래) -->
  <path d="M 480 176 L 480 228" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-02-1cb47ab1-01-arrow)"/>

  <!-- 파서 → 표 구조 (오른쪽 → orthogonal) -->
  <path d="M 568 176 L 720 176 L 720 228" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-02-1cb47ab1-01-arrow)" stroke-linejoin="round"/>

  <!-- 텍스트 청크 → 텍스트 임베딩 -->
  <path d="M 240 284 L 240 336" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-02-1cb47ab1-01-arrow-accent)"/>

  <!-- 이미지 크롭 → 이미지 임베딩 -->

  <path d="M 240 392 L 240 460 L 420 460" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-02-1cb47ab1-01-arrow-accent)" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="404" y="235" width="28" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.4)" stroke-width="0.8"/>

  <rect x="156" y="336" width="168" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="164" y="343" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="178" y="352" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>
  <text x="240" y="369" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">텍스트 임베딩</text>
  <text x="240" y="385" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">text embedding</text>

  <rect x="396" y="336" width="168" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="404" y="343" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="418" y="352" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>

  <text x="720" y="385" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">table→text</text>

  <!-- arrow default -->

  <text x="556" y="549" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">분리</text>
