<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-07-c621f6a4-06-guardrails-tune-title 2026-10-07-c621f6a4-06-guardrails-tune-desc">
  <title id="2026-10-07-c621f6a4-06-guardrails-tune-title">Guardrails 임계값 조정 사이클</title>
  <desc id="2026-10-07-c621f6a4-06-guardrails-tune-desc">차단 로그 샘플링에서 오탐 분석, 임계값 조정, 스테이징 검증, 프로덕션 배포로 이어지는 주 1회 튜닝 루프. 검증 실패 시 분석 단계로 되돌아간다.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-07-c621f6a4-06-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-07-c621f6a4-06-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 복귀 화살표 (muted) -->
    <marker id="2026-10-07-c621f6a4-06-arr-back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────
       화살표 (노드보다 먼저 그림)
  ───────────────────────────────────────────── -->

  <!-- LOG → ANA (직선, 같은 y=196) -->
  <line x1="176" y1="196" x2="232" y2="196" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-07-c621f6a4-06-arr)"/>

  <!-- ANA → THR (오탐 높음 — 위쪽으로) -->
  <!-- ANA 우측 (360,196) → 오른쪽 → 위쪽 → THR 좌측 (432,120) -->
  <path d="M360,196 L396,196 L396,120 L432,120" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-07-c621f6a4-06-arr)"/>
  <!-- 레이블 -->
  <rect x="362" y="148" width="52" height="13" rx="2" fill="#f8fafb"/>
  <text x="388" y="158" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">오탐 높음</text>

  <!-- ANA → THR2 (미탐 높음 — 아래쪽으로) -->
  <!-- ANA 우측 (360,196) → 오른쪽 → 아래쪽 → THR2 좌측 (432,272) -->
  <path d="M360,196 L396,196 L396,272 L432,272" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-07-c621f6a4-06-arr)"/>
  <!-- 레이블 -->
  <rect x="362" y="231" width="52" height="13" rx="2" fill="#f8fafb"/>
  <text x="388" y="241" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">미탐 높음</text>

  <!-- THR → VER (위 경로: THR 우측 (568,120) → VER 위쪽 (660,168)) -->
  <path d="M568,120 L628,120 L628,168 L624,168" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-07-c621f6a4-06-arr)"/>

  <!-- THR2 → VER (아래 경로: THR2 우측 (568,272) → VER 아래쪽 (660,224)) -->
  <path d="M568,272 L628,272 L628,224 L624,224" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-07-c621f6a4-06-arr)"/>

  <!-- VER → DEP (통과: 직선, 같은 y=196) -->
  <line x1="760" y1="196" x2="812" y2="196" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-06-arr-acc)"/>
  <!-- 레이블 -->
  <rect x="770" y="182" width="32" height="13" rx="2" fill="#f8fafb"/>
  <text x="786" y="192" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">통과</text>

  <!-- VER → ANA (실패: 아래 우회 경로) -->
  <!-- VER 하단 (692,240) → 아래 → 왼쪽 → ANA 하단 (296,240) → 위로 ANA -->
  <path d="M692,240 L692,320 L296,320 L296,240" fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-07-c621f6a4-06-arr-back)"/>
  <!-- 레이블 -->
  <rect x="470" y="307" width="32" height="13" rx="2" fill="#f8fafb"/>
  <text x="486" y="317" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">실패</text>

  <!-- ─────────────────────────────────────────────
       노드
  ───────────────────────────────────────────── -->

  <!-- LOG: 차단 로그 샘플링 (input 스타일: muted@0.10 fill, soft stroke) -->
  <rect x="44" y="164" width="132" height="64" rx="6" fill="#f8fafb"/>
  <rect x="44" y="164" width="132" height="64" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="52" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="66" y="181" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
  <text x="110" y="200" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">차단 로그</text>
  <text x="110" y="216" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">샘플링</text>

  <!-- ANA: 오탐 분석 주 1회 (focal — accent) -->
  <rect x="232" y="164" width="128" height="64" rx="6" fill="#f8fafb"/>
  <rect x="232" y="164" width="128" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="240" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="254" y="181" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">분석</text>
  <text x="296" y="200" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">오탐 분석</text>
  <text x="296" y="216" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">주 1회</text>

  <!-- THR: 임계값 상향 (backend) -->
  <rect x="432" y="88" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="432" y="88" width="136" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="440" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="454" y="105" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THR</text>
  <text x="500" y="124" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">임계값 상향</text>
  <text x="500" y="140" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">threshold ↑</text>

  <!-- THR2: 임계값 하향 (backend) -->
  <rect x="432" y="240" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="432" y="240" width="136" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="440" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="454" y="257" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THR</text>
  <text x="500" y="276" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">임계값 하향</text>
  <text x="500" y="292" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">threshold ↓</text>

  <!-- VER: 스테이징 검증 (backend) -->
  <rect x="624" y="164" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="624" y="164" width="136" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="632" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="646" y="181" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">검증</text>
  <text x="692" y="200" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">스테이징 검증</text>
  <text x="692" y="216" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">staging</text>

  <!-- DEP: 프로덕션 배포 (focal — accent) -->
  <rect x="812" y="164" width="116" height="64" rx="6" fill="#f8fafb"/>
  <rect x="812" y="164" width="116" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="820" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="834" y="181" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">배포</text>
  <text x="870" y="200" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">프로덕션 배포</text>
  <text x="870" y="216" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">production</text>

  <!-- ─────────────────────────────────────────────
       범례 (하단 스트립)
  ───────────────────────────────────────────── -->
  <line x1="32" y1="354" x2="928" y2="354" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <text x="32" y="368" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="104" y="358" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="122" y="368" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">핵심 단계</text>

  <!-- backend -->
  <rect x="216" y="358" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="234" y="368" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">처리 단계</text>

  <!-- input -->
  <rect x="328" y="358" width="12" height="12" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="346" y="368" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">입력</text>

  <!-- 실패 복귀 점선 -->
  <line x1="420" y1="364" x2="452" y2="364" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-07-c621f6a4-06-arr-back)"/>
  <text x="460" y="368" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">검증 실패 복귀</text>

  <!-- 통과 -->
  <line x1="580" y1="364" x2="612" y2="364" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-06-arr-acc)"/>
  <text x="620" y="368" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">검증 통과</text>

</svg>
</body>
</html>
