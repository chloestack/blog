<!DOCTYPE html>
<html lang="ko">
<head>

<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }

</head>
<body>
<svg
  xmlns="http://www.w3.org/2000/svg"

>
  <title id="2026-10-14-71367d11-01-snap-title">Qdrant 스냅샷 백업·복구 흐름</title>
  <desc id="2026-10-14-71367d11-01-snap-desc">스냅샷 트리거에서 시작해 샤드 리더가 스냅샷을 생성하고 로컬 파일을 오브젝트 스토리지에 업로드한 뒤, 복구 필요 여부에 따라 복원 또는 보관으로 분기되는 흐름도.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-14-71367d11-01-snap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-14-71367d11-01-snap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    <!-- 뮤트 화살표 -->
    <marker id="2026-10-14-71367d11-01-snap-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" fill="#f8fafb"/>

       커넥터 (노드보다 먼저 그림)
  ──────────────────────────────────────────────── -->

  <!-- TRIG → SNAP (직선, 같은 y=148) -->
  <line x1="172" y1="148" x2="248" y2="148"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-01-snap-arrow)"/>

  <!-- SNAP → FILE -->
  <line x1="388" y1="148" x2="464" y2="148"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-01-snap-arrow)"/>

  <!-- FILE → S3 -->
  <line x1="604" y1="148" x2="680" y2="148"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-01-snap-arrow)"/>

  <!-- S3 → REC (마름모 왼쪽 꼭짓점) -->
  <line x1="820" y1="148" x2="852" y2="148"
        stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-14-71367d11-01-snap-arrow-accent)"/>

  <!-- REC → REST (예: 마름모 아래쪽 꼭짓점 → REST 위쪽) -->
  <!-- 마름모 중심 (880,148), 아래 꼭짓점 y=148+36=184 -->
  <path d="M880,184 L880,228 L788,228 L788,252"
        fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-14-71367d11-01-snap-arrow-accent)"/>

  <!-- REC → KEEP (아니오: 마름모 오른쪽 꼭짓점 → KEEP) -->

  <line x1="916" y1="148" x2="916" y2="148"
        fill="none" stroke="#6c8188" stroke-width="1"/>
  <!-- 꺾임: 마름모 오른쪽(916,148) → 오른쪽으로 나간 뒤 KEEP으로 -->
  <path d="M916,148 Q924,148 924,156 L924,252 Q924,260 916,260 L848,260"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-14-71367d11-01-snap-arrow-muted)"/>

  <!-- ───────────────────────────────────────────────
       노드
  ──────────────────────────────────────────────── -->

  <!-- 1. 스냅샷 트리거 (input 타입) x=32, y=108, w=140, h=80 -->
  <rect x="32" y="108" width="140" height="80" rx="6" fill="#f8fafb"/>
  <rect x="32" y="108" width="140" height="80" rx="6"
        fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>

  <text x="58" y="125"

        text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>
  <text x="102" y="147"
        fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">스냅샷 트리거</text>

        fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">API · CronJob</text>

  <rect x="248" y="108" width="140" height="80" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="256" y="116" width="24" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="268" y="125"
        fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">JOB</text>
  <text x="318" y="147"
        fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"

  <text x="318" y="165"

  <rect x="464" y="108" width="140" height="80" rx="6"

  <rect x="472" y="116" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(108,129,136,0.4)" stroke-width="0.8"/>
  <text x="486" y="125"
        fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"

  <text x="534" y="147"

        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">로컬 파일</text>
  <text x="534" y="165"
        fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">.snapshot</text>

  <!-- 4. 오브젝트 스토리지 (backend) x=680, y=108, w=140, h=80 -->

  <rect x="688" y="116" width="28" height="12" rx="2"

  <text x="750" y="143"

        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">오브젝트 스토리지</text>
  <text x="750" y="161"
        fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace"

  <!-- 5. 복구 필요? 마름모 (decision) 중심 (880,148), 반너비=36, 반높이=36 -->
  <!-- 마름모: 위(880,112) 오른(916,148) 아래(880,184) 왼(844,148) -->
  <polygon points="880,112 916,148 880,184 844,148"
           fill="#f8fafb"/>
  <polygon points="880,112 916,148 880,184 844,148"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="880" y="145"
        fill="#122127" font-size="10" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">복구</text>
  <text x="880" y="160"
        fill="#122127" font-size="10" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">필요?</text>

  <!-- 6. 스냅샷 복원 (backend) x=728, y=252, w=120, h=56 -->
  <rect x="728" y="252" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="728" y="252" width="120" height="56" rx="6"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="736" y="260" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(18,33,39,0.4)" stroke-width="0.8"/>
  <text x="750" y="269"
        fill="rgba(18,33,39,0.7)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">RESTORE</text>
  <text x="788" y="286"
        fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">스냅샷 복원</text>

  <!-- 7. 보관 (optional/muted) x=820, y=236, w=88, h=48 -->
  <rect x="820" y="236" width="88" height="48" rx="6" fill="#f8fafb"/>
  <rect x="820" y="236" width="88" height="48" rx="6"

  <text x="864" y="264"

        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">보관</text>

       화살표 라벨
  ──────────────────────────────────────────────── -->

  <!-- 예 라벨 (REC → REST 경로, 수직 구간 x=880, y=184~228, 라벨 y≈204) -->
  <rect x="862" y="192" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="880" y="202"
        fill="#3f545c" font-size="10" font-weight="500"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">예</text>

  <!-- 아니오 라벨 (REC → KEEP 경로, y=148 오른쪽 구간) -->
  <rect x="892" y="136" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="914" y="146"
        fill="#6c8188" font-size="10" font-weight="500"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        text-anchor="middle">아니오</text>

  <!-- ───────────────────────────────────────────────
       범례
  ──────────────────────────────────────────────── -->
  <line x1="32" y1="316" x2="928" y2="316"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 레이블 -->
  <text x="32" y="330"
        fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- focal 샘플 -->
  <rect x="92" y="321" width="10" height="10" rx="2"

  <text x="306" y="330"
        fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace">저장소</text>

  <!-- input 샘플 -->

  <text x="390" y="330"
        fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace">트리거</text>

        fill="rgba(18,33,39,0.02)" stroke="rgba(18,33,39,0.20)" stroke-width="1"
        stroke-dasharray="3,2"/>
  <text x="466" y="330"
        fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace">보관 (비활성)</text>

</svg>
