<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
  .diagram-wrap { width: 100%; max-width: 720px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-11-dd544fa0-07-cursorrules-title 2026-10-11-dd544fa0-07-cursorrules-desc">
  <title id="2026-10-11-dd544fa0-07-cursorrules-title">Cursor Rules 지시 방식 비교</title>
  <desc id="2026-10-11-dd544fa0-07-cursorrules-desc">지나친 금지 방식은 유용한 제안을 누락시키고, 대안 제시 방식은 맥락에 맞는 코드 생성을 유도함을 보여주는 흐름도.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-11-dd544fa0-07-cr-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-10-11-dd544fa0-07-cr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="280" fill="#f8fafb"/>

  <!-- ── Connectors (drawn before boxes) ── -->

  <!-- Bad → Miss (horizontal) -->
  <path d="M 212 100 L 468 100" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-10-11-dd544fa0-07-cr-arrow-stop)"/>

  <!-- Good → Better (horizontal) -->
  <path d="M 212 180 L 468 180" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-11-dd544fa0-07-cr-arrow-accent)"/>

  <!-- Arrow label: Bad → Miss -->
  <rect x="278" y="84" width="64" height="14" rx="2" fill="#f8fafb"/>
  <text x="310" y="94" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle" font-weight="500">유연성 감소</text>

  <!-- Arrow label: Good → Better -->
  <rect x="270" y="164" width="80" height="14" rx="2" fill="#f8fafb"/>
  <text x="310" y="174" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle" font-weight="500">AI 판단 유도</text>

  <!-- ── Nodes ── -->

  <!-- Bad node: 지나친 금지 (stop/warn — reddish) -->
  <rect x="44" y="64" width="168" height="72" rx="6" fill="#f8fafb"/>
  <rect x="44" y="64" width="168" height="72" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <rect x="52" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="70" y="81" fill="rgba(148,56,43,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">금지</text>
  <text x="128" y="102" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">지나친 금지</text>
  <text x="128" y="122" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">절대 하지 말 것</text>

  <!-- Miss node: 유용한 제안 누락 (warn) -->
  <rect x="468" y="64" width="208" height="72" rx="6" fill="#f8fafb"/>
  <rect x="468" y="64" width="208" height="72" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <rect x="476" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="494" y="81" fill="rgba(169,106,8,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">결과</text>
  <text x="572" y="102" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">유용한 제안 누락</text>
  <text x="572" y="122" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">가능성 있는 코드가 걸러짐</text>

  <!-- Good node: 대안 제시 (accent/focal) -->
  <rect x="44" y="144" width="168" height="72" rx="6" fill="#f8fafb"/>
  <rect x="44" y="144" width="168" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="52" y="152" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="70" y="161" fill="rgba(13,87,99,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">권장</text>
  <text x="128" y="182" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">대안 제시</text>
  <text x="128" y="202" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">대신 ~를 써라</text>

  <!-- Better node: 맥락에 맞는 코드 생성 (accent) -->
  <rect x="468" y="144" width="208" height="72" rx="6" fill="#f8fafb"/>
  <rect x="468" y="144" width="208" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="476" y="152" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="494" y="161" fill="rgba(13,87,99,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">결과</text>
  <text x="572" y="182" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">맥락에 맞는 코드 생성</text>
  <text x="572" y="202" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">AI가 판단하여 적용</text>

  <!-- ── Legend ── -->
  <line x1="32" y1="244" x2="688" y2="244" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="32" y="258" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend: 금지 방식 -->
  <rect x="104" y="250" width="10" height="10" rx="2" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <text x="120" y="259" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-weight="500">금지 방식</text>

  <!-- Legend: 권장 방식 -->
  <rect x="208" y="250" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="224" y="259" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-weight="500">권장 방식</text>

  <!-- Legend: 부정적 결과 -->
  <rect x="316" y="250" width="10" height="10" rx="2" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="332" y="259" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-weight="500">부정적 결과</text>

  <!-- Legend: 긍정적 결과 -->
  <rect x="432" y="250" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="448" y="259" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-weight="500">긍정적 결과</text>
</svg>
</div>
</body>
</html>
