<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="2026-09-19-f8fc1d22-02-wc-title 2026-09-19-f8fc1d22-02-wc-desc">
  <title id="2026-09-19-f8fc1d22-02-wc-title">WebClient 요청 처리 흐름</title>
  <desc id="2026-09-19-f8fc1d22-02-wc-desc">Spring WebClient가 요청을 빌더로 구성한 뒤 구독을 시작하고, 커넥션 풀에서 채널을 획득하거나 대기·신규 생성 후 HTTP 요청을 전송하고 응답을 수신·역직렬화하는 흐름을 보여주는 플로우차트.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-09-19-f8fc1d22-02-wc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-09-19-f8fc1d22-02-wc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="480" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────
       화살표 (노드보다 먼저 그림)
  ───────────────────────────────────────────── -->

  <!-- C → S (요청 빌더 → 구독 시작) -->
  <line x1="192" y1="200" x2="244" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- S → P (구독 시작 → 채널 획득) -->
  <line x1="356" y1="200" x2="408" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- P → Q (채널 획득 → 채널 있나?) -->
  <line x1="520" y1="200" x2="572" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- Q → W 예 분기 (위로 우회) -->
  <!-- Q 오른쪽 꼭짓점 (620,200) → 위 → W 위쪽 -->
  <path d="M 620 200 L 644 200 L 644 136 L 720 136 L 720 164"
        fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow-accent)"/>

  <!-- Q → V 아니오 분기 (아래) -->
  <!-- Q 아래 꼭짓점 (596,224) → 아래 → V -->
  <path d="M 596 224 L 596 296 L 720 296 L 720 244"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- V → W (대기/신규 → HTTP 전송) -->
  <path d="M 800 212 L 800 188"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- W → R (HTTP 전송 → 응답 수신) -->
  <line x1="800" y1="164" x2="836" y2="164" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>
  <!-- 실제 W→R은 오른쪽으로: W의 오른쪽(800+80/2=840 기준)에서 R로 -->

  <!-- ─────────────────────────────────────────────
       노드 그리기
  ───────────────────────────────────────────── -->

  <!-- ① C: 요청 빌더 구성 — link 계열(파랑) -->
  <!-- x=56 y=168 w=136 h=64 -->
  <rect x="56" y="168" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="56" y="168" width="136" height="64" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <rect x="64" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="82" y="185" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="124" y="206" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">요청 빌더</text>
  <text x="124" y="222" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">구성</text>

  <!-- ② S: 구독 시작 — accent(teal) -->
  <!-- x=244 y=168 w=112 h=64 -->
  <rect x="244" y="168" width="112" height="64" rx="6" fill="#f8fafb"/>
  <rect x="244" y="168" width="112" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="252" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="270" y="185" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="300" y="206" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">구독</text>
  <text x="300" y="222" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">시작</text>

  <!-- ③ P: 풀에서 채널 획득 — accent(teal) -->
  <!-- x=408 y=168 w=112 h=64 -->
  <rect x="408" y="168" width="112" height="64" rx="6" fill="#f8fafb"/>
  <rect x="408" y="168" width="112" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="416" y="176" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="430" y="185" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">풀</text>
  <text x="464" y="204" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">채널</text>
  <text x="464" y="220" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">획득</text>

  <!-- ④ Q: 채널 있나? — 다이아몬드 -->
  <!-- 중심 (596, 200), 폭 48, 높이 48 -->
  <polygon points="596,176 620,200 596,224 572,200" fill="#f8fafb"/>
  <polygon points="596,176 620,200 596,224 572,200" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="596" y="204" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">채널?</text>

  <!-- ⑤ V: 대기 큐 or 신규 생성 — 경고(warn) -->
  <!-- x=660 y=212 w=160 h=64 -->
  <rect x="660" y="212" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="660" y="212" width="160" height="64" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="668" y="220" width="40" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="688" y="229" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text>
  <text x="740" y="250" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">대기 큐 /</text>
  <text x="740" y="266" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">신규 생성</text>

  <!-- ⑥ W: HTTP 요청 전송 — focal(accent) -->
  <!-- x=660 y=144 w=160 h=64 -->
  <rect x="660" y="144" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="660" y="144" width="160" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="668" y="152" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="690" y="161" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
  <text x="740" y="183" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">HTTP 요청</text>
  <text x="740" y="199" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">전송</text>

  <!-- W → R 화살표: W 오른쪽(820, 176) → R 왼쪽(836, 176) -->
  <line x1="820" y1="176" x2="836" y2="176" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- ⑦ R: 응답 수신 — muted -->
  <!-- x=836 y=148 w=84 h=56 -->
  <rect x="836" y="148" width="88" height="56" rx="6" fill="#f8fafb"/>
  <rect x="836" y="148" width="88" height="56" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="880" y="180" fill="#3f545c" font-size="13" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">응답</text>
  <text x="880" y="196" fill="#3f545c" font-size="13" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">수신</text>

  <!-- R → D 화살표: R 오른쪽(924,176) → 아래 → D 위(880,276) -->
  <path d="M 880 204 L 880 248"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-f8fc1d22-02-wc-arrow)"/>

  <!-- ⑧ D: 역직렬화 — backend(white) -->
  <!-- x=836 y=248 w=88 h=56 -->
  <rect x="836" y="248" width="88" height="56" rx="6" fill="#f8fafb"/>
  <rect x="836" y="248" width="88" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="844" y="256" width="44" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="866" y="265" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
  <text x="880" y="290" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">역직렬화</text>

  <!-- ─────────────────────────────────────────────
       분기 라벨
  ───────────────────────────────────────────── -->

  <!-- 예 라벨 (Q → W 위 경로, 대략 644,136 위쪽) -->
  <rect x="630" y="124" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="640" y="133" fill="#3f545c" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">예</text>

  <!-- 아니오 라벨 (Q → V 아래 경로) -->
  <rect x="590" y="244" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="612" y="253" fill="#3f545c" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">아니오</text>

  <!-- ─────────────────────────────────────────────
       범례 구분선 + 범례
  ───────────────────────────────────────────── -->
  <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 항목들 -->
  <!-- 구독·풀 흐름 (teal) -->
  <rect x="40" y="408" width="16" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="62" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">구독 · 채널 흐름</text>

  <!-- 요청 빌더 (blue) -->
  <rect x="196" y="408" width="16" height="12" rx="2" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="218" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">요청 구성</text>

  <!-- 대기/신규 생성 (warn, dashed) -->
  <rect x="320" y="408" width="16" height="12" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="342" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">대기 / 신규 생성</text>

  <!-- 응답 수신 (muted) -->
  <rect x="488" y="408" width="16" height="12" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="510" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">응답 수신</text>

  <!-- 역직렬화 (backend) -->
  <rect x="608" y="408" width="16" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="630" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">역직렬화</text>
</svg>
</body>
</html>
