<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동기→비차단 재시도 마이그레이션 절차</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { display: block; width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-09-21-5a4b63fa-06-mig-title 2026-09-21-5a4b63fa-06-mig-desc">
  <title id="2026-09-21-5a4b63fa-06-mig-title">동기→비차단 재시도 마이그레이션 절차</title>
  <desc id="2026-09-21-5a4b63fa-06-mig-desc">기존 동기 재시도 설정에서 비차단 재시도로 전환하는 6단계 마이그레이션 흐름. 파티션 수 확인 분기를 거쳐 재시도 토픽 생성 확인, 핸들러 비활성화, 완료 순서로 진행한다.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-09-21-5a4b63fa-06-mig-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-21-5a4b63fa-06-mig-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────────────────────
       ARROWS (drawn before nodes so they sit behind boxes)
       Layout (left→right):
         OLD  x=40  cx=108
         CHK  x=200 cx=280  (diamond)
         PART x=344 cx=424  (below main track, y=240)
         NBR  x=520 cx=600
         VERIFY x=664 cx=744
         SWITCH / DONE on second row or continuation
       Main track y=160, branch y=264
  ───────────────────────────────────────────────────────────────── -->

  <!-- OLD → CHK: horizontal -->
  <line x1="176" y1="160" x2="196" y2="160"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow)"/>

  <!-- CHK →|아니오| PART: down then right -->
  <!-- CHK diamond center (280, 160); PART box top-center (424, 232) -->
  <path d="M280,188 L280,224 L344,224" fill="none"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow)"/>
  <!-- label 아니오 -->
  <rect x="254" y="192" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="274" y="202" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- CHK →|예| NBR: horizontal -->
  <!-- CHK right vertex at (308,160); NBR left edge at (520,160) -->
  <path d="M308,160 L516,160" fill="none"
        stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow-accent)"/>
  <!-- label 예 -->
  <rect x="390" y="148" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="400" y="158" fill="#0d5763" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- PART → NBR: right then up to NBR left -->
  <!-- PART right edge (472, 256); NBR left edge (520, 160) -->
  <path d="M472,256 L496,256 L496,160 L516,160" fill="none"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow)"/>

  <!-- NBR → VERIFY: horizontal -->
  <line x1="680" y1="160" x2="700" y2="160"
        stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow-accent)"/>

  <!-- VERIFY → SWITCH: right then down -->
  <!-- VERIFY right edge (808, 160); SWITCH top-center (744, 260) -->
  <path d="M808,160 L840,160 L840,252 L808,252" fill="none"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow)"/>

  <!-- SWITCH → DONE: down -->
  <line x1="744" y1="296" x2="744" y2="316"
        stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow-accent)"/>

  <!-- ─────────────────────────────────────────────────────────────
       NODES
  ───────────────────────────────────────────────────────────────── -->

  <!-- OLD: 동기 재시도 기존 설정 (warn / input style) cx=108, cy=160 w=136 h=52 -->
  <rect x="40" y="134" width="136" height="52" rx="6" fill="#f8fafb"/>
  <rect x="40" y="134" width="136" height="52" rx="6" fill="rgba(13,87,99,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="48" y="140" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="64" y="149" fill="rgba(63,84,92,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AS-IS</text>
  <text x="108" y="164" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">동기 재시도</text>
  <text x="108" y="179" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">기존 설정</text>

  <!-- CHK: 파티션 충분? (diamond) cx=280, cy=160 -->
  <!-- diamond half-w=28, half-h=28 so points: top(280,132) right(308,160) bottom(280,188) left(252,160) -->
  <polygon points="280,130 312,160 280,190 248,160"
           fill="#f8fafb"/>
  <polygon points="280,130 312,160 280,190 248,160"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="280" y="156" fill="#122127" font-size="10" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">파티션</text>
  <text x="280" y="170" fill="#122127" font-size="10" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">충분?</text>

  <!-- PART: 파티션 수 증설 cx=408, cy=256 w=128 h=48 -->
  <rect x="344" y="232" width="128" height="48" rx="6" fill="#f8fafb"/>
  <rect x="344" y="232" width="128" height="48" rx="6"
        fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="352" y="238" width="40" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.40)" stroke-width="0.8"/>
  <text x="372" y="247" fill="rgba(99,129,136,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCALE</text>
  <text x="408" y="262" fill="#3f545c" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">파티션 수 증설</text>

  <!-- NBR: 비차단 재시도 설정 추가 (focal) cx=600, cy=160 w=160 h=52 -->
  <rect x="520" y="134" width="160" height="52" rx="6" fill="#f8fafb"/>
  <rect x="520" y="134" width="160" height="52" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="528" y="140" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="542" y="149" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
  <text x="600" y="162" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">비차단 재시도</text>
  <text x="600" y="177" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">설정 추가</text>

  <!-- VERIFY: 재시도 토픽 생성 확인 cx=744, cy=160 w=128 h=52 -->
  <rect x="680" y="134" width="128" height="52" rx="6" fill="#f8fafb"/>
  <rect x="680" y="134" width="128" height="52" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="688" y="140" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="708" y="149" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
  <text x="744" y="162" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">재시도 토픽</text>
  <text x="744" y="177" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">생성 확인</text>

  <!-- SWITCH: 기존 핸들러 비활성화 cx=744, cy=272 w=128 h=48 -->
  <rect x="680" y="228" width="128" height="48" rx="6" fill="#f8fafb"/>
  <rect x="680" y="228" width="128" height="48" rx="6"
        fill="rgba(13,87,99,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="688" y="234" width="44" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="710" y="243" fill="rgba(63,84,92,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SWITCH</text>
  <text x="744" y="258" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">기존 핸들러</text>
  <text x="744" y="272" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">비활성화</text>

  <!-- DONE: 마이그레이션 완료 cx=744, cy=344 w=128 h=44 -->
  <rect x="680" y="320" width="128" height="44" rx="6" fill="#f8fafb"/>
  <rect x="680" y="320" width="128" height="44" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="688" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="702" y="335" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">END</text>
  <text x="744" y="349" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">마이그레이션 완료</text>

  <!-- ─────────────────────────────────────────────────────────────
       LEGEND strip
  ───────────────────────────────────────────────────────────────── -->
  <line x1="40" y1="385" x2="920" y2="385" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- focal accent swatch -->
  <rect x="40" y="390" width="10" height="8" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="56" y="397" fill="#3f545c" font-size="8"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">핵심 단계</text>

  <!-- default swatch -->
  <rect x="160" y="390" width="10" height="8" rx="2"
        fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="176" y="397" fill="#3f545c" font-size="8"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">선택 단계</text>

  <!-- accent arrow -->
  <line x1="280" y1="394" x2="296" y2="394"
        stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow-accent)"/>
  <text x="304" y="397" fill="#3f545c" font-size="8"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">주 경로</text>

  <!-- default arrow -->
  <line x1="400" y1="394" x2="416" y2="394"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-06-mig-arrow)"/>
  <text x="424" y="397" fill="#3f545c" font-size="8"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">분기 경로</text>

</svg>
</div>
</body>
</html>
