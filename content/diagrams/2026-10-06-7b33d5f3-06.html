<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>

</head>
<body>
<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-06-7b33d5f3-06-rag-rerank-title 2026-10-06-7b33d5f3-06-rag-rerank-desc">

  <title id="2026-10-06-7b33d5f3-06-rag-rerank-title">RAG Re-ranking 파이프라인 정확도 비교</title>
  <desc id="2026-10-06-7b33d5f3-06-rag-rerank-desc">BM25 단독 기준선에서 Dense Retrieval, 하이브리드 검색, Re-ranking 적용 순으로 각 단계마다 정확도가 향상되는 흐름을 보여주는 도식.</desc>

  <defs>
    <marker id="2026-10-06-7b33d5f3-06-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
    <marker id="2026-10-06-7b33d5f3-06-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="280" fill="#f8fafb"/>

  <!-- ── Connectors (drawn before boxes) ── -->

  <!-- BM25 → Dense: +5~10% -->
  <line x1="204" y1="128" x2="280" y2="128" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-06-7b33d5f3-06-arrow-muted)"/>
  <rect x="212" y="112" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="242" y="123" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">+5~10%</text>

  <!-- Dense → Hybrid: +3~7% -->
  <line x1="444" y1="128" x2="520" y2="128" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-06-7b33d5f3-06-arrow-muted)"/>
  <rect x="452" y="112" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="482" y="123" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">+3~7%</text>

  <!-- Hybrid → Rerank: +5~10% -->
  <line x1="684" y1="128" x2="760" y2="128" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-06-7b33d5f3-06-arrow-accent)"/>
  <rect x="692" y="112" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="722" y="123" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">+5~10%</text>

  <!-- ── Node 1: BM25 단독 (기준선 / muted) ── -->
  <rect x="40" y="88" width="164" height="80" rx="6" fill="#f8fafb"/>
  <rect x="40" y="88" width="164" height="80" rx="6" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <!-- tag -->
  <rect x="52" y="96" width="40" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.4)" stroke-width="0.8"/>
  <text x="72" y="105" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">기준선</text>
  <!-- name -->
  <text x="122" y="136" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">BM25 단독</text>
  <!-- sublabel -->
  <text x="122" y="155" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Sparse Retrieval</text>

  <!-- ── Node 2: Dense Retrieval 단독 (backend) ── -->
  <rect x="280" y="88" width="164" height="80" rx="6" fill="#f8fafb"/>
  <rect x="280" y="88" width="164" height="80" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- tag -->
  <rect x="292" y="96" width="40" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="312" y="105" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">단독</text>
  <!-- name -->
  <text x="362" y="130" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Dense Retrieval</text>
  <!-- sublabel -->
  <text x="362" y="149" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Semantic Search</text>

  <!-- ── Node 3: 하이브리드 검색 (backend) ── -->
  <rect x="520" y="88" width="164" height="80" rx="6" fill="#f8fafb"/>
  <rect x="520" y="88" width="164" height="80" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- tag -->
  <rect x="532" y="96" width="52" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="558" y="105" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">하이브리드</text>
  <!-- name -->
  <text x="602" y="126" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">하이브리드 검색</text>
  <!-- sublabel -->
  <text x="602" y="145" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">BM25 + Dense</text>

  <!-- ── Node 4: Re-ranking 적용 (focal / accent) ── -->
  <rect x="760" y="88" width="164" height="80" rx="6" fill="#f8fafb"/>
  <rect x="760" y="88" width="164" height="80" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="772" y="96" width="52" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="798" y="105" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Re-ranking</text>
  <!-- name -->
  <text x="842" y="126" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Re-ranking 적용</text>
  <!-- sublabel -->
  <text x="842" y="145" fill="#0d5763" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Cross-Encoder</text>
  <!-- "최고 정확도" badge -->
  <rect x="800" y="156" width="84" height="16" rx="4" fill="rgba(13,87,99,0.12)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="842" y="168" fill="#0d5763" font-size="9" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle" letter-spacing="0.04em">최고 정확도</text>

  <!-- ── Legend strip ── -->
  <line x1="40" y1="212" x2="920" y2="212" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend label -->
  <text x="40" y="228" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- item 1: 기준선 -->
  <rect x="112" y="218" width="14" height="14" rx="3" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="0.8"/>
  <text x="132" y="229" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">기준선</text>

  <!-- item 2: 검색 단계 -->
  <rect x="208" y="218" width="14" height="14" rx="3" fill="#ffffff" stroke="#122127" stroke-width="0.8"/>
  <text x="228" y="229" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">검색 단계</text>

  <!-- item 3: 최종 단계 (focal) -->
  <rect x="320" y="218" width="14" height="14" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="340" y="229" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">최종 단계 (Re-ranking)</text>

  <!-- item 4: 정확도 향상 -->
  <line x1="508" y1="225" x2="530" y2="225" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-06-7b33d5f3-06-arrow-muted)"/>
  <text x="536" y="229" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">단계별 정확도 향상</text>

</svg>
</body>
</html>
