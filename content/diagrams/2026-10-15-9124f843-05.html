<style>

<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-15-9124f843-05-pipeline-title 2026-10-15-9124f843-05-pipeline-desc">
  <title id="2026-10-15-9124f843-05-pipeline-title">LLM 입력–출력 방어 파이프라인</title>
  <desc id="2026-10-15-9124f843-05-pipeline-desc">사용자 요청이 L1 입력 정규화, L2 정책 분류기를 거쳐 위험도 판단 후 낮으면 L3 컨텍스트 조립·LLM 처리·L4 출력 필터로 이어지고, 높으면 차단·경고 처리되는 6단계 방어 흐름을 보여준다.</desc>

      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-15-9124f843-05-pl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </marker>
    <marker id="2026-10-15-9124f843-05-pl-arrow-block" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-10-15-9124f843-05-pl-arrow-low" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ═══════════════════════════════
       ARROWS (drawn before boxes)
  ═══════════════════════════════ -->

  <!-- U → L1 (straight vertical) -->
  <line x1="480" y1="92" x2="480" y2="132" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-05-pl-arrow)"/>

  <!-- L1 → L2 (straight vertical) -->
  <line x1="480" y1="188" x2="480" y2="228" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-05-pl-arrow)"/>

  <!-- L2 → Q (straight vertical) -->
  <line x1="480" y1="284" x2="480" y2="316" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-05-pl-arrow)"/>

  <!-- Q → L3 낮음 (straight vertical) -->
  <line x1="480" y1="364" x2="480" y2="388" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-15-9124f843-05-pl-arrow-accent)"/>
  <!-- 낮음 label -->
  <rect x="448" y="368" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="466" y="379" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">낮음</text>

  <!-- Q right midpoint: x=508, y=340  →  go right to x=680, then down to y=340 already at BL level -->
  <path d="M508,340 Q516,340 516,340 L680,340" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-10-15-9124f843-05-pl-arrow-block)"/>
  <!-- 높음 label -->
  <rect x="572" y="326" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="590" y="337" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">높음</text>

  <!-- L3 → LLM (straight vertical) -->
  <line x1="480" y1="444" x2="480" y2="464" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-05-pl-arrow)"/>

  <text x="480" y="74" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">사용자 요청</text>

  <text x="480" y="176" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">유니코드 · 인코딩 해제</text>

  <!-- ── L2 (accent node) ── -->
  <rect x="348" y="228" width="264" height="56" rx="6" fill="#f8fafb"/>

  <rect x="680" y="312" width="200" height="56" rx="6" fill="#f8fafb"/>
  <rect x="680" y="312" width="200" height="56" rx="6" fill="rgba(148,56,43,0.07)" stroke="#94382b" stroke-width="1"/>
  <rect x="688" y="318" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="704" y="327" fill="rgba(148,56,43,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BLOCK</text>
  <text x="780" y="344" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">차단 · 경고</text>
  <text x="780" y="360" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">로그 기록</text>

  <!-- ── L3 (focal accent) ── -->
  <rect x="348" y="388" width="264" height="56" rx="6" fill="#f8fafb"/>
  <rect x="348" y="388" width="264" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="356" y="394" width="16" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="364" y="403" fill="rgba(13,87,99,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L3</text>
  <text x="480" y="414" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">컨텍스트 조립</text>
  <text x="480" y="432" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">출처 태깅</text>

  <!-- ── LLM (backend/store) ── -->
  <rect x="396" y="464" width="168" height="48" rx="6" fill="#f8fafb"/>
  <rect x="396" y="464" width="168" height="48" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="404" y="470" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="420" y="479" fill="rgba(18,33,39,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="480" y="494" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">LLM 처리</text>

  <!-- ── L4 (accent node) ── -->
  <rect x="348" y="532" width="264" height="56" rx="6" fill="#f8fafb"/>
  <rect x="348" y="532" width="264" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="356" y="538" width="16" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <text x="480" y="556" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">출력 필터</text>
  <text x="480" y="574" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">민감 정보 검사</text>

       LEGEND STRIP
  ═══════════════════════════════ -->
