<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="2026-09-29-67f67d8d-02-pc-title 2026-09-29-67f67d8d-02-pc-desc">
  <title id="2026-09-29-67f67d8d-02-pc-title">Prompt Caching 처리 흐름</title>
  <desc id="2026-09-29-67f67d8d-02-pc-desc">요청 도착 후 KV 캐시 히트 여부에 따라 캐시 로드(프리필 생략) 또는 프리필 전체 수행 후 KV 캐시 저장을 거쳐 디코딩(토큰 생성)으로 이어지는 LLM API 캐싱 흐름.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-29-67f67d8d-02-pc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-29-67f67d8d-02-pc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-29-67f67d8d-02-pc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#f8fafb"/>

  <!-- 배치(2026-09-29 다시 그림): 결정 마름모 중심 (304,180), 꼭짓점 위 (304,112)·아래 (304,248)·왼쪽 (236,180).
       히트 경로는 위 줄(y=84)로 디코딩 박스 위에서, 미스 경로는 아래 줄(y=276)로 KV 저장을 거쳐
       디코딩 아래에서 들어간다. 두 경로는 디코딩 중심 x=790에서 만난다. -->

  <!-- 연결선 (박스보다 먼저) -->
  <!-- 요청 도착 → 캐시 히트인가 -->
  <line x1="172" y1="180" x2="232" y2="180" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow)"/>

  <!-- 예: 마름모 위 꼭짓점 → KV 캐시 로드 -->
  <path d="M304,112 L304,92 Q304,84 312,84 L400,84" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow-accent)"/>
  <rect x="340" y="78" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="350" y="87" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">예</text>

  <!-- 아니오: 마름모 아래 꼭짓점 → 프리필 전체 수행 -->
  <path d="M304,248 L304,268 Q304,276 312,276 L400,276" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow)"/>
  <rect x="330" y="270" width="40" height="12" rx="2" fill="#f8fafb"/>
  <text x="350" y="279" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">아니오</text>

  <!-- KV 캐시 로드 → 디코딩 (위에서 들어감) -->
  <path d="M556,84 L782,84 Q790,84 790,92 L790,148" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow-accent)"/>

  <!-- 프리필 전체 수행 → KV 캐시 저장 -->
  <line x1="556" y1="276" x2="726" y2="276" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow)"/>

  <!-- KV 캐시 저장 → 디코딩 (아래에서 들어감) -->
  <line x1="790" y1="248" x2="790" y2="212" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow)"/>

  <!-- 박스 -->
  <!-- 요청 도착 -->
  <rect x="52" y="156" width="120" height="48" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="112" y="176" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">요청</text>
  <text x="112" y="194" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">도착</text>

  <!-- 캐시 히트인가 (마름모) -->
  <rect x="256" y="132" width="96" height="96" rx="0" fill="#f8fafb" transform="rotate(45,304,180)"/>
  <rect x="256" y="132" width="96" height="96" rx="0" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2" transform="rotate(45,304,180)"/>
  <text x="304" y="178" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">캐시</text>
  <text x="304" y="194" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">히트인가</text>

  <!-- KV 캐시 로드 -->
  <rect x="404" y="56" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="404" y="56" width="152" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="412" y="63" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="426" y="72" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HIT</text>
  <text x="480" y="88" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">KV 캐시 로드</text>
  <text x="480" y="104" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">프리필 생략</text>

  <!-- 프리필 전체 수행 -->
  <rect x="404" y="248" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="404" y="248" width="152" height="56" rx="6" fill="white" stroke="#122127" stroke-width="1"/>
  <rect x="412" y="255" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.30)" stroke-width="0.8"/>
  <text x="426" y="264" fill="rgba(18,33,39,0.7)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MISS</text>
  <text x="480" y="286" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프리필 전체 수행</text>

  <!-- KV 캐시 저장 -->
  <rect x="730" y="248" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="730" y="248" width="120" height="56" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="738" y="255" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="752" y="264" fill="rgba(63,84,92,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KV</text>
  <text x="790" y="286" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">KV 캐시 저장</text>

  <!-- 디코딩 -->
  <rect x="716" y="152" width="148" height="56" rx="6" fill="#f8fafb"/>
  <rect x="716" y="152" width="148" height="56" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.25)" stroke-width="1"/>
  <rect x="724" y="159" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.20)" stroke-width="0.8"/>
  <text x="742" y="168" fill="rgba(18,33,39,0.55)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECODE</text>
  <text x="790" y="184" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">디코딩</text>
  <text x="790" y="200" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">토큰 생성</text>

  <!-- ═══════════════════════════════════════════════
       LEGEND STRIP
  ════════════════════════════════════════════════ -->
  <line x1="40" y1="328" x2="920" y2="328" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="40" y="342" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend: 캐시 히트 경로 -->
  <line x1="116" y1="338" x2="140" y2="338" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow-accent)"/>
  <text x="148" y="342" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">캐시 히트 경로</text>

  <!-- Legend: 캐시 미스 경로 -->
  <line x1="288" y1="338" x2="312" y2="338" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-02-pc-arrow)"/>
  <text x="320" y="342" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">캐시 미스 경로</text>

  <!-- Legend: 의사결정 -->
  <rect x="460" y="331" width="12" height="12" rx="0" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1" transform="rotate(45,466,337)"/>
  <text x="480" y="342" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">의사결정</text>

  <!-- Legend: 캐시 저장 -->
  <rect x="560" y="331" width="20" height="12" rx="4" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="588" y="342" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">KV 저장/생성</text>

</svg>
</body>
</html>
