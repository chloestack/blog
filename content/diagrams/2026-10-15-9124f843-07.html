<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 레드팀 배포 파이프라인</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-15-9124f843-07-redteam-pipeline-title 2026-10-15-9124f843-07-redteam-pipeline-desc">
  <title id="2026-10-15-9124f843-07-redteam-pipeline-title">LLM 레드팀 배포 파이프라인</title>
  <desc id="2026-10-15-9124f843-07-redteam-pipeline-desc">시스템 프롬프트 변경부터 버전 태그, 레드팀 자동 테스트, 결과 분기, 취약점 패치, 스테이징·프로덕션 배포, 모니터링까지 이어지는 LLM 레드팀 회귀 테스트 파이프라인을 보여주는 순서도.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-15-9124f843-07-rt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-15-9124f843-07-rt-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-15-9124f843-07-rt-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS — drawn before boxes
       ============================================================ -->

  <!-- S → V (시스템 프롬프트 → 버전 태그) vertical -->
  <path d="M 480,104 L 480,140" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow)"/>

  <!-- V → T (버전 태그 → 레드팀 회귀) vertical -->
  <path d="M 480,196 L 480,232" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow)"/>

  <!-- T → R (레드팀 회귀 → 테스트 결과) vertical -->
  <path d="M 480,288 L 480,316" stroke="#0d5763" stroke-width="1.2" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow-accent)"/>

  <!-- R → D (전부 통과 → 스테이징, right branch) -->
  <path d="M 532,344 Q 540,344 540,352 L 540,380 Q 540,388 548,388 L 636,388" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow)"/>

  <!-- R → F (실패 있음 → 취약점 패치, left branch) -->
  <path d="M 428,344 Q 420,344 420,352 L 420,388 Q 420,396 412,396 L 312,396" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow)"/>

  <!-- F → T (취약점 패치 → 레드팀, loop back left) -->
  <path d="M 220,372 Q 220,260 228,260 L 404,260" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow-muted)"/>

  <!-- D → P (스테이징 → 프로덕션) vertical -->
  <path d="M 720,416 L 720,452" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow)"/>

  <!-- P → M (프로덕션 → 모니터링) vertical -->
  <path d="M 720,508 L 720,540" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow)"/>

  <!-- M → F (이상 감지 → 취약점 패치, long feedback) -->
  <path d="M 672,556 Q 600,556 600,564 L 600,572 Q 600,580 592,580 L 268,580 Q 260,580 260,572 L 260,424 Q 260,416 268,416 L 288,416" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#2026-10-15-9124f843-07-rt-arrow-muted)"/>

  <!-- ============================================================
       Arrow labels
       ============================================================ -->

  <!-- 전부 통과 label on R→D path -->
  <rect x="508" y="355" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="534" y="365" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">전부 통과</text>

  <!-- 실패 있음 label on R→F path -->
  <rect x="388" y="355" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="414" y="365" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">실패 있음</text>

  <!-- 재테스트 label on F→T loop -->
  <rect x="272" y="248" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="298" y="258" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">재테스트</text>

  <!-- 이상 감지 label on M→F path -->
  <rect x="624" y="544" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="650" y="554" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">이상 감지</text>

  <!-- ============================================================
       NODES
       ============================================================ -->

  <!-- S: 시스템 프롬프트 변경 (input/external node) -->
  <rect x="388" y="44" width="184" height="60" rx="6" fill="#f8fafb"/>
  <rect x="388" y="44" width="184" height="60" rx="6" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <rect x="396" y="50" width="24" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="408" y="59" fill="rgba(58,84,143,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
  <text x="480" y="76" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">시스템 프롬프트</text>
  <text x="480" y="94" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">변경</text>

  <!-- V: 버전 태그 날짜 기록 (muted/store node) -->
  <rect x="396" y="140" width="168" height="56" rx="6" fill="#f8fafb"/>
  <rect x="396" y="140" width="168" height="56" rx="6" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="404" y="146" width="28" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.40)" stroke-width="0.8"/>
  <text x="418" y="155" fill="rgba(99,129,136,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAG</text>
  <text x="480" y="170" fill="#3f545c" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">버전 태그</text>
  <text x="480" y="187" fill="#3f545c" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">날짜 기록</text>

  <!-- T: 레드팀 회귀 자동 실행 (FOCAL / accent node) -->
  <rect x="388" y="232" width="184" height="56" rx="6" fill="#f8fafb"/>
  <rect x="388" y="232" width="184" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="396" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="412" y="247" fill="rgba(13,87,99,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTO</text>
  <text x="480" y="260" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">레드팀 회귀</text>
  <text x="480" y="278" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">자동 실행</text>

  <!-- R: 테스트 결과 (diamond decision) -->
  <!-- Diamond centered at (480, 344), half-w=52, half-h=28 -->
  <rect x="428" y="316" width="104" height="56" rx="0" fill="#f8fafb"/>
  <polygon points="480,316 532,344 480,372 428,344" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="340" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">테스트</text>
  <text x="480" y="355" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">결과</text>

  <!-- F: 취약점 패치 재테스트 (backend node, left) -->
  <rect x="136" y="368" width="168" height="56" rx="6" fill="#f8fafb"/>
  <rect x="136" y="368" width="168" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="144" y="374" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="162" y="383" fill="rgba(18,33,39,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PATCH</text>
  <text x="220" y="397" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">취약점 패치</text>
  <text x="220" y="415" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">재테스트</text>

  <!-- D: 스테이징 배포 (right branch, accent-2 node) -->
  <rect x="636" y="368" width="168" height="56" rx="6" fill="#f8fafb"/>
  <rect x="636" y="368" width="168" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="644" y="374" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="662" y="383" fill="rgba(13,87,99,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAGE</text>
  <text x="720" y="400" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">스테이징 배포</text>

  <!-- P: 프로덕션 배포 (backend node) -->
  <rect x="636" y="452" width="168" height="56" rx="6" fill="#f8fafb"/>
  <rect x="636" y="452" width="168" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="644" y="458" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="662" y="467" fill="rgba(18,33,39,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROD</text>
  <text x="720" y="484" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">프로덕션 배포</text>

  <!-- M: 모니터링 이상 감지 (FOCAL / accent node) -->
  <rect x="636" y="540" width="168" height="48" rx="6" fill="#f8fafb"/>
  <rect x="636" y="540" width="168" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="644" y="546" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="664" y="555" fill="rgba(13,87,99,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MONITOR</text>
  <text x="720" y="568" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">모니터링</text>
  <text x="720" y="582" fill="#3f545c" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">이상 감지</text>

  <!-- ============================================================
       LEGEND strip
       ============================================================ -->
  <line x1="32" y1="592" x2="928" y2="592" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

</svg>
</div>
</body>
