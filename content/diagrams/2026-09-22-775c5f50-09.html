<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="2026-09-22-775c5f50-09-llm-proxy-title 2026-09-22-775c5f50-09-llm-proxy-desc">
  <title id="2026-09-22-775c5f50-09-llm-proxy-title">LiteLLM 멀티 LLM 프록시 게이트웨이 구축 단계</title>
  <desc id="2026-09-22-775c5f50-09-llm-proxy-desc">투명 프록시에서 시작해 로드밸런싱, 폴백 활성화, 예산·레이트리밋 설정, Langfuse 연동까지 5단계로 진행하는 LiteLLM 게이트웨이 구축 순서를 보여주는 흐름도.</desc>

  <defs>
    <marker id="2026-09-22-775c5f50-09-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="200" fill="#f8fafb"/>

  <!-- Connector lines — drawn before boxes -->
  <!-- M1 → M2: right edge of M1 (x=224) to left edge of M2 (x=256) -->
  <line x1="224" y1="88" x2="256" y2="88" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-22-775c5f50-09-arrow-muted)"/>
  <!-- M2 → M3 -->
  <line x1="400" y1="88" x2="432" y2="88" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-22-775c5f50-09-arrow-muted)"/>
  <!-- M3 → M4 -->
  <line x1="576" y1="88" x2="608" y2="88" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-22-775c5f50-09-arrow-muted)"/>
  <!-- M4 → M5 -->
  <line x1="752" y1="88" x2="784" y2="88" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-22-775c5f50-09-arrow-muted)"/>

  <!-- M1: 1단계 투명 프록시 — link-blue style (new classDef) -->
  <!-- paper mask -->
  <rect x="60" y="52" width="164" height="72" rx="6" fill="#f8fafb"/>
  <!-- box -->
  <rect x="60" y="52" width="164" height="72" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <!-- type tag -->
  <rect x="68" y="60" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="82" y="69" fill="rgba(58,84,143,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <!-- step number -->
  <text x="142" y="84" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">1단계</text>
  <!-- node name -->
  <text x="142" y="104" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">투명 프록시</text>

  <!-- M2: 2단계 로드밸런싱 추가 — warn style -->
  <rect x="256" y="52" width="144" height="72" rx="6" fill="#f8fafb"/>
  <rect x="256" y="52" width="144" height="72" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="264" y="60" width="28" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="278" y="69" fill="rgba(169,106,8,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="328" y="84" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">2단계</text>
  <text x="328" y="104" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">로드밸런싱 추가</text>

  <!-- M3: 3단계 폴백 활성화 — warn style -->
  <rect x="432" y="52" width="144" height="72" rx="6" fill="#f8fafb"/>
  <rect x="432" y="52" width="144" height="72" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="440" y="60" width="28" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="454" y="69" fill="rgba(169,106,8,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="504" y="84" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">3단계</text>
  <text x="504" y="104" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">폴백 활성화</text>

  <!-- M4: 4단계 예산·레이트리밋 — focal/accent style (ok classDef → accent) -->
  <rect x="608" y="52" width="144" height="72" rx="6" fill="#f8fafb"/>
  <rect x="608" y="52" width="144" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="616" y="60" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="630" y="69" fill="rgba(13,87,99,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="680" y="84" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">4단계</text>
  <text x="680" y="104" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">예산·레이트리밋</text>

  <!-- M5: 5단계 Langfuse 연동 — focal/accent style (ok classDef → accent) -->
  <rect x="784" y="52" width="144" height="72" rx="6" fill="#f8fafb"/>
  <rect x="784" y="52" width="144" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="792" y="60" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="806" y="69" fill="rgba(13,87,99,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="856" y="84" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">5단계</text>
  <text x="856" y="104" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Langfuse 연동</text>

  <!-- Legend strip -->
  <line x1="32" y1="152" x2="928" y2="152" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Legend: 시작 -->
  <rect x="32" y="164" width="10" height="10" rx="2" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="0.8"/>
  <text x="48" y="173" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">시작</text>

  <!-- Legend: 진행 중 -->
  <rect x="108" y="164" width="10" height="10" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="0.8"/>
  <text x="124" y="173" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">진행 중</text>

  <!-- Legend: 핵심 단계 -->
  <rect x="208" y="164" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="224" y="173" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">핵심 단계</text>
</svg>
</body>
</html>
