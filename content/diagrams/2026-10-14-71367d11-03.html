<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-14-71367d11-03-hnsw-title 2026-10-14-71367d11-03-hnsw-desc">
  <title id="2026-10-14-71367d11-03-hnsw-title">HNSW 계층 탐색 흐름</title>
  <desc id="2026-10-14-71367d11-03-hnsw-desc">검색 쿼리 벡터가 HNSW 그래프의 레이어 2(성긴 그래프)에서 레이어 0(전체 노드)까지 순차적으로 후보를 좁혀 최종 ef 후보 집합을 구성한 뒤 상위 k개 결과를 반환하는 흐름을 보여준다.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-14-71367d11-03-hnsw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-14-71367d11-03-hnsw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ───────────────────────────────────────────
       레이어 구분 대역 (zone frame, 그라데이션 없이 순수 fill)
  ─────────────────────────────────────────────── -->
  <!-- HNSW 레이어 구역 라벨 -->
  <text x="52" y="176" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="500"
        fill="#6c8188" letter-spacing="0.14em" text-anchor="start">HNSW GRAPH</text>

  <!-- ───────────────────────────────────────────
       커넥터 (노드보다 먼저)
  ─────────────────────────────────────────────── -->

  <!-- 검색 쿼리 → 레이어 2: 세로 직선 -->
  <line x1="480" y1="160" x2="480" y2="192" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-03-hnsw-arrow)"/>

  <!-- 레이어 2 → 레이어 1: 세로 직선 + 라벨 -->
  <line x1="480" y1="260" x2="480" y2="292" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-03-hnsw-arrow)"/>
  <!-- 라벨 마스크 -->
  <rect x="444" y="264" width="72" height="16" rx="2" fill="#f8fafb"/>
  <text x="480" y="276" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="400"
        fill="#6c8188" text-anchor="middle" letter-spacing="0.06em">탐색 빠름</text>

  <!-- 레이어 1 → 레이어 0: 세로 직선 + 라벨 -->
  <line x1="480" y1="360" x2="480" y2="392" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-03-hnsw-arrow)"/>
  <!-- 라벨 마스크 -->
  <rect x="444" y="364" width="72" height="16" rx="2" fill="#f8fafb"/>
  <text x="480" y="376" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="400"
        fill="#6c8188" text-anchor="middle" letter-spacing="0.06em">후보 좁힘</text>

  <!-- 레이어 0 → ef 후보 집합: 세로 직선 (accent) -->
  <line x1="480" y1="460" x2="480" y2="492" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-14-71367d11-03-hnsw-arrow-accent)"/>

  <!-- ef 후보 집합 → 상위 k개 결과: 세로 직선 (accent) -->
  <line x1="480" y1="560" x2="480" y2="560"/>
  <!-- ef → result 화살표는 아래 노드 이후 y 계산 필요, 일단 확보 -->

  <!-- ───────────────────────────────────────────
       노드
  ─────────────────────────────────────────────── -->

  <!-- 1. 검색 쿼리 벡터 (input 타입 — muted@0.10 fill, soft stroke) -->
  <rect x="380" y="100" width="200" height="60" rx="6" fill="#f8fafb"/>
  <rect x="380" y="100" width="200" height="60" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="388" y="108" width="32" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="404" y="117" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500"
        fill="rgba(108,129,136,0.8)" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <!-- 노드명 -->
  <text x="480" y="140" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600"
        fill="#122127" text-anchor="middle">검색 쿼리 벡터</text>

  <!-- 2. 레이어 2 — 성긴 그래프 (external 타입 — 흐린) -->
  <rect x="380" y="200" width="200" height="60" rx="6" fill="#f8fafb"/>
  <rect x="380" y="200" width="200" height="60" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <rect x="388" y="208" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.20)" stroke-width="0.8"/>
  <text x="406" y="217" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500"
        fill="rgba(18,33,39,0.50)" text-anchor="middle" letter-spacing="0.08em">LAYER 2</text>
  <text x="480" y="234" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600"
        fill="#3f545c" text-anchor="middle">성긴 그래프</text>
  <text x="480" y="252" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400"
        fill="#6c8188" text-anchor="middle">sparse · 진입점 탐색</text>

  <!-- 3. 레이어 1 — 중간 밀도 (backend 타입) -->
  <rect x="380" y="300" width="200" height="60" rx="6" fill="#f8fafb"/>
  <rect x="380" y="300" width="200" height="60" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="388" y="308" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="406" y="317" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500"
        fill="rgba(18,33,39,0.8)" text-anchor="middle" letter-spacing="0.08em">LAYER 1</text>
  <text x="480" y="334" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600"
        fill="#122127" text-anchor="middle">중간 밀도 그래프</text>
  <text x="480" y="352" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400"
        fill="#6c8188" text-anchor="middle">medium density</text>

  <!-- 4. 레이어 0 — 전체 노드 (focal 1) -->
  <rect x="380" y="400" width="200" height="60" rx="6" fill="#f8fafb"/>
  <rect x="380" y="400" width="200" height="60" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="388" y="408" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="406" y="417" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500"
        fill="rgba(13,87,99,0.8)" text-anchor="middle" letter-spacing="0.08em">LAYER 0</text>
  <text x="480" y="434" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600"
        fill="#122127" text-anchor="middle">전체 노드 그래프</text>
  <text x="480" y="452" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400"
        fill="#0d5763" text-anchor="middle">base layer · 최대 밀도</text>

  <!-- 5. ef 후보 집합 (focal 2 — accent) -->
  <rect x="348" y="500" width="264" height="60" rx="6" fill="#f8fafb"/>
  <rect x="348" y="500" width="264" height="60" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="356" y="508" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="374" y="517" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500"
        fill="rgba(13,87,99,0.8)" text-anchor="middle" letter-spacing="0.08em">ef 파라미터</text>
  <text x="480" y="534" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600"
        fill="#122127" text-anchor="middle">ef 후보 집합 탐색</text>
  <text x="480" y="552" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400"
        fill="#0d5763" text-anchor="middle">ef_construct / ef_search</text>

  <!-- ef → result 화살표 (accent, 오른쪽으로 꺾어 결과 박스로) -->
  <!-- ef 박스 우측 → 꺾어서 결과 박스 좌측 -->
  <path d="M 612 530 L 668 530 L 668 530" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-14-71367d11-03-hnsw-arrow-accent)"/>
  <!-- 결과 박스는 오른쪽에 배치 -->

  <!-- 6. 상위 k개 결과 (store/state 타입 — 우측 배치) -->
  <rect x="668" y="500" width="212" height="60" rx="6" fill="#f8fafb"/>
  <rect x="668" y="500" width="212" height="60" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="676" y="508" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="692" y="517" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500"
        fill="rgba(63,84,92,0.8)" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
  <text x="774" y="537" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600"
        fill="#122127" text-anchor="middle">상위 k개 결과</text>
  <text x="774" y="552" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400"
        fill="#6c8188" text-anchor="middle">top-k neighbors</text>

  <!-- 화살표 라벨: ef → 결과 위 -->
  <rect x="628" y="518" width="32" height="16" rx="2" fill="#f8fafb"/>
  <text x="644" y="530" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="400"
        fill="#6c8188" text-anchor="middle" letter-spacing="0.06em">반환</text>

  <!-- ───────────────────────────────────────────
       오른쪽 사이드 주석 (탐색 방향 레이블)
  ─────────────────────────────────────────────── -->
  <!-- 세로 방향 브레이스 대신 점선 화살표 -->
  <line x1="308" y1="200" x2="308" y2="460" stroke="rgba(18,33,39,0.15)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <polygon points="304,456 308,464 312,456" fill="rgba(18,33,39,0.20)"/>
  <text x="292" y="336" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500"
        fill="#6c8188" text-anchor="middle" writing-mode="lr">탐색</text>
  <text x="278" y="336" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500"
        fill="#6c8188" text-anchor="middle">방향</text>

  <!-- ───────────────────────────────────────────
       범례 수평 스트립
  ─────────────────────────────────────────────── -->
  <line x1="32" y1="584" x2="928" y2="584" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="32" y="596" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="500"
        fill="#6c8188" letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목 1: focal (액센트) -->
  <rect x="108" y="588" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="124" y="597" font-family="'IBM Plex Sans KR', sans-serif" font-size="10" fill="#3f545c">핵심 단계</text>

  <!-- 범례 항목 2: backend -->
  <rect x="220" y="588" width="10" height="10" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="236" y="597" font-family="'IBM Plex Sans KR', sans-serif" font-size="10" fill="#3f545c">처리 레이어</text>

  <!-- 범례 항목 3: external -->
  <rect x="344" y="588" width="10" height="10" rx="2" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <text x="360" y="597" font-family="'IBM Plex Sans KR', sans-serif" font-size="10" fill="#3f545c">진입 레이어</text>

  <!-- 범례 항목 4: input -->
  <rect x="460" y="588" width="10" height="10" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="476" y="597" font-family="'IBM Plex Sans KR', sans-serif" font-size="10" fill="#3f545c">입력</text>

  <!-- 범례 항목 5: store -->
  <rect x="524" y="588" width="10" height="10" rx="2" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="540" y="597" font-family="'IBM Plex Sans KR', sans-serif" font-size="10" fill="#3f545c">출력 / 저장</text>
</svg>
</body>
</html>
