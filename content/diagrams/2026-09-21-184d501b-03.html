<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphRAG 엔티티 추출 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { display: block; width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-21-184d501b-03-graphrag-flow-title 2026-09-21-184d501b-03-graphrag-flow-desc">
  <title id="2026-09-21-184d501b-03-graphrag-flow-title">GraphRAG 엔티티 추출 흐름</title>
  <desc id="2026-09-21-184d501b-03-graphrag-flow-desc">텍스트 청크에서 1차 추출 프롬프트를 거쳐 엔티티·관계 목록을 만들고, 글리밍 체크에서 누락이 있으면 추가 추출을 반복하고, 없으면 결과를 병합해 지식 그래프에 누적하는 순환 흐름.</desc>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="2026-09-21-184d501b-03-grf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-21-184d501b-03-grf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-21-184d501b-03-grf-arrow-back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="420" fill="#f8fafb"/>

  <!-- ─── 커넥터 (박스보다 먼저) ─── -->

  <!-- CH → P1 -->
  <line x1="148" y1="168" x2="212" y2="168" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-184d501b-03-grf-arrow)"/>

  <!-- P1 → E1 -->
  <line x1="312" y1="168" x2="376" y2="168" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-184d501b-03-grf-arrow-accent)"/>

  <!-- E1 → P2 (글리밍 체크) -->
  <line x1="488" y1="168" x2="552" y2="168" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-184d501b-03-grf-arrow)"/>

  <!-- P2 → MG (아니오: 아래로 꺾어 오른쪽) -->
  <!-- 다이아몬드 하단(616, 208) → 아래로 내려 → MG 중앙 왼쪽 -->
  <path d="M616,208 L616,280 L720,280" stroke="#0d5763" stroke-width="1.2" fill="none" marker-end="url(#2026-09-21-184d501b-03-grf-arrow-accent)" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- P2 → P3 (예: 위로) -->
  <!-- 다이아몬드 상단(616,128) → 위 → P3 상단 -->
  <path d="M616,128 L616,72 L432,72 L432,128" stroke="#6c8188" stroke-width="1" fill="none" marker-end="url(#2026-09-21-184d501b-03-grf-arrow-back)" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4"/>

  <!-- P3 → E1 (왼쪽 → E1 상단) -->
  <!-- P3 좌측(376,152) → E1 상단 중앙 -->
  <path d="M376,152 L376,140 L432,140 L432,128" stroke="#6c8188" stroke-width="1" fill="none" marker-end="url(#2026-09-21-184d501b-03-grf-arrow-back)" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4"/>

  <!-- MG → KG -->
  <line x1="824" y1="280" x2="872" y2="280" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-184d501b-03-grf-arrow-accent)"/>

  <!-- ─── 노드 박스 ─── -->

  <!-- CH: 텍스트 청크 (input 타입) -->
  <rect x="28" y="140" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="28" y="140" width="120" height="56" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="36" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="50" y="157" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="88" y="174" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">텍스트 청크</text>

  <!-- P1: 1차 추출 프롬프트 (accent/focal 타입) -->
  <rect x="212" y="140" width="100" height="56" rx="6" fill="#f8fafb"/>
  <rect x="212" y="140" width="100" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="220" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="234" y="157" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="262" y="170" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">1차 추출</text>
  <text x="262" y="185" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프롬프트</text>

  <!-- E1: 엔티티·관계 목록 (store 타입) -->
  <rect x="376" y="128" width="112" height="80" rx="6" fill="#f8fafb"/>
  <rect x="376" y="128" width="112" height="80" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="384" y="136" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="400" y="145" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="432" y="166" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">엔티티·관계</text>
  <text x="432" y="181" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">목록</text>
  <text x="432" y="196" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">초기 결과</text>

  <!-- P2: 글리밍 체크 (다이아몬드) -->
  <!-- 중심: (616, 168), 반폭 64, 반높이 40 -->
  <polygon points="616,128 680,168 616,208 552,168" fill="#f8fafb"/>
  <polygon points="616,128 680,168 616,208 552,168" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="616" y="162" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">글리밍</text>
  <text x="616" y="176" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">체크</text>

  <!-- P3: 추가 추출 프롬프트 (accent 타입, 위) -->
  <rect x="496" y="28" width="112" height="44" rx="6" fill="#f8fafb"/>
  <rect x="496" y="28" width="112" height="44" rx="6" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="552" y="46" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">추가 추출</text>
  <text x="552" y="61" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프롬프트</text>

  <!-- MG: 결과 병합 (store 타입) -->
  <rect x="720" y="252" width="104" height="56" rx="6" fill="#f8fafb"/>
  <rect x="720" y="252" width="104" height="56" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="728" y="260" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="744" y="269" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MERGE</text>
  <text x="772" y="284" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">결과 병합</text>
  <text x="772" y="299" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">중복 제거</text>

  <!-- KG: 지식 그래프 누적 (focal) -->
  <rect x="872" y="252" width="56" height="56" rx="6" fill="#f8fafb"/>
  <rect x="872" y="252" width="56" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="900" y="274" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">지식</text>
  <text x="900" y="289" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">그래프</text>
  <text x="900" y="301" fill="#0d5763" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">누적</text>

  <!-- ─── 화살표 레이블 ─── -->

  <!-- 예 레이블 (P2→P3 경로 위, 다이아몬드 상단 근처) -->
  <rect x="601" y="104" width="28" height="14" rx="2" fill="#f8fafb"/>
  <text x="615" y="114" fill="#6c8188" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- 아니오 레이블 (P2→MG 경로, 다이아몬드 아래) -->
  <rect x="588" y="218" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="612" y="228" fill="#0d5763" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- ─── 범례 ─── -->
  <line x1="28" y1="360" x2="932" y2="360" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="28" y="376" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 입력 -->
  <rect x="92" y="365" width="32" height="16" rx="4" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="132" y="377" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">입력</text>

  <!-- 추출 단계 -->
  <rect x="180" y="365" width="32" height="16" rx="4" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="220" y="377" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">추출·결정 단계</text>

  <!-- 반복 (점선) -->
  <rect x="336" y="365" width="32" height="16" rx="4" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="376" y="377" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">반복 경로</text>

  <!-- 저장 -->
  <rect x="460" y="365" width="32" height="16" rx="4" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="500" y="377" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">저장·병합</text>

  <!-- 결과 -->
  <rect x="568" y="365" width="32" height="16" rx="4" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="608" y="377" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">최종 결과 (focal)</text>

</svg>
</div>
</body>
</html>
