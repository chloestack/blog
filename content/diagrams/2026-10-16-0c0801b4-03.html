<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"/>
<title>PromptOps 레이어 구조</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 0; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-16-0c0801b4-03-promptops-title 2026-10-16-0c0801b4-03-promptops-desc">
  <title id="2026-10-16-0c0801b4-03-promptops-title">PromptOps 레이어 구조</title>
  <desc id="2026-10-16-0c0801b4-03-promptops-desc">시스템·태스크·동적 세 레이어가 조합 엔진으로 모이고, 최종 프롬프트로 합성되어 LLM에 전달되는 흐름을 보여주는 도식.</desc>

  <defs>
    <!-- Dot pattern -->
    <pattern id="2026-10-16-0c0801b4-03-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(18,33,39,0.10)"/>
    </pattern>
    <!-- Arrow markers -->
    <marker id="2026-10-16-0c0801b4-03-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-16-0c0801b4-03-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafb"/>
  <rect width="100%" height="100%" fill="url(#2026-10-16-0c0801b4-03-dots)" opacity="0.5"/>

  <!--
    Layout (4px grid, viewBox 960×600):
    Three input layer boxes, left column, vertically centered
    SL: x=80,  y=112, w=200, h=64
    TL: x=80,  y=248, w=200, h=64
    DL: x=80,  y=384, w=200, h=64

    COMP: x=380, y=248, w=200, h=64  (center of gravity, focal)
    FP:   x=680, y=248, w=200, h=64

    Connector routing (orthogonal elbows, r=8):
    SL right edge (280, 144) → elbow down-right → COMP left top attach (380, 264)
    TL right edge (280, 280) → straight → COMP left mid (380, 280)
    DL right edge (280, 416) → elbow up-right → COMP left bottom attach (380, 296)
    COMP right edge (580, 280) → straight → FP left (680, 280)
  -->

  <!-- ── Arrows drawn BEFORE boxes ── -->

  <!-- SL → COMP: from (280,144) right, elbow at x=340, then down to (380,264) -->
  <path d="M 280,144 H 340 Q 348,144 348,152 V 264 Q 348,272 356,272 H 380"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-03-arrow)"/>

  <!-- TL → COMP: straight horizontal from (280,280) to (380,280) -->
  <line x1="280" y1="280" x2="380" y2="280"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-03-arrow)"/>

  <!-- DL → COMP: from (280,416) right, elbow at x=340, then up to (380,296) -->
  <path d="M 280,416 H 340 Q 348,416 348,408 V 296 Q 348,288 356,288 H 380"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-03-arrow)"/>

  <!-- COMP → FP: straight horizontal, accent marker -->
  <line x1="580" y1="280" x2="680" y2="280"
        stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-03-arrow-accent)"/>

  <!-- ── Nodes drawn AFTER arrows ── -->

  <!-- SL — 시스템 레이어 (input type) -->
  <rect x="80" y="112" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="80" y="112" width="200" height="64" rx="6"
        fill="rgba(58,84,143,0.08)" stroke="rgba(58,84,143,0.55)" stroke-width="1"/>
  <!-- tag -->
  <rect x="88" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="102" y="129"
        fill="rgba(58,84,143,0.80)" font-size="7" font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">SYS</text>
  <!-- name -->
  <text x="180" y="150"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        text-anchor="middle">시스템 레이어</text>
  <!-- sublabel -->
  <text x="180" y="166"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">페르소나 · 브랜드 규칙</text>

  <!-- TL — 태스크 레이어 (input type) -->
  <rect x="80" y="248" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="80" y="248" width="200" height="64" rx="6"
        fill="rgba(58,84,143,0.08)" stroke="rgba(58,84,143,0.55)" stroke-width="1"/>
  <rect x="88" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="102" y="265"
        fill="rgba(58,84,143,0.80)" font-size="7" font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">TASK</text>
  <text x="180" y="286"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        text-anchor="middle">태스크 레이어</text>
  <text x="180" y="302"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">태스크별 지시사항</text>

  <!-- DL — 동적 레이어 (input type) -->
  <rect x="80" y="384" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="80" y="384" width="200" height="64" rx="6"
        fill="rgba(58,84,143,0.08)" stroke="rgba(58,84,143,0.55)" stroke-width="1"/>
  <rect x="88" y="392" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="102" y="401"
        fill="rgba(58,84,143,0.80)" font-size="7" font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">DYN</text>
  <text x="180" y="422"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        text-anchor="middle">동적 레이어</text>
  <text x="180" y="438"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">사용자 컨텍스트</text>

  <!-- COMP — 조합 엔진 (focal, accent) -->
  <rect x="380" y="248" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="380" y="248" width="200" height="64" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="388" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="406" y="265"
        fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
  <text x="480" y="286"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        text-anchor="middle">조합 엔진</text>
  <text x="480" y="302"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">런타임 합성</text>

  <!-- FP — 최종 프롬프트 (backend / output) -->
  <rect x="680" y="248" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="680" y="248" width="200" height="64" rx="6"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="688" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="706" y="265"
        fill="rgba(18,33,39,0.70)" font-size="7" font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
  <text x="780" y="286"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        text-anchor="middle">최종 프롬프트</text>
  <text x="780" y="302"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">LLM 전달</text>

  <!-- ── Arrow label on COMP → FP ── -->
  <!-- connector at y=280; label sits above at y=264 (gap: 280-270=10px) -->
  <rect x="594" y="264" width="72" height="12" rx="2" fill="#f8fafb"/>
  <text x="630" y="273"
        fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        text-anchor="middle" font-weight="500">합성 완료</text>

  <!-- ── Legend strip ── -->
  <line x1="80" y1="524" x2="880" y2="524" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="80" y="540"
        fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', ui-monospace, monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- Legend: input layer swatch -->
  <rect x="164" y="530" width="12" height="12" rx="2"
        fill="rgba(58,84,143,0.08)" stroke="rgba(58,84,143,0.55)" stroke-width="1"/>
  <text x="182" y="540"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">입력 레이어</text>

  <!-- Legend: focal/engine swatch -->
  <rect x="304" y="530" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="322" y="540"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">조합 엔진 (핵심)</text>

  <!-- Legend: output swatch -->
  <rect x="468" y="530" width="12" height="12" rx="2"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="486" y="540"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">출력 / 전달</text>

</svg>
</div>
</body>
</html>
