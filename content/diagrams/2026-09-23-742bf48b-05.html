<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoped Values 스코프 중첩 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="2026-09-23-742bf48b-05-scoped-title 2026-09-23-742bf48b-05-scoped-desc">
  <title id="2026-09-23-742bf48b-05-scoped-title">Scoped Values 스코프 중첩 흐름</title>
  <desc id="2026-09-23-742bf48b-05-scoped-desc">외부 스코프에서 USER_ID가 alice인 상태에서 내부 스코프에 진입하면 system-admin으로 재바인딩되고, 스코프가 종료되면 alice로 자동 복원되는 흐름을 보여주는 플로우차트.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-09-23-742bf48b-05-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 (accent) -->
    <marker id="2026-09-23-742bf48b-05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─── 화살표 (노드보다 먼저) ─── -->

  <!-- O → I (외부 스코프 → 내부 스코프 진입) -->
  <path d="M480,148 L480,196" fill="none" stroke="#0d5763" stroke-width="1.5" marker-end="url(#2026-09-23-742bf48b-05-arrow-accent)"/>

  <!-- I → G1 (내부 스코프 → get() system-admin) -->
  <path d="M400,284 Q340,284 340,308 L340,332" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-05-arrow)"/>

  <!-- I → E (내부 스코프 → 내부 스코프 종료) -->
  <path d="M480,284 L480,332" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-05-arrow)"/>

  <!-- E → G2 (내부 스코프 종료 → get() alice) -->
  <path d="M480,408 L480,448" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-05-arrow)"/>

  <!-- ─── 노드 ─── -->

  <!-- O: 외부 스코프 (link 계열 파란빛) -->
  <!-- paper mask -->
  <rect x="340" y="72" width="280" height="76" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="340" y="72" width="280" height="76" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1.2"/>
  <!-- type tag -->
  <rect x="348" y="80" width="44" height="13" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="370" y="90" fill="rgba(58,84,143,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTER</text>
  <!-- node name -->
  <text x="480" y="116" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">외부 스코프</text>
  <!-- sublabel -->
  <text x="480" y="136" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">USER_ID → alice</text>

  <!-- O → I 화살표 라벨 -->
  <rect x="442" y="156" width="76" height="14" rx="2" fill="#f8fafb"/>
  <text x="480" y="166" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스코프 진입</text>

  <!-- I: 내부 스코프 진입 (focal, accent) -->
  <rect x="340" y="196" width="280" height="88" rx="6" fill="#f8fafb"/>
  <rect x="340" y="196" width="280" height="88" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <rect x="348" y="204" width="44" height="13" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="370" y="214" fill="rgba(13,87,99,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INNER</text>
  <text x="480" y="240" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">내부 스코프 진입</text>
  <text x="480" y="260" fill="#0d5763" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">USER_ID → system-admin</text>
  <text x="480" y="276" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">ScopedValue.where(…).run(…)</text>

  <!-- G1: get() → system-admin (왼쪽 가지) -->
  <rect x="240" y="332" width="204" height="72" rx="6" fill="#f8fafb"/>
  <rect x="240" y="332" width="204" height="72" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <rect x="248" y="340" width="36" height="13" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="266" y="350" fill="rgba(40,109,80,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
  <text x="342" y="372" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">get() 호출</text>
  <text x="342" y="390" fill="#286d50" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">→ system-admin</text>

  <!-- I → G1 라벨 -->
  <rect x="296" y="296" width="80" height="14" rx="2" fill="#f8fafb"/>
  <text x="336" y="306" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">내부에서 읽기</text>

  <!-- E: 내부 스코프 종료 -->
  <rect x="380" y="332" width="200" height="76" rx="6" fill="#f8fafb"/>
  <rect x="380" y="332" width="200" height="76" rx="6" fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1"/>
  <rect x="388" y="340" width="40" height="13" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="408" y="350" fill="rgba(169,106,8,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXIT</text>
  <text x="480" y="376" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">내부 스코프 종료</text>
  <text x="480" y="396" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">run() 블록 탈출</text>

  <!-- E → G2 라벨 -->
  <rect x="436" y="416" width="92" height="14" rx="2" fill="#f8fafb"/>
  <text x="482" y="426" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자동 복원</text>

  <!-- G2: get() → alice (자동 복원) -->
  <rect x="360" y="448" width="240" height="72" rx="6" fill="#f8fafb"/>
  <rect x="360" y="448" width="240" height="72" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <rect x="368" y="456" width="48" height="13" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="392" y="466" fill="rgba(40,109,80,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESTORE</text>
  <text x="480" y="492" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">get() 호출 — 복원됨</text>
  <text x="480" y="508" fill="#286d50" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">→ alice</text>

  <!-- ─── 범례 ─── -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목 1: focal (accent) -->
  <rect x="112" y="556" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="130" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">스코프 진입 (재바인딩)</text>

  <!-- 범례 항목 2: ok (green) -->
  <rect x="300" y="556" width="12" height="12" rx="2" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="318" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">읽기 / 복원 완료</text>

  <!-- 범례 항목 3: warn (amber) -->
  <rect x="476" y="556" width="12" height="12" rx="2" fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1"/>
  <text x="494" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">스코프 종료</text>

  <!-- 범례 항목 4: outer (link blue) -->
  <rect x="632" y="556" width="12" height="12" rx="2" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="650" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">외부 스코프 (원래 값)</text>

</svg>
</body>
</html>
