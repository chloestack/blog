<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="2026-09-21-56d0a588-02-cls-title 2026-09-21-56d0a588-02-cls-desc">
  <title id="2026-09-21-56d0a588-02-cls-title">Java ClassLoader 위임 탐색 흐름</title>
  <desc id="2026-09-21-56d0a588-02-cls-desc">클래스 로딩 요청이 부모 ClassLoader에 위임되고, 부모가 실패하면 자신이 직접 탐색해 바이트코드를 로드하거나 ClassNotFoundException을 던지는 과정을 보여주는 흐름도.</desc>

  <defs>

    <marker id="2026-09-21-56d0a588-02-cls-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-21-56d0a588-02-cls-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </marker>
    <marker id="2026-09-21-56d0a588-02-cls-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    <marker id="2026-09-21-56d0a588-02-cls-arrow-err" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </marker>

  <!-- 배경 -->
  <rect width="960" height="360" fill="#f8fafb"/>

  <!-- R → Q1 -->
  <line x1="172" y1="132" x2="248" y2="132" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-02-cls-arrow)"/>

  <!-- Q1 → DONE (부모 성공, 위쪽 경로) -->
  <path d="M 340 108 L 340 72 L 720 72 L 720 108" fill="none" stroke="#286d50" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-02-cls-arrow-ok)"/>
  <!-- 라벨: 부모 성공 -->
  <rect x="495" y="56" width="64" height="14" rx="2" fill="#f8fafb"/>
  <text x="527" y="67" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">부모 성공</text>

  <!-- Q1 → Q2 (부모 실패, 오른쪽) -->
  <line x1="388" y1="132" x2="464" y2="132" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-02-cls-arrow)"/>
  <!-- 라벨: 부모 실패 -->
  <rect x="399" y="118" width="56" height="14" rx="2" fill="#f8fafb"/>
  <text x="427" y="129" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">부모 실패</text>

  <rect x="573" y="52" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="591" y="63" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">발견</text>

  <path d="M 556 156 L 556 208 L 620 208" fill="none" stroke="#94382b" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-02-cls-arrow-err)"/>

  <rect x="563" y="192" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="585" y="203" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">미발견</text>

  <!-- LOAD → DONE -->
  <line x1="716" y1="132" x2="720" y2="132" stroke="#286d50" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-02-cls-arrow-ok)"/>

  <text x="108" y="150" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ClassLoader.loadClass()</text>

  <!-- Q1: 부모에게 위임 결정 (focal - diamond) -->
  <!-- 마름모: 중심(318, 132), 가로 70, 세로 48 -->
  <polygon points="248,132 318,108 388,132 318,156" fill="#f8fafb"/>
  <polygon points="248,132 318,108 388,132 318,156" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>

  <!-- 마름모: 중심(532, 132), 가로 68, 세로 48 -->
  <polygon points="464,132 532,108 600,132 532,156" fill="#f8fafb"/>

  <text x="532" y="128" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자신이</text>

  <rect x="620" y="108" width="100" height="48" rx="6" fill="#f8fafb"/>
  <rect x="620" y="108" width="100" height="48" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="628" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="642" y="123" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD</text>
  <text x="670" y="136" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">바이트코드</text>
  <text x="670" y="150" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">로드·검증</text>

  <!-- DONE: 로드 완료 (성공 상태) -->
  <rect x="720" y="108" width="100" height="48" rx="6" fill="#f8fafb"/>
  <rect x="720" y="108" width="100" height="48" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <rect x="728" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="742" y="123" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
  <text x="770" y="140" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">로드 완료</text>

  <!-- ERR: ClassNotFoundException (error 상태) -->
  <rect x="620" y="184" width="120" height="48" rx="6" fill="#f8fafb"/>
  <rect x="620" y="184" width="120" height="48" rx="6" fill="rgba(148,56,43,0.07)" stroke="#94382b" stroke-width="1"/>
  <rect x="628" y="190" width="24" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="640" y="199" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERR</text>
  <text x="680" y="206" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ClassNotFound</text>
  <text x="680" y="220" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Exception</text>

  <!-- ─── 범례 ─── -->
  <line x1="44" y1="288" x2="916" y2="288" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="44" y="304" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목들 -->
  <polygon points="116,298 128,308 116,318 104,308" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="136" y="312" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">결정 분기</text>

  <rect x="244" y="300" width="20" height="16" rx="4" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="272" y="312" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">성공 상태</text>

  <rect x="380" y="300" width="20" height="16" rx="4" fill="rgba(148,56,43,0.07)" stroke="#94382b" stroke-width="1"/>
  <text x="408" y="312" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">예외 상태</text>

  <rect x="516" y="300" width="20" height="16" rx="4" fill="#ffffff" stroke="#122127" stroke-width="1"/>

  <rect x="652" y="300" width="20" height="16" rx="4" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="680" y="312" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">진입점</text>
