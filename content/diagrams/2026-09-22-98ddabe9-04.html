<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" role="img" aria-labelledby="2026-09-22-98ddabe9-04-iac-scan-title 2026-09-22-98ddabe9-04-iac-scan-desc">
  <title id="2026-09-22-98ddabe9-04-iac-scan-title">IaC Rego 정책 평가 흐름</title>
  <desc id="2026-09-22-98ddabe9-04-iac-scan-desc">IaC 코드가 Rego 정책 평가를 거쳐 PASS 또는 FAIL로 분기되고, FAIL은 심각도에 따라 경고 또는 파이프라인 중단으로 이어지는 흐름을 보여줍니다.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-09-22-98ddabe9-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-22-98ddabe9-04-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 링크 화살표 -->
    <marker id="2026-09-22-98ddabe9-04-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="364" fill="#f8fafb"/>

  <!-- ─────────── 커넥터 (노드보다 먼저) ─────────── -->

  <!-- IaC → Rego 정책 평가 -->
  <line x1="200" y1="144" x2="308" y2="144" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-04-arrow)"/>

  <!-- Rego 정책 평가 → PASS (위쪽 분기, 오른쪽 위 방향) -->
  <!-- 오른쪽 edge에서 나와 위로 꺾고 PASS 노드 왼쪽으로 -->
  <path d="M 492 144 L 540 144 Q 548 144 548 136 L 548 92 Q 548 84 556 84 L 620 84" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-04-arrow)"/>

  <!-- 라벨: PASS 분기 -->
  <rect x="548" y="98" width="36" height="12" rx="2" fill="#f8fafb"/>
  <text x="566" y="107" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">yes</text>

  <!-- Rego 정책 평가 → FAIL (아래쪽 분기) -->
  <path d="M 492 144 L 540 144 Q 548 144 548 152 L 548 204 Q 548 212 556 212 L 620 212" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-04-arrow)"/>

  <!-- 라벨: FAIL 분기 -->
  <rect x="548" y="218" width="28" height="12" rx="2" fill="#f8fafb"/>
  <text x="562" y="227" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">no</text>

  <!-- FAIL → LOW·MEDIUM (위로 꺾임) -->
  <path d="M 780 196 L 792 196 Q 800 196 800 188 L 800 100 Q 800 92 808 92 L 818 92" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-04-arrow)"/>

  <!-- FAIL → HIGH·CRITICAL (아래로 꺾임) -->
  <path d="M 780 228 L 792 228 Q 800 228 800 236 L 800 268 Q 800 276 808 276 L 818 276" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-04-arrow)"/>

  <!-- ─────────── 노드 ─────────── -->

  <!-- 노드 1: IaC 코드 (input) -->
  <!-- x=40, y=112, w=160, h=64 -->
  <rect x="40" y="112" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="40" y="112" width="160" height="64" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="48" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.4)" stroke-width="0.8"/>
  <text x="66" y="127" fill="rgba(58,84,143,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <!-- 노드 이름 -->
  <text x="120" y="148" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">IaC 코드</text>
  <!-- 서브라벨 -->
  <text x="120" y="164" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">tf · yaml · json</text>

  <!-- 노드 2: Rego 정책 평가 (focal / accent) -->
  <!-- x=308, y=112, w=184, h=64 -->
  <rect x="308" y="112" width="184" height="64" rx="6" fill="#f8fafb"/>
  <rect x="308" y="112" width="184" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 타입 태그 -->
  <rect x="316" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="334" y="127" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
  <!-- 노드 이름 -->
  <text x="400" y="146" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Rego 정책 평가</text>
  <!-- 서브라벨 -->
  <text x="400" y="162" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">OPA / Conftest</text>

  <!-- 노드 3: PASS -->
  <!-- x=620, y=56, w=148, h=56 -->
  <rect x="620" y="56" width="148" height="56" rx="6" fill="#f8fafb"/>
  <rect x="620" y="56" width="148" height="56" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="628" y="62" width="36" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>
  <text x="646" y="71" fill="rgba(40,109,80,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>
  <!-- 노드 이름 -->
  <text x="694" y="90" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">정책 통과</text>
  <!-- 서브라벨 -->
  <text x="694" y="104" fill="#286d50" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">pipeline continues</text>

  <!-- 노드 4: FAIL -->
  <!-- x=620, y=184, w=160, h=56 -->
  <rect x="620" y="184" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="620" y="184" width="160" height="56" rx="6" fill="rgba(148,56,43,0.06)" stroke="rgba(148,56,43,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 타입 태그 -->
  <rect x="628" y="190" width="36" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>
  <text x="646" y="199" fill="rgba(148,56,43,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAIL</text>
  <!-- 노드 이름 -->
  <text x="700" y="218" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">설정 오류 감지</text>
  <!-- 서브라벨 -->
  <text x="700" y="232" fill="#94382b" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">misconfiguration</text>

  <!-- 노드 5: LOW·MEDIUM -->
  <!-- x=852, y=64, w=76, h=56 — 오른쪽 끝 -->
  <rect x="820" y="64" width="108" height="56" rx="6" fill="#f8fafb"/>
  <rect x="820" y="64" width="108" height="56" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <!-- 노드 이름 -->
  <text x="874" y="88" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">경고만</text>
  <!-- 서브라벨 -->
  <text x="874" y="104" fill="#a96a08" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">LOW · MEDIUM</text>

  <!-- 노드 6: HIGH·CRITICAL -->
  <!-- x=852, y=248, w=76, h=56 -->
  <rect x="820" y="248" width="108" height="56" rx="6" fill="#f8fafb"/>
  <rect x="820" y="248" width="108" height="56" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1.2"/>
  <!-- 노드 이름 -->
  <text x="874" y="272" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">파이프라인</text>
  <!-- 노드 이름 2줄 -->
  <text x="874" y="286" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">중단</text>
  <!-- 서브라벨 -->
  <text x="874" y="298" fill="#94382b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">HIGH · CRITICAL</text>

  <!-- ─────────── 범례 ─────────── -->
  <line x1="32" y1="324" x2="928" y2="324" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 항목들 -->
  <rect x="32" y="330" width="8" height="8" rx="1" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="0.8"/>
  <text x="46" y="338" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace">입력</text>

  <rect x="88" y="330" width="8" height="8" rx="1" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="102" y="338" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace">정책 엔진 (focal)</text>

  <rect x="216" y="330" width="8" height="8" rx="1" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="0.8"/>
  <text x="230" y="338" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace">통과</text>

  <rect x="268" y="330" width="8" height="8" rx="1" fill="rgba(148,56,43,0.06)" stroke="rgba(148,56,43,0.5)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="282" y="338" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace">오류</text>

  <rect x="312" y="330" width="8" height="8" rx="1" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="0.8"/>
  <text x="326" y="338" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace">경고</text>

  <rect x="368" y="330" width="8" height="8" rx="1" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <text x="382" y="338" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace">중단</text>

</svg>
</body>
</html>
