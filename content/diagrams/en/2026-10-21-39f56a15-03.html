<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speculative Decoding Deployment Decision Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  svg { display: block; width: 100%; max-width: 960px; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-21-39f56a15-03-sd-flow-title 2026-10-21-39f56a15-03-sd-flow-desc">
  <title id="2026-10-21-39f56a15-03-sd-flow-title">Speculative Decoding Deployment Decision Flow</title>
  <desc id="2026-10-21-39f56a15-03-sd-flow-desc">A decision flowchart starting from a deployment plan node, sequentially asking about GPU free memory and batch size, then branching into three recommended conclusions: use quantization, limited effect, or adopt aggressively.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-10-21-39f56a15-03-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-21-39f56a15-03-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-21-39f56a15-03-arr-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
    <marker id="2026-10-21-39f56a15-03-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="440" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS (drawn before nodes so nodes mask them)
  ============================================================ -->

  <!-- A → Q1: A right edge (220,160) → Q1 left point (320,160) -->
  <path d="M220,160 L314,160" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-21-39f56a15-03-arr)"/>

  <!-- Q1 → S1 (Insufficient): Q1 bottom (368,196) → down → S1 top (368,252) -->
  <path d="M368,196 L368,248" stroke="#a96a08" stroke-width="1" fill="none" marker-end="url(#2026-10-21-39f56a15-03-arr-warn)"/>
  <!-- label Insufficient -->
  <rect x="350" y="208" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="368" y="219" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Low</text>

  <!-- Q1 → Q2 (Sufficient): Q1 right point (416,160) → Q2 left point (536,160) -->
  <path d="M416,160 L530,160" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-21-39f56a15-03-arr-accent)"/>
  <!-- label Sufficient -->
  <rect x="450" y="150" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="468" y="161" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Enough</text>

  <!-- Q2 → S2 (Yes): Q2 top point (584,124) → up → S2 bottom (584,76) -->
  <path d="M584,124 L584,80" stroke="#a96a08" stroke-width="1" fill="none" marker-end="url(#2026-10-21-39f56a15-03-arr-warn)"/>
  <!-- label Yes -->
  <rect x="568" y="100" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="580" y="111" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Yes</text>

  <!-- Q2 → S3 (No): Q2 bottom point (584,196) → down → S3 top (584,252) -->
  <path d="M584,196 L584,248" stroke="#286d50" stroke-width="1" fill="none" marker-end="url(#2026-10-21-39f56a15-03-arr-ok)"/>
  <!-- label No -->
  <rect x="556" y="212" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="582" y="223" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">No</text>

  <!-- ============================================================
       NODES (drawn after arrows)
  ============================================================ -->

  <!-- A: Deployment Plan — input/start node (oval-ish, blue tint) -->
  <!-- x=60, y=136, w=160, h=48, cx=140, cy=160 -->
  <rect x="60" y="136" width="160" height="48" rx="20" fill="#f8fafb"/>
  <rect x="60" y="136" width="160" height="48" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1.2"/>
  <text x="140" y="164" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Deploy Plan</text>

  <!-- Q1: diamond — GPU Free Memory Check, cx=368, cy=160, half-w=48, half-h=36 -->
  <!-- diamond points: top(368,124) right(416,160) bottom(368,196) left(320,160) -->
  <rect x="60" y="60" width="0" height="0" fill="#f8fafb"/><!-- spacer trick not needed -->
  <!-- paper mask under diamond -->
  <polygon points="368,124 416,160 368,196 320,160" fill="#f8fafb"/>
  <polygon points="368,124 416,160 368,196 320,160" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- label for Q1, two lines -->
  <text x="368" y="155" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">GPU Free</text>
  <text x="368" y="170" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Memory?</text>

  <!-- S1: Quantized Draft — warn, below Q1 -->
  <!-- x=296, y=252, w=144, h=64, cx=368, cy=284 -->
  <rect x="296" y="252" width="144" height="64" rx="6" fill="#f8fafb"/>
  <rect x="296" y="252" width="144" height="64" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1.2"/>
  <!-- type tag -->
  <rect x="304" y="258" width="40" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="324" y="267" fill="rgba(169,106,8,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WARN</text>
  <!-- name -->
  <text x="368" y="290" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Use Quantized Draft</text>
  <text x="368" y="308" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">or Smaller Draft</text>

  <!-- Q2: diamond — Batch Size, cx=584, cy=160 half-w=48 half-h=36 -->
  <!-- points: top(584,124) right(632,160) bottom(584,196) left(536,160) -->
  <polygon points="584,124 632,160 584,196 536,160" fill="#f8fafb"/>
  <polygon points="584,124 632,160 584,196 536,160" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="584" y="155" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Batch Size</text>
  <text x="584" y="170" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Large?</text>

  <!-- S2: Speculative Effect Limited — warn, above Q2 -->
  <!-- x=488, y=12, w=192, h=64, cx=584, cy=44 -->
  <rect x="488" y="12" width="192" height="64" rx="6" fill="#f8fafb"/>
  <rect x="488" y="12" width="192" height="64" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1.2"/>
  <rect x="496" y="18" width="40" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="516" y="27" fill="rgba(169,106,8,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WARN</text>
  <text x="584" y="50" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Speculative Effect</text>
  <text x="584" y="68" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Limited — Measure First</text>

  <!-- S3: Speculative Decoding Adopt — ok, below Q2 -->
  <!-- x=488, y=252, w=192, h=64, cx=584, cy=284 -->
  <rect x="488" y="252" width="192" height="64" rx="6" fill="#f8fafb"/>
  <rect x="488" y="252" width="192" height="64" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1.2"/>
  <rect x="496" y="258" width="24" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="508" y="267" fill="rgba(40,109,80,0.80)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK</text>
  <text x="584" y="290" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Speculative Decoding</text>
  <text x="584" y="308" fill="#286d50" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Adopt Actively</text>

  <!-- ============================================================
       LEGEND STRIP
  ============================================================ -->
  <line x1="40" y1="368" x2="920" y2="368" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="382" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- legend item: Start -->
  <rect x="120" y="372" width="48" height="20" rx="10" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="144" y="386" fill="#122127" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Start</text>

  <!-- legend item: Decision -->
  <polygon points="204,372 220,382 204,392 188,382" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="236" y="386" fill="#122127" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Decision</text>

  <!-- legend item: Caution -->
  <rect x="296" y="372" width="48" height="20" rx="4" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="320" y="386" fill="#122127" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Caution</text>

  <!-- legend item: Recommend -->
  <rect x="380" y="372" width="48" height="20" rx="4" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="404" y="386" fill="#122127" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Recommend</text>

</svg>
</body>
</html>
