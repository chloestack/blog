  <title id="2026-09-19-10770688-06-ragas-opt-title">RAGAS Pipeline Optimization Direction Decision</title>
  <desc id="2026-09-19-10770688-06-ragas-opt-desc">A flowchart showing the pipeline optimization direction decision node leading through a domain characteristics branch point into three priority strategies: no hallucination, information completeness, and user satisfaction.</desc>

  <!-- Paper mask -->

  <!-- Styled box -->

  <!-- Line 2 -->
  <text x="480" y="348" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Top-k Increase · Re-ranking</text>

  <rect x="624" y="292" width="232" height="72" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>

  <rect x="636" y="300" width="40" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.4)" stroke-width="0.8"/>
  <text x="656" y="309" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">METRIC</text>

  <text x="740" y="328" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Answer Relevancy Priority</text>

  <text x="740" y="348" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prompt Structuring</text>

  <text x="122" y="431" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Key Branch / Focal Strategy</text>

  <text x="306" y="431" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Optimization Strategy</text>

  <!-- Decision item -->
  <polygon points="470,432 477,420 484,432 477,444" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>
