<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<div class="diagram-wrap">
<svg viewBox="0 0 720 660" xmlns="http://www.w3.org/2000/svg"

  <title id="2026-10-10-33c39c28-04-synth-title">Synthetic Data Diversity Validation Flow</title>
  <desc id="2026-10-10-33c39c28-04-synth-desc">From seed data, three augmentation techniques (Paraphrase, Context Aug, Persona) produce a synthetic dataset. Diversity is validated by Self-BLEU; if the criterion is met the flow ends, otherwise temperature and seed are re-adjusted.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-10-10-33c39c28-04-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-10-10-33c39c28-04-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- ok 화살표 (녹색) -->
    <marker id="2026-10-10-33c39c28-04-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    <!-- warn 화살표 (주황) -->
    <marker id="2026-10-10-33c39c28-04-arr-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </marker>

  <!-- 배경 -->
  <rect width="720" height="660" fill="#f8fafb"/>

       ARROWS (drawn before boxes)
  ════════════════════════════════ -->

  <!-- elbow: 수직 아래 148→172, 수평 왼쪽 360→176, 수직 아래 172→196 -->
  <path d="M 360,148 L 360,172 Q 360,180 352,180 L 184,180 Q 176,180 176,188 L 176,196"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-10-33c39c28-04-arr)"/>

  <!-- 시드 데이터 → Context Aug (직선 하향) -->
  <!-- SD bottom=148 → CA top=196, 같은 x=360 -->

  <!-- CA bottom=248. MX top=320. 같은 x=360 -->
  <path d="M 360,248 L 360,320"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-10-33c39c28-04-arr)"/>

  <!-- Persona → 혼합 데이터셋 -->
  <!-- PV center-x=544, bottom=248. MX top=320, center-x=360 -->

  <path d="M 284,456 L 264,456 Q 256,456 256,464 L 256,516 Q 256,524 248,524 L 248,524"

  ════════════════════════════════ -->

  <text x="449" y="455" fill="#286d50" font-size="10" font-weight="600"

  <rect x="247" y="445" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="265" y="455" fill="#a96a08" font-size="10" font-weight="600"

  <text x="176" y="228" fill="#122127" font-size="13" font-weight="600"

  <text x="176" y="242" fill="#3f545c" font-size="10"

  <!-- Context Aug (accent 처리) -->

  <rect x="280" y="196" width="160" height="52" rx="6" fill="#f8fafb"/>
  <rect x="280" y="196" width="160" height="52" rx="6"

  <rect x="288" y="204" width="36" height="12" rx="2"

  <text x="306" y="213" fill="rgba(13,87,99,0.8)" font-size="8"
        font-family="'IBM Plex Mono', monospace"

  <text x="360" y="228" fill="#122127" font-size="13" font-weight="600"

        text-anchor="middle">Context Aug</text>
  <text x="360" y="242" fill="#3f545c" font-size="10"

  <!-- Persona (accent 처리) -->

  <rect x="464" y="196" width="160" height="52" rx="6" fill="#f8fafb"/>
  <rect x="464" y="196" width="160" height="52" rx="6"

  <rect x="472" y="204" width="36" height="12" rx="2"

  <text x="490" y="213" fill="rgba(13,87,99,0.8)" font-size="8"

  <text x="544" y="228" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"

  <text x="544" y="242" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"

  <rect x="264" y="328" width="40" height="12" rx="2"

  <text x="360" y="354" fill="#122127" font-size="14" font-weight="600"

  <!-- Self-BLEU 결정 다이아몬드 -->
  <!-- center: 360,456. half-w=76, half-h=36 -->
  <!-- points: top(360,420) right(436,456) bottom(360,492) left(284,456) -->
  <polygon points="360,420 436,456 360,492 284,456"
           fill="#f8fafb"/>
  <polygon points="360,420 436,456 360,492 284,456"

  <text x="360" y="452" fill="#122127" font-size="12" font-weight="600"

  <text x="360" y="467" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">&lt; 0.5?</text>

  <!-- x=472, y=500, w=160, h=52, cx=552, cy=526 -->

  <!-- ═══════════════════════════════
       LEGEND STRIP
  ════════════════════════════════ -->
  <line x1="32" y1="596" x2="688" y2="596"

  <!-- INPUT -->
  <rect x="32" y="608" width="12" height="12" rx="2"
        fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="50" y="618" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Input</text>

  <!-- AUG -->
  <rect x="100" y="608" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="118" y="618" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Aug / Merge</text>
