<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"

  <title id="2026-10-09-b59c2a84-02-quant-title">LLM Quantization Pipeline</title>
  <desc id="2026-10-09-b59c2a84-02-quant-desc">A 5-step flow starting from original FP32/FP16 weight matrices through group splitting, scale calculation, INT4/INT8 integer conversion, and bit packing, ending with the final quantized model file.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-09-b59c2a84-02-q-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    <marker id="2026-10-09-b59c2a84-02-q-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>

  ─────────────────────────────────────────── -->

  <!-- S → QW -->
  <line x1="480" y1="260" x2="492" y2="260"
        stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-09-b59c2a84-02-q-arrow-accent)"/>

  <!-- QW → P -->

        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-02-q-arrow)"/>

  <text x="728" y="279"
        fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">Bit-pack Store</text>

  <!-- ── 노드 6: 양자화 모델 (Store — 마지막 출력) ── -->
  <!-- x=816, y=224, w=144, h=72 -->
  <rect x="816" y="224" width="144" height="72" rx="6" fill="#f8fafb"/>
  <rect x="816" y="224" width="144" height="72" rx="6"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="824" y="232" width="44" height="12" rx="2"

  <text x="846" y="241"

  <text x="888" y="261"
        fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"

  <text x="888" y="279"

  <text x="486" y="249"

  <rect x="400" y="534" width="16" height="12" rx="3"

  <text x="424" y="544"
