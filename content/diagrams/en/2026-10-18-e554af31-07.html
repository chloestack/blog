<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="2026-10-18-e554af31-07-ollama-err-title 2026-10-18-e554af31-07-ollama-err-desc">
  <title id="2026-10-18-e554af31-07-ollama-err-title">Ollama Error Diagnosis Flowchart</title>
  <desc id="2026-10-18-e554af31-07-ollama-err-desc">A flowchart diagnosing three errors that occur during Ollama local LLM serving (slow response, OOM, model not found) and guiding to their respective solutions.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-18-e554af31-07-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-18-e554af31-07-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────
       ARROWS — drawn before boxes
  ───────────────────────────────────────────── -->

  <!-- ERR → E1 (left branch, orthogonal down-left) -->
  <!-- ERR center: 480,88  E1 center: 212,200 -->
  <!-- path: down from ERR bottom (480,108) → (480,140) → left to (212,140) → down to E1 top (212,172) -->
  <path d="M480,108 L480,140 L212,140 L212,172" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow)"/>

  <!-- ERR → E2 (center branch, straight down) -->
  <!-- ERR center: 480,88  E2 center: 480,200 -->
  <path d="M480,108 L480,172" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow)"/>

  <!-- ERR → E3 (right branch, orthogonal down-right) -->
  <!-- ERR center: 480,88  E3 center: 748,200 -->
  <path d="M480,108 L480,140 L748,140 L748,172" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow)"/>

  <!-- E1 → S1 (예, left-down) -->
  <!-- E1 center: 212,216  S1 center: 132,360 -->
  <path d="M212,244 L212,280 L132,280 L132,336" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow-accent)"/>

  <!-- E1 → S1B (아니오, right-down) -->
  <!-- E1 center: 212,216  S1B center: 292,360 -->
  <path d="M212,244 L212,280 L292,280 L292,336" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow)"/>

  <!-- E2 → S2 (예, straight down) -->
  <!-- E2 center: 480,216  S2 center: 480,360 -->
  <path d="M480,244 L480,336" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow-accent)"/>

  <!-- E3 → S3 (예, straight down) -->
  <!-- E3 center: 748,216  S3 center: 748,360 -->
  <path d="M748,244 L748,336" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-18-e554af31-07-arrow-accent)"/>

  <!-- Arrow labels -->
  <!-- E1 → S1: 예 -->
  <rect x="148" y="257" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="160" y="268" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Yes</text>

  <!-- E1 → S1B: 아니오 -->
  <rect x="249" y="257" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="271" y="268" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">No</text>

  <!-- E2 → S2: 예 -->
  <rect x="468" y="283" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="480" y="294" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Yes</text>

  <!-- E3 → S3: 예 -->
  <rect x="736" y="283" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="748" y="294" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Yes</text>

  <!-- ─────────────────────────────────────────────
       NODES
  ───────────────────────────────────────────── -->

  <!-- ERR: 오류 발생 — focal start node (oval) -->
  <!-- cx=480, cy=88, w=160, h=40 -->
  <rect x="400" y="68" width="160" height="40" rx="20" fill="#eef2f4" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="93" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Error Occurred</text>

  <!-- E1: 응답이 느린가 — decision diamond -->
  <!-- cx=212, cy=208, half-w=72, half-h=36 -->
  <rect x="140" y="172" width="144" height="44" rx="0" fill="#d4e7ea" stroke="#0d5763" stroke-width="1"/>
  <!-- diamond shape via polygon -->
  <polygon points="212,172 284,208 212,244 140,208" fill="#d4e7ea" stroke="#0d5763" stroke-width="1"/>
  <text x="212" y="204" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Slow</text>
  <text x="212" y="218" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Response?</text>

  <!-- E2: OOM 오류인가 — decision diamond -->
  <!-- cx=480, cy=208 -->
  <polygon points="480,172 552,208 480,244 408,208" fill="#d4e7ea" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="204" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">OOM</text>
  <text x="480" y="218" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Error?</text>

  <!-- E3: 모델을 못 찾는가 — decision diamond -->
  <!-- cx=748, cy=208 -->
  <polygon points="748,172 820,208 748,244 676,208" fill="#d4e7ea" stroke="#0d5763" stroke-width="1"/>
  <text x="748" y="204" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Model</text>
  <text x="748" y="218" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Not Found?</text>

  <!-- S1: KEEP_ALIVE=-1 모델 상시 로드 — solution box (ok) -->
  <!-- cx=132, cy=368, w=152, h=56 -->
  <rect x="56" y="336" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="56" y="336" width="152" height="56" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="132" y="358" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">KEEP_ALIVE=-1</text>
  <text x="132" y="374" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Keep Model Loaded</text>

  <!-- S1B: 더 작은 모델 또는 GPU 확인 — solution box (warn) -->
  <!-- cx=292, cy=368, w=152, h=56 -->
  <rect x="216" y="336" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="216" y="336" width="152" height="56" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="292" y="358" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Try Smaller Model or</text>
  <text x="292" y="374" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Check GPU</text>

  <!-- S2: 낮은 양자화 num_ctx 축소 — solution box (ok) -->
  <!-- cx=480, cy=368, w=152, h=56 -->
  <rect x="404" y="336" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="404" y="336" width="152" height="56" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="480" y="358" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Lower Quantization</text>
  <text x="480" y="374" fill="#122127" font-size="11" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Reduce num_ctx</text>

  <!-- S3: ollama pull 모델 재설치 — solution box (ok) -->
  <!-- cx=748, cy=368, w=152, h=56 -->
  <rect x="672" y="336" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="672" y="336" width="152" height="56" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="748" y="358" fill="#122127" font-size="11" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ollama pull</text>
  <text x="748" y="374" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Reinstall Model</text>

  <!-- ─────────────────────────────────────────────
       LEGEND
  ───────────────────────────────────────────── -->
  <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <text x="40" y="500" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend item: 진단 -->
  <polygon points="108,497 116,501 108,505 100,501" fill="#d4e7ea" stroke="#0d5763" stroke-width="1"/>
  <text x="120" y="505" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">Diagnosis</text>

  <!-- Legend item: 권장 해결 -->
  <rect x="172" y="496" width="12" height="12" rx="2" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="188" y="505" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">Recommended Fix</text>

  <!-- Legend item: 추가 확인 -->
  <rect x="280" y="496" width="12" height="12" rx="2" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="296" y="505" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500">Further Check Needed</text>

</svg>
</body>
</html>
