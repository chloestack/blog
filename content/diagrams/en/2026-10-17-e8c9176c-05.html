<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Streaming Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f8fafb; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 360"
     role="img"
     aria-labelledby="2026-10-17-e8c9176c-05-sse-flow-title 2026-10-17-e8c9176c-05-sse-flow-desc">

  <title id="2026-10-17-e8c9176c-05-sse-flow-title">LLM Streaming Response Flow — SSE</title>
  <desc id="2026-10-17-e8c9176c-05-sse-flow-desc">Starting from user input, a session is issued via fetch POST, an SSE connection is established via EventSource, and the flow branches into text accumulation, connection close, or error display depending on token, done, or error events.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-17-e8c9176c-05-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-17-e8c9176c-05-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-17-e8c9176c-05-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-10-17-e8c9176c-05-arr-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-10-17-e8c9176c-05-arr-mute" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#f8fafb"/>

  <!-- ═══════════════════════════════════════════════
       ARROWS — drawn before boxes
  ═══════════════════════════════════════════════ -->

  <!-- UI → POST (straight horizontal) -->
  <line x1="136" y1="172" x2="196" y2="172" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-05-arr)"/>

  <!-- POST → SSE (straight horizontal) -->
  <line x1="316" y1="172" x2="376" y2="172" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-17-e8c9176c-05-arr-accent)"/>

  <!-- POST → SSE label: Session ID -->
  <rect x="322" y="152" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="346" y="162" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Session ID</text>

  <!-- SSE → RENDER: token event — goes up and right (elbow) -->
  <!-- from SSE top-center (500,136) up to y=88, then right to RENDER top-center (720,88), then down to RENDER top (720,136) -->
  <path d="M500,136 L500,104 Q500,96 508,96 L712,96 Q720,96 720,104 L720,136"
        fill="none" stroke="#286d50" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-05-arr-ok)"/>
  <!-- token event label -->
  <rect x="576" y="84" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="612" y="94" fill="#286d50" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">token event</text>

  <!-- SSE → CLOSE: done event — straight horizontal right -->
  <line x1="620" y1="180" x2="676" y2="236" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-05-arr-mute)" stroke-dasharray="4,3"/>
  <!-- done event label — placed beside the diagonal segment, but we'll use an elbow to be compliant -->

  <!-- Redo SSE → CLOSE as orthogonal: SSE right-center (620,172) → x=648 → down to y=252 → right to CLOSE left (676,252) -->
  <!-- Remove the diagonal above and replace -->

  <!-- SSE → RENDER: top path already done above -->

  <!-- SSE → CLOSE: orthogonal elbow -->
  <path d="M620,188 Q620,196 628,196 L628,244 Q628,252 636,252 L676,252"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#2026-10-17-e8c9176c-05-arr-mute)"/>
  <!-- done event label -->
  <rect x="604" y="216" width="64" height="14" rx="2" fill="#f8fafb"/>
  <text x="636" y="226" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">done event</text>

  <!-- SSE → ERR: goes down-right (elbow) -->
  <path d="M620,156 Q620,148 628,148 L628,316 Q628,324 636,324 L676,324"
        fill="none" stroke="#94382b" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-05-arr-stop)"/>
  <!-- error event label -->
  <rect x="596" y="296" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="632" y="306" fill="#94382b" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">error event</text>

  <!-- ═══════════════════════════════════════════════
       NODES
  ═══════════════════════════════════════════════ -->

  <!-- 1. User Input (UI) — input type: muted fill -->
  <!-- x=20, y=144, w=116, h=56, cx=78, cy=172 -->
  <rect x="20" y="144" width="116" height="56" rx="6" fill="#f8fafb"/>
  <rect x="20" y="144" width="116" height="56" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <!-- tag -->
  <rect x="28" y="150" width="32" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="44" y="159" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <!-- label -->
  <text x="78" y="178" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">User Input</text>

  <!-- 2. fetch POST (POST) — focal: accent -->
  <!-- x=196, y=140, w=120, h=64, cx=256, cy=172 -->
  <rect x="196" y="140" width="120" height="64" rx="6" fill="#f8fafb"/>
  <rect x="196" y="140" width="120" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="204" y="146" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="218" y="155" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <!-- label -->
  <text x="256" y="168" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">fetch POST</text>
  <!-- sublabel -->
  <text x="256" y="184" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Issue Session ID</text>

  <!-- 3. EventSource SSE — focal: accent -->
  <!-- x=376, y=136, w=144, h=72, cx=448+, cy=172 -->
  <!-- cx=448, but SSE is wider; let's use x=376,w=148,cx=450 -->
  <rect x="376" y="136" width="148" height="72" rx="6" fill="#f8fafb"/>
  <rect x="376" y="136" width="148" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- tag -->
  <rect x="384" y="142" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="398" y="151" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSE</text>
  <!-- label -->
  <text x="450" y="167" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">EventSource GET</text>
  <!-- sublabel -->
  <text x="450" y="183" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">?sessionId=xxx</text>

  <!-- Recalculate SSE node center for connectors: x=376, w=148 → right edge=524; cx=450 -->
  <!-- SSE right edge: 376+148=524. But arrows above used 620 — need to fix. Let me widen or reposition.  -->
  <!-- Re-layout: SSE at x=376, w=148, right=524. RENDER at x=676, CLOSE at x=676, ERR at x=676 -->
  <!-- Paths above used 620 as SSE right — that's wrong. SSE right = 524. Fix paths via correction layer. -->

  <!-- CORRECTION: redraw the three outgoing SSE paths with correct x=524 right edge -->
  <!-- First, paint a paper rect to cover the wrong paths -->
  <rect x="518" y="80" width="180" height="260" fill="#f8fafb"/>

  <!-- SSE → RENDER corrected: from SSE top (450,136) up to y=96, right to RENDER top-center (756,96), down to RENDER top (756,136) -->
  <path d="M500,136 L500,100 Q500,92 508,92 L748,92 Q756,92 756,100 L756,136"
        fill="none" stroke="#286d50" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-05-arr-ok)"/>
  <!-- token event label — on top segment -->
  <rect x="588" y="80" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="624" y="90" fill="#286d50" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">token event</text>

  <!-- SSE → CLOSE corrected: from SSE right (524, 184) → x=556 → down to y=252 → right to CLOSE left (676,252) -->
  <path d="M524,184 L556,184 Q564,184 564,192 L564,244 Q564,252 572,252 L676,252"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#2026-10-17-e8c9176c-05-arr-mute)"/>
  <!-- done event label -->
  <rect x="536" y="208" width="64" height="14" rx="2" fill="#f8fafb"/>
  <text x="568" y="218" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">done event</text>

  <!-- SSE → ERR corrected: from SSE right (524, 160) → x=556 → down to y=324 → right to ERR left (676,324) -->
  <path d="M524,160 L556,160 Q564,160 564,168 L564,316 Q564,324 572,324 L676,324"
        fill="none" stroke="#94382b" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-05-arr-stop)"/>
  <!-- error event label -->
  <rect x="530" y="280" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="566" y="290" fill="#94382b" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">error event</text>

  <!-- 4. Text Accumulate / DOM Update (RENDER) — ok type: green tint -->
  <!-- x=676, y=136, w=140, h=64, cx=746, cy=168 -->
  <rect x="676" y="136" width="164" height="64" rx="6" fill="#f8fafb"/>
  <rect x="676" y="136" width="164" height="64" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <!-- tag -->
  <rect x="684" y="142" width="32" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="700" y="151" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER</text>
  <!-- label -->
  <text x="758" y="164" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Accumulate Text</text>
  <text x="758" y="181" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Update DOM</text>

  <!-- 5. Connection Close (CLOSE) — muted type -->
  <!-- x=676, y=224, w=128, h=56, cx=740, cy=252 -->
  <rect x="676" y="224" width="144" height="56" rx="6" fill="#f8fafb"/>
  <rect x="676" y="224" width="144" height="56" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <!-- tag -->
  <rect x="684" y="230" width="28" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.60)" stroke-width="0.8"/>
  <text x="698" y="239" fill="rgba(99,115,120,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">END</text>
  <!-- label -->
  <text x="748" y="256" fill="#3f545c" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Close Connection</text>

  <!-- 6. Show Error / Connection Close (ERR) — stop type: red tint -->
  <!-- x=676, y=296, w=144, h=56, cx=748, cy=324 -->
  <rect x="676" y="296" width="164" height="56" rx="6" fill="#f8fafb"/>
  <rect x="676" y="296" width="164" height="56" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <!-- tag -->
  <rect x="684" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="698" y="311" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERR</text>
  <!-- label -->
  <text x="758" y="320" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Show Error</text>
  <text x="758" y="337" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Close Connection</text>

  <!-- ═══════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════ -->
  <line x1="30" y1="352" x2="930" y2="352" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <!-- legend items -->
  <!-- focal (teal) -->
  <rect x="30" y="358" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="46" y="367" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Key Step</text>
  <!-- ok (green) -->
  <rect x="140" y="358" width="10" height="10" rx="2" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="156" y="367" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Normal</text>
  <!-- stop (red) -->
  <rect x="250" y="358" width="10" height="10" rx="2" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <text x="266" y="367" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Error</text>
  <!-- muted (grey) -->
  <rect x="330" y="358" width="10" height="10" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="346" y="367" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">End</text>
  <!-- dashed = optional/async -->
  <line x1="430" y1="362" x2="450" y2="362" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="449,359 457,362 449,365" fill="#6c8188"/>
  <text x="462" y="367" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Async Event</text>

</svg>
</body>
</html>
