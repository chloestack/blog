<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPO Training Signal Decision Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 0; }
  svg { display: block; width: 100%; max-width: 960px; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-20-c7b9f4df-03-dpo-flow-title 2026-10-20-c7b9f4df-03-dpo-flow-desc">
  <title id="2026-10-20-c7b9f4df-03-dpo-flow-title">DPO Training Signal Decision Flow</title>
  <desc id="2026-10-20-c7b9f4df-03-dpo-flow-desc">Data with large quality gaps yield strong training signals used for DPO updates, while data with similar quality yields weak signals and is recommended for filtering.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-20-c7b9f4df-03-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-20-c7b9f4df-03-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-20-c7b9f4df-03-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-10-20-c7b9f4df-03-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ===================== CONNECTORS (drawn before boxes) ===================== -->

  <!-- Q → H (크다, top path: Q right edge → right bend → H left) -->
  <!-- Q diamond center: 320,180  H box center: 600,120  H left edge: 520,120 -->
  <!-- Q right vertex: 400,180 → route: 400,180 → 460,180 → 460,120 → 520,120 -->
  <path d="M400,180 L460,180 Q468,180 468,172 L468,128 Q468,120 476,120 L520,120"
        fill="none" stroke="#286d50" stroke-width="1.2"
        marker-end="url(#2026-10-20-c7b9f4df-03-arrow-ok)"/>

  <!-- Q → L (비슷하다, bottom path: Q right edge → right bend → L left) -->
  <!-- L box center: 600,244  L left edge: 520,244 -->
  <!-- Route: 400,180 → 460,180 → 460,244 → 520,244 -->
  <path d="M400,180 L460,180 Q468,180 468,188 L468,236 Q468,244 476,244 L520,244"
        fill="none" stroke="#a96a08" stroke-width="1.2"
        marker-end="url(#2026-10-20-c7b9f4df-03-arrow-warn)"/>

  <!-- H → LEARN (H right → LEARN left) -->
  <!-- H right: 680,120  LEARN left: 756,180 -->
  <!-- Route: 680,120 → 716,120 → 716,180 → 756,180 -->
  <path d="M680,120 L716,120 Q724,120 724,128 L724,172 Q724,180 732,180 L756,180"
        fill="none" stroke="#286d50" stroke-width="1.2"
        marker-end="url(#2026-10-20-c7b9f4df-03-arrow-ok)"/>

  <!-- L → NOISE (L right → NOISE left) -->
  <!-- L right: 680,244  NOISE left: 756,244 -->
  <line x1="680" y1="244" x2="752" y2="244"
        stroke="#a96a08" stroke-width="1.2"
        marker-end="url(#2026-10-20-c7b9f4df-03-arrow-warn)"/>

  <!-- ===================== ARROW LABELS ===================== -->

  <!-- "크다" label on Q→H connector, on the horizontal segment near Q right (y=180) -->
  <rect x="406" y="154" width="36" height="16" rx="2" fill="#f8fafb"/>
  <text x="424" y="166"
        fill="#286d50" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Large</text>

  <!-- "비슷하다" label on Q→L connector, on segment going down (x=468) -->
  <rect x="406" y="186" width="52" height="16" rx="2" fill="#f8fafb"/>
  <text x="432" y="198"
        fill="#a96a08" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Similar</text>

  <!-- ===================== NODES ===================== -->

  <!-- ── Q: Decision diamond (focal) ── center 320,180 half=80 -->
  <!-- Diamond: top(320,100) right(400,180) bottom(320,260) left(240,180) -->
  <!-- Paper mask first -->
  <polygon points="320,96 404,180 320,264 236,180" fill="#f8fafb"/>
  <!-- Accent-tinted diamond -->
  <polygon points="320,96 404,180 320,264 236,180"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- Tag -->
  <rect x="292" y="108" width="56" height="13" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="320" y="118.5"
        fill="rgba(13,87,99,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">DECISION</text>
  <!-- Label line 1 -->
  <text x="320" y="173"
        fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Quality Gap</text>
  <!-- Label line 2 -->
  <text x="320" y="190"
        fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Large?</text>

  <!-- ── H: 강한 학습 신호 (ok / focal) center 600,120 w=160 h=72 ── -->
  <rect x="520" y="84" width="160" height="72" rx="6" fill="#f8fafb"/>
  <rect x="520" y="84" width="160" height="72" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- Tag -->
  <rect x="528" y="92" width="52" height="13" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="554" y="102"
        fill="rgba(13,87,99,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SIGNAL</text>
  <!-- Label line 1 -->
  <text x="600" y="122"
        fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Pref. Prob. → 1</text>
  <!-- Label line 2 -->
  <text x="600" y="138"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Strong training signal</text>

  <!-- ── L: 약한 학습 신호 center 600,244 w=160 h=72 ── -->
  <rect x="520" y="208" width="160" height="72" rx="6" fill="#f8fafb"/>
  <rect x="520" y="208" width="160" height="72" rx="6"
        fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1.5"/>
  <!-- Tag -->
  <rect x="528" y="216" width="52" height="13" rx="2"
        fill="transparent" stroke="rgba(169,106,8,0.4)" stroke-width="0.8"/>
  <text x="554" y="226"
        fill="rgba(169,106,8,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SIGNAL</text>
  <!-- Label line 1 -->
  <text x="600" y="246"
        fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Pref. Prob. → 0.5</text>
  <!-- Label line 2 -->
  <text x="600" y="262"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Weak training signal</text>

  <!-- ── LEARN: DPO 업데이트 center 820,180 w=144 h=64 ── -->
  <rect x="748" y="148" width="144" height="64" rx="6" fill="#f8fafb"/>
  <rect x="748" y="148" width="144" height="64" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- Tag -->
  <rect x="756" y="156" width="44" height="13" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="778" y="166"
        fill="rgba(13,87,99,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">UPDATE</text>
  <!-- Label -->
  <text x="820" y="186"
        fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">DPO Update</text>

  <!-- ── NOISE: 노이즈 데이터 (warn) center 820,244 w=152 h=64 ── -->
  <!-- Connector L→NOISE lands at x=752, so NOISE left edge must be at 752 → x=752 -->
  <rect x="752" y="212" width="152" height="64" rx="6" fill="#f8fafb"/>
  <rect x="752" y="212" width="152" height="64" rx="6"
        fill="rgba(148,56,43,0.06)" stroke="#94382b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Tag -->
  <rect x="760" y="220" width="44" height="13" rx="2"
        fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>
  <text x="782" y="230"
        fill="rgba(148,56,43,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">FILTER</text>
  <!-- Label line 1 -->
  <text x="828" y="250"
        fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Noisy Data</text>
  <!-- Label line 2 -->
  <text x="828" y="266"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">Filter recommended</text>

  <!-- ===================== LEGEND STRIP ===================== -->
  <line x1="32" y1="336" x2="928" y2="336" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Legend label -->
  <text x="32" y="352"
        fill="#6c8188" font-size="10" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- Item 1: 판단 기준 (focal diamond) -->
  <polygon points="96,357 104,349 112,357 104,365"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="120" y="361"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Decision criterion</text>

  <!-- Item 2: 학습 경로 (green box) -->
  <rect x="208" y="349" width="16" height="16" rx="3"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="232" y="361"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Training path</text>

  <!-- Item 3: 약한 신호 (warn box) -->
  <rect x="340" y="349" width="16" height="16" rx="3"
        fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1.2"/>
  <text x="364" y="361"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Weak signal</text>

  <!-- Item 4: 필터 권장 (dashed red box) -->
  <rect x="468" y="349" width="16" height="16" rx="3"
        fill="rgba(148,56,43,0.06)" stroke="#94382b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="492" y="361"
        fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Filter recommended (optional)</text>

</svg>
</body>
</html>
