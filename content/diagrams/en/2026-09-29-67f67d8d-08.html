<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

  .diagram-wrap svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg
  viewBox="0 0 960 540"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="2026-09-29-67f67d8d-08-cache-migration-title 2026-09-29-67f67d8d-08-cache-migration-desc"
>
  <title id="2026-09-29-67f67d8d-08-cache-migration-title">Prompt Caching Migration Flow</title>
  <desc id="2026-09-29-67f67d8d-08-cache-migration-desc">A decision flow showing: after the migration plan, prefix length validation, a 1024-token threshold branch, shadow deployment for hit-rate measurement, a prompt reordering loop when hit rate is below 50%, and finally migration complete.</desc>

  <defs>
    <!-- 기본 muted 화살표 -->
    <marker id="2026-09-29-67f67d8d-08-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-29-67f67d8d-08-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 루프/보조 화살표 -->
    <marker id="2026-09-29-67f67d8d-08-arr-loop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="540" fill="#f8fafb"/>

  <!-- ───────────────────────────────────────────
       레이어 1: 화살표 (박스보다 먼저)
  ─────────────────────────────────────────────── -->

  <!-- M → V : 마이그레이션계획 → Prefix길이검증 -->
  <!-- M 우측 중앙 (220,188) → V 좌측 중앙 (276,188) -->
  <line x1="220" y1="188" x2="272" y2="188" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-08-arr)"/>

  <!-- V → T : Prefix검증 → 1024토큰 분기 -->
  <!-- V 우측 (412,188) → T 좌측 (468,188) -->
  <line x1="412" y1="188" x2="464" y2="188" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-08-arr-accent)"/>

  <!-- T →(아니오)→ E : 아래로 꺾임 -->
  <!-- T 하단 (520,228) → E 상단 (520,288) → E 좌측 중앙 팬아웃 없음, 수직 세그먼트 → E 상단 중앙 -->
  <!-- T 바텀꼭지점: (520,228), E 상단: (388,292) -->
  <!-- 수직 세그먼트: T바텀(520,228)→(520,260), 수평: (520,260)→(388,260), 수직: (388,260)→(388,288) -->
  <path d="M 520,228 L 520,260 L 388,260 L 388,288" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-08-arr-loop)"/>
  <!-- 라벨: 아니오 -->
  <rect x="462" y="240" width="36" height="16" rx="2" fill="#f8fafb"/>
  <text x="480" y="252" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">No</text>

  <!-- T →(예)→ D : 오른쪽으로 -->
  <!-- T 우측꼭지점: (572,188) → D 좌측: (628,188) -->
  <line x1="572" y1="188" x2="624" y2="188" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-08-arr-accent)"/>
  <!-- 라벨: 예 -->
  <rect x="588" y="172" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="598" y="183" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Yes</text>

  <!-- D → RS -->
  <!-- D 우측: (760,188) → RS 좌측: (816,188) -->
  <line x1="760" y1="188" x2="812" y2="188" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-08-arr-accent)"/>

  <!-- RS →(예)→ GO : 오른쪽으로 -->
  <!-- RS 우측꼭지점: (896,188) → GO 좌측: (900,320) 아래로 꺾임 -->
  <!-- RS 바텀: (864,228) → 수직(864,260) → 수평(864,316) → GO상단(864,316) 수직(864,316)→(864,320) -->
  <!-- GO는 (808,320) ~ (920,356), 상단중앙 (864,320) -->
  <path d="M 864,228 L 864,260 L 864,316" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-29-67f67d8d-08-arr-accent)"/>
  <!-- 라벨: 예 -->
  <rect x="848" y="238" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="858" y="249" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Yes</text>

  <!-- RS →(아니오)→ F : 왼쪽으로 꺾여 아래 -->
  <!-- RS 좌측꼭지점: (832,188) → 수직하단? 아니오 방향 -->
  <!-- RS 레프트꼭지점: (832,188). F는 (628,316)~(740,368), 상단중앙(684,316) -->
  <!-- RS 하단: (864,228) → (864,284) → (684,284) → (684,316) -->
  <!-- 위에서 RS 하단은 이미 사용. 두 출구 팬아웃: RS 하단에서 꼭지점 하나만 있으므로 RS 좌측꼭지점 사용 -->
  <!-- RS: 다이아몬드 중심(864,188), 좌측꼭지점(832,188) → 수평(684,188)? 이미 입력선이 사용중. -->
  <!-- 아니오: RS 좌측꼭지점(832,188) → (832,284) → (684,284) → (684,316) -->
  <path d="M 832,188 L 800,188 L 800,284 L 684,284 L 684,316" fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-29-67f67d8d-08-arr-loop)"/>
  <!-- 라벨: 아니오 -->
  <rect x="758" y="272" width="36" height="16" rx="2" fill="#f8fafb"/>
  <text x="776" y="284" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">No</text>

  <!-- F → D : 재배치 → 섀도배포 루프백 -->
  <!-- F 상단중앙(684,316) → F 상단에서 D 하단으로. D 하단중앙(692,228) F 하단중앙(684,368) -->
  <!-- F 상단 = (684,316). D 중심(692,188), D 하단: (692,228) -->
  <!-- F 좌측(628,344) → 수평(592,344) → 수직(592,148) → 수평(628,148) → D 상단(692,148) 수직(692,148)→(692,164) -->
  <path d="M 628,344 L 592,344 L 592,148 L 692,148 L 692,164" fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-29-67f67d8d-08-arr-loop)"/>

  <!-- ───────────────────────────────────────────
       레이어 2: 노드 박스
  ─────────────────────────────────────────────── -->

  <!-- ① M: 마이그레이션 계획 (external/input 스타일) -->
  <!-- 폭 120, 높이 64, 중심x=160, y범위 156~220, rx=6 -->
  <rect x="100" y="156" width="120" height="64" rx="6" fill="#f8fafb"/>
  <rect x="100" y="156" width="120" height="64" rx="6" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="108" y="162" width="32" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.4)" stroke-width="0.8"/>
  <text x="124" y="171" fill="rgba(58,84,143,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAN</text>
  <!-- 이름 -->
  <text x="160" y="198" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Migration</text>
  <text x="160" y="213" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Plan</text>

  <!-- ② V: Prefix 길이 검증 (focal) -->
  <!-- 폭 136, 높이 64, 중심x=344, y범위 156~220 -->
  <rect x="276" y="156" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="276" y="156" width="136" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="284" y="162" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="302" y="171" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK</text>
  <text x="344" y="194" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prefix Length</text>
  <text x="344" y="210" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Validation</text>

  <!-- ③ T: 1024 토큰 이상인가 (다이아몬드, focal) -->
  <!-- 다이아몬드 중심 (520,188), 반폭 52, 반높이 40 -->
  <!-- 꼭지점: top(520,148), right(572,188), bottom(520,228), left(468,188) -->
  <polygon points="520,148 572,188 520,228 468,188" fill="#f8fafb"/>
  <polygon points="520,148 572,188 520,228 468,188" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="520" y="184" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">≥ 1024</text>
  <text x="520" y="200" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">tokens?</text>

  <!-- ④ D: 섀도 배포 히트율 측정 (backend) -->
  <!-- 폭 132, 높이 64, 중심x=692, y범위 164~228 -->
  <rect x="628" y="164" width="132" height="48" rx="6" fill="#f8fafb"/>
  <rect x="628" y="164" width="132" height="48" rx="6" fill="white" stroke="#122127" stroke-width="1"/>
  <rect x="636" y="170" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.4)" stroke-width="0.8"/>
  <text x="654" y="179" fill="rgba(18,33,39,0.7)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>
  <text x="692" y="198" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Shadow Deploy</text>
  <text x="692" y="212" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Measure Hit Rate</text>

  <!-- ⑤ RS: 히트율 50% 이상 (다이아몬드, focal) -->
  <!-- 다이아몬드 중심 (864,188), 반폭 44, 반높이 40 -->
  <!-- 꼭지점: top(864,148), right(908,188), bottom(864,228), left(820,188) -->
  <!-- 입력선 좌측꼭지점 820에서 아니오 분기 => left꼭지점은 832로 조정 -->
  <!-- 수정: 중심(864,188), 반폭 48, 반높이 40 -->
  <polygon points="864,148 912,188 864,228 816,188" fill="#f8fafb"/>
  <polygon points="864,148 912,188 864,228 816,188" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="864" y="184" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Hit Rate</text>
  <text x="864" y="200" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">≥ 50%?</text>

  <!-- ⑥ E: 프롬프트 구조 재설계 (optional/stop 스타일) -->
  <!-- 폭 120, 높이 64, 중심x=388, y범위 288~352 -->
  <rect x="328" y="288" width="120" height="64" rx="6" fill="#f8fafb"/>
  <rect x="328" y="288" width="120" height="64" rx="6" fill="rgba(18,33,39,0.02)" stroke="rgba(18,33,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="336" y="294" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.25)" stroke-width="0.8"/>
  <text x="354" y="303" fill="rgba(18,33,39,0.5)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVISE</text>
  <text x="388" y="328" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prompt Structure</text>
  <text x="388" y="343" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Redesign</text>

  <!-- ⑦ F: 프롬프트 재배치 (backend) -->
  <!-- 폭 112, 높이 52, 중심x=684, y범위 316~368 -->
  <rect x="628" y="316" width="112" height="52" rx="6" fill="#f8fafb"/>
  <rect x="628" y="316" width="112" height="52" rx="6" fill="white" stroke="#122127" stroke-width="1"/>
  <rect x="636" y="322" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.4)" stroke-width="0.8"/>
  <text x="654" y="331" fill="rgba(18,33,39,0.7)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REORDER</text>
  <text x="684" y="352" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prompt Reorder</text>

  <!-- ⑧ GO: 전환 완료 (oval, accent) -->
  <!-- 타원 중심 (864,344), 반폭 56, 반높이 24 -->
  <rect x="808" y="316" width="112" height="56" rx="6" fill="#f8fafb"/>
  <rect x="808" y="316" width="112" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="864" y="348" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Migration Done</text>

  <!-- ───────────────────────────────────────────
       레전드
  ─────────────────────────────────────────────── -->
  <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- 레전드 텍스트 -->
  <text x="40" y="468" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal: 액센트 테두리 -->
  <rect x="100" y="458" width="14" height="14" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="120" y="469" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Key Step</text>

  <!-- backend: 흰색 테두리 -->
  <rect x="220" y="458" width="14" height="14" rx="3" fill="white" stroke="#122127" stroke-width="1"/>
  <text x="240" y="469" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Process Step</text>

  <!-- optional: 점선 -->
  <rect x="340" y="458" width="14" height="14" rx="3" fill="rgba(18,33,39,0.02)" stroke="rgba(18,33,39,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="469" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Alt Path</text>

  <!-- 다이아몬드 -->
  <polygon points="467,458 478,465 467,472 456,465" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="484" y="469" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Branch Condition</text>

  <!-- 루프 화살표 -->
  <line x1="560" y1="465" x2="588" y2="465" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-29-67f67d8d-08-arr-loop)"/>
  <text x="596" y="469" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Loop / Retry</text>

</svg>
