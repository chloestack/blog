<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  viewBox="0 0 960 600"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="2026-10-05-5c88b64b-08-hitl-loop-title 2026-10-05-5c88b64b-08-hitl-loop-desc"
  style="max-width:960px;"
>
  <title id="2026-10-05-5c88b64b-08-hitl-loop-title">HitL Trust-Based Automation Loop</title>
  <desc id="2026-10-05-5c88b64b-08-hitl-loop-desc">The AI agent executes actions and logs results, accumulates approvals and logs to evaluate trust, removes the HitL gate if trust is sufficient, or fine-tunes and re-executes if not.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-05-5c88b64b-08-hitl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 (accent) -->
    <marker id="2026-10-05-5c88b64b-08-hitl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ═══════════════════════════════════════════════
       화살표 (노드보다 먼저 그림)
  ════════════════════════════════════════════════ -->

  <!-- D → L (아래) -->
  <path d="M 480,148 L 480,188" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-05-5c88b64b-08-hitl-arrow)"/>

  <!-- L → A (아래) -->
  <path d="M 480,260 L 480,300" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-05-5c88b64b-08-hitl-arrow)"/>

  <!-- A → Q (아래) -->
  <path d="M 480,372 L 480,396" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-05-5c88b64b-08-hitl-arrow)"/>

  <!-- Q → RM (오른쪽, 예) -->
  <path d="M 548,432 L 620,432 L 620,432" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-05-5c88b64b-08-hitl-arrow-accent)"/>

  <!-- Q → FT (왼쪽, 아니오) -->
  <path d="M 412,432 L 340,432 L 340,432" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-05-5c88b64b-08-hitl-arrow)"/>

  <!-- FT → D (위쪽, 루프백) -->
  <!-- FT 중앙 x=300, top=408 → 왼쪽 오프셋으로 D 왼쪽 가장자리까지 -->
  <path d="M 300,408 L 300,108 L 420,108" stroke="#3f545c" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#2026-10-05-5c88b64b-08-hitl-arrow)"/>

  <!-- ═══════════════════════════════════════════════
       화살표 라벨
  ════════════════════════════════════════════════ -->

  <!-- "예" 라벨 (Q → RM 위) -->
  <rect x="558" y="420" width="24" height="16" rx="2" fill="#f8fafb"/>
  <text x="570" y="431" fill="#0d5763" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Yes</text>

  <!-- "아니오" 라벨 (Q → FT 위) -->
  <rect x="350" y="420" width="52" height="16" rx="2" fill="#f8fafb"/>
  <text x="376" y="431" fill="#3f545c" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">No</text>

  <!-- 루프백 라벨 (FT → D 왼쪽 세로 선) -->
  <rect x="220" y="248" width="56" height="16" rx="2" fill="#f8fafb"/>
  <text x="248" y="259" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        text-anchor="middle" letter-spacing="0.04em">After retrain</text>

  <!-- ═══════════════════════════════════════════════
       노드
  ════════════════════════════════════════════════ -->

  <!-- D: 동작 실행 + 결과 기록 (focal) -->
  <rect x="420" y="84" width="120" height="64" rx="6" fill="#f8fafb"/>
  <rect x="420" y="84" width="120" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="428" y="90" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="444" y="99" fill="rgba(13,87,99,0.8)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        text-anchor="middle" letter-spacing="0.08em">ACTION</text>
  <text x="480" y="122" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Execute Action</text>
  <text x="480" y="138" fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">+ Log Result</text>

  <!-- L: 승인 여부 + 결과 로그 (muted) -->
  <rect x="420" y="188" width="120" height="72" rx="6" fill="#f8fafb"/>
  <rect x="420" y="188" width="120" height="72" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="428" y="194" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="442" y="203" fill="rgba(63,84,92,0.7)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        text-anchor="middle" letter-spacing="0.08em">LOG</text>
  <text x="480" y="228" fill="#3f545c" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Approval Status</text>
  <text x="480" y="248" fill="#6c8188" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">+ Result Log</text>

  <!-- A: 데이터 축적 (store) -->
  <rect x="420" y="300" width="120" height="72" rx="6" fill="#f8fafb"/>
  <rect x="420" y="300" width="120" height="72" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="428" y="306" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="444" y="315" fill="rgba(63,84,92,0.7)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="480" y="344" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Accumulate Data</text>

  <!-- Q: 신뢰도 충분한가? (decision diamond, focal) -->
  <!-- 다이아몬드 중앙 (480, 432), 너비 136, 높이 72 -->
  <polygon points="480,396 548,432 480,468 412,432" fill="#f8fafb"/>
  <polygon points="480,396 548,432 480,468 412,432"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="428" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Trust</text>
  <text x="480" y="444" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Sufficient?</text>

  <!-- RM: HitL 게이트 제거 (backend, ok 색) -->
  <rect x="620" y="408" width="144" height="48" rx="6" fill="#f8fafb"/>
  <rect x="620" y="408" width="144" height="48" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <rect x="628" y="414" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>
  <text x="648" y="423" fill="rgba(40,109,80,0.8)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        text-anchor="middle" letter-spacing="0.08em">RESULT</text>
  <text x="692" y="438" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Remove HitL Gate</text>

  <!-- FT: 에이전트 파인튜닝 (backend, link 색) -->
  <rect x="136" y="408" width="128" height="48" rx="6" fill="#f8fafb"/>
  <rect x="136" y="408" width="128" height="48" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <rect x="144" y="414" width="40" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.4)" stroke-width="0.8"/>
  <text x="164" y="423" fill="rgba(58,84,143,0.8)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        text-anchor="middle" letter-spacing="0.08em">FINETUNE</text>
  <text x="200" y="438" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
        text-anchor="middle">Fine-tune Agent</text>

  <!-- ═══════════════════════════════════════════════
       범례 (하단 구분선 + 항목)
  ════════════════════════════════════════════════ -->
  <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="546" fill="#3f545c" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono','ui-monospace',monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="104" y="538" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="120" y="548" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">Key Step</text>

  <!-- ok -->
  <rect x="228" y="538" width="12" height="12" rx="2" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="244" y="548" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">Automated</text>

  <!-- finetune -->
  <rect x="352" y="538" width="12" height="12" rx="2" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="368" y="548" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">Improvement</text>

  <!-- store -->
  <rect x="476" y="538" width="12" height="12" rx="2" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="492" y="548" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">Accumulated Data</text>

  <!-- dashed -->
  <line x1="580" y1="544" x2="596" y2="544" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="600" y="548" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">Feedback Loop</text>

</svg>
</body>
</html>
