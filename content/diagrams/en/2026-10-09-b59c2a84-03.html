  <title id="2026-10-09-b59c2a84-03-gguf-title">GGUF Local Inference Flow</title>
  <desc id="2026-10-09-b59c2a84-03-gguf-desc">A flowchart showing how a GGUF file is downloaded from HuggingFace, loaded into the llama.cpp runtime, then branched into GPU-only fast inference or CPU+GPU hybrid mode depending on VRAM availability, with optional connections to wrapper tools such as Ollama and LM Studio.</desc>

  <defs>

      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-09-b59c2a84-03-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-09-b59c2a84-03-arr-yes" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-10-09-b59c2a84-03-arr-no" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6c8188"/>
    </marker>

  <!-- LC → Q  (acc 색) -->
  <line x1="360" y1="212" x2="436" y2="212" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-03-arr-acc)"/>

  <!-- Q → GPU (예, 오른쪽 위) -->
  <!-- 다이아몬드 오른쪽 꼭짓점 (536,212) → 오른쪽으로 꺾어 올라가서 GPU 박스 왼쪽 -->
  <path d="M 536 212 H 580 Q 588 212 588 204 V 144 Q 588 136 596 136 H 672"
        fill="none" stroke="#286d50" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-03-arr-yes)"/>

  <text x="736" y="319" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono',monospace" text-anchor="middle">hybrid mode</text>

  <rect x="820" y="272" width="112" height="56" rx="6" fill="#f8fafb"/>
  <rect x="820" y="272" width="112" height="56" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="876" y="302" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Usable speed</text>
  <text x="876" y="316" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono',monospace" text-anchor="middle">maintained</text>

  <!-- Ollama · LM Studio (muted / optional) -->
  <rect x="672" y="348" width="128" height="56" rx="6" fill="#f8fafb"/>

  <text x="736" y="381" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Ollama ·</text>
  <text x="736" y="395" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">LM Studio</text>

  <!-- ───────────── LEGEND STRIP ───────────── -->
  <line x1="32" y1="444" x2="928" y2="444" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
