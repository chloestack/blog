<!DOCTYPE html>
<html lang="en">
<head>

<title>Synthetic Data Adoption Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-10-33c39c28-06-synth-title 2026-10-10-33c39c28-06-synth-desc">
  <title id="2026-10-10-33c39c28-06-synth-title">Synthetic Data Adoption Strategy</title>
  <desc id="2026-10-10-33c39c28-06-synth-desc">Decision flow for synthetic data fine-tuning: real data mix ratio and scale strategy lead to balanced training or cost/quality risks.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-10-33c39c28-06-synth-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-10-33c39c28-06-synth-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-10-33c39c28-06-synth-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-10-10-33c39c28-06-synth-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

       CONNECTORS (drawn before boxes)
  ============================================================ -->

  <!-- START → Q1 (left branch, orthogonal: down then left) -->
  <!-- START center: x=480, bottom=152. Q1 center: x=260, top=220 -->
  <path d="M 480 152 L 480 180 L 260 180 L 260 220" fill="none" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-10-10-33c39c28-06-synth-arrow)"/>

  <!-- START → Q2 (right branch, orthogonal: down then right) -->
  <!-- Q2 center: x=700, top=220 -->
  <path d="M 480 152 L 480 180 L 700 180 L 700 220" fill="none" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-10-10-33c39c28-06-synth-arrow)"/>

  <!-- Q1 → RISK (left exit, label: 0% synth only) -->
  <!-- Q1 diamond tip-left: x=196, y=260. RISK right edge: x=144+120=264... RISK center x=152, top=340 -->
  <!-- Q1 left tip: (196,260), RISK top center: (184,340) -->
  <path d="M 196 260 L 152 260 L 152 340" fill="none" stroke="#94382b" stroke-width="1" stroke-dasharray="0" marker-end="url(#2026-10-10-33c39c28-06-synth-arrow-stop)"/>

  <!-- Q1 right tip: (324,260). SAFE center x=360, top=340 -->

  <rect x="100" y="234" width="52" height="20" rx="2" fill="#f8fafb"/>
  <text x="126" y="248" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">0% only</text>

  <text x="786" y="248" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">small-scale first</text>

       NODES
  ============================================================ -->

  <polygon points="260,222 324,260 260,298 196,260" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>

  <text x="260" y="270" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">real data share</text>

  <text x="700" y="270" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">gen. order</text>

  <rect x="84" y="340" width="136" height="80" rx="6" fill="#f8fafb"/>

  <rect x="292" y="348" width="36" height="13" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>

  <text x="360" y="386" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Balanced</text>
  <text x="360" y="403" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Training Data</text>

  <!-- COST node — center x=600, y=388, 144×80 -->
  <rect x="528" y="340" width="144" height="80" rx="6" fill="#f8fafb"/>
  <rect x="528" y="340" width="144" height="80" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1.2"/>
  <rect x="536" y="348" width="36" height="13" rx="2" fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>

  <text x="600" y="386" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">API Cost</text>
  <text x="600" y="403" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Waste Risk</text>

  <!-- EFF node — center x=808, y=388, 152×80 -->
  <rect x="732" y="340" width="152" height="80" rx="6" fill="#f8fafb"/>
  <rect x="732" y="340" width="152" height="80" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1.5"/>
  <rect x="740" y="348" width="36" height="13" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>
  <text x="758" y="358" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GOOD</text>
  <text x="808" y="386" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Efficient</text>
  <text x="808" y="403" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Cost Control</text>

  <!-- ============================================================
       LEGEND
  ============================================================ -->
  <line x1="40" y1="492" x2="920" y2="492" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="510" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend item: Start point (accent) -->
  <rect x="108" y="500" width="16" height="12" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="130" y="510" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Start point</text>

  <!-- Legend item: Decision (diamond) -->
  <polygon points="182,506 190,502 198,506 190,510" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="206" y="510" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Decision</text>

  <!-- Legend item: Recommended path -->
  <rect x="292" y="500" width="16" height="12" rx="3" fill="#d6e9de" stroke="#286d50" stroke-width="1.2"/>
  <text x="314" y="510" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Recommended</text>

  <!-- Legend item: Caution required -->
  <rect x="400" y="500" width="16" height="12" rx="3" fill="#f1d9d4" stroke="#94382b" stroke-width="1.2"/>
  <text x="422" y="510" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Caution</text>
