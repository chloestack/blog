<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Signal Processing Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f8fafb; }
  body { display: flex; justify-content: center; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 340"
     role="img"
     aria-labelledby="2026-10-05-5c88b64b-07-resume-flow-title 2026-10-05-5c88b64b-07-resume-flow-desc">

  <title id="2026-10-05-5c88b64b-07-resume-flow-title">Resume Signal Processing Flow</title>
  <desc id="2026-10-05-5c88b64b-07-resume-flow-desc">Shows how a Human-in-the-Loop AI agent, upon receiving a resume signal, checks for duplicate execution ID and state validity in sequence, then branches into resume execution, ignore/log, or error notification.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-05-5c88b64b-07-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-07-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-07-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-07-arr-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-07-arr-mute" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="340" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS (drawn before boxes)
       ============================================================ -->

  <!-- R → D : straight horizontal -->
  <line x1="176" y1="170" x2="236" y2="170" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-07-arr)"/>

  <!-- D → IG : upward branch (예) -->
  <!-- Elbow: from top of D (288,136) up to IG center row y=76 -->
  <path d="M 288 136 L 288 76 L 596 76" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-07-arr-mute)"/>
  <!-- Label Yes -->
  <rect x="294" y="60" width="20" height="13" rx="2" fill="#f8fafb"/>
  <text x="304" y="70" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- D → V : straight horizontal (아니오) -->
  <line x1="340" y1="170" x2="440" y2="170" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-07-arr-accent)"/>
  <!-- Label No -->
  <rect x="360" y="154" width="40" height="13" rx="2" fill="#f8fafb"/>
  <text x="380" y="164" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- V → EX : straight horizontal (예) -->
  <line x1="552" y1="170" x2="652" y2="170" stroke="#286d50" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-07-arr-ok)"/>
  <!-- Label Yes -->
  <rect x="570" y="154" width="24" height="13" rx="2" fill="#f8fafb"/>
  <text x="582" y="164" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- V → ER : downward branch (아니오) -->
  <!-- Elbow: from bottom of V (496, 204) down to ER row y=252 -->
  <path d="M 496 204 L 496 252 L 652 252" fill="none" stroke="#94382b" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-07-arr-stop)"/>
  <!-- Label No -->
  <rect x="502" y="246" width="40" height="13" rx="2" fill="#f8fafb"/>
  <text x="522" y="256" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- ============================================================
       NODES
       ============================================================ -->

  <!-- R : Resume Signal Received (input / start-like) -->
  <!-- Oval start shape -->
  <rect x="48" y="148" width="128" height="44" rx="20" fill="#f8fafb"/>
  <rect x="48" y="148" width="128" height="44" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="112" y="168" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Resume Signal</text>
  <text x="112" y="183" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">TRIGGER</text>

  <!-- D : Duplicate Execution ID? (diamond decision, focal) -->
  <!-- Diamond centered at (288, 170), half-w=52, half-h=34 -->
  <rect x="236" y="136" width="104" height="68" rx="0" fill="#f8fafb"/>
  <polygon points="288,136 340,170 288,204 236,170" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="288" y="165" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Exec ID</text>
  <text x="288" y="179" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Duplicate?</text>

  <!-- V : State Valid? (diamond decision, focal) -->
  <!-- Diamond centered at (496, 170) -->
  <rect x="440" y="136" width="112" height="68" rx="0" fill="#f8fafb"/>
  <polygon points="496,136 552,170 496,204 440,170" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="496" y="165" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">State</text>
  <text x="496" y="179" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Valid?</text>

  <!-- IG : Ignore·Log (muted, top branch) -->
  <rect x="596" y="52" width="120" height="48" rx="6" fill="#f8fafb"/>
  <rect x="596" y="52" width="120" height="48" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <!-- Tag -->
  <rect x="604" y="58" width="28" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.4)" stroke-width="0.8"/>
  <text x="618" y="67" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">LOG</text>
  <text x="656" y="82" fill="#3f545c" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Ignore·Log</text>

  <!-- EX : Resume Execution (ok / positive outcome) -->
  <rect x="652" y="148" width="132" height="44" rx="20" fill="#f8fafb"/>
  <rect x="652" y="148" width="132" height="44" rx="20" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1.2"/>
  <text x="718" y="174" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Resume Execution</text>

  <!-- ER : Error Notification (stop / error outcome) -->
  <rect x="652" y="228" width="132" height="48" rx="6" fill="#f8fafb"/>
  <rect x="652" y="228" width="132" height="48" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1.2"/>
  <!-- Tag -->
  <rect x="660" y="234" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>
  <text x="676" y="243" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">ERROR</text>
  <text x="718" y="261" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Error Notify</text>

  <!-- ============================================================
       LEGEND strip
       ============================================================ -->
  <line x1="32" y1="302" x2="928" y2="302" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Start/Trigger swatch -->
  <rect x="32" y="312" width="14" height="10" rx="5" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="52" y="321" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Start</text>

  <!-- Decision swatch -->
  <polygon points="183,317 192,322 183,327 174,322" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="198" y="321" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Decision</text>

  <!-- Ok swatch -->
  <rect x="340" y="312" width="14" height="10" rx="5" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="360" y="321" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">OK</text>

  <!-- Error swatch -->
  <rect x="500" y="312" width="14" height="10" rx="2" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <text x="520" y="321" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Error</text>

  <!-- Muted swatch -->
  <rect x="660" y="312" width="14" height="10" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="680" y="321" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Ignore</text>

</svg>
</body>
</html>
