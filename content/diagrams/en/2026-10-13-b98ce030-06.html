<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-13-b98ce030-06-mem-title 2026-10-13-b98ce030-06-mem-desc">
  <title id="2026-10-13-b98ce030-06-mem-title">LLM Agent Memory Architecture</title>
  <desc id="2026-10-13-b98ce030-06-mem-desc">LLM agent context window structure where episodic, semantic, and procedural memory connect around working memory.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-10-13-b98ce030-06-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 (accent) -->
    <marker id="2026-10-13-b98ce030-06-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ────────────────────────────────────────────
       화살표 (박스보다 먼저)
  ──────────────────────────────────────────── -->

  <!-- W → E (작업→에피소딕): 오른쪽 위, 수직+수평 꺾임 -->
  <!-- W 중심(480,200) → E 중심(220,380) -->
  <!-- W 왼쪽 edge (416,200) → 내려가 → E 상단(220,344) -->
  <path d="M 416,200 L 220,200 L 220,344" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-13-b98ce030-06-arr)"/>

  <!-- W → S (작업→시맨틱): W 하단(480,244) → 아래로 직진 → S 상단(480,344) -->
  <path d="M 480,244 L 480,344" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-13-b98ce030-06-arr)"/>

  <!-- W → P (작업→절차): W 오른쪽(544,200) → P 상단(740,344) -->
  <path d="M 544,200 L 740,200 L 740,344" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-13-b98ce030-06-arr)"/>

  <!-- E → W (에피소딕→작업): E 오른쪽(284,392) → W 왼쪽(416,192) 수평+수직 -->
  <!-- 위쪽 경유: E 상단중앙(220,344) → 위로 → W 하단 -->
  <!-- 오프셋: E.right(284,392) → 중간 수평(320,392) → 위(320,168) → W.bottom_left(448,168) → W bottom -->
  <path d="M 284,392 L 320,392 L 320,168 L 448,168 L 448,156" fill="none" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-13-b98ce030-06-arr-acc)"/>

  <!-- S → W (시맨틱→작업): S 상단(480,344) → 위로 W 하단(480,244) - 오프셋 -->
  <!-- 같은 수직선이므로 옆으로 살짝 offset -->
  <path d="M 500,344 L 500,280 L 492,280 L 492,244" fill="none" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-13-b98ce030-06-arr-acc)"/>

  <!-- P → W (절차→작업): P.left(676,392) → 위쪽 수평 → W.right -->
  <path d="M 676,392 L 640,392 L 640,168 L 512,168 L 512,156" fill="none" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-13-b98ce030-06-arr-acc)"/>

  <!-- ────────────────────────────────────────────
       화살표 라벨
  ──────────────────────────────────────────── -->

  <!-- E→W 라벨: 320,168 선 위 -->
  <rect x="264" y="252" width="80" height="16" rx="2" fill="#f8fafb"/>
  <text x="304" y="263" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Load on session start</text>

  <!-- S→W 라벨 -->
  <rect x="508" y="280" width="72" height="16" rx="2" fill="#f8fafb"/>
  <text x="544" y="291" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Retrieve on demand</text>

  <!-- P→W 라벨 -->
  <rect x="608" y="252" width="60" height="16" rx="2" fill="#f8fafb"/>
  <text x="638" y="263" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Always included</text>

  <!-- ────────────────────────────────────────────
       노드 박스
  ──────────────────────────────────────────── -->

  <!-- W: 작업 메모리 (focal, accent) — 중앙 상단 -->
  <rect x="384" y="152" width="192" height="88" rx="6" fill="#f8fafb"/>
  <rect x="384" y="152" width="192" height="88" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="392" y="160" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="410" y="169" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WM</text>
  <text x="480" y="203" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Working Memory</text>
  <text x="480" y="221" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">current context</text>

  <!-- E: 에피소딕 메모리 (왼쪽 하단) -->
  <rect x="152" y="344" width="192" height="88" rx="6" fill="#f8fafb"/>
  <rect x="152" y="344" width="192" height="88" rx="6" fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1"/>
  <rect x="160" y="352" width="44" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.4)" stroke-width="0.8"/>
  <text x="182" y="361" fill="rgba(169,106,8,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EPISODIC</text>
  <text x="248" y="395" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Episodic Memory</text>
  <text x="248" y="413" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">session summaries</text>

  <!-- S: 시맨틱 메모리 (중앙 하단) -->
  <rect x="384" y="344" width="192" height="88" rx="6" fill="#f8fafb"/>
  <rect x="384" y="344" width="192" height="88" rx="6" fill="rgba(40,109,80,0.07)" stroke="#286d50" stroke-width="1"/>
  <rect x="392" y="352" width="44" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>
  <text x="414" y="361" fill="rgba(40,109,80,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEMANTIC</text>
  <text x="480" y="395" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Semantic Memory</text>
  <text x="480" y="413" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Vector DB · RAG</text>

  <!-- P: 절차 메모리 (오른쪽 하단) -->
  <rect x="616" y="344" width="192" height="88" rx="6" fill="#f8fafb"/>
  <rect x="616" y="344" width="192" height="88" rx="6" fill="rgba(195,208,212,0.30)" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="624" y="352" width="52" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.4)" stroke-width="0.8"/>
  <text x="650" y="361" fill="rgba(99,129,136,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROCEDURAL</text>
  <text x="712" y="395" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Procedural Memory</text>
  <text x="712" y="413" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">system prompt</text>

  <!-- ────────────────────────────────────────────
       레전드 구분선 + 레전드
  ──────────────────────────────────────────── -->
  <line x1="40" y1="498" x2="920" y2="498" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="514" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 실선: 정보 쓰기 -->
  <line x1="112" y1="514" x2="148" y2="514" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-13-b98ce030-06-arr)"/>
  <text x="156" y="518" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Store info</text>

  <!-- 점선: 정보 로드 -->
  <line x1="260" y1="514" x2="296" y2="514" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-13-b98ce030-06-arr-acc)"/>
  <text x="304" y="518" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Load context</text>

  <!-- focal 샘플 -->
  <rect x="432" y="506" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="450" y="518" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Working Memory (currently active)</text>
</svg>
</body>
</html>
