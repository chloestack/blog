<!DOCTYPE html>

<style>

  <title id="2026-10-07-c621f6a4-05-guardrails-title">LLM Guardrails 4-Layer Defense Structure</title>
  <desc id="2026-10-07-c621f6a4-05-guardrails-desc">Shows the flow where a user request passes sequentially through 4 layers — API gateway filter, ML classification & PII detection, LLM system prompt, and output post-processing — resulting in a safe response.</desc>

  <!-- L1 → L2 -->
  <line x1="480" y1="224" x2="480" y2="260" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-07-c621f6a4-05-arrow)"/>
  <!-- L2 → L3 -->
  <line x1="480" y1="332" x2="480" y2="368" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-05-arrow-accent)"/>
  <!-- L3 → L4 -->
  <line x1="480" y1="440" x2="480" y2="476" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-05-arrow-accent)"/>
  <!-- L4 → RES -->

  <!-- paper mask -->
  <rect x="360" y="64" width="240" height="52" rx="26" fill="#f8fafb"/>

  <rect x="360" y="64" width="240" height="52" rx="26" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>

  <text x="388" y="81" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>

  <rect x="280" y="260" width="400" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="292" y="268" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <text x="480" y="316" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ML Classification · PII Detection</text>

  <!-- ── L3 node (Accent — focal) ── -->
  <rect x="280" y="368" width="400" height="72" rx="6" fill="#f8fafb"/>
  <rect x="280" y="368" width="400" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="292" y="376" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <rect x="292" y="484" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>

  <text x="480" y="532" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Output Post-Processing</text>

  <rect x="360" y="548" width="240" height="52" rx="26" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="372" y="556" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <line x1="30" y1="608" x2="930" y2="608" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <text x="48" y="630" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">Input / Output</text>

  <rect x="148" y="620" width="12" height="12" rx="2" fill="white" stroke="#122127" stroke-width="1"/>
  <text x="166" y="630" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">Processing Layer</text>
  <!-- accent swatch -->
  <rect x="280" y="620" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="298" y="630" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">Core Defense Layer</text>
