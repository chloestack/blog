<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphify Auto-Update Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-19-6b5f07e6-08-graphify-flow-title 2026-10-19-6b5f07e6-08-graphify-flow-desc">
  <title id="2026-10-19-6b5f07e6-08-graphify-flow-title">Graphify Auto-Update Flow</title>
  <desc id="2026-10-19-6b5f07e6-08-graphify-flow-desc">A developer commit triggers a Git hook, which branches into full parsing or incremental parsing based on the scope of changes, then updates graph.json.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-19-6b5f07e6-08-gf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 악센트 화살표 -->
    <marker id="2026-10-19-6b5f07e6-08-gf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" fill="#f8fafb"/>

  <!-- ── 커넥터 (박스보다 먼저) ── -->

  <!-- DEV → HOOK -->
  <line x1="172" y1="148" x2="232" y2="148" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-08-gf-arrow)"/>

  <!-- HOOK → Q (decision) -->
  <line x1="340" y1="148" x2="400" y2="148" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-08-gf-arrow-accent)"/>

  <!-- Q → FULL (위쪽 분기: 초기·대규모) -->
  <!-- Q 다이아몬드 중심: (448, 148), 상단 꼭짓점: (448, 104) -->
  <!-- 꺾임: (448,88) → (572,88) → FULL 왼쪽 엣지 (572,80) 아니고 FULL top -->
  <!-- FULL 박스: x=524, y=60, w=160, h=56 → left=(524,88) -->
  <path d="M448,104 L448,88 L524,88" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-08-gf-arrow)"/>

  <!-- Q → INC (아래쪽 분기: 일반 커밋) -->
  <!-- INC 박스: x=524, y=180, w=160, h=56 → left=(524,208) -->
  <path d="M448,192 L448,208 L524,208" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-08-gf-arrow)"/>

  <!-- FULL → GJ -->
  <!-- FULL 우측: (684,88) → 꺾임 → GJ 좌측: (752,168) -->
  <path d="M684,88 L720,88 L720,168 L752,168" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-08-gf-arrow)"/>

  <!-- INC → GJ -->
  <!-- INC 우측: (684,208) → 꺾임 → GJ 좌측: (752,176) -->
  <path d="M684,208 L720,208 L720,176 L752,176" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-08-gf-arrow)"/>

  <!-- ── 분기 레이블 (커넥터 위, 박스 아래) ── -->

  <!-- "초기·대규모 변경" 레이블 — Q 위, FULL 경로 수평 구간 중간 -->
  <!-- 수평 구간: x=448→524, y=88 → 중간점 x=486, y=88 -->
  <rect x="436" y="68" width="100" height="14" rx="2" fill="#f8fafb"/>
  <text x="486" y="79" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle" font-weight="500">Init·Large Change</text>

  <!-- "일반 커밋" 레이블 — 수평 구간: x=448→524, y=208 → 중간점 x=486, y=208 -->
  <rect x="450" y="220" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="486" y="231" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle" font-weight="500">Reg. Commit</text>

  <!-- ── 노드 박스 ── -->

  <!-- DEV: Input 처리 -->
  <!-- x=40, y=116, w=132, h=64 -->
  <rect x="40" y="116" width="132" height="64" rx="6" fill="#f8fafb"/>
  <rect x="40" y="116" width="132" height="64" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="48" y="124" width="28" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="62" y="133" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="106" y="152" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Developer</text>
  <text x="106" y="168" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">commit·branch switch</text>

  <!-- HOOK: focal -->
  <!-- x=232, y=116, w=108, h=64 -->
  <rect x="232" y="116" width="108" height="64" rx="6" fill="#f8fafb"/>
  <rect x="232" y="116" width="108" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="240" y="124" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="254" y="133" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
  <text x="286" y="152" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Git Hook</text>
  <text x="286" y="168" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">auto trigger</text>

  <!-- Q: Decision diamond, focal -->
  <!-- 중심: (448, 148), 반폭 48, 반높이 44 -->
  <polygon points="448,104 496,148 448,192 400,148" fill="#f8fafb"/>
  <polygon points="448,104 496,148 448,192 400,148" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="448" y="144" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Change</text>
  <text x="448" y="160" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Scope</text>

  <!-- FULL: Backend -->
  <!-- x=524, y=60, w=160, h=56 -->
  <rect x="524" y="60" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="524" y="60" width="160" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="532" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="548" y="77" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">FULL</text>
  <text x="604" y="92" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Full Parse</text>
  <text x="604" y="107" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">graphify .</text>

  <!-- INC: Backend -->
  <!-- x=524, y=180, w=160, h=56 -->
  <rect x="524" y="180" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="524" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="532" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="548" y="197" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">INCR</text>
  <text x="604" y="212" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Incr. Parse</text>
  <text x="604" y="227" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">graphify --update</text>

  <!-- GJ: Store, focal -->
  <!-- x=752, y=140, w=160, h=56 -->
  <rect x="752" y="140" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="752" y="140" width="160" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="760" y="148" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="776" y="157" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="832" y="172" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">graph.json</text>
  <text x="832" y="187" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">update</text>

  <!-- ── 범례 구분선 ── -->
  <line x1="32" y1="278" x2="928" y2="278" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- 범례 항목 -->
  <text x="32" y="294" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="108" y="284" width="14" height="14" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="128" y="295" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif">Key Step</text>

  <!-- backend -->
  <rect x="228" y="284" width="14" height="14" rx="3" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="248" y="295" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif">Process Step</text>

  <!-- input -->
  <rect x="348" y="284" width="14" height="14" rx="3" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="368" y="295" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif">Input</text>

  <!-- decision -->
  <polygon points="476,291 483,284 490,291 483,298" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="496" y="295" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif">Branch Cond.</text>

</svg>
</div>
</body>
</html>
