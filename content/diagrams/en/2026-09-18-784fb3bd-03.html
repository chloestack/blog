<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-18-784fb3bd-03-llm-flow-title 2026-09-18-784fb3bd-03-llm-flow-desc">
  <title id="2026-09-18-784fb3bd-03-llm-flow-title">LLM Structured Output Flow</title>
  <desc id="2026-09-18-784fb3bd-03-llm-flow-desc">A flow diagram where a user request goes through an API call and LLM constrained decoding to produce a JSON response, then passes Pydantic validation and business rules before being delivered to the application or retried with error context.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-09-18-784fb3bd-03-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-18-784fb3bd-03-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 재시도 화살표 (link-blue) -->

  <!-- L → J -->
  <path d="M 484,200 L 532,200" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-18-784fb3bd-03-arr)"/>

  <!-- J → P -->
  <path d="M 636,200 L 684,200" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-18-784fb3bd-03-arr)"/>

  <!-- P → Q2 -->
  <path d="M 804,200 L 818,200" stroke="#0d5763" stroke-width="1.2" fill="none" marker-end="url(#2026-09-18-784fb3bd-03-arr-acc)"/>

  <!-- Q2 → R (예: 아래) -->
  <path d="M 868,232 L 868,262" stroke="#0d5763" stroke-width="1.2" fill="none" marker-end="url(#2026-09-18-784fb3bd-03-arr-acc)"/>
  <!-- 예 레이블 -->
  <rect x="874" y="240" width="20" height="14" rx="2" fill="#f8fafb"/>

  <!-- 아니오 레이블 -->
  <rect x="848" y="122" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="868" y="133" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <rect x="442" y="81" width="56" height="14" rx="2" fill="#f8fafb"/>
  <text x="470" y="92" fill="#3a548f" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">retry</text>

  <!-- ─── 노드 ─── -->

  <!-- Q: 사용자 요청 (input) -->
  <rect x="48" y="168" width="100" height="64" rx="6" fill="#f8fafb"/>

  <rect x="204" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <rect x="372" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>

  <text x="424" y="212" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Constrained Decode</text>

  <text x="584" y="220" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Response</text>

  <rect x="684" y="152" width="120" height="96" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="692" y="158" width="52" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <text x="744" y="196" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Pydantic</text>
  <text x="744" y="212" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Validation</text>

  <!-- Q2: 비즈니스 규칙 다이아몬드 -->
  <polygon points="868,168 916,200 868,232 820,200" fill="#f8fafb"/>
  <polygon points="868,168 916,200 868,232 820,200" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="868" y="196" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Business</text>
  <text x="868" y="210" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Rules?</text>

  <!-- R: 애플리케이션 사용 (아래 오른쪽) -->
  <rect x="812" y="264" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="812" y="264" width="120" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="820" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="834" y="279" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>

  <text x="744" y="92" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Error Context</text>
  <text x="744" y="108" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Retry</text>

  <!-- ─── 범례 ─── -->
  <line x1="32" y1="420" x2="928" y2="420" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="32" y="434" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal 노드 -->
  <rect x="100" y="426" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="118" y="436" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Key Step</text>

  <!-- 일반 노드 -->
  <rect x="220" y="426" width="12" height="12" rx="2" fill="white" stroke="#122127" stroke-width="1"/>
  <text x="238" y="436" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Process Step</text>

  <text x="358" y="436" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Data</text>

  <text x="458" y="436" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Retry Path</text>
