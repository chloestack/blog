<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-15-9124f843-02-inj-title 2026-10-15-9124f843-02-inj-desc">
  <title id="2026-10-15-9124f843-02-inj-title">Prompt Injection Priority Conflict Flow</title>
  <desc id="2026-10-15-9124f843-02-inj-desc">A diagram showing how user input (injection attempt) and a system prompt conflict within the LLM context window, branching into a normal response or a successful attack depending on which instruction takes priority.</desc>

  <defs>
    <!-- 기본 화살표: muted -->
    <marker id="2026-10-15-9124f843-02-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표: 정상 경로 -->
    <marker id="2026-10-15-9124f843-02-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
    <!-- 위험 화살표: BAD 경로 -->
    <marker id="2026-10-15-9124f843-02-arr-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#94382b"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="420" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────
       레이아웃 좌표 (4px grid)
       U:  x=40,  y=148, w=144, h=64
       S:  x=40,  y=252, w=144, h=64
       M:  x=280, y=184, w=160, h=64  (cx=360, cy=216)
       Q:  x=508, y=184, w=96,  h=64  (cx=556, cy=216) — diamond
       OK: x=720, y=148, w=160, h=64
       BAD:x=720, y=252, w=160, h=64
  ───────────────────────────────────────────── -->

  <!-- ── 1. 화살표 (박스보다 먼저 그림) ───────────────── -->

  <!-- U → M (우측으로) -->
  <path d="M 184,180 L 280,204" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-02-arr)"/>

  <!-- S → M (우측으로) -->
  <path d="M 184,284 L 280,228" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-02-arr)"/>

  <!-- M → Q (우측으로, 같은 y=216) -->
  <path d="M 440,216 L 504,216" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-02-arr)"/>

  <!-- Q → OK (우측 상단으로) — 직각 엘보: 556,216 → 556,180 → 720,180 -->
  <path d="M 604,204 L 640,180 L 720,180" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-15-9124f843-02-arr-accent)"/>

  <!-- Q → BAD (우측 하단으로) — 직각 엘보: 556,248 → 556,284 → 720,284 -->
  <path d="M 604,228 L 640,284 L 720,284" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-10-15-9124f843-02-arr-danger)"/>

  <!-- ── 화살표 레이블 ─────────────────────────────── -->

  <!-- M → Q 레이블 없음 (단순 전달) -->

  <!-- Q → OK 레이블: "System prompt wins" -->
  <rect x="618" y="160" width="96" height="14" rx="2" fill="#f8fafb"/>
  <text x="666" y="171" fill="#0d5763" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.04em">System prompt wins</text>

  <!-- Q → BAD 레이블: "Injection wins" -->
  <rect x="626" y="276" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="656" y="287" fill="#94382b" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.04em">Injection wins</text>

  <!-- ── 2. 노드 박스 ──────────────────────────────── -->

  <!-- U: 사용자 입력 / 인젝션 시도 — input 타입 -->
  <rect x="40" y="148" width="144" height="64" rx="6" fill="#f8fafb"/>
  <rect x="40" y="148" width="144" height="64" rx="6" fill="rgba(148,56,43,0.07)" stroke="rgba(148,56,43,0.55)" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="48" y="156" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="64" y="165" fill="rgba(148,56,43,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">INPUT</text>
  <!-- 노드 이름 -->
  <text x="112" y="196" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">User Input</text>
  <text x="112" y="210" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">Injection attempt</text>

  <!-- S: 시스템 프롬프트 — accent/focal 타입 -->
  <rect x="40" y="252" width="144" height="64" rx="6" fill="#f8fafb"/>
  <rect x="40" y="252" width="144" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="48" y="260" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="70" y="269" fill="rgba(13,87,99,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">SYSTEM</text>
  <!-- 노드 이름 -->
  <text x="112" y="300" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">System Prompt</text>
  <text x="112" y="314" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">Operator instruction</text>

  <!-- M: 컨텍스트 창 — focal 타입 (accent) -->
  <rect x="280" y="184" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="280" y="184" width="160" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 타입 태그 -->
  <rect x="288" y="192" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="310" y="201" fill="rgba(13,87,99,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">CONTEXT</text>
  <!-- 노드 이름 -->
  <text x="360" y="228" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Context Window</text>
  <text x="360" y="242" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">Single pass</text>

  <!-- Q: 결정 다이아몬드 — "어느 지시 우선" -->
  <!-- diamond: cx=556, cy=216, half=40 -->
  <polygon points="556,176 604,216 556,256 508,216" fill="#f8fafb"/>
  <polygon points="556,176 604,216 556,256 508,216"
           fill="rgba(13,87,99,0.05)" stroke="#0d5763" stroke-width="1"/>
  <text x="556" y="212" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Which takes</text>
  <text x="556" y="226" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">priority?</text>

  <!-- OK: 정상 응답 — backend 타입 -->
  <rect x="720" y="148" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="720" y="148" width="160" height="64" rx="6" fill="rgba(40,109,80,0.07)" stroke="rgba(40,109,80,0.55)" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="728" y="156" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="748" y="165" fill="rgba(40,109,80,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">OUTPUT</text>
  <!-- 노드 이름 -->
  <text x="800" y="196" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Normal Response</text>
  <text x="800" y="210" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">Defense success</text>

  <!-- BAD: 공격 성공 — focal accent danger -->
  <rect x="720" y="252" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="720" y="252" width="160" height="64" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1.2"/>
  <!-- 타입 태그 -->
  <rect x="728" y="260" width="44" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="750" y="269" fill="rgba(148,56,43,0.80)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">THREAT</text>
  <!-- 노드 이름 -->
  <text x="800" y="296" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Attack Success</text>
  <text x="800" y="310" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">Objective achieved</text>

  <!-- ── 3. 범례 (하단 수평 스트립) ─────────────────── -->
  <line x1="40" y1="362" x2="920" y2="362" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="376" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- 항목 1: 시스템 프롬프트 (accent) -->
  <rect x="108" y="369" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="128" y="379" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">System Prompt</text>

  <!-- 항목 2: 인젝션 입력 -->
  <rect x="260" y="369" width="12" height="12" rx="2" fill="rgba(148,56,43,0.07)" stroke="rgba(148,56,43,0.55)" stroke-width="1"/>
  <text x="280" y="379" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Injection Input</text>

  <!-- 항목 3: 정상 경로 -->
  <line x1="396" y1="375" x2="416" y2="375" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-15-9124f843-02-arr-accent)"/>
  <text x="424" y="379" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Defense success path</text>

  <!-- 항목 4: 위험 경로 -->
  <line x1="548" y1="375" x2="568" y2="375" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-10-15-9124f843-02-arr-danger)"/>
  <text x="576" y="379" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Attack success path</text>

</svg>
</body>
</html>
