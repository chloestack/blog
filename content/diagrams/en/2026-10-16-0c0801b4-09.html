<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Replacement Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  svg { display: block; width: 100%; height: auto; max-width: 960px; }
</style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-16-0c0801b4-09-flow-title 2026-10-16-0c0801b4-09-flow-desc">
  <title id="2026-10-16-0c0801b4-09-flow-title">Prompt Re-evaluation Flow on Model Replacement</title>
  <desc id="2026-10-16-0c0801b4-09-flow-desc">Decision flow: on model EOL notice or new model release, re-evaluate with a golden dataset, then adjust prompts or update metadata based on performance change, followed by canary deployment.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-16-0c0801b4-09-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-16-0c0801b4-09-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-16-0c0801b4-09-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- EOL → REVAL (straight down) -->
  <line x1="480" y1="96" x2="480" y2="144" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-09-arr)"/>

  <!-- REVAL → Q1 (straight down) -->
  <line x1="480" y1="200" x2="480" y2="248" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-09-arr)"/>

  <!-- Q1 → UMETA: "None" and "Improved" branch (right side) -->
  <!-- None: Q1 right → UMETA right -->
  <path d="M 556 284 L 680 284 L 680 332" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-09-arr)" stroke-linejoin="round"/>
  <!-- label None -->
  <rect x="590" y="270" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="608" y="280" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">None</text>

  <!-- Q1 → TUNE: "Degraded" branch (left side) -->
  <path d="M 404 284 L 280 284 L 280 332" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-09-arr)" stroke-linejoin="round"/>
  <!-- label Degraded -->
  <rect x="316" y="270" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="334" y="280" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Down</text>

  <!-- Q1 → UMETA: "Improved" branch — route from bottom of Q1 area down and right to UMETA -->
  <!-- Improved: goes down from Q1 bottom, then right -->
  <path d="M 480 320 L 480 344 L 680 344 L 680 332" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-09-arr)" stroke-linejoin="round" stroke-dasharray="5,3"/>
  <!-- label Improved -->
  <rect x="487" y="330" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="505" y="340" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Up</text>

  <!-- TUNE → REVAL2 (straight down) -->
  <line x1="280" y1="388" x2="280" y2="428" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-09-arr)"/>

  <!-- REVAL2 → UMETA (right then up: orthogonal elbow) -->
  <path d="M 340 456 L 500 456 L 500 408 L 620 408 L 620 388" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-09-arr-accent)" stroke-linejoin="round"/>

  <!-- UMETA → DEPLOY (straight down) -->
  <line x1="680" y1="388" x2="680" y2="468" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-09-arr-accent)"/>

  <!-- ===================== BOXES ===================== -->

  <!-- EOL node (link/external style) x=360 y=48 w=240 h=48 -->
  <rect x="360" y="48" width="240" height="48" rx="6" fill="#f8fafb"/>
  <rect x="360" y="48" width="240" height="48" rx="6" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <rect x="368" y="54" width="44" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="390" y="63" fill="rgba(58,84,143,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>
  <text x="480" y="76" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Model EOL Notice / New Release</text>

  <!-- REVAL node (accent style) x=360 y=144 w=240 h=56 -->
  <rect x="360" y="144" width="240" height="56" rx="6" fill="#f8fafb"/>
  <rect x="360" y="144" width="240" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="368" y="150" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="390" y="159" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVAL</text>
  <text x="480" y="174" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Golden Dataset Re-evaluation</text>
  <text x="480" y="190" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Golden Dataset</text>

  <!-- Q1 DECISION DIAMOND center=480,284 half=76,36 -->
  <!-- Paper mask -->
  <polygon points="404,284 480,248 556,284 480,320" fill="#f8fafb"/>
  <!-- Styled diamond -->
  <polygon points="404,284 480,248 556,284 480,320" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="279" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Perf.</text>
  <text x="480" y="295" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Changed?</text>

  <!-- TUNE node (warn style) x=160 y=332 w=240 h=56 -->
  <rect x="160" y="332" width="240" height="56" rx="6" fill="#f8fafb"/>
  <rect x="160" y="332" width="240" height="56" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="168" y="338" width="44" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="190" y="347" fill="rgba(169,106,8,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUNE</text>
  <text x="280" y="362" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prompt Adjustment</text>
  <text x="280" y="378" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">New Minor Version</text>

  <!-- UMETA node (focal/accent) x=560 y=332 w=240 h=56 -->
  <rect x="560" y="332" width="240" height="56" rx="6" fill="#f8fafb"/>
  <rect x="560" y="332" width="240" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="568" y="338" width="52" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="594" y="347" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE</text>
  <text x="680" y="362" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Metadata Update</text>
  <text x="680" y="378" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">target_model change</text>

  <!-- REVAL2 node (accent style) x=160 y=428 w=240 h=48 -->
  <rect x="160" y="428" width="240" height="48" rx="6" fill="#f8fafb"/>
  <rect x="160" y="428" width="240" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="168" y="434" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="190" y="443" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVAL</text>
  <text x="280" y="456" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Re-eval Pass Confirm</text>

  <!-- DEPLOY node (focal) x=560 y=468 w=240 h=56 -->
  <rect x="560" y="468" width="240" height="56" rx="6" fill="#f8fafb"/>
  <rect x="560" y="468" width="240" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="568" y="474" width="52" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="594" y="483" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPLOY</text>
  <text x="680" y="500" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">New Model Canary Deploy</text>
  <text x="680" y="516" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Canary Deployment</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="564" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Trigger swatch -->
  <rect x="112" y="556" width="12" height="12" rx="2" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <text x="130" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Trigger</text>

  <!-- Eval swatch -->
  <rect x="212" y="556" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="230" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Eval Step</text>

  <!-- Warn swatch -->
  <rect x="332" y="556" width="12" height="12" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <text x="350" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Needs Tuning</text>

  <!-- Decision swatch -->
  <polygon points="456,562 464,556 472,562 464,568" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Decision</text>

  <!-- Dashed line swatch (Improved path) -->
  <line x1="576" y1="562" x2="600" y2="562" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="608" y="566" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Perf. Improved Path</text>

</svg>
</body>
</html>
