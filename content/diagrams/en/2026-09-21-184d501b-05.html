  <title id="2026-09-21-184d501b-05-graphrag-title">GraphRAG Indexing Pipeline — LLM Model Selection Guide</title>
  <desc id="2026-09-21-184d501b-05-graphrag-desc">The indexing pipeline branches into three stages (entity extraction, gleaming validation, community summarization), each connecting to a small LLM (gpt-4o-mini / claude-haiku) or large LLM (gpt-4o / claude-sonnet) based on cost or quality criteria.</desc>
