<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"

  <title id="2026-10-16-0c0801b4-07-promptops-eval-title">Prompt Version Evaluation Flow — v2.4 vs v2.3</title>
  <desc id="2026-10-16-0c0801b4-07-promptops-eval-desc">A PromptOps evaluation pipeline flowchart in which an evaluation LLM scores the new prompt (v2.4) and the baseline prompt (v2.3) on accuracy, conciseness, and empathy, then approves deployment if v2.4 scores higher, or blocks deployment otherwise.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-16-0c0801b4-07-pe-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-16-0c0801b4-07-pe-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-16-0c0801b4-07-pe-arrow-pass" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-10-16-0c0801b4-07-pe-arrow-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ═══════════════════════════════════════════
       LAYER 1: ARROWS (drawn before boxes)
  ═══════════════════════════════════════════ -->

  <!-- NEW → JUDGE: right-angle elbow, NEW bottom → JUDGE left -->
  <!-- NEW center: (200,156), JUDGE center: (480,216) -->
  <!-- NEW bottom: (200,188) → elbow at (200,216) → JUDGE left: (368,216) -->
  <path d="M 200 188 L 200 216 L 368 216"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-07-pe-arrow)"/>

  <!-- BASE → JUDGE: right-angle elbow, BASE bottom → JUDGE left -->
  <!-- BASE center: (200,284), JUDGE center: (480,216) -->
  <!-- BASE bottom: (200,316) → elbow at (200,216) → wait, BASE is below JUDGE -->
  <!-- BASE top: (200,252) → elbow at (200,216) → JUDGE left: (368,216) -->
  <path d="M 200 252 L 200 216 L 368 216"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-07-pe-arrow)"/>

  <!-- CRITERIA → JUDGE: right-angle elbow, CRITERIA right → JUDGE bottom -->
  <!-- CRITERIA center: (480,316), JUDGE center: (480,216) -->
  <!-- CRITERIA top: (480,284) → JUDGE bottom: (480,248) -->
  <path d="M 480 284 L 480 248"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-07-pe-arrow)"/>

  <!-- JUDGE → SCORE: straight down -->
  <!-- JUDGE bottom: (480,248) already used; JUDGE is at y=184..248 -->
  <!-- JUDGE bottom: (480,248), SCORE top: (480,352) -->
  <!-- Wait, let me recalculate all node positions first -->
  <!-- I'll use consistent coords below after placing nodes -->

  <!-- ── Recalculated layout (top-down, centered at x=480) ──
       JUDGE:    x=368, y=184, w=224, h=64  → center (480,216), bottom (480,248)
       NEW:      x=88,  y=124, w=224, h=64  → center (200,156), bottom (200,188)
       BASE:     x=88,  y=220, w=224, h=64  → center (200,252), bottom (200,284)
       CRITERIA: x=368, y=284, w=224, h=64  → center (480,316), top (480,284)
       SCORE:    x=368, y=352, w=224, h=64  → center (480,384), top (480,352), bottom (480,416)
       Q1:       x=424, y=432, w=112, h=64  → center (480,464), bottom (480,496)
                 diamond: tip-top (480,432), tip-bottom (480,496), tip-left (424,464), tip-right (536,464)
       PASS:     x=612, y=432, w=200, h=64  → center (712,464), left (612,464)
       FAIL:     x=148, y=432, w=200, h=64  → center (248,464), right (348,464)
  -->

  <!-- Clear previous paths and redraw correctly -->

  <!-- Already drawn above but with wrong CRITERIA coord; redraw all -->

  <rect x="551" y="450" width="24" height="14" rx="2" fill="#f8fafb"/>

        text-anchor="middle" letter-spacing="0.08em">NEW</text>
  <!-- Label -->
  <text x="200" y="157" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">New Prompt</text>
  <text x="200" y="174" fill="#3f545c" font-size="11"

  <!-- ── BASE: 기준 프롬프트 v2.3 ── -->

  <text x="114" y="237" fill="rgba(18,33,39,0.6)" font-size="7" font-family="'IBM Plex Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">BASE</text>
  <!-- Label -->
  <text x="200" y="253" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Base Prompt</text>
  <text x="200" y="270" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono',monospace" text-anchor="middle">v2.3 response</text>

  <!-- ── JUDGE: 평가 LLM (focal) ── -->

  <!-- Label -->
  <text x="480" y="217" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Eval LLM</text>
  <text x="480" y="234" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono',monospace" text-anchor="middle">gpt-4o</text>

  <!-- ── CRITERIA: 평가 기준 ── -->
  <!-- x=648, y=220, w=224, h=64  (repositioned to right side) -->
  <!-- Reconsider: CRITERIA was at center (480,316) below JUDGE.
       Better: put it to the right of JUDGE so it enters from right side.
       CRITERIA: x=648, y=184, w=224, h=64 → center (760,216), left (648,216) -->
  <rect x="648" y="184" width="224" height="64" rx="6" fill="#f8fafb"/>
  <rect x="648" y="184" width="224" height="64" rx="6"
        fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.25)" stroke-width="1"/>
  <!-- Tag -->
  <rect x="656" y="192" width="40" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.22)" stroke-width="0.8"/>
  <text x="676" y="201" fill="rgba(18,33,39,0.55)" font-size="7" font-family="'IBM Plex Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">Criteria</text>
  <!-- Label -->
  <text x="760" y="213" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Eval Criteria</text>
  <text x="760" y="230" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Accuracy · Conciseness · Empathy</text>

  <!-- ── SCORE: 점수 비교 ── -->
  <!-- x=368, y=352, w=224, h=64 -->
  <rect x="368" y="352" width="224" height="64" rx="6" fill="#f8fafb"/>
  <rect x="368" y="352" width="224" height="64" rx="6"
        fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <!-- Tag -->
  <rect x="376" y="360" width="40" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.22)" stroke-width="0.8"/>
  <text x="396" y="369" fill="rgba(18,33,39,0.55)" font-size="7" font-family="'IBM Plex Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">SCORE</text>
  <!-- Label -->
  <text x="480" y="385" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Score Compare</text>
  <text x="480" y="402" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono',monospace" text-anchor="middle">v2.4 vs v2.3</text>

  <!-- ── Q1: Decision diamond ── -->
  <!-- center (480,464), half-w=56, half-h=32 -->
  <!-- tip-top (480,432), tip-right (536,464), tip-bottom (480,496), tip-left (424,464) -->
  <polygon points="480,432 536,464 480,496 424,464"
           fill="#f8fafb"/>
  <polygon points="480,432 536,464 480,496 424,464"
           fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="460" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">v2.4</text>
  <text x="480" y="476" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Better?</text>

  <!-- ── PASS: 배포 승인 ── -->
  <!-- x=612, y=432, w=200, h=64 -->
  <rect x="612" y="432" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="612" y="432" width="200" height="64" rx="6"
        fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <!-- Tag -->
  <rect x="620" y="440" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="640" y="449" fill="rgba(40,109,80,0.85)" font-size="7" font-family="'IBM Plex Mono',monospace"

  <!-- Label -->

  <!-- ── FAIL: 배포 차단 ── -->
  <!-- x=148, y=432, w=200, h=64 -->
  <rect x="148" y="432" width="200" height="64" rx="6" fill="#f8fafb"/>
  <rect x="148" y="432" width="200" height="64" rx="6"
        fill="rgba(148,56,43,0.07)" stroke="#94382b" stroke-width="1"/>
