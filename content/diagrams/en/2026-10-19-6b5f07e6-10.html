<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 540"
  role="img"
  aria-labelledby="2026-10-19-6b5f07e6-10-graphify-title 2026-10-19-6b5f07e6-10-graphify-desc"
>
  <title id="2026-10-19-6b5f07e6-10-graphify-title">Graphify Adoption Decision Flow</title>
  <desc id="2026-10-19-6b5f07e6-10-graphify-desc">A flowchart that determines whether Graphify is suitable through two branches asking about codebase size and traversal frequency. If file traversal is not a burden, vector RAG is sufficient; if it is a burden but structural navigation is infrequent, a pilot measurement is recommended.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-19-6b5f07e6-10-gf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-19-6b5f07e6-10-gf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="720" height="540" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       커넥터 (노드보다 먼저)
  ───────────────────────────────────────── -->

  <!-- START → Q1 (수직) -->
  <line x1="360" y1="92" x2="360" y2="168" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-10-gf-arrow)"/>

  <!-- Q1 → SKIP (아니오, 오른쪽으로 꺾어 아래) -->
  <!-- Q1 center (360, 216), SKIP center (564, 284) -->
  <!-- 오른쪽 꼭짓점에서 출발 → 수평 → 수직 내려감 -->
  <path d="M 436 216 L 564 216 L 564 260" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-10-gf-arrow)"/>
  <!-- 라벨: 아니오 -->
  <rect x="468" y="204" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="486" y="214" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- Q1 → Q2 (예, 수직) -->
  <line x1="360" y1="264" x2="360" y2="332" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-10-gf-arrow-accent)"/>
  <!-- 라벨: 예 -->
  <rect x="344" y="290" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="354" y="300" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- Q2 → USE (예, 수직) -->
  <line x1="360" y1="396" x2="360" y2="440" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-10-gf-arrow-accent)"/>
  <!-- 라벨: 예 -->
  <rect x="344" y="410" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="354" y="420" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- Q2 → PILOT (아니오, 왼쪽으로 꺾어 아래) -->
  <!-- Q2 center (360, 364), left vertex (284, 364), PILOT center (156, 440) -->
  <path d="M 284 364 L 156 364 L 156 440" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-10-gf-arrow)"/>
  <!-- 라벨: 아니오 -->
  <rect x="192" y="352" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="210" y="362" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- ─────────────────────────────────────────
       노드
  ───────────────────────────────────────── -->

  <!-- START: 도입 검토 (타원) -->
  <rect x="288" y="48" width="144" height="44" rx="6" fill="#f8fafb"/>
  <rect x="288" y="48" width="144" height="44" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="360" y="67" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Adoption Review</text>
  <text x="360" y="83" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">START</text>

  <!-- Q1: 다이아몬드 — 코드베이스가 커서 파일 순회가 부담인가 -->
  <!-- 센터 (360, 216), 반너비 76, 반높이 48 -->
  <rect x="284" y="168" width="152" height="96" rx="6" fill="#f8fafb"/>
  <polygon points="360,168 436,216 360,264 284,216" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="360" y="210" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Is file traversal</text>
  <text x="360" y="225" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">costly at scale?</text>

  <!-- Q2: 다이아몬드 — 구조·호출 탐색이 잦은가 -->
  <!-- 센터 (360, 364), 반너비 76, 반높이 32 -->
  <rect x="284" y="332" width="152" height="64" rx="6" fill="#f8fafb"/>
  <polygon points="360,332 436,364 360,396 284,364" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="360" y="358" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Frequent struct/</text>
  <text x="360" y="373" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">call navigation?</text>

  <!-- USE: Graphify 적합 (focal — accent) -->
  <rect x="288" y="440" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="288" y="440" width="144" height="52" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="360" y="462" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Graphify Fits</text>
  <text x="360" y="480" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">RECOMMENDED</text>

  <!-- PILOT: 파일럿으로 효과 먼저 측정 -->
  <rect x="84" y="440" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="84" y="440" width="144" height="52" rx="6" fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="156" y="462" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Pilot First,</text>
  <text x="156" y="478" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Measure Impact</text>

  <!-- SKIP: 벡터 RAG·파일 검색으로 충분 -->
  <rect x="492" y="260" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="492" y="260" width="144" height="52" rx="6" fill="rgba(63,84,92,0.06)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="564" y="282" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Vector RAG &amp; file</text>
  <text x="564" y="298" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">search suffices</text>

  <!-- ─────────────────────────────────────────
       범례 구분선 + 범례
  ───────────────────────────────────────── -->
  <line x1="40" y1="512" x2="680" y2="512" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례: 시작/끝 -->
  <rect x="40" y="520" width="10" height="10" rx="10" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="0.8"/>
  <text x="56" y="529" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Start/End</text>

  <!-- 범례: 결정 -->
  <polygon points="104,530 112,524 120,530 112,536" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="126" y="529" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Decision</text>

  <!-- 범례: 권장 -->
  <rect x="188" y="521" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="204" y="529" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Recommended</text>

  <!-- 범례: 파일럿 -->
  <rect x="278" y="521" width="10" height="10" rx="2" fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="294" y="529" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Pilot</text>

  <!-- 범례: 대안 -->
  <rect x="368" y="521" width="10" height="10" rx="2" fill="rgba(63,84,92,0.06)" stroke="#c3d0d4" stroke-width="0.8"/>
  <text x="384" y="529" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Alternative</text>

</svg>
</body>
</html>
