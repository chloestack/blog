<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-19-bd9f231a-01-handoff-title 2026-10-19-bd9f231a-01-handoff-desc">
  <title id="2026-10-19-bd9f231a-01-handoff-title">Limitations of a Single Agent</title>
  <desc id="2026-10-19-bd9f231a-01-handoff-desc">Shows a structure where a user request is passed to a single agent that holds all of Tools A, B, and C, causing context overload and mixed-permission issues.</desc>

  <defs>
    <!-- 배경 점선 패턴 없음, 단색 paper -->
    <marker id="2026-10-19-bd9f231a-01-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-01-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-01-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-01-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" fill="#f8fafb"/>

  <!-- ====== 화살표 (노드보다 먼저) ====== -->

  <!-- 사용자 → 단일 에이전트: x=160→228, y=144 -->
  <line x1="160" y1="144" x2="224" y2="144" stroke="#3a548f" stroke-width="1.2" marker-end="url(#2026-10-19-bd9f231a-01-arrow-link)"/>

  <!-- 단일 에이전트 → 도구 A: 에이전트 오른쪽 중앙(x=460,y=132) → 도구A 왼쪽(x=520,y=104) -->
  <!-- 팬 아웃: 에이전트 오른쪽 엣지에서 3개 attach point: y=112, y=144, y=176 -->
  <!-- 도구A: y=100, 도구B: y=164, 도구C: y=228 -->
  <!-- 에이전트 → 도구A (attach y=112) -->
  <path d="M460,112 L488,112 L488,104 L516,104" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-01-arrow-muted)"/>
  <!-- 에이전트 → 도구B (attach y=144, 직선) -->
  <line x1="460" y1="144" x2="516" y2="144" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-01-arrow-muted)"/>
  <!-- 에이전트 → 도구C (attach y=176) -->
  <path d="M460,176 L488,176 L488,184 L516,184" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-01-arrow-muted)"/>

  <!-- 단일 에이전트 → 컨텍스트 과부하: 에이전트 아래쪽(x=344,y=188) → (x=344,y=236) -->
  <path d="M344,188 L344,232" fill="none" stroke="#94382b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#2026-10-19-bd9f231a-01-arrow-stop)"/>

  <!-- ====== 노드 ====== -->

  <!-- 사용자 요청: x=36, y=120, w=124, h=48 -->
  <rect x="36" y="120" width="124" height="48" rx="6" fill="#f8fafb"/>
  <rect x="36" y="120" width="124" height="48" rx="6" fill="#dbe2f2" stroke="#3a548f" stroke-width="1"/>
  <rect x="44" y="127" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="58" y="136" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="98" y="151" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">User Request</text>

  <!-- 단일 에이전트: x=228, y=108, w=232, h=72 -->
  <rect x="228" y="108" width="232" height="72" rx="6" fill="#f8fafb"/>
  <rect x="228" y="108" width="232" height="72" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1.2"/>
  <rect x="236" y="115" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="252" y="124" fill="rgba(169,106,8,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="344" y="147" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Single Agent</text>
  <text x="344" y="165" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Holds all tools</text>

  <!-- 도구 A: x=520, y=80, w=100, h=48 -->
  <rect x="520" y="80" width="100" height="48" rx="6" fill="#f8fafb"/>
  <rect x="520" y="80" width="100" height="48" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="528" y="87" width="24" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.40)" stroke-width="0.8"/>
  <text x="540" y="96" fill="rgba(99,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="570" y="111" fill="#3f545c" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Tool A</text>

  <!-- 도구 B: x=520, y=120, w=100, h=48 -->
  <rect x="520" y="120" width="100" height="48" rx="6" fill="#f8fafb"/>
  <rect x="520" y="120" width="100" height="48" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="528" y="127" width="24" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.40)" stroke-width="0.8"/>
  <text x="540" y="136" fill="rgba(99,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="570" y="151" fill="#3f545c" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Tool B</text>

  <!-- 도구 C: x=520, y=160, w=100, h=48 -->
  <rect x="520" y="160" width="100" height="48" rx="6" fill="#f8fafb"/>
  <rect x="520" y="160" width="100" height="48" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="528" y="167" width="24" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.40)" stroke-width="0.8"/>
  <text x="540" y="176" fill="rgba(99,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="570" y="191" fill="#3f545c" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Tool C</text>

  <!-- 컨텍스트 과부하: x=248, y=236, w=192, h=56 -->
  <rect x="248" y="236" width="192" height="56" rx="6" fill="#f8fafb"/>
  <rect x="248" y="236" width="192" height="56" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <rect x="256" y="243" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="272" y="252" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ISSUE</text>
  <text x="344" y="272" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Context Overload</text>
  <text x="344" y="288" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Mixed Permissions</text>

  <!-- 화살표 라벨 (노드보다 앞, mask 사용) -->
  <!-- 사용자→에이전트 라벨 -->
  <rect x="164" y="126" width="36" height="12" rx="2" fill="#f8fafb"/>
  <text x="182" y="135" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">send</text>

  <!-- 에이전트→에러 라벨 (수직 화살표 옆에 배치) -->
  <rect x="352" y="204" width="36" height="12" rx="2" fill="#f8fafb"/>
  <text x="370" y="213" fill="#94382b" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">cause</text>

  <!-- ====== 범례 구분선 ====== -->
  <line x1="36" y1="324" x2="924" y2="324" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="36" y="336" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 범례: 사용자 요청 -->
  <rect x="116" y="328" width="12" height="12" rx="2" fill="#dbe2f2" stroke="#3a548f" stroke-width="1"/>
  <text x="132" y="338" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">User Request</text>

  <!-- 범례: 에이전트 -->
  <rect x="236" y="328" width="12" height="12" rx="2" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="252" y="338" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Agent</text>

  <!-- 범례: 도구 -->
  <rect x="332" y="328" width="12" height="12" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="348" y="338" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Tool</text>

  <!-- 범례: 문제 -->
  <rect x="408" y="328" width="12" height="12" rx="2" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <text x="424" y="338" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Issue</text>

</svg>
</div>
</body>
