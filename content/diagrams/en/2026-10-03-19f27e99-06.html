<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-03-19f27e99-06-pipeline-title 2026-10-03-19f27e99-06-pipeline-desc">
  <title id="2026-10-03-19f27e99-06-pipeline-title">Inference Model Cost-Efficient Pipeline</title>
  <desc id="2026-10-03-19f27e99-06-pipeline-desc">A 3-stage cascade pipeline that processes large documents through Haiku chunk summarisation → Sonnet mid-aggregation → Opus final inference &amp; validation to generate an insight report.</desc>

      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>

  <!-- 마스크 -->
  <rect x="48" y="88" width="148" height="72" rx="6" fill="#f8fafb"/>

  <text x="771" y="117" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle" font-weight="500">output</text>

  <line x1="32" y1="208" x2="928" y2="208" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <text x="114" y="224" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" font-weight="400">Input</text>
