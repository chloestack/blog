<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Guardrails Input Processing Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="2026-10-07-c621f6a4-02-guardrails-title 2026-10-07-c621f6a4-02-guardrails-desc">
  <title id="2026-10-07-c621f6a4-02-guardrails-title">LLM Guardrails Input Processing Flow</title>
  <desc id="2026-10-07-c621f6a4-02-guardrails-desc">AI input safety pipeline that branches into three paths — immediate block, human review, and LLM processing — after receiving input and passing through rule-based checks and an ML classifier.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-07-c621f6a4-02-grd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-07-c621f6a4-02-grd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-07-c621f6a4-02-grd-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-10-07-c621f6a4-02-grd-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
    <marker id="2026-10-07-c621f6a4-02-grd-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       ARROWS (drawn before boxes)
  ───────────────────────────────────────── -->

  <!-- IN → R1 (straight down) -->
  <line x1="480" y1="120" x2="480" y2="156" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-02-grd-arrow-accent)"/>

  <!-- R1 → BLK (명백 위반): right elbow -->
  <!-- R1 right edge: x=600, y=192. BLK top center: x=752, y=272 -->
  <!-- path: right from R1 at y=192, then down to BLK top -->
  <path d="M600,192 L680,192 Q688,192 688,200 L688,272" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-02-grd-arrow-stop)"/>
  <!-- label: 명백 위반 -->
  <rect x="622" y="176" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="648" y="187" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Obvious Viol.</text>

  <!-- R1 → ML1 (통과): straight down -->
  <line x1="480" y1="228" x2="480" y2="272" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-02-grd-arrow-accent)"/>
  <!-- label: 통과 -->
  <rect x="460" y="244" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="480" y="255" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Pass</text>

  <!-- ML1 → BLK (고위험): right elbow -->
  <!-- ML1 right edge: x=600, y=316. BLK left edge: x=704, y=316 then down to BLK y=312 -->
  <path d="M600,316 L688,316 Q688,316 688,316 L688,320 Q688,328 688,340 L704,340" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-02-grd-arrow-stop)"/>
  <!-- label: 고위험 -->
  <rect x="622" y="300" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="644" y="311" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">High Risk</text>

  <!-- ML1 → HU (중위험): left elbow -->
  <!-- ML1 left edge: x=360, y=316. HU top center: x=208, y=396 -->
  <path d="M360,316 L280,316 Q272,316 272,324 L272,396" fill="none" stroke="#a96a08" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-02-grd-arrow-warn)"/>
  <!-- label: 중위험 -->
  <rect x="294" y="300" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="316" y="311" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Med Risk</text>

  <!-- ML1 → PROC (저위험): straight down -->
  <line x1="480" y1="352" x2="480" y2="396" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-10-07-c621f6a4-02-grd-arrow-ok)"/>
  <!-- label: 저위험 -->
  <rect x="460" y="368" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="482" y="379" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Low Risk</text>

  <!-- ─────────────────────────────────────────
       NODES
  ───────────────────────────────────────── -->

  <!-- IN: 입력 수신 (input/user type → link blue) -->
  <!-- oval: rx=20 for start -->
  <rect x="392" y="72" width="176" height="48" rx="20" fill="#f8fafb"/>
  <rect x="392" y="72" width="176" height="48" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="98" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Input Received</text>

  <!-- R1: 규칙 기반 검사 (accent/focal) -->
  <rect x="360" y="156" width="240" height="72" rx="6" fill="#f8fafb"/>
  <rect x="360" y="156" width="240" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="368" y="162" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="384" y="171" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RULE</text>
  <!-- name -->
  <text x="480" y="202" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Rule-Based Check</text>
  <!-- sublabel -->
  <text x="480" y="218" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">&lt; 1ms</text>

  <!-- ML1: ML 분류기 (accent/focal) -->
  <rect x="360" y="272" width="240" height="80" rx="6" fill="#f8fafb"/>
  <rect x="360" y="272" width="240" height="80" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="368" y="278" width="20" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="378" y="287" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ML</text>
  <!-- name -->
  <text x="480" y="316" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">ML Classifier</text>
  <!-- sublabel -->
  <text x="480" y="334" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">10~50ms</text>

  <!-- BLK: 즉시 차단 (stop) -->
  <rect x="704" y="272" width="176" height="136" rx="6" fill="#f8fafb"/>
  <rect x="704" y="272" width="176" height="136" rx="6" fill="rgba(148,56,43,0.06)" stroke="#94382b" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="712" y="278" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>
  <text x="728" y="287" fill="rgba(148,56,43,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STOP</text>
  <!-- name -->
  <text x="792" y="340" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Immediate Block</text>

  <!-- HU: 인간 검토 큐 (warn) -->
  <rect x="168" y="396" width="208" height="72" rx="6" fill="#f8fafb"/>
  <rect x="168" y="396" width="208" height="72" rx="6" fill="rgba(169,106,8,0.06)" stroke="#a96a08" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="176" y="402" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.4)" stroke-width="0.8"/>
  <text x="192" y="411" fill="rgba(169,106,8,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
  <!-- name -->
  <text x="272" y="436" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Human Review Queue</text>

  <!-- PROC: LLM 처리 (ok / focal) -->
  <!-- oval: rx=20 for end/terminal -->
  <rect x="392" y="396" width="176" height="72" rx="20" fill="#f8fafb"/>
  <rect x="392" y="396" width="176" height="72" rx="20" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1.2"/>
  <!-- name -->
  <text x="480" y="428" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">LLM Processing</text>

  <!-- ─────────────────────────────────────────
       LEGEND STRIP
  ───────────────────────────────────────── -->
  <line x1="32" y1="532" x2="928" y2="532" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="32" y="546" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 입력 swatch -->
  <rect x="108" y="537" width="12" height="12" rx="3" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="124" y="547" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Input / Output</text>

  <!-- 분류기 swatch -->
  <rect x="228" y="537" width="12" height="12" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="244" y="547" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Classification</text>

  <!-- 차단 swatch -->
  <rect x="348" y="537" width="12" height="12" rx="3" fill="rgba(148,56,43,0.06)" stroke="#94382b" stroke-width="1.2"/>
  <text x="364" y="547" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Immediate Block</text>

  <!-- 검토 swatch -->
  <rect x="456" y="537" width="12" height="12" rx="3" fill="rgba(169,106,8,0.06)" stroke="#a96a08" stroke-width="1.2"/>
  <text x="472" y="547" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Human Review</text>

  <!-- 처리 swatch -->
  <rect x="564" y="537" width="12" height="12" rx="3" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1.2"/>
  <text x="580" y="547" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">LLM Processing</text>

</svg>
</body>
</html>
