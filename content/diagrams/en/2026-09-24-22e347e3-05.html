<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-24-22e347e3-05-redis-shard-title 2026-09-24-22e347e3-05-redis-shard-desc">
  <title id="2026-09-24-22e347e3-05-redis-shard-title">Redis Counter Sharding Flow</title>
  <desc id="2026-09-24-22e347e3-05-redis-shard-desc">Write requests pass through a random shard selector and are distributed across three shards — count:0, count:1, and count:N. Read requests use MGET to read all shards and return the sum.</desc>

  <defs>
    <!-- 기본 muted 화살표 -->
    <marker id="2026-09-24-22e347e3-05-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-24-22e347e3-05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- link 화살표 -->
    <marker id="2026-09-24-22e347e3-05-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="440" fill="#f8fafb"/>

  <!-- ───────────────────────────────────────────
       WRITE 경로 영역 라벨
  ─────────────────────────────────────────────── -->
  <text x="48" y="52" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em" font-weight="500">WRITE PATH</text>
  <line x1="44" y1="58" x2="580" y2="58" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- READ 경로 영역 라벨 -->
  <text x="48" y="296" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em" font-weight="500">READ PATH</text>
  <line x1="44" y1="302" stroke="rgba(18,33,39,0.10)" stroke-width="0.8" x2="580" y2="302"/>

  <!-- ═══════════════════════════════════════════
       ARROWS (drawn before boxes)
  ═══════════════════════════════════════════════ -->

  <!-- 쓰기 요청 → 랜덤 샤드 선택 -->
  <path d="M188,140 L252,140" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow)"/>

  <!-- 랜덤 샤드 선택 → count:0 (위) -->
  <path d="M388,124 Q408,124 408,100 L508,100" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>
  <!-- label 마스크: 샤드 0 -->
  <rect x="418" y="86" width="42" height="14" rx="2" fill="#f8fafb"/>
  <text x="439" y="97" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">shard 0</text>

  <!-- 랜덤 샤드 선택 → count:1 (중간) -->
  <path d="M388,140 L508,140" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>
  <!-- label 마스크: 샤드 1 -->
  <rect x="420" y="126" width="42" height="14" rx="2" fill="#f8fafb"/>
  <text x="441" y="137" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">shard 1</text>

  <!-- 랜덤 샤드 선택 → count:N (아래) -->
  <path d="M388,156 Q408,156 408,180 L508,180" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>
  <!-- label 마스크: 샤드 N -->
  <rect x="418" y="166" width="42" height="14" rx="2" fill="#f8fafb"/>
  <text x="439" y="177" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">shard N</text>

  <!-- 집계 요청 → MGET 전체 샤드 -->
  <path d="M188,360 L284,360" stroke="#3a548f" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-link)"/>

  <!-- MGET → count:0 (위) -->
  <path d="M420,344 Q420,100 508,100" stroke="#3f545c" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#2026-09-24-22e347e3-05-arrow)"/>

  <!-- MGET → count:1 (중간) -->
  <path d="M420,360 Q464,360 464,140 L508,140" stroke="#3f545c" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#2026-09-24-22e347e3-05-arrow)"/>

  <!-- MGET → count:N (아래) -->
  <path d="M420,376 Q448,376 448,180 L508,180" stroke="#3f545c" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#2026-09-24-22e347e3-05-arrow)"/>

  <!-- count:0 → 합산 반환 -->
  <path d="M648,100 Q780,100 780,124" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>

  <!-- count:1 → 합산 반환 -->
  <path d="M648,140 L780,140" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>

  <!-- count:N → 합산 반환 -->
  <path d="M648,180 Q780,180 780,156" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>

  <!-- ═══════════════════════════════════════════
       NODES
  ═══════════════════════════════════════════════ -->

  <!-- 쓰기 요청 (input) -->
  <rect x="44" y="116" width="144" height="48" rx="6" fill="#f8fafb"/>
  <rect x="44" y="116" width="144" height="48" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="52" y="122" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="70" y="131" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="116" y="147" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Write Req</text>

  <!-- 랜덤 샤드 선택 (focal — diamond) -->
  <!-- diamond center: (320, 140), half-w=68, half-h=40 -->
  <polygon points="252,140 320,100 388,140 320,180" fill="#f8fafb"/>
  <polygon points="252,140 320,100 388,140 320,180" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="320" y="135" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Random</text>
  <text x="320" y="151" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Shard Pick</text>

  <!-- count:0 (store) -->
  <rect x="508" y="76" width="140" height="48" rx="6" fill="#f8fafb"/>
  <rect x="508" y="76" width="140" height="48" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="516" y="82" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="530" y="91" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="578" y="107" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">count:0</text>

  <!-- count:1 (store) -->
  <rect x="508" y="116" width="140" height="48" rx="6" fill="#f8fafb"/>
  <rect x="508" y="116" width="140" height="48" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="516" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="530" y="131" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="578" y="147" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">count:1</text>

  <!-- count:N (store) -->
  <rect x="508" y="156" width="140" height="48" rx="6" fill="#f8fafb"/>
  <rect x="508" y="156" width="140" height="48" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="516" y="162" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="530" y="171" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="578" y="192" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">count:N</text>

  <!-- 합산 반환 (focal) -->
  <rect x="736" y="116" width="152" height="48" rx="6" fill="#f8fafb"/>
  <rect x="736" y="116" width="152" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="744" y="122" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="766" y="131" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
  <text x="812" y="147" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Sum Return</text>

  <!-- 집계 요청 (input) -->
  <rect x="44" y="336" width="144" height="48" rx="6" fill="#f8fafb"/>
  <rect x="44" y="336" width="144" height="48" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="52" y="342" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="70" y="351" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="116" y="367" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Read Req</text>

  <!-- MGET 전체 샤드 (backend) -->
  <rect x="284" y="336" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="284" y="336" width="136" height="48" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="292" y="342" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="308" y="351" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CMD</text>
  <text x="352" y="362" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">MGET</text>
  <text x="352" y="378" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">all shards</text>

  <!-- ═══════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════ -->
  <line x1="44" y1="404" x2="916" y2="404" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="44" y="418" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="120" y="408" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="138" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Key Node</text>

  <!-- store -->
  <rect x="228" y="408" width="12" height="12" rx="2" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="246" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Redis Key</text>

  <!-- input -->
  <rect x="324" y="408" width="12" height="12" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="342" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Request</text>

  <!-- backend -->
  <rect x="420" y="408" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="438" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Command</text>

  <!-- dashed -->
  <line x1="512" y1="414" x2="536" y2="414" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="542" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Read Path (MGET)</text>
</svg>
</body>
</html>
