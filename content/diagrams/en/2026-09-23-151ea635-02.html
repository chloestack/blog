  <title id="2026-09-23-151ea635-02-ecst-fail-title">Sync Call Failure Propagation Flow</title>

  <text x="430" y="362" fill="#0d5763" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pool exhausted</text>

  <text x="598" y="205" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Inventory Service</text>
  <text x="598" y="224" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Inventory</text>

  <!-- 레전드 항목 2: 장애 전파 화살표 -->
  <line x1="268" y1="482" x2="296" y2="482" stroke="#0d5763" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#2026-09-23-151ea635-02-ecst-arrow-danger)"/>

  <text x="468" y="486" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Failure · Propagation Point</text>
