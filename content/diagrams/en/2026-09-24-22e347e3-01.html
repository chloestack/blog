<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 400"
  role="img"
  aria-labelledby="2026-09-24-22e347e3-01-slot-title 2026-09-24-22e347e3-01-slot-desc"
>
  <title id="2026-09-24-22e347e3-01-slot-title">Redis Key Slot Routing Flow</title>
  <desc id="2026-09-24-22e347e3-01-slot-desc">Flowchart showing Redis Cluster slot assignment: from key input, checking for a hash tag, applying CRC16, computing mod 16384 to get the slot number, then routing to the responsible node.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-24-22e347e3-01-slot-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-24-22e347e3-01-slot-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────── -->
  <!-- ARROWS (drawn before boxes) -->
  <!-- ─────────────────────────────────────── -->

  <!-- K → HT (right, straight) -->
  <path d="M 188,160 L 268,160" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow)"/>

  <!-- HT → BK (예, up-right elbow) -->
  <path d="M 340,132 Q 340,108 348,108 L 460,108" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow-accent)"/>
  <!-- 예 label -->
  <rect x="366" y="92" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="376" y="101" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- HT → FK (아니오, down-right elbow) -->
  <path d="M 340,188 Q 340,212 348,212 L 460,212" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow)"/>
  <!-- 아니오 label -->
  <rect x="352" y="196" width="36" height="12" rx="2" fill="#f8fafb"/>
  <text x="370" y="205" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- BK → SL (right-down elbow to SL) -->
  <path d="M 572,108 Q 608,108 608,132 L 608,148" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow-accent)"/>

  <!-- FK → SL (right-up elbow to SL) -->
  <path d="M 572,212 Q 608,212 608,188 L 608,212" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow)"/>

  <!-- Adjusted: BK → SL straight merge point -->
  <!-- Let's redo with a shared merge: BK exits right, FK exits right, both go to SL centered -->

  <!-- ─────────────────────────────────────── -->
  <!-- REVISED ARROWS -->
  <!-- ─────────────────────────────────────── -->

  <!-- BK (x=460..572, cy=108) → corner (640,108) → corner (640,160) → SL (x=652, y=160) -->
  <path d="M 572,108 L 636,108 Q 644,108 644,116 L 644,152 Q 644,160 652,160" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow-accent)"/>

  <!-- FK (x=460..572, cy=212) → corner (640,212) → corner (640,168) → SL (x=652, y=160) -->
  <path d="M 572,212 L 636,212 Q 644,212 644,204 L 644,168 Q 644,160 652,160" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow)"/>

  <!-- SL → ND (right, straight) -->
  <path d="M 772,160 L 808,160" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-01-slot-arrow-accent)"/>

  <!-- ─────────────────────────────────────── -->
  <!-- NODES -->
  <!-- ─────────────────────────────────────── -->

  <!-- K: 키 입력 (input style) -->
  <rect x="80" y="132" width="108" height="56" rx="6" fill="#f8fafb"/>
  <rect x="80" y="132" width="108" height="56" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="88" y="138" width="32" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="104" y="147" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="134" y="166" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Key Input</text>

  <!-- HT: 해시 태그 {…} 있나? (decision diamond, focal) -->
  <!-- Diamond centered at (304,160), half-width=60, half-height=44 -->
  <polygon points="244,160 304,116 364,160 304,204" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="304" y="154" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Hash Tag</text>
  <text x="304" y="168" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">{...} exists?</text>

  <!-- BK: 중괄호 내용만 CRC16 (backend) -->
  <rect x="460" y="80" width="112" height="56" rx="6" fill="#f8fafb"/>
  <rect x="460" y="80" width="112" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="468" y="86" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="484" y="95" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HASH</text>
  <text x="516" y="113" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Bracket content</text>
  <text x="516" y="127" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">CRC16 apply</text>

  <!-- FK: 키 전체에 CRC16 (backend) -->
  <rect x="460" y="184" width="112" height="56" rx="6" fill="#f8fafb"/>
  <rect x="460" y="184" width="112" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="468" y="190" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="484" y="199" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HASH</text>
  <text x="516" y="217" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Whole key</text>
  <text x="516" y="231" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">CRC16 apply</text>

  <!-- SL: 슬롯 번호 mod 16384 (focal) -->
  <rect x="652" y="132" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="652" y="132" width="120" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="660" y="138" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="676" y="147" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SLOT</text>
  <text x="712" y="162" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Slot number</text>
  <text x="712" y="176" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">mod 16384</text>

  <!-- ND: 담당 노드로 라우팅 (backend) -->
  <rect x="808" y="132" width="116" height="56" rx="6" fill="#f8fafb"/>
  <rect x="808" y="132" width="116" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="816" y="138" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="834" y="147" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
  <text x="866" y="162" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Route to</text>
  <text x="866" y="176" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">target node</text>

  <!-- ─────────────────────────────────────── -->
  <!-- LEGEND -->
  <!-- ─────────────────────────────────────── -->
  <line x1="32" y1="332" x2="928" y2="332" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="32" y="348" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal swatch -->
  <rect x="100" y="338" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="118" y="348" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Key step</text>

  <!-- backend swatch -->
  <rect x="240" y="338" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="258" y="348" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Process step</text>

  <!-- input swatch -->
  <rect x="380" y="338" width="12" height="12" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="398" y="348" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Input</text>

  <!-- decision swatch -->
  <polygon points="500,344 508,338 516,344 508,350" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="524" y="348" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Branch decision</text>

</svg>
</body>
</html>
