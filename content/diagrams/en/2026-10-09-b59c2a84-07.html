<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="2026-10-09-b59c2a84-07-flow-title 2026-10-09-b59c2a84-07-flow-desc">
  <title id="2026-10-09-b59c2a84-07-flow-title">LLM Serving Troubleshooting Flowchart</title>
  <desc id="2026-10-09-b59c2a84-07-flow-desc">A decision flowchart showing how to inspect OOM, abnormal output, and slow speed in order after serving starts, with response steps for each issue.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-09-b59c2a84-07-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-09-b59c2a84-07-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-09-b59c2a84-07-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafb"/>

  <!-- ===================== CONNECTORS (drawn before boxes) ===================== -->

  <!-- START → M1 (OOM 발생?) -->
  <line x1="480" y1="84" x2="480" y2="116" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>

  <!-- M1 예 → F1 (왼쪽으로) -->
  <!-- M1 left edge x=388, y=148; go left to x=240, then down to F1 top -->
  <path d="M388,148 H240 V212" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>
  <!-- label 예 -->
  <rect x="293" y="136" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="303" y="147" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- F1 → F2 -->
  <line x1="240" y1="260" x2="240" y2="296" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>

  <!-- M1 아니오 → M2 (아래로) -->
  <line x1="480" y1="180" x2="480" y2="244" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>
  <!-- label 아니오 -->
  <rect x="444" y="196" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="468" y="207" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- M2 예 → D1 (왼쪽으로) -->
  <path d="M388,276 H240 V356" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>
  <!-- label 예 -->
  <rect x="293" y="264" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="303" y="275" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- D1 → D2 -->
  <line x1="240" y1="404" x2="240" y2="440" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>

  <!-- M2 아니오 → M3 (아래로) -->
  <line x1="480" y1="308" x2="480" y2="372" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>
  <!-- label 아니오 -->
  <rect x="444" y="324" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="468" y="335" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- M3 예 → P1 (오른쪽으로) -->
  <path d="M572,404 H720 V444" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-09-b59c2a84-07-arrow)"/>
  <!-- label 예 -->
  <rect x="615" y="392" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="625" y="403" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- M3 아니오 → OK (아래로) -->
  <line x1="480" y1="436" x2="480" y2="484" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-09-b59c2a84-07-arrow-accent)"/>
  <!-- label 아니오 -->
  <rect x="444" y="452" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="468" y="463" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- ===================== NODES ===================== -->

  <!-- START: 서빙 시작 (oval) -->
  <rect x="420" y="44" width="120" height="40" rx="2" fill="#f8fafb"/>
  <rect x="420" y="44" width="120" height="40" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="69" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Serving Start</text>

  <!-- M1: OOM 발생? (diamond) -->
  <!-- center 480,148; diamond points: top(480,116) right(524,148) bottom(480,180) left(436,148) -->
  <rect x="428" y="112" width="104" height="72" rx="2" fill="#f8fafb"/>
  <polygon points="480,116 524,148 480,180 436,148" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="144" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">OOM</text>
  <text x="480" y="158" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Occurred?</text>

  <!-- F1: 컨텍스트 길이 줄이기 -->
  <rect x="160" y="212" width="160" height="48" rx="2" fill="#f8fafb"/>
  <rect x="160" y="212" width="160" height="48" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="240" y="232" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Reduce Context</text>
  <text x="240" y="248" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Length</text>

  <!-- F2: gpu_memory_utilization 낮추기 -->
  <rect x="148" y="296" width="184" height="52" rx="2" fill="#f8fafb"/>
  <rect x="148" y="296" width="184" height="52" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="240" y="316" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">gpu_memory_utilization</text>
  <text x="240" y="332" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Lower (0.80)</text>

  <!-- M2: 출력이 이상한가? (diamond) -->
  <!-- center 480,276 -->
  <rect x="428" y="244" width="104" height="64" rx="2" fill="#f8fafb"/>
  <polygon points="480,244 524,276 480,308 436,276" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="272" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Abnormal</text>
  <text x="480" y="286" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Output?</text>

  <!-- D1: 라이브러리 버전 확인 -->
  <rect x="160" y="356" width="160" height="48" rx="2" fill="#f8fafb"/>
  <rect x="160" y="356" width="160" height="48" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="240" y="376" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Check Library</text>
  <text x="240" y="392" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Version</text>

  <!-- D2: 보정 데이터 도메인 검토 -->
  <rect x="160" y="440" width="160" height="48" rx="2" fill="#f8fafb"/>
  <rect x="160" y="440" width="160" height="48" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="240" y="460" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Review Calib.</text>
  <text x="240" y="476" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Data Domain</text>

  <!-- M3: 속도가 느린가? (diamond) -->
  <!-- center 480,404 -->
  <rect x="428" y="372" width="104" height="64" rx="2" fill="#f8fafb"/>
  <polygon points="480,372 524,404 480,436 436,404" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="400" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Speed</text>
  <text x="480" y="414" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Too Slow?</text>

  <!-- P1: ngl 최대화 / 배치 크기 조정 -->
  <rect x="640" y="444" width="160" height="52" rx="2" fill="#f8fafb"/>
  <rect x="640" y="444" width="160" height="52" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="720" y="464" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Max ngl /</text>
  <text x="720" y="480" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Tune Batch Size</text>

  <!-- OK: 정상 운영 (focal — accent) -->
  <rect x="420" y="484" width="120" height="44" rx="2" fill="#f8fafb"/>
  <rect x="420" y="484" width="120" height="44" rx="20" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="480" y="511" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Normal Ops</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="32" y1="552" x2="928" y2="552" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend: 타원 = 시작/종료 -->
  <rect x="44" y="558" width="52" height="22" rx="11" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="70" y="574" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START</text>

  <!-- legend: 다이아몬드 = 분기 -->
  <polygon points="120,569 136,580 120,591 104,580" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="148" y="584" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">Branch</text>

  <!-- legend: 사각형 = 대응 단계 -->
  <rect x="192" y="567" width="48" height="22" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="252" y="583" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">Action Step</text>

  <!-- legend: 타원 진한 = 정상 종료 -->
  <rect x="320" y="558" width="72" height="22" rx="11" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="356" y="574" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Normal End</text>

</svg>
</body>
</html>
