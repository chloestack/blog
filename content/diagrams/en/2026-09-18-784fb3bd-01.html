<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-18-784fb3bd-01-llm-flow-title 2026-09-18-784fb3bd-01-llm-flow-desc">
  <title id="2026-09-18-784fb3bd-01-llm-flow-title">LLM Unstructured Response Parsing Failure Loop</title>
  <desc id="2026-09-18-784fb3bd-01-llm-flow-desc">A cyclic flow where a prompt generates a response via probabilistic sampling, then branches to data use or error handling and manual retry depending on whether JSON parsing succeeds.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-18-784fb3bd-01-llm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-18-784fb3bd-01-llm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-18-784fb3bd-01-llm-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-09-18-784fb3bd-01-llm-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="#f8fafb"/>

  <!-- ============================================================
       CONNECTORS — drawn before boxes
  ============================================================ -->

  <!-- P → R: Prompt → Response (probabilistic sampling) -->
  <line x1="208" y1="140" x2="312" y2="140" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow)"/>
  <!-- label: Probabilistic Sampling -->
  <rect x="222" y="120" width="76" height="14" rx="2" fill="#f8fafb"/>
  <text x="260" y="131" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prob. Sampling</text>

  <!-- R → V: Response → Parse branch -->
  <line x1="440" y1="140" x2="512" y2="140" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow)"/>

  <!-- V → D: Yes (right then down to D center) -->
  <path d="M 588 140 L 678 140" fill="none" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow-ok)"/>
  <!-- label: Yes -->
  <rect x="622" y="126" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="634" y="137" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- V → E: No (down) -->
  <path d="M 550 172 L 550 206" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow-warn)"/>
  <!-- label: No -->
  <rect x="556" y="182" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="576" y="193" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- E → M: Error handler → Manual retry -->
  <line x1="604" y1="236" x2="658" y2="236" stroke="#a96a08" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow-warn)"/>

  <!-- M → P: Manual retry → Prompt (feedback loop) -->
  <path d="M 804 236 L 840 236 L 840 76 L 124 76 L 124 106" fill="none" stroke="#a96a08" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow-warn)"/>
  <!-- label: Retry -->
  <rect x="444" y="60" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="468" y="71" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Retry</text>

  <!-- ============================================================
       NODES
  ============================================================ -->

  <!-- P: Prompt Format Instruction — Input type -->
  <rect x="40" y="108" width="168" height="64" rx="6" fill="#f8fafb"/>
  <rect x="40" y="108" width="168" height="64" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <!-- type tag -->
  <rect x="48" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="62" y="123" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <!-- node name -->
  <text x="124" y="147" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Prompt</text>
  <text x="124" y="163" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Format Instruction</text>

  <!-- R: Response (format not guaranteed) — warn -->
  <rect x="312" y="108" width="128" height="64" rx="6" fill="#f8fafb"/>
  <rect x="312" y="108" width="128" height="64" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <!-- type tag -->
  <rect x="320" y="114" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="336" y="123" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
  <!-- node name -->
  <text x="376" y="147" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Response</text>
  <text x="376" y="163" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Format Not Guaranteed</text>

  <!-- V: JSON Parseable? — Decision diamond -->
  <!-- Diamond: center (550, 140), half-w=38, half-h=32 -->
  <polygon points="512,140 550,108 588,140 550,172" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="550" y="136" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">JSON</text>
  <text x="550" y="150" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Parse?</text>

  <!-- D: Use Data — ok/success style -->
  <rect x="680" y="112" width="128" height="56" rx="6" fill="#f8fafb"/>
  <rect x="680" y="112" width="128" height="56" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <!-- type tag -->
  <rect x="688" y="118" width="24" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="700" y="127" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK</text>
  <!-- node name -->
  <text x="744" y="148" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Use Data</text>

  <!-- E: Error Handler — stop/error style -->
  <rect x="496" y="208" width="108" height="56" rx="6" fill="#f8fafb"/>
  <rect x="496" y="208" width="108" height="56" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <!-- type tag -->
  <rect x="504" y="214" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="520" y="223" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERROR</text>
  <!-- node name -->
  <text x="550" y="244" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Error Handler</text>

  <!-- M: Manual Retry — warn style -->
  <rect x="660" y="208" width="144" height="56" rx="6" fill="#f8fafb"/>
  <rect x="660" y="208" width="144" height="56" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <!-- type tag -->
  <rect x="668" y="214" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="684" y="223" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
  <!-- node name -->
  <text x="732" y="244" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Manual Retry</text>

  <!-- ============================================================
       LEGEND
  ============================================================ -->
  <line x1="40" y1="302" x2="920" y2="302" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="318" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- legend: INPUT -->
  <rect x="112" y="308" width="36" height="16" rx="4" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="130" y="320" fill="#3a548f" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Input</text>

  <!-- legend: OUTPUT/WARN -->
  <rect x="168" y="308" width="52" height="16" rx="4" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <text x="194" y="320" fill="#a96a08" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Uncertain</text>

  <!-- legend: DECISION -->
  <polygon points="246,316 260,308 274,316 260,324" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="296" y="320" fill="#0d5763" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="start">Branch Condition</text>

  <!-- legend: OK -->
  <rect x="372" y="308" width="36" height="16" rx="4" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="390" y="320" fill="#286d50" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Success</text>

  <!-- legend: ERROR -->
  <rect x="428" y="308" width="36" height="16" rx="4" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <text x="446" y="320" fill="#94382b" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Error</text>

  <!-- legend: RETRY dashed -->
  <line x1="492" y1="316" x2="528" y2="316" stroke="#a96a08" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#2026-09-18-784fb3bd-01-llm-arrow-warn)"/>
  <text x="540" y="320" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="start">Retry Loop</text>

</svg>
</div>
</body>
</html>
