<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-19-acc35f49-05-redis-persistence-title 2026-09-19-acc35f49-05-redis-persistence-desc">
  <title id="2026-09-19-acc35f49-05-redis-persistence-title">Redis Persistence Strategy Selection Flowchart</title>
  <desc id="2026-09-19-acc35f49-05-redis-persistence-desc">A decision flowchart for choosing one of four strategies—No Persistence, RDB only, AOF everysec+RDB hybrid, or AOF always—based on whether data can be regenerated and the acceptable data loss window.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-19-acc35f49-05-rp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-19-acc35f49-05-rp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ───────────────────────────────────────────────
       CONNECTORS (drawn before boxes)
  ─────────────────────────────────────────────── -->

  <!-- N → Q1 (straight horizontal) -->
  <line x1="224" y1="236" x2="288" y2="236" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-19-acc35f49-05-rp-arrow-accent)"/>

  <!-- Q1 →|Yes| A : down then left -->
  <!-- Q1 bottom (364,260) → down to y=340 → left to A right edge (224,340) -->
  <path d="M364,280 L364,340 Q364,348 356,348 L224,348" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-05-rp-arrow)"/>
  <!-- "Yes" label -->
  <rect x="346" y="292" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="358" y="302" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Yes</text>

  <!-- Q1 →|No| Q2 : straight right -->
  <line x1="440" y1="236" x2="508" y2="236" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-05-rp-arrow)"/>
  <!-- "No" label -->
  <rect x="447" y="222" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="471" y="232" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No</text>

  <!-- Q2 →|Minutes OK| B : up-right path -->
  <!-- Q2 top (584,212) → up to y=124 → right to B left (680,124) -->
  <path d="M584,188 L584,124 Q584,116 592,116 L718,116" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-05-rp-arrow)"/>
  <!-- label -->
  <rect x="551" y="148" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="581" y="158" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Minutes OK</text>

  <!-- Q2 →|&lt;1s| C : straight right -->
  <line x1="660" y1="236" x2="718" y2="236" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-05-rp-arrow)"/>
  <!-- label -->
  <rect x="663" y="220" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="689" y="230" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">&lt;1 sec</text>

  <!-- Q2 →|0s required| D : down-right path -->
  <!-- Q2 bottom (584,260) → down to y=348 → right to D left (680,348) -->
  <path d="M584,284 L584,348 Q584,356 592,356 L718,356" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-05-rp-arrow)"/>
  <!-- label -->
  <rect x="552" y="300" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="578" y="310" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">0s required</text>

  <!-- ───────────────────────────────────────────────
       NODES
  ─────────────────────────────────────────────── -->

  <!-- N: Data Type Selection (focal / accent) -->
  <!-- cx=160, cy=236, w=128, h=48 -->
  <rect x="96" y="212" width="128" height="48" rx="6" fill="#f8fafb"/>
  <rect x="96" y="212" width="128" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="104" y="218" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="120" y="227" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
  <text x="160" y="242" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Select Data Type</text>

  <!-- Q1: Regenerable? (decision diamond, accent) -->
  <!-- cx=364, cy=236, half-w=76, half-h=44 -->
  <polygon points="364,192 440,236 364,280 288,236" fill="#f8fafb"/>
  <polygon points="364,192 440,236 364,280 288,236" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="364" y="231" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Regenera-</text>
  <text x="364" y="246" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">ble?</text>

  <!-- A: No Persistence or RDB only (muted) -->
  <!-- cx=160, cy=348, w=128, h=56 -->
  <rect x="96" y="320" width="128" height="56" rx="6" fill="#f8fafb"/>
  <rect x="96" y="320" width="128" height="56" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.20)" stroke-width="0.8"/>
  <rect x="104" y="326" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.20)" stroke-width="0.8"/>
  <text x="120" y="335" fill="rgba(18,33,39,0.4)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
  <text x="160" y="349" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">No Persistence</text>
  <text x="160" y="364" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">or RDB only</text>

  <!-- Q2: Acceptable Loss Window (decision diamond) -->
  <!-- cx=584, cy=236, half-w=76, half-h=48 -->
  <polygon points="584,188 660,236 584,284 508,236" fill="#f8fafb"/>
  <polygon points="584,188 660,236 584,284 508,236" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="584" y="228" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Loss</text>
  <text x="584" y="243" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Tolerance</text>

  <!-- B: RDB only (backend / warn-ish: white fill ink stroke) -->
  <!-- x=680, cy=124, w=184, h=56 -->
  <rect x="720" y="96" width="184" height="56" rx="6" fill="#f8fafb"/>
  <rect x="720" y="96" width="184" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="728" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="746" y="111" fill="rgba(18,33,39,0.7)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RDB</text>
  <text x="812" y="124" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">RDB Only</text>
  <text x="812" y="139" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">save 60 1000</text>

  <!-- C: AOF everysec + RDB hybrid (focal 2nd accent) -->
  <!-- x=680, cy=236, w=184, h=56 -->
  <rect x="720" y="208" width="184" height="56" rx="6" fill="#f8fafb"/>
  <rect x="720" y="208" width="184" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="728" y="214" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="744" y="223" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AOF</text>
  <text x="812" y="234" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">AOF everysec</text>
  <text x="812" y="249" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">+ RDB hybrid</text>

  <!-- D: AOF always (backend) -->
  <!-- x=680, cy=348, w=184, h=56 -->
  <rect x="720" y="320" width="184" height="56" rx="6" fill="#f8fafb"/>
  <rect x="720" y="320" width="184" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="728" y="326" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="746" y="335" fill="rgba(18,33,39,0.7)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AOF</text>
  <text x="812" y="348" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">AOF always</text>
  <text x="812" y="363" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">perf. cost accepted</text>

  <!-- ───────────────────────────────────────────────
       LEGEND
  ─────────────────────────────────────────────── -->
  <line x1="32" y1="528" x2="928" y2="528" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Legend: Start -->
  <rect x="32" y="540" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="50" y="550" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Start / Recommended</text>

  <!-- Legend: Decision -->
  <polygon points="176,552 188,546 200,552 188,558" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="208" y="550" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Decision</text>

  <!-- Legend: Strategy Option -->
  <rect x="312" y="540" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="330" y="550" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Strategy Option</text>

  <!-- Legend: No persistence needed -->
  <rect x="440" y="540" width="12" height="12" rx="2" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.20)" stroke-width="0.8"/>
  <text x="458" y="550" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">No persistence needed (regenerable)</text>

</svg>
