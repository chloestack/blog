<!DOCTYPE html>

<title>Graphify Pipeline</title>

<style>

</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-19-6b5f07e6-02-graphify-title 2026-10-19-6b5f07e6-02-graphify-desc">
  <title id="2026-10-19-6b5f07e6-02-graphify-title">Graphify Codebase Knowledge Graph Transformation Pipeline</title>
  <desc id="2026-10-19-6b5f07e6-02-graphify-desc">A two-branch pipeline where source files and docs/PDFs/images/videos pass through tree-sitter parsing and an assistant model respectively, extract nodes and edges, then merge into graph.json.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-19-6b5f07e6-02-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 -->
    <marker id="2026-10-19-6b5f07e6-02-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>

  <rect width="960" height="600" fill="#f8fafb"/>

       화살표 (박스보다 먼저 그림)
  ───────────────────────────────────────── -->

  <!-- SRC → TS  (수직 직선) -->
  <line x1="212" y1="124" x2="212" y2="192" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>

  <!-- TS 중심: (212, 228), N 중심: (120, 332) -->
  <!-- TS bottom: (212,264) → 수직으로 (212, 304) → 수평으로 (120, 304) → 수직으로 N top: (120,308) -->
  <path d="M212,264 L212,304 Q212,312 204,312 L128,312 Q120,312 120,320 L120,308" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>

  <!-- TS → E  (오른쪽 아래 → 직각 엘보) -->
  <!-- TS bottom: (212,264) → (212,288) → (304,288) → E top: (304,308) -->
  <path d="M212,264 L212,288 Q212,296 220,296 L296,296 Q304,296 304,304 L304,308" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>

  <!-- N → GR  (직각 엘보: 오른쪽으로 나가서 GR로) -->
  <!-- N right: (168, 352), GR: (560, 352 중심) GR top: (560,308) -->
  <!-- N right (168,352) → (400,352) → (400, 332) → GR left -->
  <path d="M168,352 L392,352 Q400,352 400,344 L400,332 Q400,324 408,324 L512,324" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>

  <!-- E → GR  (직각 엘보) -->
  <!-- E right: (352, 352), → (400,352) 이미 있는 경로와 겹치지 않도록 y 오프셋 -->
  <!-- E right (352,364) → (440,364) → (440,340) → GR left -->
  <path d="M352,364 L440,364 Q448,364 448,356 L448,340 Q448,332 456,332 L512,332" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>

  <!-- DOC → LLM (수직 직선) -->
  <line x1="748" y1="124" x2="748" y2="192" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>

  <!-- ─────────────────────────────────────────
       노드 박스
  ───────────────────────────────────────── -->

  <!-- SRC — 소스 파일 (input 타입) -->

  <text x="152" y="77" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="212" y="101" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Source Files</text>
  <text x="212" y="117" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">40+ languages</text>

  <!-- TS — tree-sitter (focal) -->
  <rect x="128" y="192" width="168" height="72" rx="6" fill="#f8fafb"/>
  <rect x="128" y="192" width="168" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="136" y="200" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>

  <text x="212" y="237" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">tree-sitter</text>
  <text x="212" y="253" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">AST Parsing</text>

  <!-- N — 노드 추출 (backend) -->
  <rect x="60" y="308" width="120" height="72" rx="6" fill="#f8fafb"/>
  <rect x="60" y="308" width="120" height="72" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="68" y="316" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>

  <text x="120" y="353" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Node Extract</text>
  <text x="120" y="369" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">func·class·module</text>

  <!-- E — 엣지 추출 (backend) -->
  <rect x="244" y="308" width="120" height="72" rx="6" fill="#f8fafb"/>
  <rect x="244" y="308" width="120" height="72" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="252" y="316" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>

  <text x="304" y="353" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Edge Extract</text>
  <text x="304" y="369" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">calls·imports·inherits</text>

  <!-- DOC — 문서·PDF·이미지·영상 (input 타입) -->
  <rect x="664" y="60" width="168" height="64" rx="6" fill="#f8fafb"/>
  <rect x="664" y="60" width="168" height="64" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="672" y="68" width="32" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="688" y="77" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="748" y="100" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Docs · PDF · Images</text>
  <text x="748" y="116" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Video</text>

  <!-- LLM — 어시스턴트 모델 (backend) -->
  <rect x="664" y="192" width="168" height="72" rx="6" fill="#f8fafb"/>
  <rect x="664" y="192" width="168" height="72" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="672" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="686" y="209" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="748" y="237" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Assistant Model</text>
  <text x="748" y="253" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Semantic Extract</text>

  <!-- GR — graph.json (store, focal) -->
  <rect x="512" y="308" width="144" height="72" rx="6" fill="#f8fafb"/>
  <rect x="512" y="308" width="144" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="520" y="316" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="538" y="325" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="584" y="353" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Graph Store</text>
  <text x="584" y="369" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">graph.json</text>

  <!-- ─────────────────────────────────────────
       레전드 구분선 + 항목
  ───────────────────────────────────────── -->
  <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <text x="40" y="544" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal 범례 -->
  <rect x="120" y="533" width="16" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="140" y="544" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Core Processing</text>

  <!-- backend 범례 -->
  <rect x="288" y="533" width="16" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="308" y="544" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Transform·Extract</text>

  <!-- input 범례 -->
  <rect x="456" y="533" width="16" height="12" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="476" y="544" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Input Source</text>

  <!-- 화살표 범례 -->
  <line x1="600" y1="539" x2="624" y2="539" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-02-arrow)"/>
  <text x="632" y="544" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Data Flow</text>

  <line x1="756" y1="539" x2="780" y2="539" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-19-6b5f07e6-02-arrow-accent)"/>
  <text x="788" y="544" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Semantic Merge</text>

</svg>
