<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  .diagram-wrap { display: block; width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg
  viewBox="0 0 960 600"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="2026-09-19-acc35f49-06-redis-restore-title 2026-09-19-acc35f49-06-redis-restore-desc"
>
  <title id="2026-09-19-acc35f49-06-redis-restore-title">Redis Restart Restore Flow</title>
  <desc id="2026-09-19-acc35f49-06-redis-restore-desc">When Redis restarts, it selects AOF restore or RDB snapshot restore depending on whether an AOF file exists, completes memory restore, then resumes service.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-19-acc35f49-06-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-19-acc35f49-06-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-19-acc35f49-06-arr-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#122127"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS — drawn before boxes
  ============================================================ -->

  <!-- Redis restart → decision diamond (straight vertical) -->
  <line x1="480" y1="136" x2="480" y2="196" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-06-arr-muted)"/>

  <!-- decision diamond → AOF restore (YES, right elbow) -->
  <!-- from diamond right point (620,252) → right → down to AOF box -->
  <path d="M620,252 H700 V288" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-06-arr-accent)"/>

  <!-- decision diamond → RDB restore (NO, left elbow) -->
  <!-- from diamond left point (340,252) → left → down to RDB box -->
  <path d="M340,252 H260 V288" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-06-arr-muted)"/>

  <!-- AOF restore → memory restore complete (elbow: right column → center) -->
  <!-- AOF box bottom: (700, 372) → down to y=428 → left to x=480 → down to memory box top -->
  <path d="M700,372 V428 H480 V444" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-06-arr-muted)"/>

  <!-- RDB restore → memory restore complete (elbow: left column → center) -->
  <!-- RDB box bottom: (260, 372) → down to y=428 → right to x=480 → already at 428 going to 444 — shared segment handled by offset -->
  <!-- RDB exits at (260,372) → y=432 → x=480 → y=444 -->
  <path d="M260,372 V432 H480" fill="none" stroke="#3f545c" stroke-width="1"/>
  <!-- The path above meets at (480,432); we draw a short segment down to the box top separately to avoid shared final segment -->
  <!-- Actually combine: RDB joins AOF at a merge point above memory box -->
  <!-- merge dot at (480, 432) -->

  <!-- merge dot → memory restore complete -->
  <line x1="480" y1="432" x2="480" y2="444" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-06-arr-muted)"/>

  <!-- memory restore complete → service resume -->
  <line x1="480" y1="500" x2="480" y2="524" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-acc35f49-06-arr-muted)"/>

  <!-- ============================================================
       NODES
  ============================================================ -->

  <!-- Node 1: Redis Restart (input oval) — cx=480, cy=108 -->
  <!-- Opaque mask -->
  <ellipse cx="480" cy="108" rx="100" ry="28" fill="#f8fafb"/>
  <!-- Styled oval -->
  <ellipse cx="480" cy="108" rx="100" ry="28" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <!-- Type tag -->
  <rect x="438" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="452" y="97" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <!-- Label -->
  <text x="480" y="113" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Redis Restart</text>

  <!-- Node 2: decision diamond — cx=480, cy=252 -->
  <!-- Diamond points: top(480,196), right(620,252), bottom(480,308), left(340,252) -->
  <polygon points="480,196 620,252 480,308 340,252" fill="#f8fafb"/>
  <polygon points="480,196 620,252 480,308 340,252" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- Label -->
  <text x="480" y="246" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">AOF file</text>
  <text x="480" y="264" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">exists?</text>

  <!-- YES label on right branch -->
  <rect x="628" y="218" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="640" y="229" fill="#0d5763" font-size="10" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Yes</text>

  <!-- NO label on left branch -->
  <rect x="300" y="218" width="32" height="14" rx="2" fill="#f8fafb"/>
  <text x="316" y="229" fill="#3f545c" font-size="10" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">No</text>

  <!-- Node 3: AOF restore (focal) — cx=700, cy=328, w=192, h=88 -->
  <rect x="604" y="288" width="192" height="84" rx="6" fill="#f8fafb"/>
  <rect x="604" y="288" width="192" height="84" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- Type tag -->
  <rect x="612" y="296" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="630" y="305" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AOF</text>
  <!-- Label -->
  <text x="700" y="334" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Restore via AOF</text>
  <text x="700" y="356" fill="#3f545c" font-size="11" font-weight="400" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">More recent data</text>

  <!-- Node 4: RDB restore — cx=260, cy=328, w=192, h=88 -->
  <rect x="164" y="288" width="192" height="84" rx="6" fill="#f8fafb"/>
  <rect x="164" y="288" width="192" height="84" rx="6" fill="rgba(45,49,66,0.04)" stroke="#6c8188" stroke-width="1"/>
  <!-- Type tag -->
  <rect x="172" y="296" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="190" y="305" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RDB</text>
  <!-- Label -->
  <text x="260" y="334" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Restore via RDB</text>
  <text x="260" y="356" fill="#3f545c" font-size="11" font-weight="400" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Last snapshot</text>

  <!-- Merge dot -->
  <circle cx="480" cy="432" r="4" fill="#3f545c"/>

  <!-- Node 5: memory restore complete — cx=480, cy=472, w=240, h=56 -->
  <rect x="360" y="444" width="240" height="56" rx="6" fill="#f8fafb"/>
  <rect x="360" y="444" width="240" height="56" rx="6" fill="rgba(45,49,66,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="480" y="476" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Memory Restore Done</text>

  <!-- Node 6: service resume (terminal oval) — cx=480, cy=552 -->
  <ellipse cx="480" cy="552" rx="112" ry="28" fill="#f8fafb"/>
  <ellipse cx="480" cy="552" rx="112" ry="28" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="557" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Service Resumed</text>

  <!-- ============================================================
       LEGEND
  ============================================================ -->
  <line x1="32" y1="590" x2="928" y2="590" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <!-- AOF legend -->
  <rect x="32" y="596" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="50" y="606" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">AOF restore path (priority)</text>
  <!-- RDB legend -->
  <rect x="220" y="596" width="12" height="12" rx="2" fill="rgba(45,49,66,0.04)" stroke="#6c8188" stroke-width="1"/>
  <text x="238" y="606" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">RDB restore path (fallback)</text>
  <!-- merge dot legend -->
  <circle cx="408" cy="602" r="4" fill="#3f545c"/>
  <text x="418" y="606" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">Branch merge</text>

</svg>
</div>
</body>
</html>
