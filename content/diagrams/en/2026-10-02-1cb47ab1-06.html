<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="2026-10-02-1cb47ab1-06-rag-rerank-title 2026-10-02-1cb47ab1-06-rag-rerank-desc">
  <title id="2026-10-02-1cb47ab1-06-rag-rerank-title">Multimodal RAG — Reranking &amp; Context Assembly Pipeline</title>
  <desc id="2026-10-02-1cb47ab1-06-rag-rerank-desc">Shows the flow where top-K candidates pass through Cross-Encoder reranking, are assembled into context, branch into text chunks and image paths, and finally an LLM generates a response.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-10-02-1cb47ab1-06-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-02-1cb47ab1-06-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-02-1cb47ab1-06-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="520" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       CONNECTORS (drawn before nodes)
  ───────────────────────────────────────── -->

  <!-- Top-K Candidates → Cross-Encoder (straight horizontal) -->
  <line x1="164" y1="180" x2="220" y2="180" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>

  <!-- Cross-Encoder → Context Assembly (straight horizontal) -->
  <line x1="356" y1="180" x2="412" y2="180" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-02-1cb47ab1-06-arr-accent)"/>

  <!-- Context Assembly → Text Chunk (elbow down-left to right) -->
  <!-- exit bottom of Context, go down then right to Text Chunk -->
  <path d="M 508 220 L 508 268 L 572 268 L 572 300" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>

  <!-- Context Assembly → Image Inclusion Gate (elbow up-right) -->
  <!-- exit top of Context, go up then right -->
  <path d="M 508 140 L 508 92 L 572 92 L 572 120" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>

  <!-- Image Inclusion Gate → Image bytes direct (elbow right-up) -->
  <path d="M 668 140 L 668 92 L 732 92" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr-muted)"/>

  <!-- Image Inclusion Gate → Image summary text (elbow right-down) -->
  <path d="M 668 160 L 668 208 L 732 208" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr-muted)"/>

  <!-- Text Chunk → LLM (elbow right) -->
  <path d="M 668 328 L 700 328 L 700 268 L 732 268" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>

  <!-- Image bytes → LLM (elbow right then down) -->
  <path d="M 840 120 L 876 120 L 876 248" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>

  <!-- Image summary → LLM (straight right) -->
  <line x1="840" y1="228" x2="876" y2="228" stroke="#3f545c" stroke-width="1"/>
  <!-- connector from 876,228 to 876,248 already handled above shared path — draw separately -->
  <!-- Actually draw iamge-summary → LLM as its own path to LLM left edge -->
  <!-- LLM left edge is at x=856, center y=268 -->
  <!-- Re-route: Image summary right(840,228) → (856,228) bend down → (856,248) → LLM left (856,268) -->

  <!-- Arrow label masks & labels for the two IMG branches -->
  <!-- "Multimodal LLM" label on the upper branch (IMG → D1) -->
  <rect x="664" y="84" width="68" height="14" rx="2" fill="#f8fafb"/>
  <text x="698" y="94" fill="#6c8188" font-size="8" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Multimodal LLM</text>

  <!-- "Text LLM" label on the lower branch (IMG → D2) -->
  <rect x="668" y="200" width="56" height="14" rx="2" fill="#f8fafb"/>
  <text x="696" y="210" fill="#6c8188" font-size="8" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Text LLM</text>

  <!-- ─────────────────────────────────────────
       NODES
  ───────────────────────────────────────── -->

  <!-- 1. Top-K Candidates (input type, x=28 y=152 w=136 h=56) -->
  <rect x="28" y="152" width="136" height="56" rx="6" fill="#f8fafb"/>
  <rect x="28" y="152" width="136" height="56" rx="6" fill="rgba(58,84,143,0.08)" stroke="rgba(58,84,143,0.55)" stroke-width="1"/>
  <rect x="36" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="50" y="167" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="96" y="183" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Top-K Candidates</text>
  <text x="96" y="199" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">top-K candidates</text>

  <!-- 2. Cross-Encoder Reranking (focal, x=220 y=144 w=136 h=72) -->
  <rect x="220" y="144" width="136" height="72" rx="6" fill="#f8fafb"/>
  <rect x="220" y="144" width="136" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="228" y="150" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="246" y="159" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RERANK</text>
  <text x="288" y="176" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Cross-Encoder</text>
  <text x="288" y="192" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Reranking</text>
  <text x="288" y="208" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">bi-encoder → cross</text>

  <!-- 3. Context Assembly (focal, x=412 y=144 w=136 h=72) -->
  <rect x="412" y="144" width="136" height="72" rx="6" fill="#f8fafb"/>
  <rect x="412" y="144" width="136" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="420" y="150" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="438" y="159" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MERGE</text>
  <text x="480" y="176" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Context</text>
  <text x="480" y="192" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Assembly</text>
  <text x="480" y="208" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">context assembly</text>

  <!-- 4. Text Chunk (backend, x=572 y=300 w=96 h=56) -->
  <rect x="572" y="300" width="96" height="56" rx="6" fill="#f8fafb"/>
  <rect x="572" y="300" width="96" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="580" y="306" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="596" y="315" fill="rgba(18,33,39,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEXT</text>
  <text x="620" y="335" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Text Chunk</text>
  <text x="620" y="349" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">text chunk</text>

  <!-- 5. Image Inclusion Gate (backend, x=572 y=120 w=96 h=56) -->
  <rect x="572" y="120" width="96" height="56" rx="6" fill="#f8fafb"/>
  <rect x="572" y="120" width="96" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="580" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="594" y="135" fill="rgba(18,33,39,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
  <text x="620" y="150" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Image Incl.</text>
  <text x="620" y="164" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Gate</text>

  <!-- 6. Image bytes direct (store, x=732 y=92 w=108 h=56) -->
  <rect x="732" y="92" width="108" height="56" rx="6" fill="#f8fafb"/>
  <rect x="732" y="92" width="108" height="56" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="740" y="98" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="756" y="107" fill="rgba(63,84,92,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BYTES</text>
  <text x="786" y="124" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Image bytes</text>
  <text x="786" y="138" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">direct pass</text>

  <!-- 7. Image summary text (store, x=732 y=208 w=108 h=56) -->
  <rect x="732" y="208" width="108" height="56" rx="6" fill="#f8fafb"/>
  <rect x="732" y="208" width="108" height="56" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="740" y="214" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="756" y="223" fill="rgba(63,84,92,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUMMARY</text>
  <text x="786" y="240" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Image summary</text>
  <text x="786" y="254" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">text pass</text>

  <!-- 8. LLM Response Generation (focal output, x=856 y=232 w=76 h=72) -->
  <rect x="856" y="232" width="76" height="72" rx="6" fill="#f8fafb"/>
  <rect x="856" y="232" width="76" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="864" y="238" width="24" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="876" y="247" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="894" y="264" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">LLM Response</text>
  <text x="894" y="280" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Generation</text>
  <text x="894" y="296" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">generation</text>

  <!-- ─────────────────────────────────────────
       FIX: additional connector segments not yet closed
  ───────────────────────────────────────── -->
  <!-- Image bytes (840,120) → LLM left (856,268): go right then down -->
  <path d="M 840 120 L 876 120 L 876 232" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>
  <!-- Image summary (840,236) → LLM left (856,268) -->
  <path d="M 840 236 L 856 236" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>
  <!-- Text chunk right edge (668,328) → LLM bottom-left area via bend -->
  <path d="M 668 328 L 720 328 L 720 296 L 856 296" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-06-arr)"/>

  <!-- ─────────────────────────────────────────
       LEGEND STRIP
  ───────────────────────────────────────── -->
  <line x1="28" y1="432" x2="932" y2="432" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="28" y="448" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="96" y="438" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="114" y="449" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Key Step</text>

  <!-- backend -->
  <rect x="200" y="438" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="218" y="449" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Process Step</text>

  <!-- store -->
  <rect x="304" y="438" width="12" height="12" rx="2" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="322" y="449" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Pass-through</text>

  <!-- input -->
  <rect x="408" y="438" width="12" height="12" rx="2" fill="rgba(58,84,143,0.08)" stroke="rgba(58,84,143,0.55)" stroke-width="1"/>
  <text x="426" y="449" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Input</text>
</svg>
</body>
