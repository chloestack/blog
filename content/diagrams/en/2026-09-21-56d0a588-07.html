<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f8fafb;display:flex;justify-content:center;padding:0}
svg{display:block;width:100%;height:auto;max-width:960px}
</style>
</head>
<body>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-21-56d0a588-07-cl-migrate-title 2026-09-21-56d0a588-07-cl-migrate-desc">
  <title id="2026-09-21-56d0a588-07-cl-migrate-title">ClassLoader Migration Procedure</title>
  <desc id="2026-09-21-56d0a588-07-cl-migrate-desc">A cyclic flow starting from a single ClassLoader structure, repeatedly identifying independent components, applying and verifying an isolated ClassLoader, then completing migration.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-09-21-56d0a588-07-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-21-56d0a588-07-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-21-56d0a588-07-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS  (drawn before boxes)
       Layout (LR):
         START  x=60  cx=160  → Q1 diamond cx=316
         Q1 → ISO  cx=472
         ISO → TEST cx=628
         TEST → Q2 diamond cx=784
         Q2 → DONE cx=900 (아니오)
         Q2 back-loop up → Q1 (예)  arc over top
       ============================================================ -->

  <!-- START → Q1 (horizontal) -->
  <line x1="220" y1="200" x2="276" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-07-arr)"/>

  <!-- Q1 → ISO (horizontal, from right vertex of diamond) -->
  <line x1="356" y1="200" x2="412" y2="200" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-56d0a588-07-arr-accent)"/>

  <!-- ISO → TEST (horizontal) -->
  <line x1="532" y1="200" x2="568" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-07-arr)"/>

  <!-- TEST → Q2 (horizontal) -->
  <line x1="688" y1="200" x2="744" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-07-arr)"/>

  <!-- Q2 → DONE (horizontal, 아니오) -->
  <line x1="824" y1="200" x2="848" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-07-arr)"/>

  <!-- Q2 → back loop (예): down from Q2 bottom, left across bottom, up to Q1 bottom -->
  <!-- Q2 bottom vertex: (784, 240) → go down to y=296 → left to x=316 → up to Q1 bottom (316,240) -->
  <path d="M784,240 L784,296 L316,296 L316,240"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4"
        marker-end="url(#2026-09-21-56d0a588-07-arr)"/>

  <!-- loop label "Yes" -->
  <rect x="536" y="276" width="28" height="16" rx="2" fill="#f8fafb"/>
  <text x="550" y="288" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle" font-weight="500">Yes</text>

  <!-- Q2 → DONE label "No" -->
  <rect x="814" y="166" width="44" height="16" rx="2" fill="#f8fafb"/>
  <text x="836" y="178" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle" font-weight="500">No</text>

  <!-- ============================================================
       NODES
       ============================================================ -->

  <!-- START: 단일 CL / 현재 구조  — input type, oval (rx=20) -->
  <!-- cx=140, cy=200, w=160, h=52 -->
  <rect x="60" y="174" width="160" height="52" rx="20" fill="#f8fafb"/>
  <rect x="60" y="174" width="160" height="52" rx="20" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <!-- tag -->
  <rect x="68" y="180" width="32" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="84" y="189" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
  <!-- label -->
  <text x="140" y="199" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Single CL</text>
  <text x="140" y="215" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Current Structure</text>

  <!-- Q1: 독립 컴포넌트 식별 — decision diamond, accent (focal) -->
  <!-- cx=316, cy=200, half-w=40, half-h=40 -->
  <polygon points="316,160 356,200 316,240 276,200" fill="#f8fafb"/>
  <polygon points="316,160 356,200 316,240 276,200" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="316" y="196" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Identify</text>
  <text x="316" y="210" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Component</text>

  <!-- ISO: 격리 ClassLoader 적용 — backend box, accent (focal) -->
  <!-- cx=472, cy=200, w=120, h=56 -->
  <rect x="412" y="172" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="412" y="172" width="120" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="420" y="178" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="438" y="187" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">APPLY</text>
  <!-- label -->
  <text x="472" y="202" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Isolated ClassLoader</text>
  <text x="472" y="218" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Apply</text>

  <!-- TEST: 인터페이스 계약 검증 — backend box -->
  <!-- cx=628, cy=200, w=120, h=56 -->
  <rect x="568" y="172" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="568" y="172" width="120" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- tag -->
  <rect x="576" y="178" width="36" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.30)" stroke-width="0.8"/>
  <text x="594" y="187" fill="rgba(18,33,39,0.7)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
  <!-- label -->
  <text x="628" y="202" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Interface Contract</text>
  <text x="628" y="218" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Verify</text>

  <!-- Q2: 더 격리할 컴포넌트 있나 — decision diamond, muted -->
  <!-- cx=784, cy=200, half-w=40, half-h=40 -->
  <polygon points="784,160 824,200 784,240 744,200" fill="#f8fafb"/>
  <polygon points="784,160 824,200 784,240 744,200" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <text x="784" y="196" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">More to</text>
  <text x="784" y="210" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Isolate?</text>

  <!-- DONE: 마이그레이션 완료 — store/state type oval -->
  <!-- cx=900, cy=200, w=104, h=52 -->
  <rect x="848" y="174" width="104" height="52" rx="20" fill="#f8fafb"/>
  <rect x="848" y="174" width="104" height="52" rx="20" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <!-- tag -->
  <rect x="856" y="180" width="32" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="872" y="189" fill="rgba(63,84,92,0.75)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
  <!-- label -->
  <text x="900" y="201" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Migration</text>
  <text x="900" y="217" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">Complete</text>

  <!-- ============================================================
       LEGEND strip
       ============================================================ -->
  <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="40" y="362" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- legend: 시작 상태 (타원) -->
  <rect x="108" y="352" width="36" height="20" rx="10" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <text x="126" y="367" fill="#122127" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle">Start</text>

  <!-- legend: 판단 (다이아몬드) -->
  <polygon points="194,362 206,372 194,382 182,372" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <text x="220" y="374" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono',monospace">Decision</text>

  <!-- legend: 격리 적용 (accent box) -->
  <rect x="272" y="354" width="64" height="20" rx="4" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="304" y="369" fill="#122127" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle">Isolate</text>

  <!-- legend: 일반 단계 (ink box) -->
  <rect x="360" y="354" width="64" height="20" rx="4" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="392" y="369" fill="#122127" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle">General Step</text>

  <!-- legend: 반복 경로 (dashed) -->
  <line x1="448" y1="364" x2="488" y2="364" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-21-56d0a588-07-arr)"/>
  <text x="500" y="368" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono',monospace">Loop Path</text>

</svg>
</body>
</html>
