<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framework Selection Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-19-bd9f231a-09-fw-sel-title 2026-10-19-bd9f231a-09-fw-sel-desc">
  <title id="2026-10-19-bd9f231a-09-fw-sel-title">Multi-Agent Framework Selection Flowchart</title>
  <desc id="2026-10-19-bd9f231a-09-fw-sel-desc">A decision flowchart that evaluates whether dynamic routing is needed and whether OpenAI models are used, then selects Agents SDK, LangGraph, or another framework.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-19-bd9f231a-09-fw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-09-fw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- START → Q1 (horizontal) -->
  <line x1="184" y1="200" x2="244" y2="200" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow)"/>

  <!-- Q1 → Q2 (예, horizontal right) -->
  <path d="M 348 200 L 452 200" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow-accent)"/>
  <!-- label: 예 -->
  <rect x="382" y="183" width="28" height="14" rx="2" fill="#f8fafb"/>
  <text x="396" y="194" fill="#0d5763" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Yes</text>

  <!-- Q1 → LG (아니오, down then right) -->
  <path d="M 296 240 L 296 308 L 452 308" fill="none" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow)"/>
  <!-- label: 아니오 -->
  <rect x="262" y="256" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="286" y="267" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">No</text>

  <!-- Q2 → OA (예, horizontal right) -->
  <path d="M 556 200 L 664 200" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow-accent)"/>
  <!-- label: 예 -->
  <rect x="592" y="183" width="28" height="14" rx="2" fill="#f8fafb"/>
  <text x="606" y="194" fill="#0d5763" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">Yes</text>

  <!-- Q2 → ALT (아니오, down then right) -->
  <path d="M 504 240 L 504 308 L 664 308" fill="none" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow)"/>
  <!-- label: 아니오 -->
  <rect x="470" y="256" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="494" y="267" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">No</text>

  <!-- ===================== NODES ===================== -->

  <!-- START: 적용 판단 (oval) -->
  <rect x="60" y="176" width="124" height="48" rx="6" fill="#f8fafb"/>
  <rect x="60" y="176" width="124" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="122" y="196" fill="#122127" font-size="8" font-family="'IBM Plex Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.12em">START</text>
  <text x="122" y="212" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Evaluate</text>

  <!-- Q1: 동적 라우팅 필요한가 (diamond) -->
  <rect x="240" y="148" width="112" height="104" rx="6" fill="#f8fafb"/>
  <polygon points="296,152 352,200 296,248 240,200" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="296" y="196" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Dynamic Routing</text>
  <text x="296" y="212" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Needed?</text>

  <!-- Q2: OpenAI 모델 사용하나 (diamond, focal) -->
  <rect x="448" y="148" width="112" height="104" rx="6" fill="#f8fafb"/>
  <polygon points="504,152 560,200 504,248 448,200" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="504" y="192" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">OpenAI Model</text>
  <text x="504" y="208" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Used?</text>

  <!-- OA: Agents SDK (focal, accent) -->
  <rect x="664" y="172" width="136" height="56" rx="6" fill="#f8fafb"/>
  <rect x="664" y="172" width="136" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- type tag -->
  <rect x="672" y="178" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="690" y="187" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.10em">SDK</text>
  <text x="732" y="204" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Agents SDK</text>
  <text x="732" y="220" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">openai-agents</text>

  <!-- LG: LangGraph -->
  <rect x="452" y="284" width="104" height="48" rx="6" fill="#f8fafb"/>
  <rect x="452" y="284" width="104" height="48" rx="6" fill="rgba(63,84,92,0.06)" stroke="#6c8188" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="504" y="312" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">LangGraph</text>

  <!-- ALT: 다른 프레임워크 -->
  <rect x="664" y="284" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="664" y="284" width="136" height="48" rx="6" fill="rgba(63,84,92,0.04)" stroke="rgba(63,84,92,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="732" y="312" fill="#122127" font-size="14" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">Other Framework</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="367" x2="920" y2="367" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend: 선택됨 (accent) -->
  <rect x="40" y="376" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="56" y="385" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Recommended</text>

  <!-- legend: 대안 (dashed) -->
  <rect x="148" y="376" width="10" height="10" rx="2" fill="rgba(63,84,92,0.04)" stroke="rgba(63,84,92,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="164" y="385" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Alt Path</text>

  <!-- legend: 예 경로 (solid) -->
  <line x1="244" y1="381" x2="264" y2="381" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow-accent)"/>
  <text x="272" y="385" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Yes (main path)</text>

  <!-- legend: 아니오 경로 (dashed) -->
  <line x1="368" y1="381" x2="388" y2="381" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-19-bd9f231a-09-fw-arrow)"/>
  <text x="396" y="385" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">No (alt path)</text>

</svg>
</div>
</body>
</html>
