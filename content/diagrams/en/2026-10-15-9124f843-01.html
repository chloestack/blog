  <title id="2026-10-15-9124f843-01-atk-title">LLM Attack Surface Classification</title>
  <desc id="2026-10-15-9124f843-01-atk-desc">A flowchart showing how three input/output layers of an LLM system form attack surfaces, and how attacks from each layer converge toward three objectives: system prompt extraction, forbidden content generation, and agent behavior manipulation.</desc>

  <!-- A → D (Attack Surface → Output Layer) -->
  <!-- D center: 760,188 -->
  <path d="M480,96 L480,144 L760,144 L760,164"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-15-9124f843-01-atk-arrow)"/>

  <!-- B → E (Input Layer → Attack Objective) -->

  <text x="812" y="494" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Manipulation</text>
