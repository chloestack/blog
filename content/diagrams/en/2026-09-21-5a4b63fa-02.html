<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DefaultErrorHandler Default Retry Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" role="img" aria-labelledby="2026-09-21-5a4b63fa-02-flow-title 2026-09-21-5a4b63fa-02-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="2026-09-21-5a4b63fa-02-flow-title">DefaultErrorHandler Default Retry Flow</title>
  <desc id="2026-09-21-5a4b63fa-02-flow-desc">A flowchart showing the flow from message receipt through processing attempts, offset commit on success, retry branching on failure, and rebalancing risk when retry count is exceeded. Visualizes thread blocking during retries.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-21-5a4b63fa-02-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-21-5a4b63fa-02-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-21-5a4b63fa-02-arr-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
    <marker id="2026-09-21-5a4b63fa-02-arr-err" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <marker id="2026-09-21-5a4b63fa-02-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────
       ARROWS (drawn before nodes)
  ───────────────────────────────────────────── -->

  <!-- MSG → TRY (vertical) -->
  <line x1="480" y1="120" x2="480" y2="190" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr)"/>

  <!-- TRY → CMT (성공, right branch) -->
  <!-- from TRY right edge (556,232) → right → up a bit → CMT left (656,232) -->
  <path d="M556,232 L636,232" fill="none" stroke="#286d50" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr-ok)"/>
  <!-- 성공 label -->
  <rect x="574" y="218" width="36" height="13" rx="2" fill="#f8fafb"/>
  <text x="592" y="228" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR',sans-serif" text-anchor="middle" font-weight="500">Success</text>

  <!-- TRY → Q1 (실패, vertical down) -->
  <line x1="480" y1="273" x2="480" y2="333" stroke="#94382b" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr-err)"/>
  <!-- 실패 label -->
  <rect x="458" y="292" width="36" height="13" rx="2" fill="#f8fafb"/>
  <text x="476" y="302" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR',sans-serif" text-anchor="middle" font-weight="500">Failure</text>

  <!-- Q1 → WAIT (아니오, left branch) -->
  <!-- from Q1 left apex (430,372) → left → WAIT right (344,432) -->
  <path d="M430,372 L344,372 L344,420" fill="none" stroke="#a96a08" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr-warn)"/>
  <!-- 아니오 label -->
  <rect x="360" y="358" width="44" height="13" rx="2" fill="#f8fafb"/>
  <text x="382" y="368" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR',sans-serif" text-anchor="middle" font-weight="500">No</text>

  <!-- Q1 → ERR (예, right branch) -->
  <!-- from Q1 right apex (530,372) → right → ERR left (636,372) -->
  <path d="M530,372 L636,372" fill="none" stroke="#94382b" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr-err)"/>
  <!-- 예 label -->
  <rect x="560" y="358" width="24" height="13" rx="2" fill="#f8fafb"/>
  <text x="572" y="368" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR',sans-serif" text-anchor="middle" font-weight="500">Yes</text>

  <!-- WAIT → TRY (loop back left, going up) -->
  <!-- from WAIT left (264,452) → left → up → TRY left (404,232) -->
  <path d="M264,452 L224,452 L224,232 L404,232" fill="none" stroke="#a96a08" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-21-5a4b63fa-02-arr-warn)"/>
  <!-- 재시도 label on left vertical segment -->
  <rect x="196" y="330" width="40" height="13" rx="2" fill="#f8fafb"/>
  <text x="216" y="340" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR',sans-serif" text-anchor="middle" font-weight="500">Retry</text>

  <!-- ─────────────────────────────────────────────
       NODES
  ───────────────────────────────────────────── -->

  <!-- START oval: 메시지 수신 -->
  <rect x="396" y="72" width="168" height="48" rx="24" fill="#f8fafb"/>
  <rect x="396" y="72" width="168" height="48" rx="24" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="100" fill="#122127" font-size="13" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Message Received</text>

  <!-- TRY rect: 처리 시도 (focal) -->
  <rect x="404" y="192" width="152" height="80" rx="6" fill="#f8fafb"/>
  <rect x="404" y="192" width="152" height="80" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="412" y="200" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="428" y="209" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="480" y="243" fill="#122127" font-size="13" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Process Attempt</text>
  <text x="480" y="260" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" text-anchor="middle">consumer poll loop</text>

  <!-- CMT rect: 오프셋 커밋 -->
  <rect x="636" y="192" width="152" height="80" rx="6" fill="#f8fafb"/>
  <rect x="636" y="192" width="152" height="80" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <!-- tag -->
  <rect x="644" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="658" y="209" fill="rgba(40,109,80,0.8)" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OK</text>
  <text x="712" y="243" fill="#122127" font-size="13" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Offset Commit</text>
  <text x="712" y="260" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" text-anchor="middle">commitSync</text>

  <!-- Q1 diamond: 재시도 횟수 초과? -->
  <!-- center 480,372 half-w=50 half-h=39 -->
  <polygon points="480,333 530,372 480,411 430,372" fill="#f8fafb"/>
  <polygon points="480,333 530,372 480,411 430,372" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="368" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Retry Limit</text>
  <text x="480" y="382" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Exceeded?</text>

  <!-- WAIT rect: 스레드 대기 (warn — focal accent) -->
  <rect x="264" y="420" width="160" height="64" rx="6" fill="#f8fafb"/>
  <rect x="264" y="420" width="160" height="64" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1.2"/>
  <!-- tag -->
  <rect x="272" y="428" width="36" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="290" y="437" fill="rgba(169,106,8,0.8)" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text>
  <text x="344" y="456" fill="#122127" font-size="13" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Thread Wait</text>
  <text x="344" y="471" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" text-anchor="middle">blocking occurs</text>

  <!-- ERR rect: 리밸런싱 위험 -->
  <rect x="636" y="332" width="160" height="80" rx="6" fill="#f8fafb"/>
  <rect x="636" y="332" width="160" height="80" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <!-- tag -->
  <rect x="644" y="340" width="36" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="662" y="349" fill="rgba(148,56,43,0.8)" font-size="8" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RISK</text>
  <text x="716" y="377" fill="#122127" font-size="13" font-family="'IBM Plex Sans KR',sans-serif" font-weight="600" text-anchor="middle">Rebalance Risk</text>
  <text x="716" y="393" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" text-anchor="middle">session.timeout exceeded</text>

  <!-- ─────────────────────────────────────────────
       LEGEND
  ───────────────────────────────────────────── -->
  <line x1="30" y1="532" x2="930" y2="532" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="30" y="546" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- legend item 1: 정상 경로 -->
  <line x1="100" y1="543" x2="124" y2="543" stroke="#286d50" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr-ok)"/>
  <text x="130" y="548" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR',sans-serif">Success Path</text>

  <!-- legend item 2: 재시도 경로 -->
  <line x1="232" y1="543" x2="256" y2="543" stroke="#a96a08" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-21-5a4b63fa-02-arr-warn)"/>
  <text x="262" y="548" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR',sans-serif">Retry Path (blocking)</text>

  <!-- legend item 3: 오류 경로 -->
  <line x1="420" y1="543" x2="444" y2="543" stroke="#94382b" stroke-width="1" marker-end="url(#2026-09-21-5a4b63fa-02-arr-err)"/>
  <text x="450" y="548" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR',sans-serif">Error Path</text>

  <!-- legend item 4: focal 노드 -->
  <rect x="548" y="536" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="566" y="548" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR',sans-serif">Key Step</text>

  <!-- legend item 5: 경고 노드 -->
  <rect x="652" y="536" width="12" height="12" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <text x="670" y="548" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR',sans-serif">Caution Step</text>

  <!-- legend item 6: 위험 노드 -->
  <rect x="756" y="536" width="12" height="12" rx="2" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <text x="774" y="548" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR',sans-serif">Risk Step</text>

</svg>
</div>
</body>
</html>
