  <title id="2026-10-19-bd9f231a-07-handoff-title">Multi-Agent Handoff Structure</title>
  <desc id="2026-10-19-bd9f231a-07-handoff-desc">A triage agent receives user requests and routes them to three domain agents — payment, tech, and ops — where the payment domain further hands off to subscription and refund agents, and the tech domain to bug and integration agents, forming a hierarchical multi-agent flow.</desc>
