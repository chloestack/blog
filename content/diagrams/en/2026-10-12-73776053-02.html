<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f8fafb;display:flex;justify-content:center;padding:0}
svg{display:block;width:100%;height:auto;max-width:960px}
</style>
</head>
<body>
<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-12-73776053-02-chunk-title 2026-10-12-73776053-02-chunk-desc">
  <title id="2026-10-12-73776053-02-chunk-title">Fixed-size Chunking — Overlapping Sliding Window</title>
  <desc id="2026-10-12-73776053-02-chunk-desc">The source text is split into fixed-size chunks A, B, and C, with a 50-character overlap between adjacent chunks, illustrating the sliding window approach.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-10-12-73776053-02-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-12-73776053-02-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="300" fill="#f8fafb"/>

  <!-- ────────────────────────────────────────────
       ARROWS  (drawn before boxes)
  ──────────────────────────────────────────── -->

  <!-- T → A -->
  <line x1="212" y1="108" x2="280" y2="108"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-12-73776053-02-arr)"/>

  <!-- T → B  (fan: exits bottom of T, routes down then right) -->
  <path d="M 160 132 L 160 172 L 344 172 L 344 148"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-12-73776053-02-arr)"/>

  <!-- T → C  (fan: exits bottom, routes further down then right) -->
  <path d="M 160 132 L 160 200 L 536 200 L 536 148"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-12-73776053-02-arr)"/>

  <!-- A → B  overlap arrow (runs along y=172, above the boxes at y=84) -->
  <path d="M 408 108 L 448 108 L 448 76 L 500 76 L 500 108 L 524 108"
        fill="none" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#2026-10-12-73776053-02-arr-accent)"/>
  <!-- A→B label mask & text -->
  <rect x="453" y="60" width="44" height="13" rx="2" fill="#f8fafb"/>
  <text x="475" y="70" fill="#0d5763" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="500"
        text-anchor="middle">50-chr overlap</text>

  <!-- B → C  overlap arrow -->
  <path d="M 600 108 L 640 108 L 640 76 L 692 76 L 692 108 L 716 108"
        fill="none" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#2026-10-12-73776053-02-arr-accent)"/>
  <!-- B→C label mask & text -->
  <rect x="645" y="60" width="44" height="13" rx="2" fill="#f8fafb"/>
  <text x="667" y="70" fill="#0d5763" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="500"
        text-anchor="middle">50-chr overlap</text>

  <!-- ────────────────────────────────────────────
       NODES
  ──────────────────────────────────────────── -->

  <!-- T — Source Text (input treatment) -->
  <!-- opaque mask -->
  <rect x="60" y="72" width="152" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="60" y="72" width="152" height="72" rx="6"
        fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <!-- type tag -->
  <rect x="68" y="78" width="36" height="12" rx="2"
        fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="86" y="87" fill="rgba(108,129,136,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <!-- name -->
  <text x="136" y="112" fill="#122127" font-size="14"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="600"
        text-anchor="middle">Source Text</text>

  <!-- A — Chunk A  (focal) -->
  <!-- opaque mask -->
  <rect x="280" y="72" width="128" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="280" y="72" width="128" height="72" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- type tag -->
  <rect x="288" y="78" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="302" y="87" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">CHUNK</text>
  <!-- name -->
  <text x="344" y="106" fill="#122127" font-size="14"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="600"
        text-anchor="middle">Chunk A</text>
  <!-- sublabel -->
  <text x="344" y="124" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">0 – 500 chr</text>

  <!-- B — Chunk B  (focal) -->
  <!-- opaque mask -->
  <rect x="472" y="72" width="128" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="472" y="72" width="128" height="72" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- type tag -->
  <rect x="480" y="78" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="494" y="87" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">CHUNK</text>
  <!-- name -->
  <text x="536" y="106" fill="#122127" font-size="14"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="600"
        text-anchor="middle">Chunk B</text>
  <!-- sublabel -->
  <text x="536" y="124" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">450 – 950 chr</text>

  <!-- C — Chunk C  (focal) -->
  <!-- opaque mask -->
  <rect x="664" y="72" width="136" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="664" y="72" width="136" height="72" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- type tag -->
  <rect x="672" y="78" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="686" y="87" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">CHUNK</text>
  <!-- name -->
  <text x="732" y="106" fill="#122127" font-size="14"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="600"
        text-anchor="middle">Chunk C</text>
  <!-- sublabel -->
  <text x="732" y="124" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">900 – 1400 chr</text>

  <!-- ────────────────────────────────────────────
       OVERLAP BAND ANNOTATIONS  (below the boxes)
       Shows the overlap region visually
  ──────────────────────────────────────────── -->

  <!-- Overlap band A–B -->
  <rect x="380" y="164" width="48" height="20" rx="3"
        fill="rgba(13,87,99,0.12)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="404" y="178" fill="#0d5763" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="500"
        text-anchor="middle">Overlap</text>

  <!-- Overlap band B–C -->
  <rect x="572" y="164" width="48" height="20" rx="3"
        fill="rgba(13,87,99,0.12)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="596" y="178" fill="#0d5763" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" font-weight="500"
        text-anchor="middle">Overlap</text>

  <!-- ────────────────────────────────────────────
       LEGEND STRIP
  ──────────────────────────────────────────── -->
  <line x1="32" y1="232" x2="928" y2="232"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <text x="32" y="248" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- input swatch -->
  <rect x="108" y="237" width="16" height="12" rx="3"
        fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="130" y="248" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="start">Source Input</text>

  <!-- chunk swatch -->
  <rect x="220" y="237" width="16" height="12" rx="3"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="242" y="248" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="start">Chunk (fixed-size)</text>

  <!-- overlap arrow swatch -->
  <line x1="380" y1="243" x2="404" y2="243"
        stroke="#0d5763" stroke-width="1" stroke-dasharray="5,3"
        marker-end="url(#2026-10-12-73776053-02-arr-accent)"/>
  <text x="412" y="248" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="start">Overlap region (50 chr)</text>

  <!-- split arrow swatch -->
  <line x1="572" y1="243" x2="596" y2="243"
        stroke="#3f545c" stroke-width="1"
        marker-end="url(#2026-10-12-73776053-02-arr)"/>
  <text x="604" y="248" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="start">Split</text>

</svg>
</body>
</html>
