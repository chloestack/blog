  <title id="2026-10-02-1cb47ab1-03-pdf-pipeline-title">PDF Layout Analysis Pipeline</title>
  <desc id="2026-10-02-1cb47ab1-03-pdf-pipeline-desc">A pipeline that detects four elements — title, body text, table, and image — from a PDF page via a layout analysis model, integrates them into section hierarchy metadata, and saves to an index.</desc>

  <defs>

      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>

      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-02-1cb47ab1-03-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

  <path d="M 462 200 L 462 212 Q 462 236 450 236 L 400 236 Q 388 236 388 248 L 388 256" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-03-arr)"/>
  <!-- to Table (center-right) -->
  <path d="M 498 200 L 498 212 Q 498 236 510 236 L 560 236 Q 572 236 572 248 L 572 256" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-03-arr)"/>
  <!-- to Figure (right) -->
  <path d="M 516 200 L 516 212 Q 516 224 528 224 L 692 224 Q 704 224 704 236 L 704 256" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-02-1cb47ab1-03-arr)"/>

  <text x="704" y="305" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Figure</text>

  <rect x="360" y="384" width="240" height="60" rx="6" fill="#f8fafb"/>
  <rect x="360" y="384" width="240" height="60" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>

  <text x="480" y="418" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Section Hierarchy Meta</text>
  <text x="480" y="436" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">section hierarchy</text>

  <!-- Cylinder-like store box -->
  <rect x="384" y="484" width="192" height="56" rx="6" fill="#f8fafb"/>
  <rect x="384" y="484" width="192" height="56" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>

  <text x="552" y="582" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Input</text>
