<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Injection Attack Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480"

  <title id="2026-10-15-9124f843-03-pii-title">Prompt Injection Attack Flow</title>
  <desc id="2026-10-15-9124f843-03-pii-desc">A flow diagram showing an indirect prompt injection path where malicious instructions from an attacker-controlled web page are injected into the agent context via RAG retrieval results, and the agent calls an email-sending tool to exfiltrate data to an external server.</desc>

  <defs>
    <!-- 배경 패턴 없음 — 기본 clean paper -->

    <!-- 마커: 기본(muted) -->
    <marker id="2026-10-15-9124f843-03-pii-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 마커: 위험(stop) -->
    <marker id="2026-10-15-9124f843-03-pii-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <!-- 마커: 경고(warn) -->
    <marker id="2026-10-15-9124f843-03-pii-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
    <!-- 마커: 포커스(accent) -->

      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="480" fill="#f8fafb"/>

  <!--
    레이아웃 (LR 흐름, 상단 경로 위주):
    W(64,160) → R(204,160) → C(364,160) → AG(524,160) → T1(684,100) → EX(844,100)
                                                         ↘ T2(684,220)

    노드 크기: W/R/C/EX = 112×60, AG = 120×60, T1/T2 = 120×60
    중앙 y(상단행) = 160, T1/EX = 100, T2 = 220
  -->

  <!-- ═══════════════════════════════ 화살표 (노드보다 먼저) ═══════════════════════════════ -->

  <!-- W → R (stop 색) -->
  <line x1="176" y1="160" x2="200" y2="160"
        stroke="#94382b" stroke-width="1.2"
        marker-end="url(#2026-10-15-9124f843-03-pii-arrow-stop)"/>

  <!-- R → C (warn 색) -->
  <line x1="316" y1="160" x2="360" y2="160"
        stroke="#a96a08" stroke-width="1.2"
        marker-end="url(#2026-10-15-9124f843-03-pii-arrow-warn)"/>

  <!-- C → AG (warn→accent 전환, accent 사용) -->
  <line x1="476" y1="160" x2="520" y2="160"
        stroke="#0d5763" stroke-width="1.5"
        marker-end="url(#2026-10-15-9124f843-03-pii-arrow-accent)"/>

  <!-- AG → T1 (상단, stop) — AG 오른쪽(644,160) → T1 왼쪽(680,100): 꺾임 경로 -->
  <!-- 수평으로 나가고 위로 올라감: x=664에서 꺾음 -->
  <path d="M 644,148 L 664,148 L 664,100 L 680,100"
        fill="none" stroke="#94382b" stroke-width="1.2"
        marker-end="url(#2026-10-15-9124f843-03-pii-arrow-stop)"/>

  <!-- AG → T2 (하단, muted) — AG 오른쪽(644,172) → T2 왼쪽(680,220): 꺾임 경로 -->
  <path d="M 644,172 L 664,172 L 664,220 L 680,220"
        fill="none" stroke="#3f545c" stroke-width="1"
        marker-end="url(#2026-10-15-9124f843-03-pii-arrow)"/>

  <!-- T1 → EX (stop) -->
  <line x1="800" y1="100" x2="840" y2="100"
        stroke="#94382b" stroke-width="1.2"
        marker-end="url(#2026-10-15-9124f843-03-pii-arrow-stop)"/>

  <!-- ═══════════════════════════════ 노드 ═══════════════════════════════ -->

  <!-- W: 웹 페이지 (stop — 빨간 계열) x=64 y=130 w=112 h=60 -->
  <rect x="64" y="130" width="112" height="60" rx="6" fill="#f8fafb"/>
  <rect x="64" y="130" width="112" height="60" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1.2"/>

  <!-- 이름 -->
  <text x="120" y="160" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Web Page</text>
  <text x="120" y="176" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Attacker-controlled</text>

  <!-- R: RAG 검색 (warn — 주황 계열) x=204 y=130 w=112 h=60 -->
  <rect x="204" y="130" width="112" height="60" rx="6" fill="#f8fafb"/>
  <rect x="204" y="130" width="112" height="60" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1.2"/>
  <rect x="212" y="136" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="228" y="145" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">RAG</text>
  <text x="260" y="160" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">RAG Retrieval</text>
  <text x="260" y="176" fill="#6c8188" font-size="10"

  <!-- C: 컨텍스트 조립 (warn) x=364 y=130 w=112 h=60 -->
  <rect x="364" y="130" width="112" height="60" rx="6" fill="#f8fafb"/>

  <text x="392" y="145" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">CTX</text>
  <text x="420" y="160" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Context Build</text>
  <text x="420" y="176" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Malicious Instr.</text>

  <!-- AG: 에이전트 (focal/accent) x=524 y=130 w=120 h=60 -->
  <rect x="524" y="130" width="120" height="60" rx="6" fill="#f8fafb"/>

  <text x="584" y="162" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Agent</text>
  <text x="584" y="178" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Processing</text>

  <!-- T1: 도구 호출 이메일 (stop) x=680 y=70 w=120 h=60 -->
  <rect x="680" y="70" width="120" height="60" rx="6" fill="#f8fafb"/>
  <rect x="680" y="70" width="120" height="60" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1.2"/>
  <rect x="688" y="76" width="44" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="710" y="85" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="740" y="102" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Tool Call</text>
  <text x="740" y="118" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Send Email</text>

  <!-- T2: 도구 호출 데이터 조회 (muted) x=680 y=190 w=120 h=60 -->
  <rect x="680" y="190" width="120" height="60" rx="6" fill="#f8fafb"/>

  <rect x="688" y="196" width="44" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.6)" stroke-width="0.8"/>
  <text x="710" y="205" fill="#6c8188" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="740" y="222" fill="#3f545c" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Tool Call</text>
  <text x="740" y="238" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Data Query</text>

  <!-- EX: 외부 서버 (stop) x=840 y=70 w=112 h=60 -->
  <rect x="840" y="70" width="112" height="60" rx="6" fill="#f8fafb"/>
  <rect x="840" y="70" width="112" height="60" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1.5"/>
  <rect x="848" y="76" width="40" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="868" y="85" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">EXFIL</text>
  <text x="896" y="102" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Ext. Server</text>
  <text x="896" y="118" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Data Exfil.</text>

  <!-- ═══════════════════════════════ 화살표 라벨 ═══════════════════════════════ -->

  <!-- W→R 라벨: "검색 쿼리" — y=160, 중간 x=190 -->
  <rect x="169" y="140" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="189" y="151" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">Query</text>

  <!-- C→AG 라벨: "프롬프트" — x=498 y=160 -->
  <rect x="479" y="140" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="499" y="151" fill="#0d5763" font-size="9" font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">Prompt</text>

  <!-- ═══════════════════════════════ 범례 ═══════════════════════════════ -->
  <line x1="40" y1="388" x2="920" y2="388" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <text x="40" y="404" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- 위험 -->
  <rect x="108" y="394" width="12" height="12" rx="2" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <text x="126" y="404" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Risk Node</text>

  <!-- 경고 -->
  <rect x="212" y="394" width="12" height="12" rx="2" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="230" y="404" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Taint Path</text>

  <!-- 포커스 -->
  <rect x="316" y="394" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="334" y="404" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Core Process</text>

  <!-- 비활성 -->
  <rect x="420" y="394" width="12" height="12" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="438" y="404" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Aux. Path</text>
