  <title id="2026-09-24-22e347e3-07-hotslot-title">Hot Slot Resolution Strategy Selection Flowchart</title>
  <desc id="2026-09-24-22e347e3-07-hotslot-desc">A flowchart showing the decision flow for resolving Redis Cluster hot slot bottlenecks, selecting different strategies based on four scenarios: read-heavy, write-heavy, slot imbalance, and hash tag overuse, all converging on latency improvement.</desc>

  <defs>
    <!-- Default arrow: muted -->
    <marker id="2026-09-24-22e347e3-07-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    <marker id="2026-09-24-22e347e3-07-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─── ARROWS (drawn before boxes) ─── -->

  <!-- Q → RP  (right branch, then down) -->
  <!-- Q center: 480,148  RP center: 164,312 -->
  <!-- Route: 480,168 → 480,192 → 164,192 → 164,292 -->
  <path d="M480,168 L480,192 L164,192 L164,292"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-07-arr)"/>

  <!-- KS center: 344,312 -->

        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-07-arr)"/>

  <!-- SR center: 616,312 -->

  <path d="M480,168 L480,220 L616,220 L616,292"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-07-arr)"/>

  <!-- Q → HT  (far right branch) -->
  <!-- HT center: 796,312 -->

  <path d="M480,168 L480,192 L796,192 L796,292"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-07-arr)"/>

  <!-- RP → OK -->

        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-07-arr)"/>

        fill="none" stroke="#3f545c" stroke-width="1"/>

  <!-- SR → OK -->
  <path d="M616,352 L616,428 L480,428"
        fill="none" stroke="#3f545c" stroke-width="1"/>

  <!-- HT → OK -->
  <path d="M796,352 L796,428 L480,428"
        fill="none" stroke="#3f545c" stroke-width="1"/>

  <!-- Vertical from horizontal merge to OK top (one arrow tip only) -->

       collects all four. We draw the single vertical drop separately to avoid double marker. -->

  <text x="204" y="192" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif"

  <rect x="92" y="292" width="144" height="60" rx="6" fill="#f8fafb"/>
  <rect x="92" y="292" width="144" height="60" rx="6"

  <text x="164" y="318" fill="#122127" font-size="14" font-weight="600"

  <rect x="272" y="292" width="144" height="60" rx="6" fill="#f8fafb"/>

  <text x="796" y="318" fill="#122127" font-size="14" font-weight="600"

  <text x="796" y="336" fill="#122127" font-size="14" font-weight="600"

  <rect x="390" y="444" width="180" height="56" rx="6" fill="#f8fafb"/>
  <rect x="390" y="444" width="180" height="56" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- small type tag -->
  <rect x="398" y="450" width="40" height="12" rx="2" fill="transparent"
        stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="418" y="459" fill="rgba(13,87,99,0.80)" font-size="8"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">result</text>
  <text x="480" y="479" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Latency Improved</text>

  <!-- ─── LEGEND ─── -->
  <line x1="32" y1="548" x2="928" y2="548" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Legend: focal -->
  <polygon points="56,560 64,556 72,560 64,564"

  <rect x="168" y="554" width="16" height="12" rx="2"
