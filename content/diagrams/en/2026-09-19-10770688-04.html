<!DOCTYPE html>

<head>

</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" role="img" aria-labelledby="2026-09-19-10770688-04-faithfulness-title 2026-09-19-10770688-04-faithfulness-desc"

  <title id="2026-09-19-10770688-04-faithfulness-title">Faithfulness Evaluation Flow</title>
  <desc id="2026-09-19-10770688-04-faithfulness-desc">RAGAS Faithfulness metric calculation flow: the generated answer is decomposed into atomic claims, then each claim is judged for context support and classified as "Supported" or "Hallucination Suspected".</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-09-19-10770688-04-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 (accent) -->
    <marker id="2026-09-19-10770688-04-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 성공 화살표 -->
    <marker id="2026-09-19-10770688-04-arr-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <!-- 실패 화살표 -->
    <marker id="2026-09-19-10770688-04-arr-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       CONNECTORS (arrows before boxes)
       Layout (cx):
         ANS  → cx=480, y=72
         DEC  → cx=480, y=176
         C1   → cx=288, y=284
         C2   → cx=480, y=284
         C3   → cx=672, y=284
         JDG  → cx=480, y=392  (diamond)
         OK   → cx=320, y=492
         FAIL → cx=640, y=492
  ───────────────────────────────────────── -->

  <!-- ANS → DEC (수직) -->
  <line x1="480" y1="112" x2="480" y2="150" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-04-arr-acc)"/>

  <!-- DEC → C1 (elbow: 내려가다 왼쪽으로) -->
  <path d="M 480 220 L 480 232 Q 480 240 472 240 L 296 240 Q 288 240 288 248 L 288 258" 
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-10770688-04-arr)"/>

  <!-- DEC → C2 (수직) -->
  <line x1="480" y1="220" x2="480" y2="258" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-10770688-04-arr)"/>

  <!-- DEC → C3 (elbow: 내려가다 오른쪽으로) -->
  <path d="M 480 220 L 480 232 Q 480 240 488 240 L 664 240 Q 672 240 672 248 L 672 258"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-10770688-04-arr)"/>

  <!-- C1 → JDG (elbow: 아래로 내려와 오른쪽으로) -->
  <path d="M 288 316 L 288 340 Q 288 348 296 348 L 472 348 Q 480 348 480 356 L 480 378"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-10770688-04-arr)"/>

  <!-- C2 → JDG (수직) -->
  <line x1="480" y1="316" x2="480" y2="378" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-10770688-04-arr)"/>

  <!-- C3 → JDG (elbow: 아래로 내려와 왼쪽으로) -->
  <path d="M 672 316 L 672 340 Q 672 348 664 348 L 488 348 Q 480 348 480 356 L 480 378"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-19-10770688-04-arr)"/>

  <!-- JDG → OK (예 / 왼쪽으로) -->
  <path d="M 424 420 L 320 420 Q 312 420 312 428 L 312 472"
        fill="none" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-04-arr-ok)"/>

  <!-- JDG → FAIL (아니오 / 오른쪽으로) -->
  <path d="M 536 420 L 640 420 Q 648 420 648 428 L 648 472"
        fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-04-arr-fail)"/>

  <!-- ─────────────────────────────────────────
       NODES
  ───────────────────────────────────────── -->

  <!-- ANS: Generated Answer (input 처리 — link blue) -->
  <!-- mask -->
  <rect x="376" y="44" width="208" height="68" rx="6" fill="#f8fafb"/>
  <rect x="376" y="44" width="208" height="68" rx="6" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1.2"/>
  <rect x="384" y="52" width="36" height="13" rx="2" fill="transparent" stroke="rgba(58,84,143,0.45)" stroke-width="0.8"/>
  <text x="402" y="62" fill="rgba(58,84,143,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="480" y="88" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Generated Answer</text>

  <!-- DEC: Decompose into Atomic Claims (focal / accent) -->
  <rect x="344" y="152" width="272" height="68" rx="6" fill="#f8fafb"/>
  <rect x="344" y="152" width="272" height="68" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="352" y="160" width="36" height="13" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="370" y="170" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="480" y="192" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Decompose into Atomic Claims</text>

  <!-- C1 -->
  <rect x="200" y="260" width="176" height="56" rx="6" fill="#f8fafb"/>
  <rect x="200" y="260" width="176" height="56" rx="6" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="288" y="293" fill="#3f545c" font-size="14" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Claim 1</text>

  <!-- C2 -->
  <rect x="392" y="260" width="176" height="56" rx="6" fill="#f8fafb"/>
  <rect x="392" y="260" width="176" height="56" rx="6" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="480" y="293" fill="#3f545c" font-size="14" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Claim 2</text>

  <!-- C3 -->
  <rect x="584" y="260" width="176" height="56" rx="6" fill="#f8fafb"/>
  <rect x="584" y="260" width="176" height="56" rx="6" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="672" y="293" fill="#3f545c" font-size="14" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Claim N</text>

  <!-- JDG: Context Support Check (diamond / focal) -->
  <!-- 다이아몬드: cx=480, cy=420, half-w=56, half-h=40 -->
  <polygon points="480,380 536,420 480,460 424,420" fill="#f8fafb"/>
  <polygon points="480,380 536,420 480,460 424,420" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="415" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Context</text>
  <text x="480" y="431" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Supported?</text>

  <!-- JDG→OK 라벨: Yes -->
  <rect x="366" y="410" width="28" height="16" rx="2" fill="#f8fafb"/>
  <text x="380" y="422" fill="#286d50" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Yes</text>

  <!-- JDG→FAIL 라벨: No -->
  <rect x="562" y="410" width="52" height="16" rx="2" fill="#f8fafb"/>
  <text x="588" y="422" fill="#94382b" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">No</text>

  <!-- OK: Supported -->
  <rect x="224" y="472" width="192" height="60" rx="6" fill="#f8fafb"/>
  <rect x="224" y="472" width="192" height="60" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1.2"/>
  <text x="320" y="506" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Supported</text>

  <!-- FAIL: Hallucination Suspected -->
  <rect x="544" y="472" width="208" height="60" rx="6" fill="#f8fafb"/>
  <rect x="544" y="472" width="208" height="60" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1.2"/>
  <text x="648" y="506" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Hallucination Suspected</text>

  <!-- ─────────────────────────────────────────
       LEGEND
  ───────────────────────────────────────── -->
  <line x1="32" y1="560" x2="928" y2="560" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Supported legend -->
  <rect x="32" y="572" width="12" height="12" rx="2" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="50" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Supported</text>

  <!-- Hallucination Suspected legend -->
  <rect x="140" y="572" width="12" height="12" rx="2" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <text x="158" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Hallucination</text>

  <!-- Eval Step legend -->
  <rect x="288" y="572" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="306" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Eval Step</text>

  <!-- Individual Claim legend -->
  <rect x="420" y="572" width="12" height="12" rx="2" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="438" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">Indiv. Claim</text>

  <!-- RAGAS Faithfulness 출처 표기 -->
  <text x="928" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="end" letter-spacing="0.06em">RAGAS · Faithfulness</text>

</svg>
