  <desc id="2026-09-21-184d501b-06-graphrag-chunk-desc">Branching flow showing how relation extraction results differ based on chunk size settings when Korean documents are tokenized with tiktoken. The default (1200) yields short chunks with incomplete relation extraction; setting 2000–2400 stabilizes relation extraction.</desc>
