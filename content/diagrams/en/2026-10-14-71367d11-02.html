  <title id="2026-10-14-71367d11-02-qdrant-title">Qdrant Collection Design and Filter Optimization Flow</title>
  <desc id="2026-10-14-71367d11-02-qdrant-desc">A flow starting from collection creation, branching into vector configuration and payload index declaration, where four index types (keyword, integer/float, datetime, text) build inverted indexes and converge into fast filtered search.</desc>

  <!-- Payload Index → integer/float (down) -->
  <path d="M 212 196 Q 212 208 212 216 L 212 272" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-02-qdrant-arrow)"/>

  <path d="M 276 196 Q 276 208 316 208 L 316 216 L 316 272" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-14-71367d11-02-qdrant-arrow)"/>

  <text x="428" y="308" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">full-text search</text>

  <rect x="368" y="406" width="52" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="394" y="415" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
  <text x="464" y="430" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Build Inverted Index</text>

  <text x="590" y="589" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">Key Flow</text>
