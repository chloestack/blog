<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-18-784fb3bd-04-instructor-title 2026-09-18-784fb3bd-04-instructor-desc">
  <title id="2026-09-18-784fb3bd-04-instructor-title">Instructor Pattern — Structured Output Retry Flow</title>
  <desc id="2026-09-18-784fb3bd-04-instructor-desc">Flow diagram: call LLM API, receive JSON response, validate with Pydantic; if passed return instance, if failed build error context and retry.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-18-784fb3bd-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-18-784fb3bd-04-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-18-784fb3bd-04-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-09-18-784fb3bd-04-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ─────────────── ARROWS (drawn before boxes) ─────────────── -->

  <!-- C → J (첫 번째 API 호출 → JSON 응답) -->
  <line x1="176" y1="180" x2="264" y2="180" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-04-arrow)"/>

  <!-- J → V (JSON 응답 → Pydantic 검증) -->
  <line x1="360" y1="180" x2="448" y2="180" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-04-arrow)"/>

  <!-- V → Q (Pydantic 검증 → 통과?) -->
  <line x1="544" y1="180" x2="612" y2="180" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-04-arrow-accent)"/>

  <!-- Q → OK (예: 아래로 꺾어 오른쪽 OK로) -->
  <!-- Yes: Q right to OK -->
  <path d="M 668 180 L 720 180 L 720 180 L 808 180" fill="none" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-04-arrow-ok)"/>
  <!-- "예" label -->
  <rect x="718" y="164" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="728" y="174" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Yes</text>

  <!-- Q → E (아니오: 아래로) -->
  <path d="M 640 208 L 640 280 L 720 280" fill="none" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-04-arrow)"/>
  <!-- "아니오" label -->
  <rect x="614" y="232" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="632" y="243" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">No</text>

  <!-- E → R (오류 맥락 → 재시도) -->
  <line x1="816" y1="280" x2="834" y2="280" stroke="#a96a08" stroke-width="1.2" marker-end="url(#2026-09-18-784fb3bd-04-arrow-warn)"/>

  <!-- R → V (재시도 → Pydantic 검증: 위로 올라가서 왼쪽 V 상단에) -->
  <path d="M 892 308 L 892 328 L 496 328 L 496 210" fill="none" stroke="#a96a08" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#2026-09-18-784fb3bd-04-arrow-warn)"/>
  <!-- "재시도" label -->
  <rect x="666" y="321" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="690" y="332" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Retry</text>

  <!-- ─────────────── NODES ─────────────── -->

  <!-- C: 첫 번째 API 호출 (input 계열, link 색) -->
  <rect x="60" y="152" width="116" height="56" rx="6" fill="#f8fafb"/>
  <rect x="60" y="152" width="116" height="56" rx="6" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <rect x="68" y="158" width="24" height="11" rx="2" fill="transparent" stroke="rgba(58,84,143,0.4)" stroke-width="0.8"/>
  <text x="80" y="167" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="118" y="184" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Initial</text>
  <text x="118" y="200" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">API Call</text>

  <!-- J: JSON 응답 (store/muted) -->
  <rect x="264" y="152" width="96" height="56" rx="6" fill="#f8fafb"/>
  <rect x="264" y="152" width="96" height="56" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="272" y="158" width="28" height="11" rx="2" fill="transparent" stroke="rgba(195,208,212,0.6)" stroke-width="0.8"/>
  <text x="286" y="167" fill="#3f545c" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
  <text x="312" y="188" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">JSON Response</text>

  <!-- V: Pydantic 검증 (focal/accent) -->
  <rect x="448" y="152" width="96" height="56" rx="6" fill="#f8fafb"/>
  <rect x="448" y="152" width="96" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="456" y="158" width="40" height="11" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="476" y="167" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PYDANTIC</text>
  <text x="496" y="188" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Pydantic Validate</text>

  <!-- Q: 통과? (decision diamond, accent) -->
  <!-- Diamond centered at (640, 180), half-width=28, half-height=28 -->
  <polygon points="640,152 668,180 640,208 612,180" fill="#f8fafb"/>
  <polygon points="640,152 668,180 640,208 612,180" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="640" y="184" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Pass?</text>

  <!-- OK: 인스턴스 반환 (ok green) -->
  <rect x="808" y="152" width="100" height="56" rx="6" fill="#f8fafb"/>
  <rect x="808" y="152" width="100" height="56" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <rect x="816" y="158" width="24" height="11" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>
  <text x="828" y="167" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK</text>
  <text x="858" y="184" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Return</text>
  <text x="858" y="200" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Instance</text>

  <!-- E: 오류 맥락 생성 (stop/red) -->
  <rect x="720" y="252" width="96" height="56" rx="6" fill="#f8fafb"/>
  <rect x="720" y="252" width="96" height="56" rx="6" fill="#f1d9d4" stroke="#94382b" stroke-width="1"/>
  <rect x="728" y="258" width="24" height="11" rx="2" fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>
  <text x="740" y="267" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERR</text>
  <text x="768" y="284" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Build Error</text>
  <text x="768" y="300" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Context</text>

  <!-- R: 재시도 API 호출 (warn/amber) -->
  <rect x="836" y="252" width="112" height="56" rx="6" fill="#f8fafb"/>
  <rect x="836" y="252" width="112" height="56" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <rect x="844" y="258" width="36" height="11" rx="2" fill="transparent" stroke="rgba(169,106,8,0.4)" stroke-width="0.8"/>
  <text x="862" y="267" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
  <text x="892" y="284" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Retry</text>
  <text x="892" y="300" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">API Call</text>

  <!-- ─────────────── LEGEND ─────────────── -->
  <line x1="40" y1="352" x2="920" y2="352" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="365" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend items -->
  <rect x="108" y="357" width="12" height="12" rx="2" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="0.8"/>
  <text x="124" y="367" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">API Call</text>

  <rect x="208" y="357" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="224" y="367" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Validation</text>

  <rect x="320" y="357" width="12" height="12" rx="2" fill="#d6e9de" stroke="#286d50" stroke-width="0.8"/>
  <text x="336" y="367" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Success</text>

  <rect x="400" y="357" width="12" height="12" rx="2" fill="#f1d9d4" stroke="#94382b" stroke-width="0.8"/>
  <text x="416" y="367" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Error</text>

  <rect x="480" y="357" width="12" height="12" rx="2" fill="#f5e8cc" stroke="#a96a08" stroke-width="0.8"/>
  <text x="496" y="367" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Retry</text>

  <!-- dashed line legend -->
  <line x1="572" y1="363" x2="592" y2="363" stroke="#a96a08" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="596" y="367" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">Retry Path (loop)</text>

</svg>
</div>
</body>
</html>
