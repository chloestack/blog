<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="2026-10-17-e8c9176c-01-sse-sync-title 2026-10-17-e8c9176c-01-sse-sync-desc">
  <title id="2026-10-17-e8c9176c-01-sse-sync-title">Synchronous LLM Response Flow</title>
  <desc id="2026-10-17-e8c9176c-01-sse-sync-desc">A synchronous flow in which the client sends an HTTP request, the server calls the LLM API, waits until the LLM finishes generating all tokens, and returns the full response at once after approximately 8 seconds.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-17-e8c9176c-01-sse-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 -->
    <marker id="2026-10-17-e8c9176c-01-sse-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" fill="#f8fafb"/>

  <!-- ── 화살표 (노드보다 먼저) ── -->

  <!-- 클라이언트 → 서버 : HTTP 요청 -->
  <line x1="232" y1="140" x2="340" y2="140" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow)"/>
  <rect x="238" y="124" width="56" height="14" rx="2" fill="#f8fafb"/>
  <text x="266" y="134" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">HTTP Req</text>

  <!-- 서버 → LLM : LLM API 호출 -->
  <line x1="520" y1="140" x2="628" y2="140" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow)"/>
  <rect x="526" y="124" width="66" height="14" rx="2" fill="#f8fafb"/>
  <text x="559" y="134" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">LLM API Call</text>

  <!-- LLM → 서버 : 전체 완료 대기 (아래쪽 경로) -->
  <path d="M 700 180 L 700 220 L 430 220 L 430 180" fill="none" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow)"/>
  <rect x="522" y="224" width="76" height="14" rx="2" fill="#f8fafb"/>
  <text x="560" y="234" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">Await completion</text>

  <!-- 서버 → 클라이언트 : 8초 후 한번에 (아래쪽 경로) -->
  <path d="M 340 180 L 340 260 L 140 260 L 140 180" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow-accent)"/>
  <rect x="196" y="264" width="88" height="14" rx="2" fill="#f8fafb"/>
  <text x="240" y="274" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="600">After 8s, at once</text>

  <!-- ── 노드 ── -->

  <!-- 클라이언트 -->
  <rect x="60" y="108" width="120" height="64" rx="6" fill="#f8fafb"/>
  <rect x="60" y="108" width="120" height="64" rx="6" fill="rgba(18,33,39,0.06)" stroke="#6c8188" stroke-width="1"/>
  <rect x="68" y="116" width="36" height="13" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="86" y="125.5" fill="rgba(108,129,136,0.9)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
  <text x="120" y="148" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Client</text>

  <!-- 서버 (focal) -->
  <rect x="340" y="108" width="180" height="64" rx="6" fill="#f8fafb"/>
  <rect x="340" y="108" width="180" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="348" y="116" width="32" height="13" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="364" y="125.5" fill="rgba(13,87,99,0.9)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
  <text x="430" y="148" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Server</text>

  <!-- LLM 모델 -->
  <rect x="628" y="108" width="188" height="64" rx="6" fill="#f8fafb"/>
  <rect x="628" y="108" width="188" height="64" rx="6" fill="rgba(18,33,39,0.04)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <rect x="636" y="116" width="36" height="13" rx="2" fill="transparent" stroke="rgba(18,33,39,0.25)" stroke-width="0.8"/>
  <text x="654" y="125.5" fill="rgba(18,33,39,0.6)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="722" y="144" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">LLM Model</text>
  <text x="722" y="161" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Generating tokens…</text>

  <!-- ── 범례 구분선 ── -->
  <line x1="40" y1="302" x2="920" y2="302" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- 범례 -->
  <text x="40" y="320" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목 1: 동기 요청 -->
  <line x1="110" y1="316" x2="134" y2="316" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow)"/>
  <text x="140" y="320" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Sync Request</text>

  <!-- 범례 항목 2: 대기 (점선) -->
  <line x1="224" y1="316" x2="248" y2="316" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow)"/>
  <text x="254" y="320" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Blocking Wait</text>

  <!-- 범례 항목 3: 최종 응답 -->
  <line x1="352" y1="316" x2="376" y2="316" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-17-e8c9176c-01-sse-arrow-accent)"/>
  <text x="382" y="320" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Final Response (single)</text>

</svg>
</body>
</html>
