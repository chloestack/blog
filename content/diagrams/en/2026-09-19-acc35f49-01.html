  <title id="2026-09-19-acc35f49-01-redis-persist-title">Redis Persistence Strategy: RDB vs AOF</title>
  <desc id="2026-09-19-acc35f49-01-redis-persist-desc">Diagram showing client requests written to Redis memory, RDB persisting via snapshot dump, AOF persisting via command append, and both restoring memory on restart.</desc>

  <rect width="960" height="420" fill="#f8fafb"/>

  <rect x="564" y="228" width="28" height="12" rx="2"

  <text x="636" y="276" fill="#3f545c" font-size="11"

  <text x="28" y="368" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"

  <text x="114" y="368" fill="#3f545c" font-size="10"
