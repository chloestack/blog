<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphify Knowledge Graph Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f8fafb; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { display: block; max-width: 100%; }
</style>
</head>
<body>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 340"
  role="img"
  aria-labelledby="2026-10-19-6b5f07e6-06-graphify-title 2026-10-19-6b5f07e6-06-graphify-desc"
>
  <title id="2026-10-19-6b5f07e6-06-graphify-title">Graphify Codebase Knowledge Graph Flow</title>
  <desc id="2026-10-19-6b5f07e6-06-graphify-desc">A flowchart showing a knowledge graph structure: source code connects via WHY comments to NOTE nodes, NOTE nodes connect via ADR references to ADR documents, and source code connects to other modules via calls relationships.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-19-6b5f07e6-06-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-19-6b5f07e6-06-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 링크 화살표 -->
    <marker id="2026-10-19-6b5f07e6-06-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" fill="#f8fafb"/>

  <!-- ─── 화살표 먼저 ─── -->

  <!-- CODE → NOTE (WHY 주석) : 위쪽 경로 -->
  <path
    d="M 312,124 L 460,124 Q 468,124 468,132 L 468,148"
    fill="none" stroke="#0d5763" stroke-width="1.2"
    marker-end="url(#2026-10-19-6b5f07e6-06-arrow-accent)"/>

  <!-- NOTE → ADR (ADR 참조) -->
  <path
    d="M 568,188 L 648,188"
    fill="none" stroke="#3f545c" stroke-width="1"
    marker-end="url(#2026-10-19-6b5f07e6-06-arrow)"/>

  <!-- CODE → OTHER (calls) : 아래쪽 경로 -->
  <path
    d="M 312,176 L 460,176 Q 468,176 468,168 L 468,152"
    fill="none" stroke="#3a548f" stroke-width="1"
    stroke-dasharray="5,4"
    marker-end="url(#2026-10-19-6b5f07e6-06-arrow-link)"/>

  <!-- ─── 화살표 레이블 ─── -->

  <!-- WHY 주석 레이블 -->
  <rect x="356" y="104" width="64" height="14" rx="2" fill="#f8fafb"/>
  <text x="388" y="114"
    fill="#0d5763" font-size="10" font-weight="500"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle"># WHY comment</text>

  <!-- ADR 참조 레이블 -->
  <rect x="582" y="178" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="608" y="188"
    fill="#3f545c" font-size="10" font-weight="500"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle">ADR ref</text>

  <!-- calls 레이블 -->
  <rect x="358" y="156" width="32" height="14" rx="2" fill="#f8fafb"/>
  <text x="374" y="166"
    fill="#3a548f" font-size="10" font-weight="400"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    text-anchor="middle">calls</text>

  <!-- ─── 노드 ─── -->

  <!-- CODE 노드 (링크/파란 계열) -->
  <!-- 마스크 -->
  <rect x="100" y="124" width="212" height="76" rx="6" fill="#f8fafb"/>
  <!-- 박스 -->
  <rect x="100" y="124" width="212" height="76" rx="6"
    fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1.2"/>
  <!-- 태그 -->
  <rect x="108" y="132" width="36" height="12" rx="2"
    fill="transparent" stroke="rgba(58,84,143,0.4)" stroke-width="0.8"/>
  <text x="126" y="141"
    fill="rgba(58,84,143,0.8)" font-size="8" font-weight="500"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
  <!-- 이름 -->
  <text x="206" y="166"
    fill="#122127" font-size="14" font-weight="600"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle">Source Code</text>
  <!-- 서브레이블 -->
  <text x="206" y="184"
    fill="#3f545c" font-size="11" font-weight="400"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    text-anchor="middle">func · class</text>

  <!-- NOTE 노드 (액센트 — 초점) -->
  <!-- 마스크 -->
  <rect x="368" y="152" width="200" height="72" rx="6" fill="#f8fafb"/>
  <!-- 박스 -->
  <rect x="368" y="152" width="200" height="72" rx="6"
    fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- 태그 -->
  <rect x="376" y="160" width="32" height="12" rx="2"
    fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="392" y="169"
    fill="rgba(13,87,99,0.8)" font-size="8" font-weight="500"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    text-anchor="middle" letter-spacing="0.08em">NOTE</text>
  <!-- 이름 -->
  <text x="468" y="192"
    fill="#122127" font-size="14" font-weight="600"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle">NOTE Node</text>
  <!-- 서브레이블 -->
  <text x="468" y="210"
    fill="#3f545c" font-size="11" font-weight="400"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle">design intent</text>

  <!-- ADR 노드 (store 계열) -->
  <!-- 마스크 -->
  <rect x="648" y="156" width="196" height="68" rx="6" fill="#f8fafb"/>
  <!-- 박스 -->
  <rect x="648" y="156" width="196" height="68" rx="6"
    fill="rgba(18,33,39,0.04)" stroke="#6c8188" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="656" y="164" width="28" height="12" rx="2"
    fill="transparent" stroke="rgba(108,129,136,0.4)" stroke-width="0.8"/>
  <text x="670" y="173"
    fill="rgba(108,129,136,0.8)" font-size="8" font-weight="500"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    text-anchor="middle" letter-spacing="0.08em">ADR</text>
  <!-- 이름 -->
  <text x="746" y="192"
    fill="#122127" font-size="14" font-weight="600"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle">ADR Document</text>
  <!-- 서브레이블 -->
  <text x="746" y="210"
    fill="#3f545c" font-size="11" font-weight="400"
    font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
    text-anchor="middle">decision record</text>

  <!-- ─── 범례 ─── -->
  <line x1="32" y1="292" x2="928" y2="292"
    stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례: 주요 흐름 -->
  <line x1="40" y1="314" x2="64" y2="314"
    stroke="#0d5763" stroke-width="1.5" marker-end="url(#2026-10-19-6b5f07e6-06-arrow-accent)"/>
  <text x="72" y="318"
    fill="#3f545c" font-size="10" font-weight="400"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    letter-spacing="0.08em">main flow</text>

  <!-- 범례: 모듈 참조 -->
  <line x1="180" y1="314" x2="204" y2="314"
    stroke="#3a548f" stroke-width="1" stroke-dasharray="5,4"
    marker-end="url(#2026-10-19-6b5f07e6-06-arrow-link)"/>
  <text x="212" y="318"
    fill="#3f545c" font-size="10" font-weight="400"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    letter-spacing="0.08em">module ref</text>

  <!-- 범례: 문서 참조 -->
  <line x1="340" y1="314" x2="364" y2="314"
    stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-06-arrow)"/>
  <text x="372" y="318"
    fill="#3f545c" font-size="10" font-weight="400"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    letter-spacing="0.08em">doc ref</text>

</svg>
</body>
</html>
