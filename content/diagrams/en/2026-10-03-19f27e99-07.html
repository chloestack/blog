<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inference Model Parallel Execution Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-03-19f27e99-07-flowchart-title 2026-10-03-19f27e99-07-flowchart-desc">
  <title id="2026-10-03-19f27e99-07-flowchart-title">Inference Model Parallel Execution Flow</title>
  <desc id="2026-10-03-19f27e99-07-flowchart-desc">Shows a parallel execution flow where Haiku immediately displays a draft upon user request, while Opus completes reasoning in the background and replaces the result.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-03-19f27e99-07-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-03-19f27e99-07-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-03-19f27e99-07-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS (drawn before boxes)
       Layout (LR):
         사용자 요청   x=80  cx=160  w=160
         Haiku         x=320 cx=400  w=160   y=80  cy=128
         Opus          x=320 cx=400  w=160   y=208 cy=256
         초안 화면     x=576 cx=680  w=160   y=80  cy=128  (merge target)
         추론 완료     x=576 cx=680  w=160   y=208 cy=256
       ============================================================ -->

  <!-- 사용자 요청 → Haiku  (upper path: y=128) -->
  <!-- exits right edge of 사용자 요청 at (240, 120), enters left edge of Haiku at (320, 120) -->
  <path d="M 240 120 L 320 120" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-03-19f27e99-07-arrow)"/>

  <!-- 사용자 요청 → Opus  (lower path: exits at (240,148), bends to y=248, enters Opus left at (320,248)) -->
  <path d="M 240 148 C 280 148 280 248 320 248" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-03-19f27e99-07-arrow-accent)"/>

  <!-- Haiku → 초안 화면  (straight, y=120) -->
  <path d="M 480 120 L 576 120" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-03-19f27e99-07-arrow)"/>

  <!-- 추론 완료 → 초안 화면  (exits 추론 완료 top at (680,208), goes up to y=168, enters 초안 화면 bottom at (680,168)) -->
  <path d="M 680 208 L 680 168" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-03-19f27e99-07-arrow-accent)"/>

  <!-- Opus → 추론 완료  (straight, y=248) -->
  <path d="M 480 248 L 576 248" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-03-19f27e99-07-arrow-accent)"/>

  <!-- ============================================================
       NODES
       ============================================================ -->

  <!-- User Request  (input treatment: muted@0.10 fill, soft stroke)  cx=160 cy=134 w=160 h=56 -->
  <rect x="80" y="108" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="80" y="108" width="160" height="56" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="88" y="114" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="106" y="123" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="160" y="143" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">User Request</text>

  <!-- Haiku (muted/secondary: paper-2 fill, rule-solid stroke)  cx=400 cy=120 w=160 h=56 -->
  <rect x="320" y="92" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="320" y="92" width="160" height="56" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="328" y="98" width="40" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.60)" stroke-width="0.8"/>
  <text x="348" y="107" fill="#6c8188" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAST</text>
  <text x="400" y="127" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Haiku</text>
  <text x="400" y="143" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Instant draft display</text>

  <!-- Opus Reasoning (focal: accent-tint fill, accent stroke)  cx=400 cy=248 w=160 h=56 -->
  <rect x="320" y="220" width="160" height="56" rx="6" fill="#f8fafb"/>
  <rect x="320" y="220" width="160" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="328" y="226" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="350" y="235" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REASON</text>
  <text x="400" y="255" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Opus Reasoning</text>
  <text x="400" y="271" fill="#0d5763" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Background exec</text>

  <!-- Draft View (backend: white fill, ink stroke)  cx=680 cy=120 w=160 h=76 -->
  <rect x="576" y="84" width="208" height="76" rx="6" fill="#f8fafb"/>
  <rect x="576" y="84" width="208" height="76" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="584" y="90" width="40" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="604" y="99" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
  <text x="680" y="131" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Draft Displayed</text>
  <text x="680" y="149" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">→ replaced by result</text>

  <!-- Reasoning Complete (focal: accent-tint fill, accent stroke)  cx=680 cy=248 w=160 h=56 -->
  <rect x="576" y="220" width="208" height="56" rx="6" fill="#f8fafb"/>
  <rect x="576" y="220" width="208" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="584" y="226" width="48" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="608" y="235" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
  <text x="680" y="255" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Reasoning Done · Replace</text>

  <!-- ============================================================
       ARROW LABELS
       ============================================================ -->

  <!-- Label: upper path (above Haiku) -->
  <rect x="254" y="100" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="280" y="111" fill="#6c8188" font-size="10" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Instant</text>

  <!-- Label: lower path (toward Opus) -->
  <rect x="250" y="175" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="280" y="186" fill="#0d5763" font-size="10" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Parallel</text>

  <!-- Label: Reasoning Complete → Draft View (vertical segment) -->
  <rect x="688" y="179" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="714" y="190" fill="#0d5763" font-size="10" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Replace</text>

  <!-- ============================================================
       LEGEND STRIP
       ============================================================ -->
  <line x1="40" y1="340" x2="920" y2="340" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="356" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- legend: input -->
  <rect x="108" y="345" width="14" height="14" rx="3" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="0.8"/>
  <text x="128" y="356" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Input</text>

  <!-- legend: fast path -->
  <rect x="188" y="345" width="14" height="14" rx="3" fill="#eef2f4" stroke="#c3d0d4" stroke-width="0.8"/>
  <text x="208" y="356" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Fast Path (Haiku)</text>

  <!-- legend: focal / accent -->
  <rect x="348" y="345" width="14" height="14" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="368" y="356" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Reasoning Path (Opus)</text>

  <!-- legend: output -->
  <rect x="508" y="345" width="14" height="14" rx="3" fill="#ffffff" stroke="#122127" stroke-width="0.8"/>
  <text x="528" y="356" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Screen Output</text>

</svg>
</body>
</html>
