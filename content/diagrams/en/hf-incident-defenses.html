<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breached Defenses vs. Defenses That Held</title>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f8fafb; --ink: #122127; --muted: #3f545c; --soft: #6c8188; --accent: #0d5763;
      --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: 'Gothic A1', var(--sans); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Incident Analysis</p>
    <h1>What Was Breached, and What Held to the End</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hf-def-title hf-def-desc">
      <title id="hf-def-title">Breached Defenses vs. Defenses That Held</title>
      <desc id="hf-def-desc">Five defense layers stacked vertically. Broad-scope, long-lived privileges (metadata access, privileged pods, shared admin credentials) were breached; tightly scoped boundaries (Private Link, IAM write deny, CI execution policy) held.</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#f8fafb"/>

      <!-- column headers -->
      <text x="40" y="96" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.12em">Defense Layer</text>
      <text x="892" y="96" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.12em" text-anchor="end">Result</text>

      <!-- Row 1 (focal / broke): shared connector credential -->
      <rect x="40" y="112" width="880" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
      <text x="60" y="140" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">CRED</text>
      <text x="60" y="160" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">Shared Connector Credential</text>
      <text x="300" y="150" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">Single system:masters across clusters — stolen credential means full takeover in seconds</text>
      <rect x="812" y="132" width="88" height="24" rx="4" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
      <text x="856" y="148" fill="#0d5763" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Breached</text>

      <!-- Row 2 (broke): pod IMDS -->
      <rect x="40" y="184" width="880" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="60" y="212" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">IMDS</text>
      <text x="60" y="232" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">Pod &#8594; Node Metadata</text>
      <text x="300" y="222" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">IMDS exposed from pod — node credentials obtained</text>
      <rect x="812" y="204" width="88" height="24" rx="4" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
      <text x="856" y="220" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Breached</text>

      <!-- Row 3 (broke): privileged pod admission -->
      <rect x="40" y="256" width="880" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="60" y="284" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">ADMIT</text>
      <text x="60" y="304" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">Privileged Pod Admission</text>
      <text x="300" y="294" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">No deny policy — hostPath privileged pod enabled node root escape</text>
      <rect x="812" y="276" width="88" height="24" rx="4" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
      <text x="856" y="292" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Breached</text>

      <!-- divider between broke / held -->
      <line x1="40" y1="336" x2="920" y2="336" stroke="rgba(18,33,39,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>

      <!-- Row 4 (held): private link -->
      <rect x="40" y="352" width="880" height="64" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="60" y="380" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">NET</text>
      <text x="60" y="400" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">Prod DB Private Link</text>
      <text x="300" y="390" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">Traffic outside allowlist timed out — prod DB never reached</text>
      <rect x="812" y="372" width="88" height="24" rx="4" fill="transparent" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
      <text x="856" y="388" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Held</text>

      <!-- Row 5 (held): IAM write + CI policy -->
      <rect x="40" y="424" width="880" height="64" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="60" y="452" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">POLICY</text>
      <text x="60" y="472" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">IAM Write · CI Execution Policy</text>
      <text x="300" y="462" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">Enumeration allowed; mutate API denied / malicious PR pipeline hijack blocked</text>
      <rect x="812" y="444" width="88" height="24" rx="4" fill="transparent" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
      <text x="856" y="460" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Held</text>
    </svg>
  </div>
</body>
</html>
