<style>

<body>
<div class="diagram-wrap">

  <rect x="892" y="140" width="36" height="40" rx="20" fill="rgba(13,87,99,0.08)"/>
  <rect x="888" y="140" width="44" height="40" rx="20" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>

  <text x="464" y="352" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">주요 흐름</text>
