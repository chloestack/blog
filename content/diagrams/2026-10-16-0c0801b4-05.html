<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptOps 배포 파이프라인</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-16-0c0801b4-05-promptops-title 2026-10-16-0c0801b4-05-promptops-desc">
  <title id="2026-10-16-0c0801b4-05-promptops-title">PromptOps 배포 파이프라인</title>
  <desc id="2026-10-16-0c0801b4-05-promptops-desc">PR 생성부터 정적 검증, 동적 평가, 사람 리뷰 또는 자동 배포를 거쳐 점진적 롤아웃까지 이어지는 LLM 프롬프트 배포 흐름을 보여주는 플로우차트.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-16-0c0801b4-05-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 (accent) -->
    <marker id="2026-10-16-0c0801b4-05-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 실패 화살표 -->
    <marker id="2026-10-16-0c0801b4-05-arr-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <!-- 경고 화살표 -->
    <marker id="2026-10-16-0c0801b4-05-arr-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       ARROWS (drawn before boxes)
  ───────────────────────────────────────── -->

  <!-- PR → SV (right, horizontal) -->
  <line x1="136" y1="120" x2="216" y2="120" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-05-arr)"/>

  <!-- SV → FB (실패, 아래로) -->
  <path d="M 268 148 L 268 200 L 268 216" stroke="#94382b" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-05-arr-stop)" stroke-dasharray="5,4"/>

  <!-- SV → DE (right, horizontal) -->
  <line x1="320" y1="120" x2="392" y2="120" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-05-arr-acc)"/>

  <!-- DE → RV (지표 미달, 아래로) -->
  <path d="M 480 148 L 480 200 L 480 216" stroke="#a96a08" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-05-arr-warn)"/>

  <!-- DE → CD (지표 통과, right) -->
  <line x1="568" y1="120" x2="640" y2="120" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-05-arr-acc)"/>

  <!-- RV → CD (승인, 위로 올라가서 오른쪽으로) -->
  <path d="M 548 248 Q 548 248 600 248 L 600 136 Q 600 120 616 120" stroke="#a96a08" stroke-width="1" fill="none" marker-end="url(#2026-10-16-0c0801b4-05-arr-warn)" stroke-linejoin="round"/>

  <!-- CD → PR2 (right, horizontal) -->
  <line x1="744" y1="120" x2="812" y2="120" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-05-arr-acc)"/>

  <!-- ─────────────────────────────────────────
       EDGE LABELS (마스킹 포함)
  ───────────────────────────────────────── -->

  <!-- SV → FB 레이블 "실패" -->
  <rect x="250" y="153" width="36" height="13" rx="2" fill="#f8fafb"/>
  <text x="268" y="163" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">실패</text>

  <!-- SV → DE 레이블 "통과" -->
  <rect x="323" y="103" width="36" height="13" rx="2" fill="#f8fafb"/>
  <text x="356" y="113" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">통과</text>

  <!-- DE → RV 레이블 "지표 미달" -->
  <rect x="448" y="153" width="60" height="13" rx="2" fill="#f8fafb"/>
  <text x="480" y="163" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">지표 미달</text>

  <!-- DE → CD 레이블 "지표 통과" -->
  <rect x="572" y="103" width="60" height="13" rx="2" fill="#f8fafb"/>
  <text x="604" y="113" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">지표 통과</text>

  <!-- RV → CD 레이블 "승인" -->
  <rect x="556" y="227" width="36" height="13" rx="2" fill="#f8fafb"/>
  <text x="574" y="237" fill="#a96a08" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" font-weight="500">승인</text>

  <!-- ─────────────────────────────────────────
       NODES (boxes drawn after arrows)
  ───────────────────────────────────────── -->

  <!-- PR 생성 (link/input 처리) -->
  <rect x="32" y="88" width="104" height="64" rx="6" fill="#f8fafb"/>
  <rect x="32" y="88" width="104" height="64" rx="6" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <rect x="40" y="95" width="24" height="11" rx="2" fill="transparent" stroke="rgba(58,84,143,0.35)" stroke-width="0.8"/>
  <text x="52" y="104" fill="rgba(58,84,143,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PR</text>
  <text x="84" y="128" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">PR 생성</text>
  <text x="84" y="144" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프롬프트 변경</text>

  <!-- 정적 검증 (focal) -->
  <rect x="216" y="88" width="104" height="64" rx="6" fill="#f8fafb"/>
  <rect x="216" y="88" width="104" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="224" y="95" width="24" height="11" rx="2" fill="transparent" stroke="rgba(13,87,99,0.35)" stroke-width="0.8"/>
  <text x="236" y="104" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
  <text x="268" y="128" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">정적 검증</text>
  <text x="268" y="144" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">문법 · 스키마</text>

  <!-- 피드백 (stop / fail) — 아래 행 -->
  <rect x="216" y="216" width="104" height="64" rx="6" fill="#f8fafb"/>
  <rect x="216" y="216" width="104" height="64" rx="6" fill="rgba(148,56,43,0.06)" stroke="#94382b" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="224" y="223" width="24" height="11" rx="2" fill="transparent" stroke="rgba(148,56,43,0.35)" stroke-width="0.8"/>
  <text x="236" y="232" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAIL</text>
  <text x="268" y="256" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">피드백</text>
  <text x="268" y="272" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">PR 블록</text>

  <!-- 동적 평가 (focal / accent) -->
  <rect x="392" y="88" width="108" height="64" rx="6" fill="#f8fafb"/>
  <rect x="392" y="88" width="108" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <rect x="400" y="95" width="24" height="11" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="412" y="104" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVAL</text>
  <text x="446" y="128" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">동적 평가</text>
  <text x="446" y="144" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">테스트셋 실행</text>

  <!-- 사람 리뷰 (warn) — 아래 행 -->
  <rect x="412" y="216" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="412" y="216" width="136" height="64" rx="6" fill="rgba(169,106,8,0.07)" stroke="#a96a08" stroke-width="1"/>
  <rect x="420" y="223" width="24" height="11" rx="2" fill="transparent" stroke="rgba(169,106,8,0.35)" stroke-width="0.8"/>
  <text x="432" y="232" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW</text>
  <text x="480" y="256" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">사람 리뷰</text>
  <text x="480" y="272" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">수동 승인</text>

  <!-- 자동 배포 (ok / backend) -->
  <rect x="640" y="88" width="104" height="64" rx="6" fill="#f8fafb"/>
  <rect x="640" y="88" width="104" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="648" y="95" width="24" height="11" rx="2" fill="transparent" stroke="rgba(18,33,39,0.3)" stroke-width="0.8"/>
  <text x="660" y="104" fill="rgba(18,33,39,0.65)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CD</text>
  <text x="692" y="128" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">자동 배포</text>
  <text x="692" y="144" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">canary</text>

  <!-- 점진적 롤아웃 (ok / store) -->
  <rect x="812" y="88" width="116" height="64" rx="6" fill="#f8fafb"/>
  <rect x="812" y="88" width="116" height="64" rx="6" fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <rect x="820" y="95" width="24" height="11" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="832" y="104" fill="rgba(63,84,92,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROLLOUT</text>
  <text x="870" y="124" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">점진적 롤아웃</text>
  <text x="870" y="140" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">10 → 50 → 100%</text>

  <!-- ─────────────────────────────────────────
       LEGEND
  ───────────────────────────────────────── -->
  <line x1="32" y1="304" x2="928" y2="304" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="32" y="316" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 일반 흐름 -->
  <line x1="110" y1="319" x2="128" y2="319" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-05-arr)"/>
  <text x="132" y="323" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">정상 흐름</text>

  <!-- 통과 흐름 -->
  <line x1="224" y1="319" x2="242" y2="319" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-05-arr-acc)"/>
  <text x="246" y="323" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">통과 / 승인</text>

  <!-- 실패 흐름 -->
  <line x1="352" y1="319" x2="370" y2="319" stroke="#94382b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-16-0c0801b4-05-arr-stop)"/>
  <text x="374" y="323" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">실패 / 블록</text>

  <!-- 경고 흐름 -->
  <line x1="476" y1="319" x2="494" y2="319" stroke="#a96a08" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-05-arr-warn)"/>
  <text x="498" y="323" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">지표 미달 / 검토</text>

</svg>
</div>
</body>
</html>
