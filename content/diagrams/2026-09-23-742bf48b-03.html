<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-23-742bf48b-03-scoped-title 2026-09-23-742bf48b-03-scoped-desc">
  <title id="2026-09-23-742bf48b-03-scoped-title">Java Scoped Values 라이프사이클</title>
  <desc id="2026-09-23-742bf48b-03-scoped-desc">ScopedValue.where()로 바인딩을 만들고 run()/call()로 스코프에 진입한 뒤, 스코프 안에서만 K.get()이 유효하며 스코프 종료 시 바인딩이 자동 해제되고 이후 K.get() 호출은 예외를 던진다.</desc>

  <defs>
    <!-- 배경 패턴 없음 — 클린 paper -->
    <!-- 화살표 마커 -->
    <marker id="2026-09-23-742bf48b-03-scoped-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-23-742bf48b-03-scoped-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-23-742bf48b-03-scoped-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 페이지 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────────
       노드 레이아웃 (top→down, 수평 중앙 정렬)
       B: y=60  cx=480  w=320 h=56
       R: y=176 cx=480  w=320 h=56
       G: y=300 cx=300  w=252 h=56   (왼쪽 분기)
       E: y=300 cx=660  w=252 h=56   (오른쪽 분기)
       N: y=420 cx=660  w=252 h=56
  ──────────────────────────────────────────────── -->

  <!-- ── 커넥터 (노드보다 먼저) ── -->

  <!-- B → R (수직, 중앙) -->
  <line x1="480" y1="116" x2="480" y2="172" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-03-scoped-arrow)"/>

  <!-- R → G (오른쪽 엣지 → 왼쪽, L자 경로) -->
  <!-- R 하단(340,232) → G 상단 중앙(300,296) : 수직+수평 엘보 -->
  <path d="M 340,232 L 340,264 L 300,264 L 300,296"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-23-742bf48b-03-scoped-arrow)"/>

  <!-- R → E (오른쪽, L자 경로) -->
  <path d="M 620,232 L 620,264 L 660,264 L 660,296"
        fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-23-742bf48b-03-scoped-arrow-accent)"/>

  <!-- E → N (수직) -->
  <line x1="660" y1="356" x2="660" y2="416" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-23-742bf48b-03-scoped-arrow-muted)"/>

  <!-- ── 노드 B: ScopedValue.where(K, V) ── -->
  <!-- paper mask -->
  <rect x="320" y="60" width="320" height="56" rx="6" fill="#f8fafb"/>
  <!-- styled box — focal (accent) -->
  <rect x="320" y="60" width="320" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- type tag -->
  <rect x="328" y="68" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="348" y="77" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em" font-weight="500">API</text>
  <!-- node name -->
  <text x="480" y="91" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">ScopedValue.where(K, V)</text>
  <!-- sublabel -->
  <text x="480" y="107" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">바인딩 생성</text>

  <!-- 화살표 레이블: B→R -->
  <rect x="458" y="128" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="480" y="137" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIND</text>

  <!-- ── 노드 R: run() / call() 스코프 진입 ── -->
  <rect x="320" y="176" width="320" height="56" rx="6" fill="#f8fafb"/>
  <rect x="320" y="176" width="320" height="56" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="328" y="184" width="48" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="352" y="193" fill="rgba(18,33,39,0.75)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em" font-weight="500">SCOPE</text>
  <text x="480" y="207" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">run() 또는 call()</text>
  <text x="480" y="223" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">스코프 진입</text>

  <!-- R→G 화살표 레이블 (수평 세그먼트 위) -->
  <rect x="298" y="246" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="320" y="255" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

  <!-- R→E 화살표 레이블 (수평 세그먼트 위) -->
  <rect x="618" y="246" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="640" y="255" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT</text>

  <!-- ── 노드 G: K.get() → V (스코프 안에서만 유효) ── -->
  <rect x="172" y="300" width="256" height="56" rx="6" fill="#f8fafb"/>
  <rect x="172" y="300" width="256" height="56" rx="6" fill="rgba(13,87,99,0.05)" stroke="#6c8188" stroke-width="1"/>
  <rect x="180" y="308" width="44" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.25)" stroke-width="0.8"/>
  <text x="202" y="317" fill="rgba(18,33,39,0.6)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em" font-weight="500">VALID</text>
  <text x="300" y="331" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">K.get() → V</text>
  <text x="300" y="347" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">스코프 안에서만 유효</text>

  <!-- ── 노드 E: 스코프 종료 / 바인딩 자동 해제 ── -->
  <rect x="532" y="300" width="256" height="56" rx="6" fill="#f8fafb"/>
  <rect x="532" y="300" width="256" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="540" y="308" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="562" y="317" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em" font-weight="500">CLOSE</text>
  <text x="660" y="331" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">스코프 종료</text>
  <text x="660" y="347" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">바인딩 자동 해제</text>

  <!-- E→N 화살표 레이블 -->
  <rect x="638" y="372" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="660" y="381" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AFTER</text>

  <!-- ── 노드 N: K.get() 호출 → 예외 발생 ── -->
  <rect x="532" y="420" width="256" height="56" rx="6" fill="#f8fafb"/>
  <rect x="532" y="420" width="256" height="56" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="540" y="428" width="44" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.2)" stroke-width="0.8"/>
  <text x="562" y="437" fill="rgba(18,33,39,0.55)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em" font-weight="500">ERROR</text>
  <text x="660" y="451" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">K.get() 호출</text>
  <text x="660" y="467" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">→ 예외 발생</text>

  <!-- ── 범례 구분선 ── -->
  <line x1="32" y1="526" x2="928" y2="526" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 텍스트 -->
  <text x="32" y="540" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em" font-weight="500">LEGEND</text>

  <!-- 범례 항목 1: 포커스 노드 -->
  <rect x="108" y="530" width="14" height="14" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="130" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">핵심 단계</text>

  <!-- 범례 항목 2: 일반 노드 -->
  <rect x="244" y="530" width="14" height="14" rx="3" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="266" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">실행 컨텍스트</text>

  <!-- 범례 항목 3: 조용한 노드 -->
  <rect x="400" y="530" width="14" height="14" rx="3" fill="rgba(13,87,99,0.05)" stroke="#6c8188" stroke-width="1"/>
  <text x="422" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">유효 구간</text>

  <!-- 범례 항목 4: 옵셔널 노드 -->
  <rect x="532" y="530" width="14" height="14" rx="3" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="554" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">스코프 외부 (오류)</text>

  <!-- 범례 항목 5: 점선 화살표 -->
  <line x1="700" y1="537" x2="730" y2="537" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-23-742bf48b-03-scoped-arrow-muted)"/>
  <text x="740" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">해제 후 흐름</text>

</svg>
</div>
</body>
</html>
