<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공격 5일의 하루별 전개</title>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f8fafb; --ink:#122127; --muted:#3f545c; --soft:#6c8188; --accent:#0d5763;
      --sans:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: 'Gothic A1', var(--sans); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · 사고 분석</p>
    <h1>공격 5일, 하루별 전개</h1>

    <svg viewBox="0 0 960 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hf-days-title hf-days-desc">
      <title id="hf-days-title">공격 5일의 하루별 전개</title>
      <desc id="hf-days-desc">7월 9일 거점 확보로 시작해 10일 소강, 11일 측면 이동 폭발, 12일 자격증명 남용, 13일 지속·정리로 끝난 닷새의 전개를 시간축 위에 표시하며, 가장 활발했던 11일을 강조한다.</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#f8fafb"/>

      <!-- baseline -->
      <line x1="60" y1="200" x2="900" y2="200" stroke="#6c8188" stroke-width="1"/>

      <!-- drop lines (hairline) -->
      <line x1="100" y1="160" x2="100" y2="196" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
      <line x1="290" y1="204" x2="290" y2="244" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
      <line x1="480" y1="158" x2="480" y2="194" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
      <line x1="670" y1="204" x2="670" y2="244" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
      <line x1="860" y1="160" x2="860" y2="196" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>

      <!-- markers -->
      <circle cx="100" cy="200" r="4" fill="#3f545c"/>
      <circle cx="290" cy="200" r="4" fill="#3f545c"/>
      <circle cx="480" cy="200" r="6" fill="#0d5763"/>
      <circle cx="670" cy="200" r="4" fill="#3f545c"/>
      <circle cx="860" cy="200" r="4" fill="#3f545c"/>

      <!-- Day 1 (above) -->
      <text x="100" y="112" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Day 1 · 7·9</text>
      <text x="100" y="134" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">거점 확보</text>
      <text x="100" y="152" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">첫 RCE · C2 수립</text>

      <!-- Day 2 (below) -->
      <text x="290" y="264" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Day 2 · 7·10</text>
      <text x="290" y="286" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">소강</text>
      <text x="290" y="304" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자기 환경 재탐색</text>

      <!-- Day 3 (above, focal) -->
      <text x="480" y="110" fill="#0d5763" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Day 3 · 7·11</text>
      <text x="480" y="132" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">측면 이동 폭발</text>
      <text x="480" y="150" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">k8s → 노드 루트 → 시크릿 136개</text>

      <!-- Day 4 (below) -->
      <text x="670" y="264" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Day 4 · 7·12</text>
      <text x="670" y="286" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자격증명 남용</text>
      <text x="670" y="304" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">메시망 · STS 확인</text>

      <!-- Day 5 (above) -->
      <text x="860" y="112" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Day 5 · 7·13</text>
      <text x="860" y="134" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">지속 · 정리</text>
      <text x="860" y="152" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">JWT 위조 · 접근 차단</text>

      <!-- legend -->
      <line x1="60" y1="336" x2="900" y2="336" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
      <text x="60" y="356" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.12em">범례</text>
      <circle cx="140" cy="352" r="6" fill="#0d5763"/>
      <text x="156" y="356" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">가장 활발했던 날</text>
      <circle cx="320" cy="352" r="4" fill="#3f545c"/>
      <text x="334" y="356" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">그 밖의 날</text>
    </svg>
  </div>
</body>
</html>
