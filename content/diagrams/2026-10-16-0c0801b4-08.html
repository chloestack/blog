<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptOps 배포 파이프라인</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-16-0c0801b4-08-promptops-pipeline-title 2026-10-16-0c0801b4-08-promptops-pipeline-desc">
  <title id="2026-10-16-0c0801b4-08-promptops-pipeline-title">PromptOps LLM 프롬프트 배포 파이프라인</title>
  <desc id="2026-10-16-0c0801b4-08-promptops-pipeline-desc">개발 단계에서 스테이징, 배포 승인 홀드아웃, 프로덕션까지 순차적으로 진행되는 LLM 프롬프트 버전 배포 흐름을 보여주는 도식.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-16-0c0801b4-08-pp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-16-0c0801b4-08-pp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="260" fill="#f8fafb"/>

  <!-- ── 커넥터 (박스보다 먼저) ── -->

  <!-- DEV → STAGE -->
  <line x1="228" y1="120" x2="332" y2="120"
        stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-08-pp-arrow)"/>
  <!-- 라벨 마스크 + 텍스트 -->
  <rect x="255" y="104" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="281" y="115"
        fill="#6c8188" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">커밋</text>

  <!-- STAGE → HOLD -->
  <line x1="508" y1="120" x2="612" y2="120"
        stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-08-pp-arrow)"/>
  <rect x="535" y="104" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="561" y="115"
        fill="#6c8188" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">테스트 통과</text>

  <!-- HOLD → PROD (accent) -->
  <line x1="788" y1="120" x2="876" y2="120"
        stroke="#0d5763" stroke-width="1.4" marker-end="url(#2026-10-16-0c0801b4-08-pp-arrow-accent)"/>
  <rect x="812" y="104" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="838" y="115"
        fill="#0d5763" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">승인</text>

  <!-- ── 노드 ── -->

  <!-- DEV: 개발 단계 -->
  <!-- 마스크 -->
  <rect x="52" y="72" width="176" height="96" rx="6" fill="#f8fafb"/>
  <!-- 박스 -->
  <rect x="52" y="72" width="176" height="96" rx="6"
        fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="60" y="80" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="74" y="89"
        fill="rgba(58,84,143,0.8)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">DEV</text>
  <!-- 노드 이름 -->
  <text x="140" y="118"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">개발 단계</text>
  <!-- 서브라벨 -->
  <text x="140" y="136"
        fill="#6c8188" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">테스트셋 접근 가능</text>

  <!-- STAGE: 스테이징 -->
  <rect x="332" y="72" width="176" height="96" rx="6" fill="#f8fafb"/>
  <rect x="332" y="72" width="176" height="96" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="340" y="80" width="36" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="358" y="89"
        fill="rgba(13,87,99,0.8)" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">STAGE</text>
  <text x="420" y="118"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">스테이징</text>
  <text x="420" y="136"
        fill="#6c8188" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">일반 테스트셋</text>

  <!-- HOLD: 배포 승인 (focal) -->
  <rect x="612" y="72" width="176" height="96" rx="6" fill="#f8fafb"/>
  <rect x="612" y="72" width="176" height="96" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.6"/>
  <rect x="620" y="80" width="36" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="638" y="89"
        fill="#0d5763" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">GATE</text>
  <text x="700" y="118"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">배포 승인</text>
  <text x="700" y="136"
        fill="#6c8188" font-size="11" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">홀드아웃 세트</text>

  <!-- PROD: 프로덕션 (focal, accent) -->
  <rect x="876" y="72" width="56" height="96" rx="6" fill="#f8fafb"/>
  <!-- 실제 박스는 아이콘+텍스트가 부족하므로 PROD는 넓게 재배치 -->
  <!-- PROD 노드: x=876이 너무 좁아 x=860, width=72 -->

  <!-- 위 PROD 마스크/박스 취소하고 다시 -->
  <rect x="856" y="72" width="88" height="96" rx="6" fill="#f8fafb"/>
  <rect x="856" y="72" width="88" height="96" rx="6"
        fill="rgba(13,87,99,0.12)" stroke="#0d5763" stroke-width="2"/>
  <rect x="864" y="80" width="32" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="880" y="89"
        fill="#0d5763" font-size="7" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">PROD</text>
  <text x="900" y="118"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">프로덕션</text>
  <text x="900" y="136"
        fill="#0d5763" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif"
        text-anchor="middle">배포</text>

  <!-- ── 범례 구분선 ── -->
  <line x1="40" y1="212" x2="920" y2="212"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 -->
  <text x="40" y="228"
        fill="#3f545c" font-size="10" font-weight="500"
        font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목 1: 단계 박스 -->
  <rect x="116" y="219" width="12" height="12" rx="2"
        fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="134" y="229"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">배포 단계</text>

  <!-- 범례 항목 2: 승인 게이트 -->
  <rect x="256" y="219" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.6"/>
  <text x="274" y="229"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">승인 게이트</text>

  <!-- 범례 항목 3: 배포 완료 -->
  <rect x="396" y="219" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.12)" stroke="#0d5763" stroke-width="2"/>
  <text x="414" y="229"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">배포 완료 (프로덕션)</text>

  <!-- 범례 항목 4: 화살표 -->
  <line x1="596" y1="225" x2="620" y2="225"
        stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-08-pp-arrow)"/>
  <text x="630" y="229"
        fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">단계 전환</text>

</svg>
</div>
</body>
</html>
