<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSE 청크 파싱 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 720px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-17-e8c9176c-03-sse-flow-title 2026-10-17-e8c9176c-03-sse-flow-desc">
  <title id="2026-10-17-e8c9176c-03-sse-flow-title">SSE 청크 파싱 흐름</title>
  <desc id="2026-10-17-e8c9176c-03-sse-flow-desc">네트워크 바이트 스트림이 누적 버퍼에 쌓이고, 이중 개행 구분자를 찾으면 data: 필드를 추출하여 [DONE] 여부에 따라 스트림을 종료하거나 토큰을 방출해 UI를 업데이트하는 Server-Sent Events 파싱 흐름.</desc>

  <defs>
    <!-- 배경 점 패턴 없음 — 클린 페이퍼 -->
    <marker id="2026-10-17-e8c9176c-03-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-17-e8c9176c-03-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-17-e8c9176c-03-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- ── 배경 ── -->
  <rect width="720" height="680" fill="#f8fafb"/>

  <!-- ═══════════════════════════════════════
       커넥터 (노드보다 먼저 그려서 z-order 보장)
  ════════════════════════════════════════ -->

  <!-- IN → BUF: 수직 직선 (같은 x) -->
  <line x1="360" y1="112" x2="360" y2="152"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-03-arr)"/>

  <!-- BUF → SPLIT: 수직 직선 -->
  <line x1="360" y1="204" x2="360" y2="244"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-03-arr)"/>

  <!-- SPLIT → PARSE: 예 — 오른쪽 수직 하향 elbow -->
  <!-- SPLIT 중심: 360,272  PARSE 중심: 536,340 -->
  <!-- right exit x=440, then down, then right to 536 -->
  <path d="M 440,272 L 536,272 L 536,316"
        fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-17-e8c9176c-03-arr-accent)"/>
  <!-- SPLIT 오른쪽 꼭짓점 at x=440 -->
  <line x1="360" y1="272" x2="440" y2="272"
        fill="none" stroke="#0d5763" stroke-width="1.2"/>

  <!-- SPLIT → BUF: 아니오 — 왼쪽 루프 -->
  <!-- SPLIT 왼쪽 x=280, 위로 올라가 BUF 왼쪽 x=280 -->
  <path d="M 280,272 L 220,272 L 220,178 L 280,178"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-17-e8c9176c-03-arr-muted)"/>

  <!-- PARSE → DONE: 수직 직선 -->
  <line x1="536" y1="380" x2="536" y2="412"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-03-arr)"/>

  <!-- DONE → END: 예 — 수직 직선 -->
  <line x1="536" y1="480" x2="536" y2="512"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-03-arr)"/>

  <!-- DONE → EMIT: 아니오 — 왼쪽 elbow -->
  <!-- DONE 중심: 536,446  EMIT 중심: 360,446+72=... 실제 EMIT y=524이 아니라 아래 배치 참고 -->
  <!-- EMIT 중심: 360,544  DONE 하단: 536,480 -->
  <!-- DONE 왼쪽 x=456, y=446 → left to x=360 → down to 516 -->
  <path d="M 456,446 L 360,446 L 360,516"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-17-e8c9176c-03-arr)"/>
  <line x1="536" y1="446" x2="456" y2="446"
        fill="none" stroke="#3f545c" stroke-width="1"/>

  <!-- EMIT → BUF: 왼쪽 큰 루프 (BUF 왼쪽 벽으로) -->
  <!-- EMIT 중심: 360,544  BUF 중심: 360,178 -->
  <!-- EMIT 왼쪽 x=272, 위로 BUF 왼쪽 x=272 -->
  <path d="M 272,544 L 176,544 L 176,178 L 280,178"
        fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-17-e8c9176c-03-arr-accent)"/>

  <!-- ═══════════════════════════════════════
       노드
  ════════════════════════════════════════ -->

  <!-- IN: 네트워크 바이트 스트림 — 입력 노드, oval -->
  <!-- 중심 360,88  w=200 h=48 rx=24 -->
  <rect x="260" y="64" width="200" height="48" rx="20" fill="#f8fafb"/>
  <rect x="260" y="64" width="200" height="48" rx="20"
        fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="360" y="84" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="12" font-weight="600" fill="#122127">네트워크 바이트 스트림</text>
  <text x="360" y="100" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="10" font-weight="400" fill="#3a548f">ReadableStream</text>

  <!-- BUF: 누적 버퍼 — store 노드 -->
  <!-- 중심 360,178  w=176 h=48 rx=6 -->
  <rect x="272" y="154" width="176" height="48" rx="6" fill="#f8fafb"/>
  <rect x="272" y="154" width="176" height="48" rx="6"
        fill="rgba(13,87,99,0.07)" stroke="#0d5763" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="280" y="160" width="36" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="298" y="169"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="7" font-weight="500" fill="rgba(13,87,99,0.8)"
        text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="360" y="184" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="14" font-weight="600" fill="#122127">누적 버퍼</text>
  <text x="360" y="196" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="10" font-weight="400" fill="#3f545c">TextDecoder chunk</text>

  <!-- SPLIT: \n\n 발견? — 결정 다이아몬드 -->
  <!-- 중심 360,272  반폭 80 반높이 40 -->
  <polygon points="360,232 440,272 360,312 280,272" fill="#f8fafb"/>
  <polygon points="360,232 440,272 360,312 280,272"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="360" y="268" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="11" font-weight="500" fill="#122127">\\n\\n</text>
  <text x="360" y="282" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" font-weight="600" fill="#122127">발견?</text>

  <!-- SPLIT 예 레이블 -->
  <rect x="448" y="256" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="458" y="265" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="12" font-weight="500" fill="#0d5763">예</text>

  <!-- SPLIT 아니오 레이블 -->
  <rect x="218" y="256" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="240" y="265" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="12" font-weight="500" fill="#6c8188">아니오</text>

  <!-- PARSE: 메시지 파싱 — backend 노드, accent 포컬 -->
  <!-- 중심 536,348  w=176 h=56 rx=6 -->
  <rect x="448" y="316" width="176" height="64" rx="6" fill="#f8fafb"/>
  <rect x="448" y="316" width="176" height="64" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- 태그 -->
  <rect x="456" y="322" width="32" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="472" y="331"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="7" font-weight="500" fill="rgba(13,87,99,0.8)"
        text-anchor="middle" letter-spacing="0.08em">PARSE</text>
  <text x="536" y="350" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="14" font-weight="600" fill="#122127">메시지 파싱</text>
  <text x="536" y="368" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="10" font-weight="400" fill="#3f545c">data: 필드 추출</text>

  <!-- DONE: [DONE] 인가? — 결정 다이아몬드 -->
  <!-- 중심 536,446  반폭 80 반높이 36 -->
  <polygon points="536,410 616,446 536,482 456,446" fill="#f8fafb"/>
  <polygon points="536,410 616,446 536,482 456,446"
           fill="rgba(45,49,66,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="536" y="440" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="11" font-weight="500" fill="#122127">[DONE]</text>
  <text x="536" y="454" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" font-weight="600" fill="#122127">인가?</text>

  <!-- DONE 예 레이블 -->
  <rect x="548" y="486" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="558" y="495" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="12" font-weight="500" fill="#3f545c">예</text>

  <!-- DONE 아니오 레이블 -->
  <rect x="374" y="430" width="44" height="12" rx="2" fill="#f8fafb"/>
  <text x="396" y="439" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="12" font-weight="500" fill="#6c8188">아니오</text>

  <!-- END: 스트림 종료 — oval 종단 -->
  <!-- 중심 536,548  w=176 h=48 rx=24 -->
  <rect x="448" y="512" width="176" height="48" rx="20" fill="#f8fafb"/>
  <rect x="448" y="512" width="176" height="48" rx="20"
        fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
  <text x="536" y="532" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="14" font-weight="600" fill="#122127">스트림 종료</text>
  <text x="536" y="548" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="10" font-weight="400" fill="#3f545c">connection close</text>

  <!-- EMIT: 토큰 방출 — focal 노드 (accent) -->
  <!-- 중심 360,544  w=176 h=56 rx=6 -->
  <rect x="272" y="516" width="176" height="56" rx="6" fill="#f8fafb"/>
  <rect x="272" y="516" width="176" height="56" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- 태그 -->
  <rect x="280" y="522" width="32" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="296" y="531"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="7" font-weight="500" fill="rgba(13,87,99,0.8)"
        text-anchor="middle" letter-spacing="0.08em">EMIT</text>
  <text x="360" y="548" text-anchor="middle"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="14" font-weight="600" fill="#122127">토큰 방출</text>
  <text x="360" y="564" text-anchor="middle"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="10" font-weight="400" fill="#0d5763">UI 업데이트</text>

  <!-- ═══════════════════════════════════════
       레전드 (하단 수평 스트립)
  ════════════════════════════════════════ -->
  <line x1="32" y1="612" x2="688" y2="612"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="32" y="626"
        font-family="'IBM Plex Mono',ui-monospace,monospace"
        font-size="8" font-weight="500" fill="#6c8188" letter-spacing="0.14em">LEGEND</text>

  <!-- 입력 -->
  <rect x="96" y="618" width="12" height="12" rx="3"
        fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="114" y="628"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" fill="#3f545c">입력</text>

  <!-- 누적/파싱 -->
  <rect x="164" y="618" width="12" height="12" rx="3"
        fill="rgba(13,87,99,0.07)" stroke="#0d5763" stroke-width="1"/>
  <text x="182" y="628"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" fill="#3f545c">누적 / 파싱 / 방출</text>

  <!-- 판단 -->
  <polygon points="310,624 318,618 326,624 318,630"
           fill="rgba(45,49,66,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="334" y="628"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" fill="#3f545c">판단</text>

  <!-- 종료 -->
  <rect x="380" y="618" width="12" height="12" rx="5"
        fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
  <text x="398" y="628"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" fill="#3f545c">종료</text>

  <!-- 루프 -->
  <line x1="452" y1="618" x2="464" y2="618"
        stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="470" y="628"
        font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="11" fill="#3f545c">대기 / 루프</text>

</svg>
</div>
</body>
</html>
