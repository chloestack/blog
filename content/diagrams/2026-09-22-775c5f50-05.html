<body>
<svg

>
  <title id="2026-09-22-775c5f50-05-fallback-title">LLM 폴백 체인</title>
  <desc id="2026-09-22-775c5f50-05-fallback-desc">요청이 gpt-4o-mini(1순위)로 먼저 전달되고, 실패 시 gpt-4o(2순위), claude-haiku(3순위)로 순차 폴백하며, 성공하면 응답을 반환하고 모두 실패하면 503을 반환하는 흐름.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-09-22-775c5f50-05-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 성공 화살표 (accent teal) -->
    <marker id="2026-09-22-775c5f50-05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 실패 화살표 (muted soft) -->
    <marker id="2026-09-22-775c5f50-05-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
    <!-- 에러 화살표 (error red) -->

      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="360" fill="#f8fafb"/>

  <!--
    레이아웃 (LR, 좌→우):
    REQ  x=48, cx=112  w=128  h=52  cy=180
    P1   x=228, cx=312  w=168  h=64  cy=180
    P2   x=428, cx=512  w=168  h=64  cy=180  (아래 폴백: cy=180)
    P3   x=628, cx=712  w=168  h=64  cy=180  (아래 폴백)
    ERR  x=756, cx=828  w=100  h=48  cy=284  (아래 끝)
    RES  x=756, cx=828  w=100  h=52  cy=100  (위 성공)

    폴백 라인: P1→P2 (실패), P2→P3 (실패), P3→ERR (모두 실패)
    성공 라인: P1→RES, P2→RES, P3→RES
    REQ→P1
  -->

  <!-- ======== ARROWS (drawn before boxes) ======== -->

  <!-- REQ → P1 (가운데 수평) -->
  <line x1="144" y1="180" x2="194" y2="180"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-775c5f50-05-arrow)"/>

  <path fill="none" d="M 270 212 L 270 236 Q 270 244 278 244 L 444 244 Q 452 244 452 236 L 452 214"
        stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-22-775c5f50-05-arrow-muted)"/>
  <!-- 라벨: P1→P2 -->
  <rect x="325" y="237" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="361" y="248" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.04em">실패·타임아웃</text>

  <!-- P2 → P3 (실패·레이트리밋, 수평) -->
  <path fill="none" d="M 504 212 L 504 236 Q 504 244 512 244 L 652 244 Q 660 244 660 236 L 660 214"
        stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-22-775c5f50-05-arrow-muted)"/>
  <!-- 라벨: P2→P3 -->
  <rect x="542" y="237" width="80" height="14" rx="2" fill="#f8fafb"/>
  <text x="582" y="248" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.04em">실패·레이트리밋</text>

  <!-- P3 → ERR: 오른쪽 끝에서 아래로 꺾어 ERR 위쪽으로 -->
  <!-- P3 오른쪽 엣지: x=796, cy=180 -->
  <!-- ERR 위쪽: cx=828, y=260 -->

  <path d="M 760 196 L 776 196 Q 784 196 784 204 L 784 266 Q 784 274 792 274 L 806 274"

  <text x="784" y="239" fill="#94382b" font-size="9" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.04em">모두 실패</text>

  <!-- P1 → RES (성공): P1 위쪽(312,148) → 위로 올라가 RES 아래쪽(828,124) -->
  <!-- P1 top: 312,148 / RES bottom: 828,124 -->
  <!-- path: (312,148) → (312,100) → (828,100) → (828,124) -->
  <path d="M 270 148 L 270 68 L 864 68 L 864 146"
        stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-05-arrow-accent)"/>

  <path d="M 478 148 L 478 84 L 864 84 L 864 146"

  <path d="M 686 148 L 686 100 L 864 100 L 864 146"
        stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-05-arrow-accent)"/>

  <!-- 성공 라벨 (P1 성공 선, 위쪽 구간) -->

  <text x="360" y="72" fill="#0d5763" font-size="9" font-family="'IBM Plex Mono', monospace"

  <!-- 이름 -->

  <rect x="196" y="148" width="148" height="64" rx="6"

  <text x="218" y="163" fill="rgba(13,87,99,0.8)" font-size="7"

  <!-- 이름 -->

  <!-- 서브라벨 -->

  <!-- 이름 -->
  <text x="478" y="178" fill="#122127" font-size="14" font-weight="600"

  <!-- 서브라벨 -->

  <!-- P3: claude-haiku 비상용 3순위 (backend) -->
  <rect x="612" y="148" width="148" height="64" rx="6" fill="#f8fafb"/>
  <rect x="612" y="148" width="148" height="64" rx="6"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="620" y="154" width="28" height="11" rx="2"

  <text x="634" y="163" fill="rgba(18,33,39,0.8)" font-size="7"

  <!-- 이름 -->
  <text x="686" y="178" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">claude-haiku</text>
  <!-- 서브라벨 -->
  <text x="686" y="196" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">비상용 3순위</text>

  <!-- RES: 응답 (store/success 처리) -->
  <rect x="808" y="148" width="112" height="64" rx="6" fill="#f8fafb"/>
  <rect x="808" y="148" width="112" height="64" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="816" y="154" width="24" height="11" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="828" y="163" fill="rgba(13,87,99,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <!-- 이름 -->
  <text x="864" y="186" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">응답</text>

  <!-- ERR: 503 반환 (optional/error) -->
  <rect x="808" y="248" width="112" height="52" rx="6" fill="#f8fafb"/>
  <rect x="808" y="248" width="112" height="52" rx="6"
        fill="rgba(148,56,43,0.06)" stroke="rgba(148,56,43,0.6)" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- 태그 -->
  <rect x="816" y="254" width="28" height="11" rx="2"
        fill="transparent" stroke="rgba(148,56,43,0.4)" stroke-width="0.8"/>
  <text x="830" y="263" fill="rgba(148,56,43,0.8)" font-size="7"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERROR</text>
  <!-- 이름 -->
  <text x="864" y="280" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">503 반환</text>

  <!-- ======== LEGEND ======== -->
  <line x1="32" y1="328" x2="928" y2="328"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 항목들 -->
  <!-- 성공 경로 -->
  <line x1="44" y1="343" x2="68" y2="343"
        stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-22-775c5f50-05-arrow-accent)"/>
  <text x="76" y="347" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">성공 경로</text>

  <!-- 폴백 경로 -->
  <line x1="168" y1="343" x2="192" y2="343"
        stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-22-775c5f50-05-arrow-muted)"/>
  <text x="200" y="347" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">폴백 경로</text>

  <!-- 오류 경로 -->
  <line x1="292" y1="343" x2="316" y2="343"

  <text x="324" y="347" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">오류 반환</text>

  <!-- 1순위 박스 범례 -->
  <rect x="412" y="335" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="430" y="346" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">최우선 모델</text>

  <!-- 폴백 박스 범례 -->
  <rect x="532" y="335" width="12" height="12" rx="2"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="550" y="346" fill="#3f545c" font-size="10"
