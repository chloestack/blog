<!DOCTYPE html>

<style>

<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-22-42592f2f-08-wf-title 2026-09-22-42592f2f-08-wf-desc">
  <title id="2026-09-22-42592f2f-08-wf-title">WINDOW 절 최적화 판단 흐름</title>
  <desc id="2026-09-22-42592f2f-08-wf-desc">여러 OVER 절이 동일한 PARTITION BY·ORDER BY를 공유하는지 판단해 WINDOW 절 추출 여부를 결정하는 플로차트. 공유 시 정렬 패스 1회로 줄어들고, 다를 경우 OVER 수만큼 정렬 패스가 발생한다.</desc>

    </marker>
    <marker id="2026-09-22-42592f2f-08-wf-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#f8fafb"/>

  ═══════════════════════════════════════════ -->

  <!-- 예 label -->
  <rect x="490" y="126" width="20" height="12" rx="2" fill="#f8fafb"/>
  <text x="500" y="135" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">예</text>

  <text x="596" y="262" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">OVER 절 유지</text>

  <text x="742" y="88" fill="rgba(40,109,80,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GOOD</text>
  <!-- label -->
  <text x="808" y="102" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">정렬 패스 1회</text>
  <text x="808" y="118" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">공유</text>

  <!-- ═══════════════════════════════════════════
       NODE: BAD — 결과 (warn)
       x=720, y=216, w=176, h=56, cx=808, cy=244
  ═══════════════════════════════════════════ -->

  <rect x="720" y="216" width="176" height="56" rx="6" fill="rgba(148,56,43,0.07)" stroke="rgba(148,56,43,0.6)" stroke-width="1"/>
