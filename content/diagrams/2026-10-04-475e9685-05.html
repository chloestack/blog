<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-04-475e9685-05-routing-title 2026-10-04-475e9685-05-routing-desc">
  <title id="2026-10-04-475e9685-05-routing-title">LLM 요청 라우팅 플로우차트</title>
  <desc id="2026-10-04-475e9685-05-routing-desc">실시간 여부와 복잡도 점수(0.65 기준)로 요청을 분기해 프리미엄 스트리밍, 경량 스트리밍, 배치 최적화 세 경로 중 하나로 라우팅하는 의사결정 흐름도.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-10-04-475e9685-05-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 (accent) -->
    <marker id="2026-10-04-475e9685-05-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ─────────────── 화살표 (nodes 보다 먼저) ─────────────── -->

  <!-- 요청 수신 → 실시간 요청인가 (아래로) -->
  <path d="M480,96 L480,148" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-04-475e9685-05-arr)"/>

  <!-- 실시간? 예 → 복잡도 점수 초과? (오른쪽) -->
  <path d="M548,188 L620,188" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-04-475e9685-05-arr-acc)"/>
  <!-- "예" 라벨 -->
  <rect x="567" y="176" width="22" height="13" rx="2" fill="#f8fafb"/>
  <text x="578" y="186" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- 실시간? 아니오 → 배치 큐 (아래로) -->
  <path d="M480,228 L480,296" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-04-475e9685-05-arr)"/>
  <!-- "아니오" 라벨 -->
  <rect x="455" y="248" width="42" height="13" rx="2" fill="#f8fafb"/>
  <text x="476" y="258" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- 복잡도 초과? 예 → 프리미엄 스트리밍 (오른쪽+위) -->
  <path d="M720,168 L720,120 L808,120" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-04-475e9685-05-arr-acc)"/>
  <!-- "예" 라벨 -->
  <rect x="716" y="135" width="22" height="13" rx="2" fill="#f8fafb"/>
  <text x="727" y="145" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- 복잡도 초과? 아니오 → 경량 스트리밍 (오른쪽+아래) -->
  <path d="M720,208 L720,260 L808,260" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-04-475e9685-05-arr)"/>
  <!-- "아니오" 라벨 -->
  <rect x="697" y="228" width="42" height="13" rx="2" fill="#f8fafb"/>
  <text x="718" y="238" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- 배치 큐 → 고성능 모델 배치 최적화 (아래로) -->
  <path d="M480,352" stroke="#3f545c" stroke-width="1" fill="none"/>
  <path d="M480,352 L480,412" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-04-475e9685-05-arr)"/>

  <!-- ─────────────── 노드 ─────────────── -->

  <!-- 요청 수신 (시작 oval) — link/blue 처리 -->
  <rect x="420" y="44" width="120" height="44" rx="22" fill="#f8fafb"/>
  <rect x="420" y="44" width="120" height="44" rx="22" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="71" fill="#122127" font-size="13" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">요청 수신</text>

  <!-- 실시간 요청인가? (diamond / decision) — accent -->
  <!-- diamond 중심: 480,188  크기: 68×40 -->
  <rect x="412" y="148" width="136" height="80" rx="0" fill="#f8fafb"/>
  <polygon points="480,148 548,188 480,228 412,188" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="184" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">실시간</text>
  <text x="480" y="198" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">요청인가?</text>

  <!-- 복잡도 점수 0.65 초과? (diamond) — accent -->
  <!-- diamond 중심: 720,188  크기: 100×40 -->
  <rect x="620" y="148" width="200" height="80" rx="0" fill="#f8fafb"/>
  <polygon points="720,148 820,188 720,228 620,188" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="720" y="181" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">복잡도 점수</text>
  <text x="720" y="196" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">0.65 초과?</text>

  <!-- 프리미엄 스트리밍 (step) — warn/amber -->
  <rect x="808" y="96" width="120" height="48" rx="6" fill="#f8fafb"/>
  <rect x="808" y="96" width="120" height="48" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="816" y="102" width="44" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.4)" stroke-width="0.8"/>
  <text x="838" y="111" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">PREMIUM</text>
  <text x="868" y="127" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프리미엄</text>
  <text x="868" y="140" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스트리밍</text>

  <!-- 경량 스트리밍 (step) — ok/green, focal -->
  <rect x="808" y="236" width="120" height="48" rx="6" fill="#f8fafb"/>
  <rect x="808" y="236" width="120" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 타입 태그 -->
  <rect x="816" y="242" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="836" y="251" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">STREAM</text>
  <text x="868" y="267" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">경량</text>
  <text x="868" y="280" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스트리밍</text>

  <!-- 배치 큐 (step) — muted -->
  <rect x="420" y="296" width="120" height="56" rx="6" fill="#f8fafb"/>
  <rect x="420" y="296" width="120" height="56" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="428" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.8)" stroke-width="0.8"/>
  <text x="442" y="311" fill="#6c8188" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">ASYNC</text>
  <text x="480" y="330" fill="#3f545c" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">배치 큐</text>
  <text x="480" y="344" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">비동기 처리</text>

  <!-- 고성능 모델 배치 최적화 (step) — ok/green, focal -->
  <rect x="404" y="412" width="152" height="56" rx="6" fill="#f8fafb"/>
  <rect x="404" y="412" width="152" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 타입 태그 -->
  <rect x="412" y="418" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="428" y="427" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">BATCH</text>
  <text x="480" y="447" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">고성능 모델</text>
  <text x="480" y="460" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">배치 최적화</text>

  <!-- ─────────────── 범례 ─────────────── -->
  <line x1="30" y1="530" x2="930" y2="530" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="30" y="543" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- oval: 시작 -->
  <rect x="100" y="534" width="60" height="20" rx="10" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="130" y="549" fill="#3f545c" font-size="8" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">시작점</text>

  <!-- diamond: 분기 -->
  <polygon points="216,544 232,554 216,564 200,554" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="248" y="558" fill="#3f545c" font-size="8" font-family="'IBM Plex Sans KR', sans-serif">분기 조건</text>

  <!-- rect amber: 고비용 경로 -->
  <rect x="316" y="540" width="16" height="16" rx="3" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <text x="338" y="552" fill="#3f545c" font-size="8" font-family="'IBM Plex Sans KR', sans-serif">고비용 경로</text>

  <!-- rect teal: 최적 경로 (focal) -->
  <rect x="432" y="540" width="16" height="16" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="454" y="552" fill="#3f545c" font-size="8" font-family="'IBM Plex Sans KR', sans-serif">최적 경로</text>

  <!-- rect muted: 비동기 -->
  <rect x="540" y="540" width="16" height="16" rx="3" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="562" y="552" fill="#3f545c" font-size="8" font-family="'IBM Plex Sans KR', sans-serif">비동기 처리</text>
</svg>
</div>
</body>
