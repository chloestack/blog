<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }

</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-09-23-151ea635-03-ecst-title 2026-09-23-151ea635-03-ecst-desc">
  <title id="2026-09-23-151ea635-03-ecst-title">동기 체인 vs ECST 레이턴시 비교</title>
  <desc id="2026-09-23-151ea635-03-ecst-desc">동기 호출 체인(서비스 A→B→C, 총 ~60ms)과 Event-Carried State Transfer 적용 후 로컬 조회(총 ~2ms)를 나란히 비교한 흐름도.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-09-23-151ea635-03-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-23-151ea635-03-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-23-151ea635-03-arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- page background -->
  <rect width="960" height="580" fill="#f8fafb"/>

  <!-- ── 칼럼 레이블 ── -->
  <!-- 왼쪽 컬럼 레이블 -->
  <rect x="60" y="36" width="80" height="16" rx="2" fill="transparent" stroke="rgba(18,33,39,0.18)" stroke-width="0.8"/>
  <text x="100" y="48" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em" font-weight="500">BEFORE</text>

  <!-- 오른쪽 컬럼 레이블 -->
  <rect x="524" y="36" width="80" height="16" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="564" y="48" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em" font-weight="500">AFTER</text>

  <!-- divider -->
  <line x1="480" y1="28" x2="480" y2="520" stroke="rgba(18,33,39,0.10)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ════════════════════════════
       왼쪽: 동기 체인
  ════════════════════════════ -->

  <!-- arrows BEFORE boxes (z-order) -->
  <!-- 요청 → 서비스A -->
  <line x1="100" y1="152" x2="100" y2="176" stroke="#3a548f" stroke-width="1.2" marker-end="url(#2026-09-23-151ea635-03-arr-link)"/>
  <!-- 서비스A → 서비스B -->
  <line x1="100" y1="224" x2="100" y2="248" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-23-151ea635-03-arr)"/>
  <!-- 서비스B → 서비스C -->
  <line x1="100" y1="296" x2="100" y2="320" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-23-151ea635-03-arr)"/>
  <!-- 서비스C → 결과 -->
  <line x1="100" y1="368" x2="100" y2="392" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-23-151ea635-03-arr)"/>

  <!-- 동기 체인 요청 박스 (input) -->
  <rect x="32" y="108" width="136" height="44" rx="6" fill="#f8fafb"/>
  <rect x="32" y="108" width="136" height="44" rx="6" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="100" y="127" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">동기 체인 요청</text>
  <text x="100" y="143" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">client call</text>

  <!-- 서비스 A (warn) -->
  <rect x="32" y="176" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="32" y="176" width="136" height="48" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="40" y="182" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="56" y="191" fill="rgba(169,106,8,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="100" y="205" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">서비스 A</text>
  <text x="100" y="218" fill="#a96a08" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">20ms · 원격 호출</text>

  <!-- 서비스 B (warn) -->
  <rect x="32" y="248" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="32" y="248" width="136" height="48" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="40" y="254" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="56" y="263" fill="rgba(169,106,8,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="100" y="277" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">서비스 B</text>
  <text x="100" y="290" fill="#a96a08" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">20ms · 원격 호출</text>

  <!-- 서비스 C (warn) -->
  <rect x="32" y="320" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="32" y="320" width="136" height="48" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="40" y="326" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="56" y="335" fill="rgba(169,106,8,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="100" y="349" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">서비스 C</text>
  <text x="100" y="362" fill="#a96a08" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">20ms · 원격 호출</text>

  <!-- 결과 박스: 총 ~60ms+ (stop/bad) -->
  <rect x="20" y="392" width="160" height="52" rx="6" fill="#f8fafb"/>
  <rect x="20" y="392" width="160" height="52" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1.2"/>
  <text x="100" y="416" fill="#94382b" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">총 ~60ms+</text>
  <text x="100" y="434" fill="#94382b" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">꼬리 레이턴시 포함</text>

  <!-- ════════════════════════════
       오른쪽: ECST 적용
  ════════════════════════════ -->

  <!-- arrows BEFORE boxes -->
  <!-- 요청 → 서비스A (로컬 조회) -->
  <line x1="748" y1="152" x2="748" y2="248" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-23-151ea635-03-arr-accent)"/>

  <!-- 서비스A → 결과 -->
  <line x1="748" y1="296" x2="748" y2="392" stroke="#0d5763" stroke-width="1.5" marker-end="url(#2026-09-23-151ea635-03-arr-accent)"/>

  <!-- ECST 적용 요청 박스 (input, link) -->
  <rect x="680" y="108" width="136" height="44" rx="6" fill="#f8fafb"/>
  <rect x="680" y="108" width="136" height="44" rx="6" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="748" y="127" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">ECST 적용 요청</text>
  <text x="748" y="143" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">client call</text>

  <!-- 서비스 A — 로컬 조회 (focal/accent) -->
  <rect x="680" y="248" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="680" y="248" width="136" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <rect x="688" y="254" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="704" y="263" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <text x="748" y="277" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">서비스 A</text>
  <text x="748" y="290" fill="#0d5763" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">2ms · 로컬 조회</text>

  <!-- 결과 박스: 총 ~2ms (accent/ok) -->
  <rect x="668" y="392" width="160" height="52" rx="6" fill="#f8fafb"/>
  <rect x="668" y="392" width="160" height="52" rx="6" fill="rgba(13,87,99,0.10)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="748" y="416" fill="#0d5763" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">총 ~2ms</text>
  <text x="748" y="434" fill="#0d5763" font-size="11"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">원격 호출 없음</text>

  <!-- ── "원격 호출 없음" 보조 설명 (중간 빈 공간) ── -->
  <!-- 오른쪽 컬럼 중간: 이벤트로 상태 복제 설명 -->
  <rect x="588" y="248" width="80" height="48" rx="6" fill="rgba(13,87,99,0.04)" stroke="rgba(13,87,99,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="628" y="268" fill="#0d5763" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">이벤트로</text>
  <text x="628" y="283" fill="#0d5763" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">상태 복제</text>
  <!-- 점선 화살표: 복제 박스 → 서비스A 로컬 -->
  <path d="M668,272 L680,272" stroke="rgba(13,87,99,0.45)" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#2026-09-23-151ea635-03-arr-accent)"/>

  <!-- ── 레이턴시 배율 콜아웃 ── -->
  <rect x="372" y="400" width="96" height="36" rx="6" fill="rgba(18,33,39,0.04)" stroke="rgba(18,33,39,0.14)" stroke-width="0.8"/>
  <text x="420" y="416" fill="#3f545c" font-size="11" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">30× 빠름</text>
  <text x="420" y="429" fill="#6c8188" font-size="10"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">60ms → 2ms</text>

  <!-- ── LEGEND ── -->
  <line x1="32" y1="516" x2="928" y2="516" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="32" y="530" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em" font-weight="500">LEGEND</text>

  <!-- 범례: 원격 호출 -->
  <rect x="104" y="520" width="12" height="12" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <text x="120" y="530" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">원격 호출</text>

  <!-- 범례: 로컬 조회 (ECST) -->
  <rect x="228" y="520" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="244" y="530" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">로컬 조회 (ECST)</text>

  <!-- 범례: 진입 요청 -->
  <rect x="396" y="520" width="12" height="12" rx="2" fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="412" y="530" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">진입 요청</text>

  <!-- 범례: 이벤트 전파 (점선) -->
  <rect x="532" y="520" width="12" height="12" rx="2" fill="rgba(13,87,99,0.04)" stroke="rgba(13,87,99,0.35)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="548" y="530" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif">이벤트 전파 (비동기)</text>

</svg>
