<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivy 스캔 플로우</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 660"
     role="img"
     aria-labelledby="2026-09-22-98ddabe9-02-trivy-flow-title 2026-09-22-98ddabe9-02-trivy-flow-desc">
  <title id="2026-09-22-98ddabe9-02-trivy-flow-title">Trivy 취약점 스캔 플로우</title>
  <desc id="2026-09-22-98ddabe9-02-trivy-flow-desc">스캔 요청이 들어오면 DB 캐시 유효성을 확인하고, 필요 시 trivy-db를 업데이트한 뒤 타겟 분석·패키지 추출·CVE 대조·심각도 필터링을 거쳐 JSON 또는 SARIF 형식으로 결과를 출력하는 Trivy 스캔 파이프라인 흐름도.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-22-98ddabe9-02-trivy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-22-98ddabe9-02-trivy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-22-98ddabe9-02-trivy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="660" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- R → D (스캔 요청 → DB 캐시) -->
  <path d="M 480 108 L 480 152" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow)"/>

  <!-- D →|아니오| U (좌측 분기: 캐시 무효 → 업데이트) -->
  <path d="M 408 192 Q 400 192 400 200 L 400 248 Q 400 256 392 256 L 364 256" fill="none" stroke="#3a548f" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow-link)"/>
  <!-- 아니오 label -->
  <rect x="342" y="216" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="360" y="227" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- D →|예| A (우측 분기 → 아래: 타겟 분석) -->
  <path d="M 552 192 Q 560 192 560 200 L 560 272 Q 560 280 552 280 L 548 280" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow-accent)"/>
  <!-- 예 label -->
  <rect x="546" y="228" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="558" y="239" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- U → merge point (업데이트 → 합류점) -->
  <path d="M 280 256 L 248 256 Q 240 256 240 264 L 240 296 Q 240 304 248 304 L 396 304 Q 404 304 404 312 L 404 348" fill="none" stroke="#3a548f" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow-link)"/>

  <!-- A (예 경로) → A node: 예 분기에서 타겟 분석으로 내려오는 경로 -->
  <!-- 예 경로: 560,280 → 타겟 분석 노드 오른쪽 엣지로. 타겟 분석 노드: cx=480, y=256~304 -->
  <path d="M 548 280 L 536 280" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow-accent)"/>

  <!-- 타겟 분석(A) → 패키지 추출(P) -->
  <path d="M 480 308 L 480 348" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow-accent)"/>

  <!-- P → CVE 대조 -->
  <path d="M 480 404 L 480 444" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow-accent)"/>

  <!-- CVE → 심각도 필터 -->
  <path d="M 480 500 L 480 540" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow)"/>

  <!-- 심각도 필터 → 결과 출력 -->
  <path d="M 480 596 L 480 ..." fill="none" stroke="#3f545c" stroke-width="0"/>
  <!-- recalculate: 심각도 필터 y=540, h=56 → bottom=596; 결과 출력 y=608 -->
  <path d="M 480 596 L 480 608" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-22-98ddabe9-02-trivy-arrow)"/>

  <!-- ===================== NODES ===================== -->

  <!-- [R] 스캔 요청 — input type, oval start -->
  <!-- oval: cx=480, cy=88, rx=80, ry=20 -->
  <ellipse cx="480" cy="88" rx="80" ry="20" fill="#f8fafb"/>
  <ellipse cx="480" cy="88" rx="80" ry="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="92" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">스캔 요청</text>

  <!-- {D} DB 캐시 유효한가 — decision diamond -->
  <!-- diamond: center (480, 192), half-w=72, half-h=40 -->
  <rect x="408" y="152" width="144" height="80" rx="6" fill="#f8fafb"/>
  <polygon points="480,152 552,192 480,232 408,192" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="188" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">DB 캐시</text>
  <text x="480" y="203" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">유효한가?</text>

  <!-- [U] trivy-db 업데이트 — warn/external type -->
  <!-- box: x=176, y=228, w=168, h=56 -->
  <rect x="176" y="228" width="168" height="56" rx="6" fill="#f8fafb"/>
  <rect x="176" y="228" width="168" height="56" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="252" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">trivy-db</text>
  <text x="260" y="268" fill="#122127" font-size="12" font-weight="400" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">업데이트</text>

  <!-- [A] 타겟 분석 — focal/accent -->
  <!-- box: x=388, y=256, w=184, h=52 -->
  <rect x="388" y="256" width="184" height="52" rx="6" fill="#f8fafb"/>
  <rect x="388" y="256" width="184" height="52" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="396" y="262" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="418" y="271" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="480" y="290" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">타겟 분석</text>

  <!-- [P] 패키지 목록 추출 — backend -->
  <!-- box: x=352, y=348, w=256, h=56 -->
  <rect x="352" y="348" width="256" height="56" rx="6" fill="#f8fafb"/>
  <rect x="352" y="348" width="256" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="360" y="354" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="382" y="363" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="480" y="376" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">패키지 목록 추출</text>
  <text x="480" y="392" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">내부 SBOM</text>

  <!-- [CV] CVE 대조 — focal (accent, 1 of 2) -->
  <!-- box: x=372, y=444, w=216, h=56 -->
  <rect x="372" y="444" width="216" height="56" rx="6" fill="#f8fafb"/>
  <rect x="372" y="444" width="216" height="56" rx="6" fill="rgba(13,87,99,0.10)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="380" y="450" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.50)" stroke-width="0.8"/>
  <text x="402" y="459" fill="rgba(13,87,99,0.9)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="480" y="478" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">CVE 대조</text>

  <!-- [F] 심각도 필터·무시 규칙 — muted/soft -->
  <!-- box: x=356, y=540, w=248, h=56 -->
  <rect x="356" y="540" width="248" height="56" rx="6" fill="#f8fafb"/>
  <rect x="356" y="540" width="248" height="56" rx="6" fill="rgba(63,84,92,0.06)" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="364" y="546" width="44" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="386" y="555" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="480" y="572" fill="#3f545c" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">심각도 필터 · 무시 규칙</text>

  <!-- [O] 결과 출력 — backend/ok -->
  <!-- box: x=352, y=608, w=256, h=56, oval end -->
  <rect x="388" y="608" width="184" height="44" rx="22" fill="#f8fafb"/>
  <rect x="388" y="608" width="184" height="44" rx="22" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="480" y="627" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">결과 출력</text>
  <text x="480" y="641" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">JSON · SARIF</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="652" x2="920" y2="652" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Legend items -->
  <!-- 분기 없음 경로 -->
  <rect x="40" y="660" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="56" y="669" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">주요 단계</text>

  <rect x="156" y="660" width="10" height="10" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="172" y="669" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">선택적 갱신</text>

  <rect x="280" y="660" width="10" height="10" rx="2" fill="rgba(63,84,92,0.06)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="296" y="669" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">후처리</text>

  <rect x="380" y="660" width="10" height="10" rx="22" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="396" y="669" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">출력 종단</text>

</svg>
</body>
</html>
