<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 0; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-10-19-6b5f07e6-03-graphify-dep-title 2026-10-19-6b5f07e6-03-graphify-dep-desc">
  <title id="2026-10-19-6b5f07e6-03-graphify-dep-title">Graphify 의존 관계 그래프</title>
  <desc id="2026-10-19-6b5f07e6-03-graphify-dep-desc">Graphify가 코드베이스에서 추출·추론한 모듈 간 의존 관계를 보여주는 도식. UserService는 AuthMiddleware를 직접 import(추출된 관계)하고, TokenHelper와 공유 타입을 통해 연결(추론된 관계)된다.</desc>

  <defs>
    <!-- 배경 점 패턴 없음 — 기본 clean paper -->
    <marker id="2026-10-19-6b5f07e6-03-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-19-6b5f07e6-03-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-19-6b5f07e6-03-arr-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="320" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       화살표는 노드보다 먼저 그림 (z-order)
  ───────────────────────────────────────── -->

  <!-- A → B : [EXTRACTED] import  (직선, 같은 y축) -->
  <!-- A 오른쪽 중앙: x=356, y=144  /  B 왼쪽 중앙: x=500, y=144 -->
  <line x1="356" y1="144" x2="494" y2="144"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-03-arr-muted)"/>

  <!-- 화살표 라벨 — A→B 중간점 x=428, y=144, 라벨은 위에 -->
  <rect x="384" y="124" width="88" height="14" rx="2" fill="#f8fafb"/>
  <text x="428" y="134"
        font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3f545c"
        text-anchor="middle" letter-spacing="0.04em">EXTRACTED</text>

  <!-- A → C : [INFERRED] 공유 타입  (엘보 커넥터: A 아래 → C 왼쪽) -->
  <!-- A 아래 중앙: x=280, y=188  /  C 왼쪽 중앙: x=664, y=216 -->
  <!-- 경로: A바닥(280,188) → 아래(280,228) → 오른쪽(664,228) → C왼쪽(664,216) -->
  <path d="M 280 188 L 280 228 Q 280 236 288 236 L 672 236"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4"
        marker-end="url(#2026-10-19-6b5f07e6-03-arr-soft)"/>

  <!-- 화살표 라벨 — 아랫 수평 구간 중간 x=472, y=236, 라벨은 아래에 -->
  <rect x="424" y="240" width="96" height="14" rx="2" fill="#f8fafb"/>
  <text x="472" y="250"
        font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6c8188"
        text-anchor="middle" letter-spacing="0.04em">INFERRED</text>

  <!-- ─────────────────────────────────────────
       노드
  ───────────────────────────────────────── -->

  <!-- A: UserService — focal (accent) -->
  <!-- 중심 cx=280, cy=144 / w=152, h=88 -->
  <rect x="204" y="100" width="152" height="88" rx="6" fill="#f8fafb"/>
  <rect x="204" y="100" width="152" height="88" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="212" y="108" width="32" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="228" y="117"
        font-family="'IBM Plex Mono', monospace" font-size="8" fill="rgba(13,87,99,0.8)"
        text-anchor="middle" letter-spacing="0.08em">SVC</text>
  <!-- 이름 -->
  <text x="280" y="154"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="14" font-weight="600" fill="#122127" text-anchor="middle">UserService</text>
  <!-- 서브라벨 -->
  <text x="280" y="172"
        font-family="'IBM Plex Mono', monospace" font-size="11" fill="#3f545c"
        text-anchor="middle">신규 모듈</text>

  <!-- B: AuthMiddleware — backend -->
  <!-- 중심 cx=588, cy=144 / w=176, h=88 -->
  <rect x="500" y="100" width="176" height="88" rx="6" fill="#f8fafb"/>
  <rect x="500" y="100" width="176" height="88" rx="6"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="508" y="108" width="36" height="12" rx="2"
        fill="transparent" stroke="rgba(18,33,39,0.4)" stroke-width="0.8"/>
  <text x="526" y="117"
        font-family="'IBM Plex Mono', monospace" font-size="8" fill="rgba(18,33,39,0.8)"
        text-anchor="middle" letter-spacing="0.08em">MID</text>
  <!-- 이름 -->
  <text x="588" y="154"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="14" font-weight="600" fill="#122127" text-anchor="middle">AuthMiddleware</text>
  <!-- 서브라벨 -->
  <text x="588" y="172"
        font-family="'IBM Plex Mono', monospace" font-size="11" fill="#3f545c"
        text-anchor="middle">검증 완료</text>

  <!-- C: TokenHelper — store/state -->
  <!-- 중심 cx=752, cy=188 / w=152, h=88 — A 아래에서 엘보로 연결 -->
  <!-- 노드를 오른쪽 아래에 배치 -->
  <rect x="676" y="172" width="152" height="88" rx="6" fill="#f8fafb"/>
  <rect x="676" y="172" width="152" height="88" rx="6"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="684" y="180" width="32" height="12" rx="2"
        fill="transparent" stroke="rgba(63,84,92,0.4)" stroke-width="0.8"/>
  <text x="700" y="189"
        font-family="'IBM Plex Mono', monospace" font-size="8" fill="rgba(63,84,92,0.8)"
        text-anchor="middle" letter-spacing="0.08em">UTIL</text>
  <!-- 이름 -->
  <text x="752" y="222"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="14" font-weight="600" fill="#122127" text-anchor="middle">TokenHelper</text>
  <!-- 서브라벨 -->
  <text x="752" y="240"
        font-family="'IBM Plex Mono', monospace" font-size="11" fill="#3f545c"
        text-anchor="middle">주의 필요</text>

  <!-- ─────────────────────────────────────────
       관계 유형 범례 레이블 (edge label 보완)
  ───────────────────────────────────────── -->

  <!-- import 라벨 (화살표 아래) -->
  <rect x="384" y="148" width="88" height="14" rx="2" fill="#f8fafb"/>
  <text x="428" y="158"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="10" fill="#3f545c" text-anchor="middle">import 의존</text>

  <!-- ─────────────────────────────────────────
       범례 — 하단 수평 스트립
  ───────────────────────────────────────── -->
  <line x1="32" y1="278" x2="928" y2="278"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 제목 -->
  <text x="32" y="294"
        font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3f545c"
        letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="104" y="284" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="122" y="294"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="11" fill="#3f545c">신규 모듈</text>

  <!-- backend -->
  <rect x="208" y="284" width="12" height="12" rx="2"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="226" y="294"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="11" fill="#3f545c">검증 완료</text>

  <!-- store -->
  <rect x="312" y="284" width="12" height="12" rx="2"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="330" y="294"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="11" fill="#3f545c">주의 필요</text>

  <!-- 실선 화살표 -->
  <line x1="440" y1="290" x2="468" y2="290"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-03-arr-muted)"/>
  <text x="476" y="294"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="11" fill="#3f545c">추출된 관계</text>

  <!-- 점선 화살표 -->
  <line x1="600" y1="290" x2="628" y2="290"
        stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-19-6b5f07e6-03-arr-soft)"/>
  <text x="636" y="294"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        font-size="11" fill="#3f545c">추론된 관계</text>

</svg>
</div>
</body>
</html>
