<!DOCTYPE html>

<style>

<body>

<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg"

  <desc id="2026-10-16-0c0801b4-02-pao-desc">템플릿 본문·메타데이터·평가 기준 세 입력 요소가 프롬프트 아티팩트 v1.4.2로 합쳐지고, 아티팩트가 레지스트리(버전 저장소)에 등록되는 흐름을 보여준다.</desc>

  <defs>

    <marker id="2026-10-16-0c0801b4-02-pao-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

  <!-- 배경 -->
  <rect width="960" height="320" fill="#f8fafb"/>

       화살표를 노드보다 먼저 그려야 z-order 유지
  ─────────────────────────────────────────────── -->

  <!-- 템플릿 본문 → 아티팩트 (입력 상단 → 좌측 중단) -->

  <!-- 수직 경유: T 우측(252,84) → 엘보우(440,84) → (440,156) → AR(504,156) -->
  <path d="M 252,84 H 440 V 156 H 504"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-02-pao-arrow)"/>

  <!-- 메타데이터 → 아티팩트 (직선, 동일 y축) -->
  <!-- M 중심: (172,160)  AR 좌측: (504,160) -->
  <line x1="252" y1="160" x2="504" y2="160"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-02-pao-arrow)"/>

  <!-- 평가 기준 → 아티팩트 (입력 하단 → 좌측 중단) -->
  <!-- E 중심: (172,236)  AR 좌측: (504,164) -->
  <!-- 수직 경유: E 우측(252,236) → 엘보우(440,236) → (440,164) → AR(504,164) -->
  <path d="M 252,236 H 440 V 164 H 504"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-16-0c0801b4-02-pao-arrow)"/>

  <!-- 아티팩트 → 레지스트리 (악센트 선) -->
  <!-- AR 우측: (676,160)  R 좌측: (732,160) -->
  <line x1="676" y1="160" x2="732" y2="160"
        fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-16-0c0801b4-02-pao-arrow-accent)"/>

  <!-- ───────────────────────────────────────────
       노드
  ─────────────────────────────────────────────── -->

  <!-- 템플릿 본문 (input 타입) -->
  <!-- x=52, y=48, w=200, h=72, cx=152, cy=84 -->
  <rect x="52" y="48" width="200" height="72" rx="6" fill="#f8fafb"/>
  <rect x="52" y="48" width="200" height="72" rx="6"

  <rect x="60" y="56" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="74" y="65"
        fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="152" y="88"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">템플릿 본문</text>
  <text x="152" y="106"

        text-anchor="middle">변수 포함 텍스트</text>

  <!-- 메타데이터 (input 타입) -->

  <rect x="52" y="124" width="200" height="72" rx="6"
        fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="60" y="132" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="74" y="141"
        fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="152" y="164"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"

  <text x="152" y="182"

        text-anchor="middle">모델 · 작성자 · 목적</text>

  <!-- 평가 기준 (input 타입) -->

  <rect x="52" y="200" width="200" height="72" rx="6" fill="#f8fafb"/>
  <rect x="52" y="200" width="200" height="72" rx="6"
        fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="60" y="208" width="28" height="12" rx="2"
        fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="74" y="217"

  <text x="152" y="240"

  <rect x="504" y="112" width="172" height="96" rx="6" fill="#f8fafb"/>
  <rect x="504" y="112" width="172" height="96" rx="6"

  <text x="760" y="137"

        text-anchor="middle" letter-spacing="0.08em">STORE</text>

  <line x1="32" y1="288" x2="928" y2="288"

  <!-- 범례 항목 1: 입력 -->
  <rect x="32" y="298" width="10" height="10" rx="2"
        fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="0.8"/>
  <text x="48" y="307"
        fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">
    입력 요소
  </text>

  <!-- 범례 항목 2: 핵심 아티팩트 -->
  <rect x="148" y="298" width="10" height="10" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="164" y="307"

  </text>

  <!-- 범례 항목 3: 저장소 -->
  <rect x="296" y="298" width="10" height="10" rx="2"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="0.8"/>
  <text x="312" y="307"
