<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="2026-10-05-5c88b64b-06-hitl-title 2026-10-05-5c88b64b-06-hitl-desc">
  <title id="2026-10-05-5c88b64b-06-hitl-title">비가역 동작 여부에 따른 Human-in-the-Loop 게이트 결정 흐름</title>
  <desc id="2026-10-05-5c88b64b-06-hitl-desc">비가역 동작인지 여부를 시작점으로, 롤백 가능 여부와 감사 충분 여부를 순서대로 판단해 HitL 사전 승인, 자동 실행+롤백 대기, 또는 사후 검토 중 하나로 귀결되는 의사결정 흐름도.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-10-05-5c88b64b-06-hitl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-06-hitl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="560" fill="#f8fafb"/>

  <!-- ============================================================
       ARROWS (drawn before boxes)
  ============================================================ -->

  <!-- Q → Y1 (비가역 = 예: right then up-right to Y1) -->
  <!-- Q center: 360,112  Y1 center: 544,212 -->
  <!-- Exit Q right edge: 432,112 → go right to 544 → down to 200 -->
  <path d="M432,112 L544,112 L544,196" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow-accent)"/>
  <!-- label "예" on horizontal segment -->
  <rect x="464" y="100" width="24" height="16" rx="2" fill="#f8fafb"/>
  <text x="476" y="112" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">예</text>

  <!-- Q → Y2 (아니오: down) -->
  <!-- Q center: 360,112  Y2 center: 360,252 -->
  <!-- Exit Q bottom: 360,140 → down to 228 -->
  <path d="M360,140 L360,228" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow)"/>
  <!-- label "아니오" -->
  <rect x="322" y="172" width="44" height="16" rx="2" fill="#f8fafb"/>
  <text x="344" y="180" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" dominant-baseline="middle">아니오</text>

  <!-- Y2 → AR (예: right) -->
  <!-- Y2 center: 360,252  AR center: 544,252 -->
  <!-- Exit Y2 right: 432,252 → AR left: 480,252 -->
  <path d="M432,252 L476,252" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow)"/>
  <!-- label "예" -->
  <rect x="444" y="240" width="24" height="16" rx="2" fill="#f8fafb"/>
  <text x="456" y="248" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" dominant-baseline="middle">예</text>

  <!-- Y2 → Y3 (아니오: down) -->
  <!-- Y2 center: 360,252  Y3 center: 360,392 -->
  <path d="M360,276 L360,368" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow)"/>
  <!-- label "아니오" -->
  <rect x="322" y="312" width="44" height="16" rx="2" fill="#f8fafb"/>
  <text x="344" y="320" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" dominant-baseline="middle">아니오</text>

  <!-- Y3 → PH (예: right) -->
  <!-- Y3 center: 360,392  PH center: 544,392 -->
  <path d="M432,392 L476,392" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow)"/>
  <!-- label "예" -->
  <rect x="444" y="380" width="24" height="16" rx="2" fill="#f8fafb"/>
  <text x="456" y="388" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" dominant-baseline="middle">예</text>

  <!-- Y3 → Y1 (아니오: left then up to Y1) -->
  <!-- Y3 center: 360,392  Y1 center: 544,212 -->
  <!-- Exit Y3 left: 288,392 → go left to 176 → up to 212 → right to 480 -->
  <path d="M288,392 L176,392 L176,212 L480,212" fill="none" stroke="#0d5763" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow-accent)"/>
  <!-- label "아니오" on bottom horizontal segment -->
  <rect x="200" y="380" width="44" height="16" rx="2" fill="#f8fafb"/>
  <text x="222" y="388" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle" dominant-baseline="middle">아니오</text>

  <!-- ============================================================
       NODES
  ============================================================ -->

  <!-- START node (oval) -->
  <!-- center: 360,52 -->
  <rect x="316" y="36" width="88" height="32" fill="#f8fafb"/>
  <ellipse cx="360" cy="52" rx="44" ry="16" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="360" y="52" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="middle">시작</text>

  <!-- Start → Q arrow -->
  <path d="M360,68 L360,84" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow)"/>

  <!-- Q: 비가역 동작인가 (diamond) -->
  <!-- center: 360,112, width:144, height:56 -->
  <rect x="284" y="84" width="152" height="56" fill="#f8fafb"/>
  <polygon points="360,84 432,112 360,140 288,112" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="360" y="108" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">비가역</text>
  <text x="360" y="122" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">동작인가?</text>

  <!-- Y1: HitL 게이트 / 사전 승인 (focal, rect) -->
  <!-- center: 544,228, width:136, height:64 -->
  <rect x="472" y="196" width="144" height="64" rx="6" fill="#f8fafb"/>
  <rect x="472" y="196" width="144" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- type tag -->
  <rect x="480" y="204" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="498" y="212" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GATE</text>
  <text x="544" y="238" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">HitL 게이트</text>
  <text x="544" y="252" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">사전 승인</text>

  <!-- Y2: 롤백 가능한가 (diamond) -->
  <!-- center: 360,252, width:144, height:48 -->
  <rect x="284" y="228" width="152" height="48" fill="#f8fafb"/>
  <polygon points="360,228 432,252 360,276 288,252" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="360" y="248" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">롤백</text>
  <text x="360" y="262" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">가능한가?</text>

  <!-- AR: 자동 실행 + 롤백 대기 (rect, ok style) -->
  <!-- center: 544,252, width:128, height:60 -->
  <rect x="476" y="220" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="476" y="220" width="136" height="64" rx="6" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <!-- type tag -->
  <rect x="484" y="228" width="36" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.4)" stroke-width="0.8"/>
  <text x="502" y="236" fill="rgba(40,109,80,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTO</text>
  <text x="544" y="260" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">자동 실행</text>
  <text x="544" y="274" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">+ 롤백 대기</text>

  <!-- Y3: 감사 충분한가 (diamond) -->
  <!-- center: 360,392, width:144, height:48 -->
  <rect x="284" y="368" width="152" height="48" fill="#f8fafb"/>
  <polygon points="360,368 432,392 360,416 288,392" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="360" y="388" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">감사</text>
  <text x="360" y="402" fill="#122127" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">충분한가?</text>

  <!-- PH: 사후 검토 / 로그 기반 (rect, muted style) -->
  <!-- center: 544,392, width:128, height:60 -->
  <rect x="476" y="360" width="136" height="64" rx="6" fill="#f8fafb"/>
  <rect x="476" y="360" width="136" height="64" rx="6" fill="rgba(195,208,212,0.25)" stroke="#c3d0d4" stroke-width="1"/>
  <!-- type tag -->
  <rect x="484" y="368" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.4)" stroke-width="0.8"/>
  <text x="502" y="376" fill="rgba(108,129,136,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIT</text>
  <text x="544" y="400" fill="#122127" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" font-weight="600" text-anchor="middle">사후 검토</text>
  <text x="544" y="414" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">로그 기반</text>

  <!-- ============================================================
       LEGEND
  ============================================================ -->
  <line x1="40" y1="488" x2="680" y2="488" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="40" y="502" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- Legend items -->
  <!-- Decision diamond -->
  <polygon points="72,518 84,512 96,518 84,524" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="102" y="522" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" dominant-baseline="middle">판단</text>

  <!-- HitL gate -->
  <rect x="152" y="510" width="20" height="16" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="178" y="522" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" dominant-baseline="middle">HitL 게이트</text>

  <!-- Auto -->
  <rect x="276" y="510" width="20" height="16" rx="3" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="302" y="522" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" dominant-baseline="middle">자동 처리</text>

  <!-- Audit -->
  <rect x="396" y="510" width="20" height="16" rx="3" fill="rgba(195,208,212,0.25)" stroke="#c3d0d4" stroke-width="1"/>
  <text x="422" y="522" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" dominant-baseline="middle">사후 검토</text>

  <!-- Fallback arrow (dashed) -->
  <line x1="520" y1="518" x2="548" y2="518" stroke="#0d5763" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#2026-10-05-5c88b64b-06-hitl-arrow-accent)"/>
  <text x="554" y="522" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" dominant-baseline="middle">강제 HitL</text>

</svg>
</body>
</html>
