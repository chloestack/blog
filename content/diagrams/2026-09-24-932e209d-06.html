<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 200" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-09-24-932e209d-06-dspy-flow-title 2026-09-24-932e209d-06-dspy-flow-desc">
  <title id="2026-09-24-932e209d-06-dspy-flow-title">DSPy 파라미터 저장·서빙 흐름</title>
  <desc id="2026-09-24-932e209d-06-dspy-flow-desc">DSPy 컴파일을 오프라인에서 실행한 뒤 파라미터를 JSON으로 저장하고, 서빙 환경에서 로딩해 최적화된 상태로 추론을 제공하는 4단계 흐름.</desc>

  <defs>
    <!-- arrow: muted -->
    <marker id="2026-09-24-932e209d-06-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- arrow: accent -->
    <marker id="2026-09-24-932e209d-06-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="200" fill="#f8fafb"/>

  <!-- ── connectors (drawn before boxes) ── -->
  <!-- COMP → SAVE -->
  <line x1="228" y1="100" x2="296" y2="100" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-932e209d-06-arr)"/>
  <!-- SAVE → LOAD -->
  <line x1="436" y1="100" x2="504" y2="100" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-932e209d-06-arr)"/>
  <!-- LOAD → SERVE -->
  <line x1="644" y1="100" x2="712" y2="100" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-24-932e209d-06-arr-acc)"/>

  <!-- ── node boxes ── -->

  <!-- COMP: 컴파일 실행 / 오프라인 — warn style -->
  <!-- paper mask -->
  <rect x="64" y="64" width="164" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="64" y="64" width="164" height="72" rx="6" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <!-- type tag -->
  <rect x="72" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="88" y="81" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <!-- name -->
  <text x="146" y="101" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">컴파일 실행</text>
  <!-- sublabel -->
  <text x="146" y="120" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">오프라인</text>

  <!-- SAVE: 파라미터 저장 / JSON — mute style -->
  <!-- paper mask -->
  <rect x="296" y="64" width="140" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="296" y="64" width="140" height="72" rx="6" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <!-- type tag -->
  <rect x="304" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.60)" stroke-width="0.8"/>
  <text x="320" y="81" fill="#6c8188" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE</text>
  <!-- name -->
  <text x="366" y="101" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">파라미터 저장</text>
  <!-- sublabel -->
  <text x="366" y="120" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">JSON</text>

  <!-- LOAD: 서빙 환경 / 파라미터 로딩 — acc style (focal) -->
  <!-- paper mask -->
  <rect x="504" y="64" width="140" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="504" y="64" width="140" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- type tag -->
  <rect x="512" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="528" y="81" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD</text>
  <!-- name -->
  <text x="574" y="101" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">서빙 환경</text>
  <!-- sublabel -->
  <text x="574" y="120" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">파라미터 로딩</text>

  <!-- SERVE: 추론 서빙 / 최적화된 상태 — ok style -->
  <!-- paper mask -->
  <rect x="712" y="64" width="164" height="72" rx="6" fill="#f8fafb"/>
  <!-- styled box -->
  <rect x="712" y="64" width="164" height="72" rx="6" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <!-- type tag -->
  <rect x="720" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="736" y="81" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
  <!-- name -->
  <text x="794" y="101" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">추론 서빙</text>
  <!-- sublabel -->
  <text x="794" y="120" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">최적화된 상태</text>

  <!-- ── legend strip ── -->
  <line x1="32" y1="164" x2="928" y2="164" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend: COMP warn -->
  <rect x="32" y="176" width="10" height="10" rx="2" fill="#f5e8cc" stroke="#a96a08" stroke-width="1"/>
  <text x="48" y="185" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">컴파일 단계</text>

  <!-- legend: SAVE mute -->
  <rect x="160" y="176" width="10" height="10" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="176" y="185" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">저장 단계</text>

  <!-- legend: LOAD acc -->
  <rect x="272" y="176" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="288" y="185" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">서빙 준비 (focal)</text>

  <!-- legend: SERVE ok -->
  <rect x="420" y="176" width="10" height="10" rx="2" fill="#d6e9de" stroke="#286d50" stroke-width="1"/>
  <text x="436" y="185" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace">서빙 완료</text>
</svg>
</body>
</html>
