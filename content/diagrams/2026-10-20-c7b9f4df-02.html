<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPO 유도 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  viewBox="0 0 720 600"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="2026-10-20-c7b9f4df-02-dpo-flow-title 2026-10-20-c7b9f4df-02-dpo-flow-desc"
>
  <title id="2026-10-20-c7b9f4df-02-dpo-flow-title">DPO 손실 함수 유도 흐름</title>
  <desc id="2026-10-20-c7b9f4df-02-dpo-flow-desc">RLHF 목적함수에서 출발해 닫힌 해, 정책 비율로의 보상 표현, Bradley-Terry 대입, Z(x) 상쇄를 거쳐 DPO 손실 함수에 도달하는 수학적 유도 단계를 보여주는 순서도.</desc>

  <defs>
    <marker id="2026-10-20-c7b9f4df-02-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-20-c7b9f4df-02-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="600" fill="#f8fafb"/>

  <!-- Connectors (drawn before boxes) -->
  <!-- OBJ → CLOSED: 360,128 → 360,168 -->
  <line x1="360" y1="128" x2="360" y2="168" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-20-c7b9f4df-02-arrow)"/>

  <!-- CLOSED → REWARD: 360,228 → 360,268 -->
  <line x1="360" y1="228" x2="360" y2="268" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-20-c7b9f4df-02-arrow)"/>

  <!-- REWARD → BT: 360,328 → 360,368 -->
  <line x1="360" y1="328" x2="360" y2="368" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-20-c7b9f4df-02-arrow)"/>

  <!-- BT → CANCEL: 360,428 → 360,464 -->
  <line x1="360" y1="428" x2="360" y2="464" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-20-c7b9f4df-02-arrow)"/>

  <!-- CANCEL → LOSS: 360,504 → 360,516 (through to next box) -->
  <!-- CANCEL bottom is y=504, LOSS top is y=520 -->
  <line x1="360" y1="504" x2="360" y2="520" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-20-c7b9f4df-02-arrow-accent)"/>

  <!-- Node 1: RLHF 목적함수 (focal — accent) -->
  <rect x="200" y="40" width="320" height="88" rx="6" fill="#f8fafb"/>
  <rect x="200" y="40" width="320" height="88" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="212" y="50" width="40" height="13" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="232" y="60" fill="rgba(13,87,99,0.85)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.10em">START</text>
  <text x="360" y="92" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">RLHF 목적함수</text>
  <text x="360" y="112" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">KL 제약 최적화</text>

  <!-- Node 2: 최적 정책 닫힌 해 (backend) -->
  <rect x="212" y="168" width="296" height="60" rx="6" fill="#f8fafb"/>
  <rect x="212" y="168" width="296" height="60" rx="6" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="360" y="196" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">최적 정책 — 닫힌 해 존재</text>
  <text x="360" y="216" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">closed-form solution</text>

  <!-- Node 3: 보상을 정책 비율로 표현 (backend) -->
  <rect x="212" y="268" width="296" height="60" rx="6" fill="#f8fafb"/>
  <rect x="212" y="268" width="296" height="60" rx="6" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="360" y="296" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">보상 → 정책 비율로 표현</text>
  <text x="360" y="316" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">reward reparameterization</text>

  <!-- Node 4: Bradley-Terry 대입 (store/step) -->
  <rect x="212" y="368" width="296" height="60" rx="6" fill="#f8fafb"/>
  <rect x="212" y="368" width="296" height="60" rx="6" fill="rgba(62,84,92,0.06)" stroke="#3f545c" stroke-width="1"/>
  <text x="360" y="396" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Bradley-Terry 모델 대입</text>
  <text x="360" y="416" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">preference model substitution</text>

  <!-- Node 5: Z(x) 상쇄 (small inline step — narrower) -->
  <!-- This is a narrow inline step between BT and LOSS -->
  <!-- Repositioned as small tag-style node at y=464 -->
  <rect x="268" y="464" width="184" height="40" rx="6" fill="#f8fafb"/>
  <rect x="268" y="464" width="184" height="40" rx="6" fill="rgba(62,84,92,0.04)" stroke="rgba(62,84,92,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="489" fill="#3f545c" font-size="13" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Z(x) 분배함수 상쇄</text>

  <!-- Node 6: DPO 손실 함수 (focal — accent, terminal) -->
  <rect x="184" y="520" width="352" height="60" rx="6" fill="#f8fafb"/>
  <rect x="184" y="520" width="352" height="60" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.4"/>
  <rect x="196" y="530" width="28" height="13" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="210" y="540" fill="rgba(13,87,99,0.85)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.10em">DPO</text>
  <text x="360" y="560" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">DPO 손실 함수</text>
  <text x="360" y="576" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">보상 모델 불필요</text>

  <!-- Legend strip -->
  <line x1="32" y1="592" x2="688" y2="592" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

</svg>
</body>
</html>
