<!DOCTYPE html>
<html lang="ko">
<head>

<title>LLM Tool Calling 설계 패턴</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }

</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg"

  <title id="2026-10-01-233c5172-07-tc-title">LLM Tool Calling 설계 패턴 — 에이전트 신뢰성 높이기</title>
  <desc id="2026-10-01-233c5172-07-tc-desc">스키마 설계에서 오류 응답 설계, 재시도 전략, 루프 안전장치, 운영 고려사항으로 이어지는 LLM Tool Calling 다섯 단계 설계 흐름을 순서대로 보여주는 도식.</desc>

  <defs>
    <!-- 기본 화살표 마커 -->
    <marker id="2026-10-01-233c5172-07-tc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="260" fill="#f8fafb"/>

  <!-- ───────────────────────────────────────────
       화살표 (박스보다 먼저 그림)
  ─────────────────────────────────────────── -->
  <!-- SC → ER -->
  <line x1="208" y1="120" x2="244" y2="120"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-07-tc-arrow)"/>
  <!-- ER → RT -->
  <line x1="396" y1="120" x2="432" y2="120"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-07-tc-arrow)"/>
  <!-- RT → LP -->
  <line x1="584" y1="120" x2="620" y2="120"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-07-tc-arrow)"/>
  <!-- LP → OP -->
  <line x1="772" y1="120" x2="808" y2="120"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-07-tc-arrow)"/>

  <!-- ───────────────────────────────────────────
       노드 1: 스키마 설계 (link-blue — 출발점)
  ─────────────────────────────────────────── -->
  <!-- 마스크 -->
  <rect x="20" y="84" width="188" height="72" rx="6" fill="#f8fafb"/>
  <!-- 박스 -->
  <rect x="20" y="84" width="188" height="72" rx="6"
        fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="28" y="92" width="36" height="13" rx="2"
        fill="transparent" stroke="rgba(58,84,143,0.45)" stroke-width="0.8"/>
  <text x="46" y="102"
        fill="rgba(58,84,143,0.85)" font-size="8"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">START</text>
  <!-- 이름 -->
  <text x="114" y="132"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">스키마 설계</text>
  <!-- 부제 -->
  <text x="114" y="148"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">명확한 이름 · 제약</text>

  <!-- ───────────────────────────────────────────
       노드 2: 오류 응답 설계 (accent — focal)
  ─────────────────────────────────────────── -->
  <rect x="244" y="84" width="152" height="72" rx="6" fill="#f8fafb"/>
  <rect x="244" y="84" width="152" height="72" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="252" y="92" width="36" height="13" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="270" y="102"
        fill="rgba(13,87,99,0.85)" font-size="8"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="320" y="132"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">오류 응답 설계</text>
  <text x="320" y="148"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">행동 가능한 정보</text>

  <!-- ───────────────────────────────────────────
       노드 3: 재시도 전략
  ─────────────────────────────────────────── -->
  <rect x="432" y="84" width="152" height="72" rx="6" fill="#f8fafb"/>
  <rect x="432" y="84" width="152" height="72" rx="6"
        fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <rect x="440" y="92" width="36" height="13" rx="2"
        fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="458" y="102"
        fill="rgba(63,84,92,0.80)" font-size="8"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">RETRY</text>
  <text x="508" y="132"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">재시도 전략</text>
  <text x="508" y="148"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">유형별 분기</text>

  <!-- ───────────────────────────────────────────
       노드 4: 루프 안전장치
  ─────────────────────────────────────────── -->
  <rect x="620" y="84" width="152" height="72" rx="6" fill="#f8fafb"/>
  <rect x="620" y="84" width="152" height="72" rx="6"
        fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <rect x="628" y="92" width="36" height="13" rx="2"
        fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="646" y="102"
        fill="rgba(63,84,92,0.80)" font-size="8"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">GUARD</text>
  <text x="696" y="132"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">루프 안전장치</text>
  <text x="696" y="148"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">반복 · 단계 제한</text>

  <!-- ───────────────────────────────────────────
       노드 5: 운영 고려사항
  ─────────────────────────────────────────── -->
  <rect x="808" y="84" width="132" height="72" rx="6" fill="#f8fafb"/>
  <rect x="808" y="84" width="132" height="72" rx="6"
        fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <rect x="816" y="92" width="36" height="13" rx="2"
        fill="transparent" stroke="rgba(18,33,39,0.25)" stroke-width="0.8"/>
  <text x="834" y="102"
        fill="rgba(18,33,39,0.55)" font-size="8"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.08em">OPS</text>
  <text x="874" y="132"
        fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif"
        text-anchor="middle">운영 고려사항</text>
  <text x="874" y="148"
        fill="#6c8188" font-size="11"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        text-anchor="middle">비용 · 보안 · 모니터링</text>

  <!-- ───────────────────────────────────────────
       범례 구분선
  ─────────────────────────────────────────── -->
  <line x1="20" y1="196" x2="940" y2="196"
        stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- 범례 -->
  <text x="20" y="212"
        fill="#3f545c" font-size="10"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목 1: 출발점 -->
  <rect x="88" y="204" width="12" height="12" rx="2"
        fill="rgba(58,84,143,0.07)" stroke="#3a548f" stroke-width="1"/>
  <text x="106" y="214"
        fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">출발점</text>

  <!-- 범례 항목 2: 핵심 단계 -->
  <rect x="176" y="204" width="12" height="12" rx="2"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="194" y="214"
        fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">핵심 단계</text>

  <!-- 범례 항목 3: 일반 단계 -->
  <rect x="272" y="204" width="12" height="12" rx="2"
        fill="rgba(18,33,39,0.04)" stroke="#3f545c" stroke-width="1"/>
  <text x="290" y="214"
        fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">일반 단계</text>

  <!-- 범례 항목 4: 외부/종착 -->
  <rect x="368" y="204" width="12" height="12" rx="2"
        fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <text x="386" y="214"
        fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">종착 단계</text>

</svg>
