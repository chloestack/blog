<!DOCTYPE html>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" role="img" aria-labelledby="2026-10-19-6b5f07e6-04-graphify-install-title 2026-10-19-6b5f07e6-04-graphify-install-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="2026-10-19-6b5f07e6-04-graphify-install-title">Graphify 설치 흐름</title>
  <desc id="2026-10-19-6b5f07e6-04-graphify-install-desc">Python 환경에서 uv tool install로 graphify를 설치한 뒤 graphify install을 실행하면 범위에 따라 전역 설치 또는 저장소 로컬 설치(.graphify/)로 분기되는 흐름을 보여주는 순서도.</desc>

  <defs>
    <!-- Default arrow -->
    <marker id="2026-10-19-6b5f07e6-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>

    <!-- Accent arrow -->
    <marker id="2026-10-19-6b5f07e6-04-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- PY → INST (vertical) -->
  <line x1="480" y1="144" x2="480" y2="196" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-04-arrow)"/>

  <!-- INST → CLI (vertical) -->
  <line x1="480" y1="256" x2="480" y2="308" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-04-arrow-accent)"/>

  <!-- CLI → Q (vertical) -->
  <line x1="480" y1="368" x2="480" y2="396" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-04-arrow-accent)"/>

  <!-- Q → SYS (left branch): from diamond left vertex to SYS right edge -->
  <!-- Diamond center (480,420), left vertex (444,420) → SYS center (240,460) right edge (320,460) -->
  <path d="M444,420 L320,420 L320,460" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-6b5f07e6-04-arrow)"/>
  <!-- Label: 시스템 -->
  <rect x="340" y="408" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="362" y="419" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle" font-weight="500">시스템</text>

  <!-- Q → PROJ (right branch): from diamond right vertex to PROJ left edge -->
  <!-- Diamond right vertex (516,420) → PROJ center (680,460) left edge (596,460) -->

  <!-- Label: 저장소 -->
  <rect x="556" y="408" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="578" y="419" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle" font-weight="500">저장소</text>

  <!-- ===================== NODES ===================== -->

  <!-- PY: Python 3.10+ / uv·pipx  — input type -->
  <!-- Mask -->
  <rect x="352" y="80" width="256" height="64" rx="6" fill="#f8fafb"/>
  <!-- Box -->
  <rect x="352" y="80" width="256" height="64" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>

  <!-- Sublabel -->
  <text x="480" y="133" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">uv / pipx</text>

  <!-- INST: uv tool install graphify — focal -->
  <!-- Mask -->
  <rect x="316" y="196" width="328" height="60" rx="6" fill="#f8fafb"/>
  <!-- Box -->
  <rect x="316" y="196" width="328" height="60" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- Tag -->

  <text x="344" y="213" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">INSTALL</text>

  <!-- Sublabel -->
  <text x="480" y="247" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">uv tool install graphify</text>

  <!-- Mask -->
  <rect x="352" y="308" width="256" height="60" rx="6" fill="#f8fafb"/>
  <!-- Box -->
  <rect x="352" y="308" width="256" height="60" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <!-- Tag -->
  <rect x="360" y="316" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="378" y="325" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <!-- Name -->
  <text x="480" y="342" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">설치 실행</text>
  <!-- Sublabel -->
  <text x="480" y="359" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">graphify install</text>

  <!-- Q: Decision diamond — 범위 -->

  <rect x="444" y="396" width="72" height="48" rx="0" fill="#f8fafb"/>
  <polygon points="480,396 516,420 480,444 444,420" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>

  <text x="320" y="511" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">PATH에 등록</text>

  <!-- Mask -->
  <rect x="512" y="460" width="256" height="60" rx="6" fill="#f8fafb"/>
  <!-- Box -->
  <rect x="512" y="460" width="256" height="60" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- Tag -->
  <rect x="520" y="468" width="44" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="542" y="477" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PROJECT</text>
  <!-- Name -->
  <text x="640" y="490" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif" text-anchor="middle">저장소 로컬 설치</text>
  <!-- Sublabel -->
  <text x="640" y="507" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono',monospace" text-anchor="middle">--project · .graphify/</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="32" y1="560" x2="928" y2="560" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- Legend: ENV -->
  <rect x="32" y="572" width="12" height="12" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="0.8"/>
  <text x="50" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.10em">환경 요건</text>

  <!-- Legend: focal -->
  <rect x="160" y="572" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="0.8"/>
  <text x="178" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.10em">주요 단계</text>

  <!-- Legend: muted -->
  <rect x="288" y="572" width="12" height="12" rx="2" fill="#eef2f4" stroke="#c3d0d4" stroke-width="0.8"/>
  <text x="306" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.10em">전역 설치</text>

  <!-- Legend: backend -->
  <rect x="416" y="572" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="0.8"/>
  <text x="434" y="582" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.10em">저장소 설치</text>
