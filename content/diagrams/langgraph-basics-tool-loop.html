<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도구를 쓰는 에이전트의 루프</title>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f8fafb; --ink:#122127; --muted:#3f545c; --soft:#6c8188; --accent:#0d5763;
      --sans:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: 'Gothic A1', var(--sans); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · LangGraph 입문</p>
    <h1>"알아서 찾아보고 답하는" 에이전트의 실체 — 모델과 도구 사이 몇 바퀴</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lg-tool-title lg-tool-desc">
      <title id="lg-tool-title">도구를 쓰는 에이전트의 루프</title>
      <desc id="lg-tool-desc">질문을 받은 모델이 도구가 필요한지 판단해, 필요하면 도구를 실행하고 그 결과를 들고 다시 모델로 돌아오며, 더는 도구를 찾지 않을 때 답변으로 빠져나가는 루프를 보여준다.</desc>
      <defs>
        <marker id="lg-tool-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f545c"/></marker>
        <marker id="lg-tool-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d5763"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafb"/>

      <!-- arrows before boxes -->
      <line x1="152" y1="204" x2="204" y2="204" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-tool-arrow)"/>
      <line x1="376" y1="204" x2="448" y2="204" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-tool-arrow)"/>
      <line x1="660" y1="204" x2="712" y2="204" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-tool-arrow)"/>
      <line x1="556" y1="260" x2="556" y2="312" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-tool-arrow)"/>
      <path d="M472,348 H300 Q292,348 292,340 V240" fill="none" stroke="#0d5763" stroke-width="1.4" marker-end="url(#lg-tool-arrow-accent)"/>
      <line x1="792" y1="236" x2="792" y2="312" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-tool-arrow)"/>

      <!-- edge labels -->
      <rect x="650" y="180" width="64" height="16" rx="2" fill="#f8fafb"/>
      <text x="682" y="192" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">불필요</text>
      <rect x="496" y="272" width="48" height="16" rx="2" fill="#f8fafb"/>
      <text x="520" y="284" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">필요</text>

      <!-- nodes -->
      <rect x="40" y="176" width="112" height="56" rx="28" fill="#f8fafb"/>
      <rect x="40" y="176" width="112" height="56" rx="28" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="96" y="209" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">질문</text>

      <rect x="208" y="172" width="168" height="64" rx="6" fill="#f8fafb"/>
      <rect x="208" y="172" width="168" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
      <text x="292" y="209" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">모델이 판단</text>

      <polygon points="452,204 556,148 660,204 556,260" fill="#f8fafb"/>
      <polygon points="452,204 556,148 660,204 556,260" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="556" y="200" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">도구가</text>
      <text x="556" y="220" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">필요한가</text>

      <rect x="716" y="172" width="152" height="64" rx="6" fill="#f8fafb"/>
      <rect x="716" y="172" width="152" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="792" y="209" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">답변</text>

      <rect x="716" y="316" width="152" height="56" rx="28" fill="#f8fafb"/>
      <rect x="716" y="316" width="152" height="56" rx="28" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="792" y="349" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">끝</text>

      <rect x="472" y="316" width="168" height="64" rx="6" fill="#f8fafb"/>
      <rect x="472" y="316" width="168" height="64" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
      <text x="556" y="353" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">도구 실행</text>

      <!-- legend -->
      <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
      <text x="40" y="444" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="432" width="20" height="16" rx="8" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="168" y="444" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">시작 · 끝</text>
      <polygon points="264,440 280,432 296,440 280,448" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="304" y="444" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">판단</text>
      <line x1="376" y1="440" x2="408" y2="440" stroke="#0d5763" stroke-width="1.4"/>
      <text x="416" y="444" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">모델과 도구 사이를 도는 루프</text>
    </svg>
  </div>
</body>
</html>
