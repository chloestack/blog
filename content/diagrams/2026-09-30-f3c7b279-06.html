<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-30-f3c7b279-06-agentic-rag-title 2026-09-30-f3c7b279-06-agentic-rag-desc">
  <title id="2026-09-30-f3c7b279-06-agentic-rag-title">Agentic RAG 에이전트 루프 흐름도</title>
  <desc id="2026-09-30-f3c7b279-06-agentic-rag-desc">에이전트 루프가 시작되어 반복 횟수 초과 여부와 동일 쿼리 재검색 여부를 판단하고, 도구 호출·결과 로깅·에이전트 평가를 거쳐 루프를 반복하거나 폴백 응답을 생성하는 흐름을 보여준다.</desc>

  <defs>
    <!-- arrow markers -->
    <marker id="2026-09-30-f3c7b279-06-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-30-f3c7b279-06-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-30-f3c7b279-06-arr-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="660" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- A → C1 (시작 → 반복 횟수 초과인가): straight down -->
  <line x1="480" y1="124" x2="480" y2="196" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-30-f3c7b279-06-arr-muted)"/>

  <!-- C1 →|예| FB: right then down -->
  <!-- C1 diamond center: (480, 232). FB center: (700, 312) -->
  <path d="M 524 232 Q 540 232 540 248 L 540 312 Q 540 328 556 328 L 644 328" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-30-f3c7b279-06-arr-soft)" stroke-dasharray="5,4"/>
  <!-- label 예 -->
  <rect x="527" y="218" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="537" y="228" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- C1 →|아니오| C2: straight down -->
  <!-- C1 center: (480, 232), C2 center: (480, 340) -->
  <line x1="480" y1="268" x2="480" y2="312" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-30-f3c7b279-06-arr-muted)"/>
  <!-- label 아니오 -->
  <rect x="452" y="278" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="472" y="288" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- C2 →|예| NQ: left then down -->
  <!-- C2 diamond center: (480, 348). NQ center: (260, 432) -->
  <path d="M 436 348 Q 420 348 420 364 L 420 432 Q 420 448 404 448 L 316 448" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-09-30-f3c7b279-06-arr-soft)" stroke-dasharray="5,4"/>
  <!-- label 예 -->
  <rect x="406" y="334" width="20" height="14" rx="2" fill="#f8fafb"/>
  <text x="416" y="344" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- C2 →|아니오| T: straight down -->
  <!-- C2 center: (480, 348) bottom at 384, T center: (480, 456) top at 432 -->
  <line x1="480" y1="384" x2="480" y2="428" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-30-f3c7b279-06-arr-accent)"/>
  <!-- label 아니오 -->
  <rect x="452" y="394" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="472" y="404" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- T → L: straight down -->
  <line x1="480" y1="484" x2="480" y2="516" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-30-f3c7b279-06-arr-muted)"/>

  <!-- L → E: straight down -->
  <line x1="480" y1="556" x2="480" y2="572" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-30-f3c7b279-06-arr-muted)"/>

  <!-- E → C1: loop back left side -->
  <!-- E center: (480, 600), C1 center: (480, 232) -->
  <path d="M 396 600 Q 340 600 340 584 L 340 248 Q 340 232 356 232 L 436 232" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-30-f3c7b279-06-arr-accent)"/>

  <!-- NQ → C1 loop: up left side (쿼리 변환 후 재시도 → 반복 횟수 초과 판단) -->
  <!-- NQ center: (260, 448), attach left edge x=172 -->
  <path d="M 172 448 Q 148 448 148 432 L 148 268 Q 148 248 164 248 L 436 248" fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-09-30-f3c7b279-06-arr-soft)"/>

  <!-- ===================== NODES ===================== -->

  <!-- A: 에이전트 루프 시작 — oval/start, link color (entry) -->
  <!-- oval: x=388, y=84, w=184, h=40 -->
  <rect x="388" y="84" width="184" height="40" rx="20" fill="#f8fafb"/>
  <rect x="388" y="84" width="184" height="40" rx="20" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="109" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">에이전트 루프 시작</text>

  <!-- C1: 반복 횟수 초과인가 — diamond, accent -->
  <!-- diamond center: (480, 232), half-w=44, half-h=36 -->
  <rect x="436" y="196" width="88" height="72" rx="0" fill="#f8fafb"/>
  <polygon points="480,196 524,232 480,268 436,232" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="228" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">반복 횟수</text>
  <text x="480" y="243" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">초과인가</text>

  <!-- C2: 동일 쿼리 재검색인가 — diamond, accent -->
  <!-- diamond center: (480, 348), half-w=44, half-h=36 -->
  <rect x="436" y="312" width="88" height="72" rx="0" fill="#f8fafb"/>
  <polygon points="480,312 524,348 480,384 436,348" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="344" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">동일 쿼리</text>
  <text x="480" y="359" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">재검색인가</text>

  <!-- FB: 폴백 응답 생성 — rect, soft/warn -->
  <!-- x=644, y=300, w=172, h=56 -->
  <rect x="644" y="300" width="172" height="56" rx="6" fill="#f8fafb"/>
  <rect x="644" y="300" width="172" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="730" y="324" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">폴백 응답</text>
  <text x="730" y="340" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">생성</text>

  <!-- NQ: 쿼리 변환 후 재시도 — rect, soft/optional -->
  <!-- x=172, y=420, w=144, h=56 -->
  <rect x="172" y="420" width="144" height="56" rx="6" fill="#f8fafb"/>
  <rect x="172" y="420" width="144" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="244" y="444" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">쿼리 변환 후</text>
  <text x="244" y="460" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">재시도</text>

  <!-- T: 도구 호출 실행 — focal rect, accent -->
  <!-- x=380, y=428, w=200, h=56 -->
  <rect x="380" y="428" width="200" height="56" rx="6" fill="#f8fafb"/>
  <rect x="380" y="428" width="200" height="56" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- eyebrow tag -->
  <rect x="388" y="434" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="408" y="443" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="480" y="462" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">도구 호출 실행</text>

  <!-- L: 결과 로깅 — backend rect -->
  <!-- x=396, y=516, w=168, h=40 -->
  <rect x="396" y="516" width="168" height="40" rx="6" fill="#f8fafb"/>
  <rect x="396" y="516" width="168" height="40" rx="6" fill="white" stroke="#122127" stroke-width="1"/>
  <text x="480" y="541" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">결과 로깅</text>

  <!-- E: 에이전트 평가 — diamond, accent -->
  <!-- E center: (480, 600), half-w=44, half-h=28 — tight diamond for evaluation -->
  <rect x="436" y="572" width="88" height="56" rx="0" fill="#f8fafb"/>
  <polygon points="480,572 524,600 480,628 436,600" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="596" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">에이전트</text>
  <text x="480" y="611" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">평가</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="646" x2="920" y2="646" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend items -->
  <!-- start node -->
  <rect x="40" y="654" width="48" height="12" rx="6" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="96" y="663" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em">시작</text>

  <!-- focal/accent -->
  <rect x="168" y="655" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="188" y="663" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em">판단 / 핵심 단계</text>

  <!-- backend -->
  <rect x="360" y="655" width="12" height="12" rx="2" fill="white" stroke="#122127" stroke-width="1"/>
  <text x="380" y="663" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em">처리 단계</text>

  <!-- optional/dashed -->
  <rect x="528" y="655" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="548" y="663" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em">우회 / 대안 경로</text>

</svg>
</body>
