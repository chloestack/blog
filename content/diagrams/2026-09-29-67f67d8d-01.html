  <!-- REQ center: (156,220), SYS center: (436,148) -->

  <text x="736" y="324" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">캐싱 불필요</text>

  <text x="456" y="540" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">매번 변경</text>

  <!-- OK -->
  <rect x="560" y="528" width="14" height="14" rx="3" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="580" y="540" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">정상 범위</text>
