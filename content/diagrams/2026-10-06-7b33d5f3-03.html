<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Re-ranking 파이프라인</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  viewBox="0 0 960 300"
  role="img"
  aria-labelledby="2026-10-06-7b33d5f3-03-rag-rerank-title 2026-10-06-7b33d5f3-03-rag-rerank-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="2026-10-06-7b33d5f3-03-rag-rerank-title">RAG Re-ranking 파이프라인</title>
  <desc id="2026-10-06-7b33d5f3-03-rag-rerank-desc">전체 코퍼스에서 Bi-Encoder로 후보 집합을 추린 뒤 Cross-Encoder로 재정렬하여 상위 문서를 LLM 컨텍스트에 주입하는 두 단계 검색 파이프라인.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-06-7b33d5f3-03-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 액센트 화살표 -->
    <marker id="2026-10-06-7b33d5f3-03-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="300" fill="#f8fafb"/>

  <!-- ─── 연결선 (노드보다 먼저) ─── -->

  <!-- ALL → CAND : Bi-Encoder -->
  <path d="M 248 150 H 348" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-06-7b33d5f3-03-arr)"/>
  <!-- 라벨 마스크 + 텍스트 -->
  <rect x="262" y="130" width="72" height="14" rx="2" fill="#f8fafb"/>
  <text x="298" y="141" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Bi-Encoder</text>

  <!-- CAND → TOP : Cross-Encoder -->
  <path d="M 528 150 H 628" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-06-7b33d5f3-03-arr-acc)"/>
  <rect x="536" y="130" width="84" height="14" rx="2" fill="#f8fafb"/>
  <text x="578" y="141" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Cross-Encoder</text>

  <!-- TOP → LLM -->
  <path d="M 748 150 H 808" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-06-7b33d5f3-03-arr-acc)"/>

  <!-- ─── 노드 ─── -->

  <!-- ALL : 전체 코퍼스 (mute) -->
  <rect x="68" y="106" width="180" height="88" rx="6" fill="#f8fafb"/>
  <rect x="68" y="106" width="180" height="88" rx="6" fill="rgba(18,33,39,0.03)" stroke="#c3d0d4" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="76" y="114" width="40" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.60)" stroke-width="0.8"/>
  <text x="96" y="123" fill="rgba(63,84,92,0.7)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CORPUS</text>
  <!-- 이름 -->
  <text x="158" y="148" fill="#3f545c" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">전체 코퍼스</text>
  <!-- 부제 -->
  <text x="158" y="166" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">수백만 문서</text>

  <!-- CAND : 후보 집합 (warn → store) -->
  <rect x="348" y="106" width="180" height="88" rx="6" fill="#f8fafb"/>
  <rect x="348" y="106" width="180" height="88" rx="6" fill="rgba(18,33,39,0.05)" stroke="#6c8188" stroke-width="1"/>
  <rect x="356" y="114" width="40" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.50)" stroke-width="0.8"/>
  <text x="376" y="123" fill="rgba(63,84,92,0.7)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.10em">RECALL</text>
  <text x="438" y="148" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">후보 집합</text>
  <text x="438" y="166" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">20 ~ 50개</text>

  <!-- TOP : 상위 결과 (focal / accent) -->
  <rect x="628" y="106" width="120" height="88" rx="6" fill="#f8fafb"/>
  <rect x="628" y="106" width="120" height="88" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="636" y="114" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
  <text x="654" y="123" fill="rgba(13,87,99,0.85)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TOP-K</text>
  <text x="688" y="148" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">상위 결과</text>
  <text x="688" y="166" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">3 ~ 5개</text>

  <!-- LLM : LLM 컨텍스트 (backend) -->
  <rect x="808" y="106" width="116" height="88" rx="6" fill="#f8fafb"/>
  <rect x="808" y="106" width="116" height="88" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="816" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="830" y="123" fill="rgba(18,33,39,0.7)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LLM</text>
  <text x="866" y="148" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">LLM</text>
  <text x="866" y="166" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">컨텍스트</text>

  <!-- ─── 범례 ─── -->
  <line x1="36" y1="252" x2="924" y2="252" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="36" y="268" fill="#6c8188" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 범례 항목 1 -->
  <rect x="104" y="259" width="12" height="12" rx="2" fill="rgba(18,33,39,0.03)" stroke="#c3d0d4" stroke-width="0.8"/>
  <text x="122" y="269" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">전체 후보</text>

  <!-- 범례 항목 2 -->
  <rect x="216" y="259" width="12" height="12" rx="2" fill="rgba(18,33,39,0.05)" stroke="#6c8188" stroke-width="0.8"/>
  <text x="234" y="269" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">1차 리콜</text>

  <!-- 범례 항목 3 -->
  <rect x="324" y="259" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="342" y="269" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">재정렬 결과 (focal)</text>

  <!-- 범례 항목 4 -->
  <rect x="492" y="259" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="510" y="269" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">최종 소비자</text>

  <!-- 범례 화살표 1 -->
  <line x1="620" y1="265" x2="648" y2="265" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-06-7b33d5f3-03-arr)"/>
  <text x="656" y="269" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Bi-Encoder 검색</text>

  <!-- 범례 화살표 2 -->
  <line x1="788" y1="265" x2="816" y2="265" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-06-7b33d5f3-03-arr-acc)"/>
  <text x="824" y="269" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">Cross-Encoder 재정렬</text>

</svg>
</body>
</html>
