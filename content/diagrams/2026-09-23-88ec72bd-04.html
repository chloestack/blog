<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-23-88ec72bd-04-title 2026-09-23-88ec72bd-04-desc">
  <title id="2026-09-23-88ec72bd-04-title">질의 횟수에 따른 누적 비용과 손익분기점</title>
  <desc id="2026-09-23-88ec72bd-04-desc">RAG는 원점에서 출발해 질의당 0.035달러씩 선형으로 오르고, LLM Wiki는 최초 수집 비용 약 10달러에서 출발해 질의당 0.024달러씩 완만하게 오른다. 두 선은 약 900회 부근에서 교차하며, 그 이후로는 LLM Wiki의 누적 비용이 낮다.</desc>

  <rect width="960" height="470" fill="#f8fafb"/>

  <text x="60" y="34" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">질의 횟수에 따른 누적 비용</text>
  <text x="60" y="52" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">문서 200건 · 입력 $5/MTok · 출력 $25/MTok 기준</text>

  <!-- ── 눈금선 (배경으로 물러남) ── -->
  <line x1="96" y1="106" x2="820" y2="106" stroke="rgba(18,33,39,0.08)" stroke-width="1"/>
  <line x1="96" y1="197" x2="820" y2="197" stroke="rgba(18,33,39,0.08)" stroke-width="1"/>
  <line x1="96" y1="289" x2="820" y2="289" stroke="rgba(18,33,39,0.08)" stroke-width="1"/>

  <!-- y축 눈금값 -->
  <text x="84" y="110" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="end">$60</text>
  <text x="84" y="201" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="end">$40</text>
  <text x="84" y="293" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="end">$20</text>
  <text x="84" y="384" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="end">$0</text>

  <!-- 축 -->
  <line x1="96" y1="60" x2="96" y2="380" stroke="rgba(18,33,39,0.20)" stroke-width="1"/>
  <line x1="96" y1="380" x2="820" y2="380" stroke="rgba(18,33,39,0.20)" stroke-width="1"/>

  <!-- x축 눈금값 -->
  <text x="96" y="400" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">0</text>
  <text x="277" y="400" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">500</text>
  <text x="458" y="400" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">1,000</text>
  <text x="639" y="400" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">1,500</text>
  <text x="820" y="400" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">2,000</text>
  <text x="458" y="420" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">질의 횟수 (회)</text>

  <!-- ── 손익분기 보조선 ── -->
  <line x1="425" y1="235" x2="425" y2="380" stroke="rgba(18,33,39,0.28)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ── 계열: RAG ── -->
  <path d="M 96,380 L 820,60" fill="none" stroke="#a96a08" stroke-width="2" stroke-linecap="round"/>

  <!-- ── 계열: LLM Wiki ── -->
  <path d="M 96,334 L 820,115" fill="none" stroke="#0092a7" stroke-width="2" stroke-linecap="round"/>

  <!-- ── 교차점 (표면 링 + 마커) ── -->
  <circle cx="425" cy="235" r="7" fill="#f8fafb"/>
  <circle cx="425" cy="235" r="5" fill="#122127"/>

  <!-- ── 직접 라벨 (플롯 밖 여백) ── -->
  <text x="832" y="64" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">RAG</text>
  <text x="832" y="119" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">LLM</text>
  <text x="832" y="134" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">Wiki</text>

  <!-- ── 주석: 수집 선지급 (선 위쪽 여백) ── -->
  <text x="112" y="281" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">최초 수집 약 $10에서 출발</text>
  <line x1="176" y1="288" x2="176" y2="306" stroke="rgba(18,33,39,0.28)" stroke-width="1"/>

  <!-- ── 주석: 손익분기 (두 선 아래쪽 여백) ── -->
  <text x="440" y="276" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif">손익분기 ≈ 900회</text>
  <text x="440" y="294" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace">이후로는 위키가 싸다</text>

  <text x="60" y="440" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">질의당 RAG $0.035 · LLM Wiki $0.024 — 차액 $0.011이 수집 비용을 갚아 나간다. 원문이 자주 바뀌면 수집이 다시 발생해 분기점은 뒤로 밀린다.</text>

  <!-- ── 범례 ── -->
  <line x1="60" y1="452" x2="900" y2="452" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <line x1="60" y1="464" x2="84" y2="464" stroke="#a96a08" stroke-width="2" stroke-linecap="round"/>
  <text x="92" y="468" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">RAG — 질의마다 과금</text>

  <line x1="260" y1="464" x2="284" y2="464" stroke="#0092a7" stroke-width="2" stroke-linecap="round"/>
  <text x="292" y="468" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">LLM Wiki — 수집에 선지급</text>

  <circle cx="484" cy="464" r="4" fill="#122127"/>
  <text x="496" y="468" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">손익분기점</text>
</svg>
</body>
</html>
