<style>

<body>
<svg xmlns="http://www.w3.org/2000/svg"

  <title id="2026-10-13-b98ce030-01-ctx-eng-title">LLM Context Engineering — 에이전트 성능을 결정하는 흐름</title>
  <desc id="2026-10-13-b98ce030-01-ctx-eng-desc">프롬프트 엔지니어링에서 시작해 복잡한 워크플로우로 확장되면, 컨텍스트 오염과 성능 저하가 발생하고, 이를 해결하기 위해 컨텍스트 엔지니어링이라는 설계 체계가 필요함을 보여주는 흐름도.</desc>

    <marker id="2026-10-13-b98ce030-01-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>

  <line x1="228" y1="120" x2="328" y2="120"
        stroke="#3f545c" stroke-width="1.2"
        marker-end="url(#2026-10-13-b98ce030-01-arrow-muted)"/>
  <!-- 라벨 마스크 (화살표 중간) -->
  <rect x="239" y="102" width="80" height="14" rx="2" fill="#f8fafb"/>
  <text x="279" y="113"
        fill="#6c8188" font-size="10" font-weight="500"

  <line x1="488" y1="120" x2="572" y2="120"

       ══════════════════════════════════════════ -->

  <rect x="336" y="80" width="36" height="12" rx="2"

  <text x="354" y="89"

  <rect x="572" y="72" width="160" height="96" rx="6"

  <rect x="812" y="60" width="120" height="120" rx="6" fill="#f8fafb"/>
  <rect x="812" y="60" width="120" height="120" rx="6"

  <text x="872" y="113"

  <!-- ══════════════════════════════════════════
       범례 (하단 수평 스트립)
       ══════════════════════════════════════════ -->
  <line x1="28" y1="212" x2="932" y2="212"
        stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 라벨 -->
  <text x="28" y="228"
        fill="#6c8188" font-size="9" font-weight="500"

  <rect x="96" y="220" width="12" height="12" rx="2"

  <text x="114" y="230"

  <rect x="228" y="220" width="12" height="12" rx="2"
