<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="2026-09-22-775c5f50-06-ratelimit-title 2026-09-22-775c5f50-06-ratelimit-desc">
  <title id="2026-09-22-775c5f50-06-ratelimit-title">LiteLLM rpm 한도 초과 처리 흐름</title>
  <desc id="2026-09-22-775c5f50-06-ratelimit-desc">요청 도착 후 rpm 한도 근접 여부를 확인해 정상이면 프로바이더를 호출하고, 한도 초과 시 폴백으로 직접 라우팅하거나 429 수신 시 서킷 브레이커를 거쳐 다음 배포로 폴백하는 흐름도.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-09-22-775c5f50-06-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 악센트 화살표 -->
    <marker id="2026-09-22-775c5f50-06-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 링크 화살표 -->
    <marker id="2026-09-22-775c5f50-06-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="380" fill="#f8fafb"/>

  <!-- ================================================
       ARROWS (drawn before boxes)
       ================================================ -->

  <!-- IN → CHECK: 수평 오른쪽 -->
  <path d="M 188,164 L 248,164" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow)"/>

  <!-- CHECK →|정상| CALL: 수평 오른쪽 -->
  <path d="M 388,164 L 448,164" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow)"/>
  <!-- 라벨: 정상 -->
  <rect x="396" y="148" width="36" height="13" rx="2" fill="#f8fafb"/>
  <text x="414" y="158" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">정상</text>

  <!-- CHECK →|80% 초과| FB: 위로 꺾어 오른쪽 -->
  <!-- CHECK 상단 (318, 136) → 위로 (318, 80) → 오른쪽 (560, 80) → 아래로 FB 상단 (560, 108) -->
  <path d="M 318,136 L 318,80 L 560,80 L 560,108" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow)" stroke-dasharray="5,4"/>
  <!-- 라벨: 80% 초과 -->
  <rect x="384" y="64" width="56" height="13" rx="2" fill="#f8fafb"/>
  <text x="412" y="74" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">80% 초과</text>

  <!-- CALL → ERR429: 수평 오른쪽 -->
  <path d="M 588,164 L 648,164" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow)"/>

  <!-- ERR429 →|아니오| OK: 수평 오른쪽 -->
  <path d="M 788,164 L 848,164" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow)"/>
  <!-- 라벨: 아니오 -->
  <rect x="793" y="148" width="44" height="13" rx="2" fill="#f8fafb"/>
  <text x="815" y="158" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- ERR429 →|예| CB: 아래로 꺾어 -->
  <!-- ERR429 하단 (718, 196) → 아래 (718, 248) → 왼쪽 (640, 248) → 아래 CB 상단 (640, 268) -->
  <path d="M 718,196 L 718,248 L 640,248 L 640,268" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow-accent)"/>
  <!-- 라벨: 예 -->
  <rect x="708" y="208" width="20" height="13" rx="2" fill="#f8fafb"/>
  <text x="718" y="218" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- CB → NEXT: 수평 오른쪽 -->
  <path d="M 700,308 L 760,308" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-22-775c5f50-06-arrow)"/>

  <!-- ================================================
       NODES
       ================================================ -->

  <!-- IN: 요청 도착 (oval, input 처리) -->
  <rect x="68" y="148" width="120" height="32" rx="2" fill="#f8fafb"/>
  <rect x="68" y="148" width="120" height="32" rx="16" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="128" y="169" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">요청 도착</text>

  <!-- CHECK: rpm 한도 근접인가 (diamond, focal) -->
  <!-- 다이아몬드 중심 (318, 164), 반경 가로 70, 세로 28 -->
  <polygon points="248,164 318,136 388,164 318,192" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="318" y="160" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">rpm 한도</text>
  <text x="318" y="173" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">근접인가</text>

  <!-- FB: 폴백 배포로 직접 라우팅 -->
  <rect x="500" y="88" width="120" height="40" rx="2" fill="#f8fafb"/>
  <rect x="500" y="88" width="120" height="40" rx="6" fill="rgba(63,84,92,0.05)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <text x="560" y="105" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">폴백 배포로</text>
  <text x="560" y="120" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">직접 라우팅</text>

  <!-- CALL: 프로바이더 호출 (backend) -->
  <rect x="448" y="144" width="140" height="40" rx="2" fill="#f8fafb"/>
  <rect x="448" y="144" width="140" height="40" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- type tag -->
  <rect x="456" y="150" width="28" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="470" y="159" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="518" y="169" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프로바이더 호출</text>

  <!-- ERR429: 429 수신 (diamond, focal) -->
  <polygon points="648,164 718,136 788,164 718,192" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="718" y="160" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">429</text>
  <text x="718" y="173" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">수신</text>

  <!-- OK: 응답 반환 -->
  <rect x="848" y="148" width="88" height="32" rx="2" fill="#f8fafb"/>
  <rect x="848" y="148" width="88" height="32" rx="16" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="892" y="169" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">응답 반환</text>

  <!-- CB: 서킷 브레이커 N초 차단 -->
  <rect x="580" y="268" width="120" height="40" rx="2" fill="#f8fafb"/>
  <rect x="580" y="268" width="120" height="40" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="640" y="285" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">서킷 브레이커</text>
  <text x="640" y="300" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">N초 차단</text>

  <!-- NEXT: 다음 배포 폴백 -->
  <rect x="760" y="288" width="116" height="40" rx="2" fill="#f8fafb"/>
  <rect x="760" y="288" width="116" height="40" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.30)" stroke-width="1"/>
  <text x="818" y="305" fill="#3f545c" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">다음 배포</text>
  <text x="818" y="320" fill="#3f545c" font-size="11" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">폴백</text>

  <!-- ================================================
       LEGEND
       ================================================ -->
  <line x1="30" y1="356" x2="930" y2="356" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 항목 1: 결정 노드 -->
  <polygon points="46,368 54,362 62,368 54,374" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="68" y="372" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">결정 노드</text>

  <!-- 범례 항목 2: 처리 단계 -->
  <rect x="148" y="362" width="16" height="12" rx="3" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="172" y="372" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">처리 단계</text>

  <!-- 범례 항목 3: 폴백 경로 (dashed) -->
  <line x1="248" y1="368" x2="272" y2="368" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="280" y="372" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">폴백 경로</text>

  <!-- 범례 항목 4: 서킷 브레이커 경로 -->
  <line x1="368" y1="368" x2="392" y2="368" stroke="#0d5763" stroke-width="1.2"/>
  <polygon points="387,365 392,368 387,371" fill="#0d5763"/>
  <text x="400" y="372" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">브레이커 경로</text>

</svg>
</body>
</html>
