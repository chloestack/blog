<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>Human-in-the-Loop 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; }

</style>
</head>
<body>
<svg
  viewBox="0 0 960 680"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="2026-10-05-5c88b64b-02-hitl-title 2026-10-05-5c88b64b-02-hitl-desc"
  style="width:100%;height:auto;display:block;"
>
  <title id="2026-10-05-5c88b64b-02-hitl-title">Human-in-the-Loop 에이전트 실행 흐름</title>
  <desc id="2026-10-05-5c88b64b-02-hitl-desc">에이전트가 노드를 실행하다 임계 동작을 감지하면 체크포인트를 저장하고 사람의 승인을 기다린다. 승인 시 실행을 재개하고, 거부 시 중단 또는 대안을 실행한다.</desc>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="2026-10-05-5c88b64b-02-hitl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-02-hitl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-05-5c88b64b-02-hitl-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="680" fill="#f8fafb"/>

  <!-- ──────────────────────────────────────────
       커넥터 (노드보다 먼저 그림)
  ─────────────────────────────────────────── -->

  <!-- S → N1 (수직) -->
  <line x1="480" y1="92" x2="480" y2="136" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)"/>

  <!-- N1 → C (수직) -->
  <line x1="480" y1="184" x2="480" y2="228" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)"/>

  <!-- C →|아니오| N2 : 오른쪽으로 꺾어서 아래 -->
  <!-- C 오른쪽 꼭짓점 (696,268) → 오른쪽 → 아래 → N2 오른쪽 attach -->
  <path d="M 696,268 H 760 V 444 H 624" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)" stroke-linejoin="round"/>
  <!-- 라벨 "아니오" -->
  <rect x="700" y="256" width="44" height="16" rx="2" fill="#f8fafb"/>
  <text x="722" y="267" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- C →|예| P (수직) -->
  <line x1="480" y1="308" x2="480" y2="352" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow-accent)"/>
  <!-- 라벨 "예" -->
  <rect x="462" y="318" width="24" height="16" rx="2" fill="#f8fafb"/>
  <text x="474" y="329" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- P → W (수직) -->
  <line x1="480" y1="400" x2="480" y2="424" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)"/>

  <!-- W → D (수직) -->
  <line x1="480" y1="472" x2="480" y2="496" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)"/>

  <!-- D →|승인| R : 왼쪽으로 꺾어서 아래 -->
  <path d="M 264,536 H 200 V 584 H 248" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow-accent)" stroke-linejoin="round"/>
  <!-- 라벨 "승인" -->
  <rect x="205" y="548" width="36" height="16" rx="2" fill="#f8fafb"/>
  <text x="223" y="559" fill="#0d5763" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">승인</text>

  <!-- D →|거부| AB : 오른쪽으로 꺾어서 아래 -->
  <path d="M 696,536 H 760 V 584 H 712" fill="none" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow-muted)" stroke-linejoin="round"/>
  <!-- 라벨 "거부" -->
  <rect x="716" y="548" width="36" height="16" rx="2" fill="#f8fafb"/>
  <text x="734" y="559" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">거부</text>

  <!-- R → N2 : 오른쪽으로 꺾어서 아래 -->
  <path d="M 408,600 H 440 V 460 H 480" fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow-accent)" stroke-linejoin="round" stroke-dasharray="5,4"/>

  <!-- N2 → E (수직) -->
  <line x1="480" y1="492" x2="480" y2="560" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)"/>

  <!-- ──────────────────────────────────────────
       노드
  ─────────────────────────────────────────── -->

  <!-- S: 에이전트 시작 (oval) — input 처리 -->
  <rect x="380" y="52" width="200" height="40" rx="20" fill="#f8fafb"/>
  <rect x="380" y="52" width="200" height="40" rx="20" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="77" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">에이전트 시작</text>

  <!-- N1: 노드 실행 (rect) — backend -->
  <rect x="380" y="136" width="200" height="48" rx="6" fill="#f8fafb"/>
  <rect x="380" y="136" width="200" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="388" y="142" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="404" y="151" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP</text>
  <text x="480" y="166" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">노드 실행</text>

  <!-- C: 임계 동작인가 (diamond) -->
  <!-- 다이아몬드 중심 (480, 268), 반폭 216, 반높이 40 -->
  <rect x="264" y="228" width="432" height="80" rx="0" fill="#f8fafb"/>
  <polygon points="480,228 696,268 480,308 264,268" fill="rgba(13,87,99,0.05)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="273" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">임계 동작인가?</text>

  <!-- P: 상태 저장 (체크포인트) (rect) — warn -->
  <rect x="360" y="352" width="240" height="48" rx="6" fill="#f8fafb"/>
  <rect x="360" y="352" width="240" height="48" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <rect x="368" y="358" width="44" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="390" y="367" fill="rgba(169,106,8,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE</text>
  <text x="480" y="378" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">상태 저장</text>
  <text x="480" y="393" fill="#6c8188" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">checkpoint</text>

  <!-- W: 승인 대기 (rect) — muted/optional -->
  <rect x="360" y="424" width="240" height="48" rx="6" fill="#f8fafb"/>
  <rect x="360" y="424" width="240" height="48" rx="6" fill="rgba(18,33,39,0.02)" stroke="rgba(195,208,212,1)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="368" y="430" width="44" height="12" rx="2" fill="transparent" stroke="rgba(195,208,212,0.8)" stroke-width="0.8"/>
  <text x="390" y="439" fill="#6c8188" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAIT</text>
  <text x="480" y="454" fill="#3f545c" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">승인 대기</text>

  <!-- D: 승인 결과 (diamond) -->
  <!-- 다이아몬드 중심 (480, 536), 반폭 216, 반높이 40 -->
  <rect x="264" y="496" width="432" height="80" rx="0" fill="#f8fafb"/>
  <polygon points="480,496 696,536 480,576 264,536" fill="rgba(13,87,99,0.05)" stroke="#0d5763" stroke-width="1"/>
  <text x="480" y="541" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">승인 결과</text>

  <!-- R: 상태 복원·실행 재개 (rect) — ok/accent -->
  <rect x="248" y="576" width="160" height="48" rx="6" fill="#f8fafb"/>
  <rect x="248" y="576" width="160" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <rect x="256" y="582" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="272" y="591" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUME</text>
  <text x="328" y="607" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">상태 복원</text>
  <text x="328" y="619" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">실행 재개</text>

  <!-- AB: 중단·대안 실행 (rect) — stop -->
  <rect x="552" y="576" width="160" height="48" rx="6" fill="#f8fafb"/>
  <rect x="552" y="576" width="160" height="48" rx="6" fill="rgba(148,56,43,0.07)" stroke="#94382b" stroke-width="1"/>
  <rect x="560" y="582" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="576" y="591" fill="rgba(148,56,43,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ABORT</text>
  <text x="632" y="607" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">중단</text>
  <text x="632" y="619" fill="#6c8188" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">대안 실행</text>

  <!-- N2: 다음 노드 (rect) — focal accent -->
  <rect x="480" y="444" width="144" height="48" rx="6" fill="#f8fafb"/>
  <rect x="480" y="444" width="144" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="488" y="450" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="504" y="459" fill="rgba(13,87,99,0.8)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT</text>
  <text x="552" y="474" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">다음 노드</text>

  <!-- E: 완료 (oval) -->
  <rect x="400" y="560" width="160" height="40" rx="20" fill="#f8fafb"/>
  <rect x="400" y="560" width="160" height="40" rx="20" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="480" y="585" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">완료</text>

  <!-- ──────────────────────────────────────────
       범례
  ─────────────────────────────────────────── -->
  <line x1="32" y1="648" x2="928" y2="648" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="32" y="662" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- 일반 흐름 -->
  <line x1="104" y1="658" x2="128" y2="658" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow)"/>
  <text x="132" y="662" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">일반 흐름</text>

  <!-- 승인 경로 -->
  <line x1="224" y1="658" x2="248" y2="658" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow-accent)"/>
  <text x="252" y="662" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">승인 경로</text>

  <!-- 재개 (점선) -->
  <line x1="352" y1="658" x2="376" y2="658" stroke="#0d5763" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-05-5c88b64b-02-hitl-arrow-accent)"/>
  <text x="380" y="662" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">실행 재개</text>

  <!-- 대기 -->
  <rect x="480" y="650" width="40" height="16" rx="3" fill="rgba(18,33,39,0.02)" stroke="rgba(195,208,212,1)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="528" y="662" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">대기 상태</text>

  <!-- 중단 -->
  <rect x="616" y="650" width="40" height="16" rx="3" fill="rgba(148,56,43,0.07)" stroke="#94382b" stroke-width="1"/>
  <text x="664" y="662" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">중단/오류</text>

</svg>
