<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  .diagram-wrap { width: 100%; max-width: 960px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="2026-09-18-784fb3bd-08-flow-title 2026-09-18-784fb3bd-08-flow-desc">
  <title id="2026-09-18-784fb3bd-08-flow-title">LLM 구조화 출력 도입 결정 흐름</title>
  <desc id="2026-09-18-784fb3bd-08-flow-desc">LLM 응답 소비 주체가 코드인지, 파싱 오류가 빈번한지에 따라 구조화 출력 불필요·Instructor 즉시 도입·프로바이더 Structured Outputs 검토 중 하나로 안내하는 의사결정 흐름도.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-09-18-784fb3bd-08-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 -->
    <marker id="2026-09-18-784fb3bd-08-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="440" fill="#f8fafb"/>

  <!-- ─────────────────────────────────────────
       커넥터 (박스보다 먼저 그림)
  ───────────────────────────────────────── -->

  <!-- N → Q1 (수평, 직선) -->
  <line x1="200" y1="220" x2="308" y2="220"
        stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-18-784fb3bd-08-arrow)"/>

  <!-- Q1 아래 → 아니오 → SK (수직 내려가다 우측으로) -->
  <!-- Q1 하단(360,260) → (360,316) → (680,316) → SK 좌단(680,316) -->
  <path d="M 360 260 L 360 316 L 612 316"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-18-784fb3bd-08-arrow)"/>

  <!-- Q1 오른쪽 → 예 → Q2 (수평, 직선) -->
  <line x1="412" y1="220" x2="558" y2="220"
        stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-18-784fb3bd-08-arrow-accent)"/>

  <!-- Q2 위 → 예 → USE (수직 올라가다 우측으로) -->
  <!-- Q2 상단(616,180) → (616,124) → (752,124) → USE 좌단 -->
  <path d="M 616 180 L 616 124 L 752 124"
        fill="none" stroke="#0d5763" stroke-width="1" marker-end="url(#2026-09-18-784fb3bd-08-arrow-accent)"/>

  <!-- Q2 오른쪽 → 아니오 → EVAL (수평) -->
  <line x1="672" y1="220" x2="752" y2="220"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-18-784fb3bd-08-arrow)"/>

  <!-- ─────────────────────────────────────────
       화살표 레이블
  ───────────────────────────────────────── -->

  <!-- N→Q1 위 없음 (레이블 없어도 자명) -->

  <!-- Q1 우측 "예" -->
  <rect x="446" y="204" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="458" y="214" fill="#0d5763" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- Q1 하단 "아니오" -->
  <rect x="330" y="266" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="350" y="276" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- Q2 위 "예" -->
  <rect x="600" y="130" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="612" y="140" fill="#0d5763" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- Q2 우 "아니오" -->
  <rect x="692" y="204" width="40" height="14" rx="2" fill="#f8fafb"/>
  <text x="712" y="214" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- ─────────────────────────────────────────
       노드: N — 시작 타원
  ───────────────────────────────────────── -->
  <!-- 타원: cx=120, cy=220, rx=80, ry=36 -->
  <rect x="40" y="184" width="160" height="72" rx="2" fill="#f8fafb"/>
  <ellipse cx="120" cy="220" rx="80" ry="36"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="120" y="213" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">LLM 응답</text>
  <text x="120" y="229" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">소비 주체?</text>

  <!-- ─────────────────────────────────────────
       노드: Q1 — 다이아몬드
  ───────────────────────────────────────── -->
  <!-- center 360,220 width=104 height=80 -->
  <polygon points="360,180 412,220 360,260 308,220" fill="#f8fafb"/>
  <polygon points="360,180 412,220 360,260 308,220"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="360" y="215" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">코드가</text>
  <text x="360" y="229" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">소비하나?</text>

  <!-- ─────────────────────────────────────────
       노드: Q2 — 다이아몬드 (focal)
  ───────────────────────────────────────── -->
  <!-- center 616,220 width=112 height=80 -->
  <polygon points="616,180 672,220 616,260 560,220" fill="#f8fafb"/>
  <polygon points="616,180 672,220 616,260 560,220"
           fill="rgba(13,87,99,0.12)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="616" y="215" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">파싱 오류</text>
  <text x="616" y="229" fill="#122127" font-size="11" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">빈번한가?</text>

  <!-- ─────────────────────────────────────────
       노드: SK — 구조화 출력 불필요 (muted)
  ───────────────────────────────────────── -->
  <!-- x=612, y=288, w=180, h=56, center 702,316 -->
  <rect x="612" y="288" width="180" height="56" rx="2" fill="#f8fafb"/>
  <rect x="612" y="288" width="180" height="56" rx="6"
        fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="620" y="295" width="42" height="12" rx="2"
        fill="transparent" stroke="rgba(195,208,212,0.6)" stroke-width="0.8"/>
  <text x="641" y="304" fill="#6c8188" font-size="8"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">SKIP</text>
  <!-- 노드 이름 -->
  <text x="702" y="318" fill="#3f545c" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">구조화 출력 불필요</text>

  <!-- ─────────────────────────────────────────
       노드: USE — Instructor 즉시 도입 (focal/ok)
  ───────────────────────────────────────── -->
  <!-- x=752, y=96, w=160, h=56, center 832,124 -->
  <rect x="752" y="96" width="160" height="56" rx="2" fill="#f8fafb"/>
  <rect x="752" y="96" width="160" height="56" rx="6"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <!-- 타입 태그 -->
  <rect x="760" y="103" width="42" height="12" rx="2"
        fill="transparent" stroke="rgba(13,87,99,0.35)" stroke-width="0.8"/>
  <text x="781" y="112" fill="rgba(13,87,99,0.8)" font-size="8"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">USE</text>
  <!-- 노드 이름 -->
  <text x="832" y="131" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Instructor 즉시 도입</text>

  <!-- ─────────────────────────────────────────
       노드: EVAL — 프로바이더 Structured Outputs 검토
  ───────────────────────────────────────── -->
  <!-- x=752, y=192, w=180, h=56, center 842,220 -->
  <rect x="752" y="192" width="180" height="56" rx="2" fill="#f8fafb"/>
  <rect x="752" y="192" width="180" height="56" rx="6"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="760" y="199" width="46" height="12" rx="2"
        fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="783" y="208" fill="rgba(18,33,39,0.7)" font-size="8"
        font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">EVAL</text>
  <!-- 노드 이름 -->
  <text x="842" y="225" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Structured Outputs</text>
  <text x="842" y="240" fill="#3f545c" font-size="11"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">프로바이더 검토</text>

  <!-- ─────────────────────────────────────────
       범례 구분선 + 범례
  ───────────────────────────────────────── -->
  <line x1="32" y1="388" x2="928" y2="388"
        stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- 범례 항목 -->
  <!-- 시작/끝 타원 -->
  <ellipse cx="52" cy="404" rx="14" ry="8"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="72" y="408" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">시작</text>

  <!-- 결정 다이아몬드 -->
  <polygon points="150,404 164,412 150,420 136,412"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="172" y="416" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">결정</text>

  <!-- 권장 단계 -->
  <rect x="236" y="399" width="20" height="14" rx="3"
        fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="262" y="410" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">권장 단계</text>

  <!-- 일반 단계 -->
  <rect x="346" y="399" width="20" height="14" rx="3"
        fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="372" y="410" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">일반 단계</text>

  <!-- 생략 가능 -->
  <rect x="456" y="399" width="20" height="14" rx="3"
        fill="#eef2f4" stroke="#c3d0d4" stroke-width="1"/>
  <text x="482" y="410" fill="#3f545c" font-size="10"
        font-family="'IBM Plex Sans KR', sans-serif">생략 가능</text>

</svg>
</div>
</body>
</html>
