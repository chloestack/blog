<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  .diagram-wrap { display: block; width: 100%; max-width: 960px; }
  .diagram-wrap svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 380" role="img" aria-labelledby="2026-09-23-742bf48b-04-sv-title 2026-09-23-742bf48b-04-sv-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="2026-09-23-742bf48b-04-sv-title">Scoped Values 참조 공유와 리바인딩</title>
  <desc id="2026-09-23-742bf48b-04-sv-desc">부모 스코프가 K→V 값을 참조 공유 방식으로 두 자식 Virtual Thread에 전달하고, 자식 스코프 내 리바인딩은 부모에 영향을 주지 않는 흐름을 보여주는 도식.</desc>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="2026-09-23-742bf48b-04-sv-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-23-742bf48b-04-sv-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-23-742bf48b-04-sv-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="380" fill="#f8fafb"/>

  <!-- ── 커넥터 (노드보다 먼저) ── -->

  <!-- P → C1: 참조 공유 / 복사 없음 (위쪽 경로) -->
  <!-- P 오른쪽 중앙(280,148) → 오른쪽으로 → C1 왼쪽 위(440,120) -->
  <path d="M 280,136 L 360,136 L 360,120 L 440,120"
        fill="none" stroke="#3a548f" stroke-width="1.2"
        marker-end="url(#2026-09-23-742bf48b-04-sv-arrow-link)"/>
  <!-- 라벨 -->
  <rect x="296" y="92" width="88" height="24" rx="2" fill="#f8fafb"/>
  <text x="340" y="102" fill="#3a548f" font-size="10" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">참조 공유</text>
  <text x="340" y="114" fill="#3a548f" font-size="10" font-weight="400"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">복사 없음</text>

  <!-- P → C2: 참조 공유 (아래쪽 경로) -->
  <!-- P 오른쪽 중앙(280,172) → 오른쪽으로 → C2 왼쪽 위(440,216) -->
  <path d="M 280,172 L 360,172 L 360,228 L 440,228"
        fill="none" stroke="#3a548f" stroke-width="1.2"
        marker-end="url(#2026-09-23-742bf48b-04-sv-arrow-link)"/>
  <!-- 라벨 -->
  <rect x="296" y="196" width="72" height="16" rx="2" fill="#f8fafb"/>
  <text x="332" y="208" fill="#3a548f" font-size="10" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">참조 공유</text>

  <!-- C1 → R: 리바인딩 -->
  <!-- C1 오른쪽 중앙(600,132) → 오른쪽으로 → R 왼쪽(700,156) 에서 아래로 R 왼쪽(700,172) -->
  <path d="M 600,132 L 648,132 L 648,172 L 700,172"
        fill="none" stroke="#3f545c" stroke-width="1.2"
        marker-end="url(#2026-09-23-742bf48b-04-sv-arrow)"/>
  <!-- 라벨 -->
  <rect x="604" y="140" width="72" height="24" rx="2" fill="#f8fafb"/>
  <text x="640" y="150" fill="#3f545c" font-size="10" font-weight="500"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">리바인딩</text>
  <text x="640" y="162" fill="#6c8188" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자식 안에서만</text>

  <!-- ── 노드 ── -->

  <!-- P: 부모 스코프 (focal) -->
  <rect x="100" y="108" width="180" height="80" rx="6" fill="#f8fafb"/>
  <rect x="100" y="108" width="180" height="80" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 타입 태그 -->
  <rect x="108" y="114" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="128" y="123" fill="rgba(13,87,99,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCOPE</text>
  <!-- 노드명 -->
  <text x="190" y="150" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">부모 스코프</text>
  <!-- 서브라벨 -->
  <text x="190" y="168" fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">K → V</text>

  <!-- C1: 자식 VT 1 -->
  <rect x="440" y="88" width="160" height="80" rx="6" fill="#f8fafb"/>
  <rect x="440" y="88" width="160" height="80" rx="6" fill="rgba(13,87,99,0.04)" stroke="#6c8188" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="448" y="94" width="24" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="460" y="103" fill="rgba(108,129,136,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VT</text>
  <!-- 노드명 -->
  <text x="520" y="130" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자식 VT 1</text>
  <!-- 서브라벨 -->
  <text x="520" y="148" fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">K → V 읽기 가능</text>

  <!-- C2: 자식 VT 2 -->
  <rect x="440" y="188" width="160" height="80" rx="6" fill="#f8fafb"/>
  <rect x="440" y="188" width="160" height="80" rx="6" fill="rgba(13,87,99,0.04)" stroke="#6c8188" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="448" y="194" width="24" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="460" y="203" fill="rgba(108,129,136,0.8)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VT</text>
  <!-- 노드명 -->
  <text x="520" y="230" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">자식 VT 2</text>
  <!-- 서브라벨 -->
  <text x="520" y="248" fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">K → V 읽기 가능</text>

  <!-- R: 리바인딩 결과 -->
  <rect x="700" y="136" width="196" height="80" rx="6" fill="#f8fafb"/>
  <rect x="700" y="136" width="196" height="80" rx="6" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.25)" stroke-width="1"/>
  <!-- 타입 태그 -->
  <rect x="708" y="142" width="48" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.20)" stroke-width="0.8"/>
  <text x="732" y="151" fill="rgba(18,33,39,0.5)" font-size="8" font-weight="500"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REBIND</text>
  <!-- 노드명 -->
  <text x="798" y="178" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">부모에 영향 없음</text>
  <!-- 서브라벨 -->
  <text x="798" y="196" fill="#3f545c" font-size="11" font-weight="400"
        font-family="'IBM Plex Mono', monospace" text-anchor="middle">K → V2</text>

  <!-- ── 범례 구분선 ── -->
  <line x1="32" y1="308" x2="928" y2="308" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 -->
  <text x="32" y="324" fill="#3f545c" font-size="10" font-weight="500"
        font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="108" y="314" width="14" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="128" y="323" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif">부모 스코프 (focal)</text>

  <!-- VT 노드 -->
  <rect x="264" y="314" width="14" height="10" rx="2" fill="rgba(13,87,99,0.04)" stroke="#6c8188" stroke-width="1"/>
  <text x="284" y="323" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif">Virtual Thread 스코프</text>

  <!-- 리바인딩 결과 -->
  <rect x="432" y="314" width="14" height="10" rx="2" fill="rgba(18,33,39,0.03)" stroke="rgba(18,33,39,0.25)" stroke-width="1"/>
  <text x="452" y="323" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif">리바인딩 결과 (격리됨)</text>

  <!-- 참조 공유 화살표 -->
  <line x1="596" y1="319" x2="620" y2="319" stroke="#3a548f" stroke-width="1.2" marker-end="url(#2026-09-23-742bf48b-04-sv-arrow-link)"/>
  <text x="628" y="323" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif">참조 공유</text>

  <!-- 리바인딩 화살표 -->
  <line x1="752" y1="319" x2="776" y2="319" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-23-742bf48b-04-sv-arrow)"/>
  <text x="784" y="323" fill="#3f545c" font-size="10" font-weight="400"
        font-family="'IBM Plex Sans KR', sans-serif">리바인딩</text>

</svg>
</div>
</body>
</html>
