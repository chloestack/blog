<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-09-24-22e347e3-05-redis-shard-title 2026-09-24-22e347e3-05-redis-shard-desc">
  <title id="2026-09-24-22e347e3-05-redis-shard-title">Redis 카운터 샤딩 흐름</title>
  <desc id="2026-09-24-22e347e3-05-redis-shard-desc">쓰기 요청이 랜덤 샤드 선택기를 거쳐 count:0·count:1·count:N 세 샤드로 분산되고, 집계 요청은 MGET으로 전체 샤드를 읽어 합산을 반환하는 구조.</desc>

  <defs>
    <!-- 기본 muted 화살표 -->
    <marker id="2026-09-24-22e347e3-05-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-24-22e347e3-05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- link 화살표 -->
    <marker id="2026-09-24-22e347e3-05-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="440" fill="#f8fafb"/>

  <!-- ───────────────────────────────────────────
       WRITE 경로 영역 라벨
  ─────────────────────────────────────────────── -->
  <text x="48" y="52" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em" font-weight="500">WRITE PATH</text>
  <line x1="44" y1="58" x2="580" y2="58" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- READ 경로 영역 라벨 -->
  <text x="48" y="296" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em" font-weight="500">READ PATH</text>
  <line x1="44" y1="302" stroke="rgba(18,33,39,0.10)" stroke-width="0.8" x2="580" y2="302"/>

  <!-- ═══════════════════════════════════════════
       ARROWS (drawn before boxes)
  ═══════════════════════════════════════════════ -->

  <!-- 배치(2026-09-29 다시 잡음): 쓰기 경로 가운데 줄 y=148. 키 박스 세 개는 가운데 y=92·148·204로
       8px씩 띄운다(전에는 8px씩 겹쳤다). 마름모 중심 (320,148), 꼭짓점 왼 252·위 108·오 388·아래 188.
       MGET 점선은 쓰기 화살표를 가로지르지 않도록 키 묶음 아래(count:N 아래 모서리)로 한 번만 들어간다. -->

  <!-- 쓰기 요청 → 랜덤 샤드 선택 -->
  <path d="M188,148 L248,148" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow)"/>

  <!-- 랜덤 샤드 선택 → count:0 (마름모 오른쪽 위 모서리의 (354,128)에서) -->
  <path d="M354,128 L354,100 Q354,92 362,92 L504,92" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>
  <rect x="418" y="85" width="42" height="14" rx="2" fill="#f8fafb"/>
  <text x="439" y="96" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">샤드 0</text>

  <!-- 랜덤 샤드 선택 → count:1 -->
  <path d="M388,148 L504,148" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>
  <rect x="418" y="141" width="42" height="14" rx="2" fill="#f8fafb"/>
  <text x="439" y="152" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">샤드 1</text>

  <!-- 랜덤 샤드 선택 → count:N (마름모 오른쪽 아래 모서리의 (354,168)에서) -->
  <path d="M354,168 L354,196 Q354,204 362,204 L504,204" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>
  <rect x="418" y="197" width="42" height="14" rx="2" fill="#f8fafb"/>
  <text x="439" y="208" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">샤드 N</text>

  <!-- 집계 요청 → MGET 전체 샤드 -->
  <path d="M188,360 L280,360" stroke="#3a548f" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-link)"/>

  <!-- MGET → count:0…N 전부 (키 묶음 아래 모서리로) -->
  <path d="M420,360 L570,360 Q578,360 578,352 L578,232" stroke="#3f545c" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#2026-09-24-22e347e3-05-arrow)"/>
  <rect x="586" y="286" width="84" height="14" rx="2" fill="#f8fafb"/>
  <text x="590" y="297" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">키 N개 조회</text>

  <!-- count:0 → 합산 반환 (위 모서리로) -->
  <path d="M648,92 L804,92 Q812,92 812,100 L812,120" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>

  <!-- count:1 → 합산 반환 -->
  <path d="M648,148 L732,148" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>

  <!-- count:N → 합산 반환 (아래 모서리로) -->
  <path d="M648,204 L804,204 Q812,204 812,196 L812,176" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-09-24-22e347e3-05-arrow-accent)"/>

  <!-- ═══════════════════════════════════════════
       NODES
  ═══════════════════════════════════════════════ -->

  <!-- 쓰기 요청 (input) -->
  <rect x="44" y="124" width="144" height="48" rx="6" fill="#f8fafb"/>
  <rect x="44" y="124" width="144" height="48" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="52" y="130" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="70" y="139" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="116" y="155" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">쓰기 요청</text>

  <!-- 랜덤 샤드 선택 (focal — diamond) -->
  <!-- diamond center: (320, 148), half-w=68, half-h=40 -->
  <polygon points="252,148 320,108 388,148 320,188" fill="#f8fafb"/>
  <polygon points="252,148 320,108 388,148 320,188" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="320" y="143" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">랜덤 샤드</text>
  <text x="320" y="159" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">선택</text>

  <!-- count:0 (store) -->
  <rect x="508" y="68" width="140" height="48" rx="6" fill="#f8fafb"/>
  <rect x="508" y="68" width="140" height="48" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="516" y="74" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="530" y="83" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="578" y="99" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">count:0</text>

  <!-- count:1 (store) -->
  <rect x="508" y="124" width="140" height="48" rx="6" fill="#f8fafb"/>
  <rect x="508" y="124" width="140" height="48" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="516" y="130" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="530" y="139" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="578" y="155" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">count:1</text>

  <!-- count:N (store) -->
  <rect x="508" y="180" width="140" height="48" rx="6" fill="#f8fafb"/>
  <rect x="508" y="180" width="140" height="48" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="516" y="186" width="28" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.40)" stroke-width="0.8"/>
  <text x="530" y="195" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
  <text x="578" y="216" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">count:N</text>

  <!-- 합산 반환 (focal) -->
  <rect x="736" y="124" width="152" height="48" rx="6" fill="#f8fafb"/>
  <rect x="736" y="124" width="152" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="744" y="130" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="766" y="139" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
  <text x="812" y="155" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">합산 반환</text>

  <!-- 집계 요청 (input) -->
  <rect x="44" y="336" width="144" height="48" rx="6" fill="#f8fafb"/>
  <rect x="44" y="336" width="144" height="48" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="52" y="342" width="36" height="12" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="70" y="351" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="116" y="367" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">집계 요청</text>

  <!-- MGET 전체 샤드 (backend) -->
  <rect x="284" y="336" width="136" height="48" rx="6" fill="#f8fafb"/>
  <rect x="284" y="336" width="136" height="48" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="292" y="342" width="32" height="12" rx="2" fill="transparent" stroke="rgba(18,33,39,0.40)" stroke-width="0.8"/>
  <text x="308" y="351" fill="rgba(18,33,39,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CMD</text>
  <text x="352" y="362" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">MGET</text>
  <text x="352" y="378" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">전체 샤드</text>

  <!-- ═══════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════ -->
  <line x1="44" y1="404" x2="916" y2="404" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="44" y="418" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="120" y="408" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="138" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">핵심 노드</text>

  <!-- store -->
  <rect x="228" y="408" width="12" height="12" rx="2" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="246" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">Redis 키</text>

  <!-- input -->
  <rect x="324" y="408" width="12" height="12" rx="2" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <text x="342" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">요청 진입</text>

  <!-- backend -->
  <rect x="420" y="408" width="12" height="12" rx="2" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="438" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">커맨드</text>

  <!-- dashed -->
  <line x1="512" y1="414" x2="536" y2="414" stroke="#3f545c" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="542" y="419" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">읽기 경로 (MGET)</text>
</svg>
</body>
</html>
