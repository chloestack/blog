<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg"

  <title id="2026-09-21-184d501b-07-graphrag-update-title">GraphRAG 지식 그래프 업데이트 전략</title>
  <desc id="2026-09-21-184d501b-07-graphrag-update-desc">새 문서에서 엔티티·관계를 추출한 뒤, 배치 전략(별도 인덱스 생성)과 스트리밍 전략(점진적 추가) 두 경로로 분기되어 각각의 정확도·복잡도 결과로 이어지는 흐름도.</desc>

  <defs>

      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-21-184d501b-07-arrow-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

  <!-- Background -->

  ══════════════════════════════════════════ -->
