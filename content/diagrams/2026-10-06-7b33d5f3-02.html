  <title id="2026-10-06-7b33d5f3-02-rag-rerank-title">Bi-Encoder vs Cross-Encoder 비교</title>
  <desc id="2026-10-06-7b33d5f3-02-rag-rerank-desc">RAG Re-ranking 파이프라인에서 Bi-Encoder와 Cross-Encoder가 각각 질문과 문서를 처리하는 방식을 나란히 비교한 플로우차트. Bi-Encoder는 질문과 문서를 별도로 인코딩해 코사인 유사도를 계산하고, Cross-Encoder는 둘을 하나의 입력으로 합쳐 관련성 점수를 출력한다.</desc>
