<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="2026-09-19-10770688-02-ragas-cr-title 2026-09-19-10770688-02-ragas-cr-desc">
  <title id="2026-09-19-10770688-02-ragas-cr-title">Context Recall 계산 흐름</title>
  <desc id="2026-09-19-10770688-02-ragas-cr-desc">Ground Truth 문장들을 단위로 분해한 뒤, 각 문장이 컨텍스트에서 설명 가능한지 판단하여 지지됨/미지지로 분류하고 Context Recall 점수를 산출하는 절차를 보여준다.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="2026-09-19-10770688-02-cr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-09-19-10770688-02-cr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-09-19-10770688-02-cr-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
    <marker id="2026-09-19-10770688-02-cr-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- GT → 문장 단위 분해: vertical, GT bottom(480,156) → S top(480,212) -->
  <line x1="480" y1="156" x2="480" y2="208" stroke="#3a548f" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-02-cr-arrow)"/>

  <!-- 문장 단위 분해 → 판단 diamond: vertical, S bottom(480,272) → J top(480,316) -->
  <line x1="480" y1="272" x2="480" y2="312" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-02-cr-arrow-accent)"/>

  <!-- J → 지지됨 (예 / Yes): right exit of diamond → SUP left -->
  <!-- Diamond center (480,364), right tip (560,364); SUP box left edge (652,332) -->
  <path d="M 560,364 L 648,364 L 648,356" fill="none" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-02-cr-arrow-ok)"/>

  <!-- Arrow label 예 -->
  <rect x="573" y="348" width="28" height="13" rx="2" fill="#f8fafb"/>
  <text x="587" y="358" fill="#286d50" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">예</text>

  <!-- J → 미지지 (아니오 / No): left exit of diamond → NS right -->
  <!-- Diamond left tip (400,364); NS box right edge (308,356) -->
  <path d="M 400,364 L 312,364 L 312,356" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-02-cr-arrow-stop)"/>

  <!-- Arrow label 아니오 -->
  <rect x="332" y="348" width="44" height="13" rx="2" fill="#f8fafb"/>
  <text x="354" y="358" fill="#94382b" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" font-weight="500" text-anchor="middle">아니오</text>

  <!-- 지지됨 → Context Recall: SUP bottom(648,400) → SC top right(572,452) -->
  <path d="M 648,400 L 648,428 L 572,428 L 572,448" fill="none" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-02-cr-arrow-ok)"/>

  <!-- 미지지 → Context Recall: NS bottom(312,400) → SC top left(388,452) -->
  <path d="M 312,400 L 312,428 L 388,428 L 388,448" fill="none" stroke="#3f545c" stroke-width="1.2" marker-end="url(#2026-09-19-10770688-02-cr-arrow)"/>

  <!-- ===================== NODES ===================== -->

  <!-- GT: Ground Truth — input/link style -->
  <!-- box: x=360, y=88, w=240, h=68, cx=480, cy=122 -->
  <rect x="360" y="88" width="240" height="68" rx="6" fill="#f8fafb"/>
  <rect x="360" y="88" width="240" height="68" rx="6" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <rect x="368" y="96" width="36" height="12" rx="2" fill="transparent" stroke="rgba(58,84,143,0.40)" stroke-width="0.8"/>
  <text x="386" y="105" fill="rgba(58,84,143,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="480" y="128" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Ground Truth</text>
  <text x="480" y="146" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">정답 문장들</text>

  <!-- 문장 단위 분해 — accent/step style -->
  <!-- box: x=356, y=212, w=248, h=60, cx=480, cy=242 -->
  <rect x="356" y="212" width="248" height="60" rx="6" fill="#f8fafb"/>
  <rect x="356" y="212" width="248" height="60" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="364" y="220" width="30" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="379" y="229" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="480" y="250" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">문장 단위 분해</text>

  <!-- Decision diamond: cx=480, cy=364, half-w=80, half-h=52 -->
  <!-- Points: top(480,312) right(560,364) bottom(480,416) left(400,364) -->
  <polygon points="480,308 564,364 480,420 396,364" fill="#f8fafb"/>
  <polygon points="480,308 564,364 480,420 396,364" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="358" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">컨텍스트에서</text>
  <text x="480" y="374" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">설명 가능한가</text>

  <!-- 지지됨 — ok/green style -->
  <!-- box: x=584, y=316, w=128, h=44, cx=648, cy=338 -->
  <rect x="584" y="316" width="128" height="44" rx="6" fill="#f8fafb"/>
  <rect x="584" y="316" width="128" height="44" rx="6" fill="rgba(40,109,80,0.09)" stroke="#286d50" stroke-width="1"/>
  <text x="648" y="343" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">지지됨</text>

  <!-- 미지지 — stop/red style -->
  <!-- box: x=248, y=316, w=128, h=44, cx=312, cy=338 -->
  <rect x="248" y="316" width="128" height="44" rx="6" fill="#f8fafb"/>
  <rect x="248" y="316" width="128" height="44" rx="6" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <text x="312" y="343" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">미지지</text>

  <!-- Context Recall — focal/accent style -->
  <!-- box: x=360, y=448, w=240, h=72, cx=480, cy=484 -->
  <rect x="360" y="448" width="240" height="72" rx="6" fill="#f8fafb"/>
  <rect x="360" y="448" width="240" height="72" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <rect x="368" y="456" width="40" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="388" y="465" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">METRIC</text>
  <text x="480" y="484" fill="#0d5763" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">Context Recall</text>
  <text x="480" y="502" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">= 지지 수 / 전체</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- legend items -->
  <!-- INPUT swatch -->
  <rect x="40" y="564" width="12" height="12" rx="2" fill="rgba(58,84,143,0.06)" stroke="#3a548f" stroke-width="1"/>
  <text x="58" y="574" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">입력</text>

  <!-- STEP/Accent swatch -->
  <rect x="132" y="564" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="150" y="574" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">처리 단계</text>

  <!-- Decision swatch -->
  <polygon points="228,570 236,564 244,570 236,576" fill="rgba(13,87,99,0.06)" stroke="#0d5763" stroke-width="1"/>
  <text x="252" y="574" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">판단</text>

  <!-- OK swatch -->
  <rect x="320" y="564" width="12" height="12" rx="2" fill="rgba(40,109,80,0.09)" stroke="#286d50" stroke-width="1"/>
  <text x="338" y="574" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">지지됨</text>

  <!-- STOP swatch -->
  <rect x="424" y="564" width="12" height="12" rx="2" fill="rgba(148,56,43,0.08)" stroke="#94382b" stroke-width="1"/>
  <text x="442" y="574" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">미지지</text>

  <!-- METRIC swatch -->
  <rect x="524" y="564" width="12" height="12" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.5"/>
  <text x="542" y="574" fill="#3f545c" font-size="9" font-family="'IBM Plex Mono', monospace" letter-spacing="0.10em">최종 지표</text>

</svg>
</body>
</html>
