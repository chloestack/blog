<!DOCTYPE html>

<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"

  <title id="2026-10-15-9124f843-01-atk-title">LLM 공격 표면 분류</title>
  <desc id="2026-10-15-9124f843-01-atk-desc">LLM 시스템의 세 입력·출력 레이어가 공격 표면을 이루고, 각 레이어로부터 발생하는 공격이 시스템 프롬프트 탈취, 금지 콘텐츠 생성, 에이전트 행동 조작 세 가지 목적으로 수렴되는 흐름을 보여주는 플로우차트.</desc>

  <defs>

    <marker id="2026-10-15-9124f843-01-atk-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-15-9124f843-01-atk-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

  <!-- A → C (공격 표면 → 컨텍스트 레이어) -->

  <text x="322" y="559" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">공격 레이어</text>

  <rect x="460" y="548" width="16" height="12" rx="2" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="482" y="559" fill="#3f545c" font-size="11" font-family="'IBM Plex Sans KR', sans-serif">공격 결과</text>
