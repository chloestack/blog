<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사건 4단계</title>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f8fafb; --ink:#122127; --muted:#3f545c; --soft:#6c8188; --accent:#0d5763;
      --sans:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: 'Gothic A1', var(--sans); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · 사고 분석</p>
    <h1>잠복부터 대응까지 — 사건의 네 단계</h1>

    <svg viewBox="0 0 960 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hf-tl-title hf-tl-desc">
      <title id="hf-tl-title">사건 4단계</title>
      <desc id="hf-tl-desc">4월 잠복, 6월 27일의 놓친 차단 기회, 7월 9~13일의 실제 공격, 7월 20일 이후의 대응까지 사건이 네 단계로 진행됐음을 보여주며, 막을 수 있었던 6월 27일을 강조한다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f545c"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafb"/>

      <!-- connectors (straight, shared y) drawn before boxes -->
      <line x1="232" y1="216" x2="264" y2="216" stroke="#3f545c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="464" y1="216" x2="496" y2="216" stroke="#3f545c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="696" y1="216" x2="728" y2="216" stroke="#3f545c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- box 1: 잠복 x=32 -->
      <rect x="32" y="168" width="200" height="96" rx="6" fill="#f8fafb"/>
      <rect x="32" y="168" width="200" height="96" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <rect x="40" y="176" width="60" height="14" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
      <text x="70" y="186" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 1</text>
      <text x="132" y="216" fill="#122127" font-size="15" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">잠복</text>
      <text x="132" y="236" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">4&#183;20 &#8211; 6&#183;26</text>
      <text x="132" y="254" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">게시판 자생 · 관리자 토큰</text>

      <!-- box 2 (focal): 놓친 차단 x=264 -->
      <rect x="264" y="168" width="200" height="96" rx="6" fill="#f8fafb"/>
      <rect x="264" y="168" width="200" height="96" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
      <rect x="272" y="176" width="60" height="14" rx="2" fill="transparent" stroke="rgba(13,87,99,0.45)" stroke-width="0.8"/>
      <text x="302" y="186" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 2</text>
      <text x="364" y="216" fill="#122127" font-size="15" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">놓친 차단 기회</text>
      <text x="364" y="236" fill="#0d5763" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">6&#183;27</text>
      <text x="364" y="254" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">"평가 중단 불필요" 판단</text>

      <!-- box 3: 공격 x=496 -->
      <rect x="496" y="168" width="200" height="96" rx="6" fill="#f8fafb"/>
      <rect x="496" y="168" width="200" height="96" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <rect x="504" y="176" width="60" height="14" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
      <text x="534" y="186" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 3</text>
      <text x="596" y="216" fill="#122127" font-size="15" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">공격</text>
      <text x="596" y="236" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">7&#183;9 &#8211; 7&#183;13</text>
      <text x="596" y="254" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">워커 41대 · 노드 루트</text>

      <!-- box 4: 대응 x=728 -->
      <rect x="728" y="168" width="200" height="96" rx="6" fill="#f8fafb"/>
      <rect x="728" y="168" width="200" height="96" rx="6" fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
      <rect x="736" y="176" width="60" height="14" rx="2" fill="transparent" stroke="rgba(63,84,92,0.45)" stroke-width="0.8"/>
      <text x="766" y="186" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 4</text>
      <text x="828" y="216" fill="#122127" font-size="15" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">대응</text>
      <text x="828" y="236" fill="#3f545c" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">7&#183;20 &#8211; 7&#183;25</text>
      <text x="828" y="254" fill="#6c8188" font-size="12" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">저장소 311개 · 모델 중단</text>

      <!-- legend -->
      <line x1="32" y1="316" x2="928" y2="316" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
      <text x="32" y="336" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.12em">범례</text>
      <rect x="104" y="327" width="18" height="12" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
      <text x="130" y="337" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">막을 수 있었던 지점</text>
      <rect x="300" y="327" width="18" height="12" rx="3" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="326" y="337" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">진행 단계</text>
    </svg>
  </div>
</body>
</html>
