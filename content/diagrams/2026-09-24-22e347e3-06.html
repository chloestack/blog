  <title id="2026-09-24-22e347e3-06-mig-title">Redis 슬롯 마이그레이션 절차</title>
  <desc id="2026-09-24-22e347e3-06-mig-desc">슬롯 마이그레이션 시작부터 SETSLOT MIGRATING, MIGRATE 키 이동, SETSLOT IMPORTING, SETSLOT NODE 완료 선언, 클러스터 맵 전파까지 6단계 순차 흐름을 보여주는 흐름도.</desc>

  <!-- MV → IM -->

  <!-- IM → DN -->

  <!-- DN → UPD -->
  <line x1="836" y1="108" x2="872" y2="108" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-24-22e347e3-06-arr)"/>

  <!-- ── 노드 ── -->

  <!-- 1. 슬롯 마이그레이션 시작 (link / blue-tinted) -->

  <text x="106" y="206" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">시작 / 종료</text>
