<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검색을 다시 밟는 그래프</title>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f8fafb; --ink:#122127; --muted:#3f545c; --soft:#6c8188; --accent:#0d5763;
      --sans:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: 'Gothic A1', var(--sans); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · LangGraph 입문</p>
    <h1>체인에 없는 화살표 하나 — 검색으로 되돌아가는 경로</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lg-retry-title lg-retry-desc">
      <title id="lg-retry-title">검색 결과가 부실하면 질의를 고쳐 다시 찾는 그래프</title>
      <desc id="lg-retry-desc">검색 후 결과가 쓸만한지 판단해, 쓸만하면 답변 생성으로 진행하고 아니면 질의를 다시 써서 두 번까지 검색 단계로 되돌아가는 흐름을 보여준다. 되돌아가는 경로가 체인과 갈라지는 지점이다.</desc>
      <defs>
        <marker id="lg-retry-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f545c"/></marker>
        <marker id="lg-retry-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d5763"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafb"/>

      <!-- arrows before boxes -->
      <line x1="152" y1="204" x2="204" y2="204" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-retry-arrow)"/>
      <line x1="368" y1="204" x2="432" y2="204" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-retry-arrow)"/>
      <line x1="636" y1="204" x2="696" y2="204" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-retry-arrow)"/>
      <line x1="536" y1="260" x2="536" y2="312" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-retry-arrow)"/>
      <path d="M396,348 H296 Q288,348 288,340 V240" fill="none" stroke="#0d5763" stroke-width="1.4" marker-end="url(#lg-retry-arrow-accent)"/>
      <line x1="780" y1="236" x2="780" y2="312" stroke="#3f545c" stroke-width="1.2" marker-end="url(#lg-retry-arrow)"/>

      <!-- edge labels -->
      <rect x="650" y="180" width="32" height="16" rx="2" fill="#f8fafb"/>
      <text x="666" y="192" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>
      <rect x="416" y="272" width="104" height="16" rx="2" fill="#f8fafb"/>
      <text x="468" y="284" fill="#3f545c" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오 · 2회까지</text>

      <!-- nodes -->
      <rect x="40" y="176" width="112" height="56" rx="28" fill="#f8fafb"/>
      <rect x="40" y="176" width="112" height="56" rx="28" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="96" y="209" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">시작</text>

      <rect x="208" y="172" width="160" height="64" rx="6" fill="#f8fafb"/>
      <rect x="208" y="172" width="160" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="288" y="209" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">검색</text>

      <polygon points="436,204 536,148 636,204 536,260" fill="#f8fafb"/>
      <polygon points="436,204 536,148 636,204 536,260" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="536" y="200" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">결과가</text>
      <text x="536" y="220" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">쓸만한가</text>

      <rect x="700" y="172" width="160" height="64" rx="6" fill="#f8fafb"/>
      <rect x="700" y="172" width="160" height="64" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="780" y="209" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">답변 생성</text>

      <rect x="700" y="316" width="160" height="56" rx="28" fill="#f8fafb"/>
      <rect x="700" y="316" width="160" height="56" rx="28" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="780" y="349" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">끝</text>

      <rect x="396" y="316" width="180" height="64" rx="6" fill="#f8fafb"/>
      <rect x="396" y="316" width="180" height="64" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
      <text x="486" y="353" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">질의 다시 쓰기</text>

      <!-- legend -->
      <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
      <text x="40" y="444" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="432" width="20" height="16" rx="8" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
      <text x="168" y="444" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">시작 · 끝</text>
      <polygon points="264,440 280,432 296,440 280,448" fill="#ffffff" stroke="#122127" stroke-width="1"/>
      <text x="304" y="444" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">판단</text>
      <line x1="376" y1="440" x2="408" y2="440" stroke="#0d5763" stroke-width="1.4"/>
      <text x="416" y="444" fill="#3f545c" font-size="12" font-family="'IBM Plex Sans KR', sans-serif">체인에는 없는 되돌아가는 경로</text>
    </svg>
  </div>
</body>
</html>
