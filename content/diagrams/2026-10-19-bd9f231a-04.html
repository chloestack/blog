<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티에이전트 핸드오프 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"
     role="img" aria-labelledby="2026-10-19-bd9f231a-04-handoff-title 2026-10-19-bd9f231a-04-handoff-desc">

  <title id="2026-10-19-bd9f231a-04-handoff-title">멀티에이전트 핸드오프 흐름도</title>
  <desc id="2026-10-19-bd9f231a-04-handoff-desc">사용자 요청이 트리아지 에이전트에 도달한 뒤 요청 유형에 따라 결제 에이전트 또는 기술지원 에이전트로 핸드오프되거나, 불명확한 경우 재확인을 요청하는 흐름을 보여준다.</desc>

  <defs>
    <!-- dot background pattern -->
    <pattern id="2026-10-19-bd9f231a-04-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(18,33,39,0.08)"/>
    </pattern>

    <!-- arrow markers -->
    <marker id="2026-10-19-bd9f231a-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-04-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-04-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
    <marker id="2026-10-19-bd9f231a-04-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6c8188"/>
    </marker>
  </defs>

  <!-- page background -->
  <rect width="960" height="560" fill="#f8fafb"/>
  <rect width="960" height="560" fill="url(#2026-10-19-bd9f231a-04-dots)" opacity="0.5"/>

  <!-- ============================================================
       CONNECTORS (drawn before boxes)
       Layout (cx values):
         사용자     cx=96   y=240  w=112 h=52
         트리아지   cx=252  y=240  w=128 h=52
         요청유형◇  cx=432  y=240  w=108 h=64  (decision)
         결제에이전트  cx=620  y=148  w=140 h=52
         기술지원      cx=620  y=332  w=128 h=52
         재확인요청    cx=620  y=240  w=136 h=52
         결제처리      cx=820  y=148  w=112 h=52
         티켓생성      cx=820  y=332  w=112 h=52
       ============================================================ -->

  <!-- 사용자 → 트리아지 : right edge of 사용자 (x=152) → left edge of 트리아지 (x=188) -->
  <line x1="152" y1="266" x2="188" y2="266" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-04-arrow)"/>

  <!-- 트리아지 → 요청유형◇ : right edge of 트리아지 (x=316) → left vertex of diamond (x=378) -->
  <line x1="316" y1="266" x2="378" y2="272" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-10-19-bd9f231a-04-arrow-accent)"/>

  <!-- 요청유형◇ → 결제 에이전트 (upward-right)
       diamond right vertex ≈ (486,272), 결제 에이전트 left edge x=550 cy=174
       orthogonal: right from diamond to x=520, then up to y=174, then right to 550 -->
  <path d="M486,272 L520,272 L520,174 L550,174"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-04-arrow)"/>

  <!-- 요청유형◇ → 기술지원 (downward-right)
       diamond right vertex ≈ (486,272), 기술지원 left edge x=556 cy=358
       orthogonal: right from diamond to x=520, then down to y=358, then right to 556 -->
  <path d="M486,272 L520,272 L520,358 L556,358"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-04-arrow)"/>

  <!-- 요청유형◇ → 재확인요청 : right vertex of diamond (x=486,y=272) → left edge of 재확인 (x=552,y=266) -->
  <line x1="486" y1="272" x2="552" y2="266" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-04-arrow)"/>

  <!-- 결제 에이전트 → 결제처리 -->
  <line x1="690" y1="174" x2="764" y2="174" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-04-arrow-muted)"/>

  <!-- 기술지원 → 티켓생성 -->
  <line x1="684" y1="358" x2="764" y2="358" stroke="#6c8188" stroke-width="1" marker-end="url(#2026-10-19-bd9f231a-04-arrow-muted)"/>

  <!-- 재확인요청 → 사용자 (loop back)
       재확인요청 bottom center cx=620 y=292 → down to y=440 → left to x=96 → up to 사용자 bottom y=292 -->
  <path d="M620,292 L620,440 L96,440 L96,292"
        fill="none" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-19-bd9f231a-04-arrow-warn)"/>

  <!-- ============================================================
       ARROW LABELS
       ============================================================ -->

  <!-- "결제 관련" label — on segment from x=520,y=272→y=174, mid y=(272+174)/2=223 -->
  <rect x="526" y="205" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="552" y="215" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif"
        font-weight="500" text-anchor="middle">결제 관련</text>

  <!-- "기술 오류" label — on segment from x=520,y=272→y=358, mid y=(272+358)/2=315 -->
  <rect x="526" y="298" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="552" y="308" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif"
        font-weight="500" text-anchor="middle">기술 오류</text>

  <!-- "불명확" label — on horizontal segment y=272 from x=486→x=552, mid x=519 -->
  <rect x="501" y="256" width="36" height="14" rx="2" fill="#f8fafb"/>
  <text x="519" y="266" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif"
        font-weight="500" text-anchor="middle">불명확</text>

  <!-- "재확인" return label — bottom segment at y=440, mid x between 620 and 96 = 358 -->
  <rect x="332" y="426" width="52" height="14" rx="2" fill="#f8fafb"/>
  <text x="358" y="436" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace"
        font-weight="400" text-anchor="middle">재확인 요청</text>

  <!-- ============================================================
       NODES
       ============================================================ -->

  <!-- 사용자  cx=96 cy=266  w=112 h=52  input treatment -->
  <rect x="40" y="240" width="112" height="52" rx="6" fill="#f8fafb"/>
  <rect x="40" y="240" width="112" height="52" rx="6" fill="rgba(63,84,92,0.10)" stroke="#6c8188" stroke-width="1"/>
  <rect x="48" y="248" width="24" height="11" rx="2" fill="transparent" stroke="rgba(108,129,136,0.40)" stroke-width="0.8"/>
  <text x="60" y="256.5" fill="rgba(108,129,136,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="96" y="273" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">사용자</text>

  <!-- 트리아지  cx=252 cy=266  w=128 h=52  focal (accent) -->
  <rect x="188" y="240" width="128" height="52" rx="6" fill="#f8fafb"/>
  <rect x="188" y="240" width="128" height="52" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="196" y="248" width="36" height="11" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="214" y="256.5" fill="rgba(13,87,99,0.85)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">TRIAGE</text>
  <text x="252" y="273" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">트리아지</text>

  <!-- 요청 유형 decision diamond  cx=432 cy=272  w=108 h=64 -->
  <!-- diamond: top(432,240) right(486,272) bottom(432,304) left(378,272) -->
  <polygon points="432,240 486,272 432,304 378,272" fill="#f8fafb"/>
  <polygon points="432,240 486,272 432,304 378,272"
           fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="432" y="268" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">요청</text>
  <text x="432" y="284" fill="#122127" font-size="12" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">유형</text>

  <!-- 결제 에이전트  cx=620 cy=174  w=140 h=52  backend -->
  <rect x="550" y="148" width="140" height="52" rx="6" fill="#f8fafb"/>
  <rect x="550" y="148" width="140" height="52" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="558" y="156" width="52" height="11" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="584" y="164.5" fill="rgba(18,33,39,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="620" y="181" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">결제 에이전트</text>

  <!-- 기술지원  cx=620 cy=358  w=128 h=52  backend -->
  <rect x="556" y="332" width="128" height="52" rx="6" fill="#f8fafb"/>
  <rect x="556" y="332" width="128" height="52" rx="6" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <rect x="564" y="340" width="52" height="11" rx="2" fill="transparent" stroke="rgba(18,33,39,0.35)" stroke-width="0.8"/>
  <text x="590" y="348.5" fill="rgba(18,33,39,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="620" y="365" fill="#122127" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">기술지원</text>

  <!-- 재확인 요청  cx=620 cy=266  w=136 h=52  optional/async -->
  <rect x="552" y="240" width="136" height="52" rx="6" fill="#f8fafb"/>
  <rect x="552" y="240" width="136" height="52" rx="6"
        fill="rgba(18,33,39,0.02)" stroke="rgba(18,33,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="560" y="248" width="44" height="11" rx="2" fill="transparent" stroke="rgba(18,33,39,0.22)" stroke-width="0.8"/>
  <text x="582" y="256.5" fill="rgba(18,33,39,0.55)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">RETRY</text>
  <text x="620" y="271" fill="#3f545c" font-size="13" font-weight="500"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">트리아지</text>
  <text x="620" y="286" fill="#3f545c" font-size="13" font-weight="500"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">재확인 요청</text>

  <!-- 결제처리  cx=820 cy=174  w=112 h=52  store/output -->
  <rect x="764" y="148" width="112" height="52" rx="6" fill="#f8fafb"/>
  <rect x="764" y="148" width="112" height="52" rx="6"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="772" y="156" width="44" height="11" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="794" y="164.5" fill="rgba(63,84,92,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">RESULT</text>
  <text x="820" y="181" fill="#3f545c" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">결제 처리</text>

  <!-- 티켓생성  cx=820 cy=358  w=112 h=52  store/output -->
  <rect x="764" y="332" width="112" height="52" rx="6" fill="#f8fafb"/>
  <rect x="764" y="332" width="112" height="52" rx="6"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="772" y="340" width="44" height="11" rx="2" fill="transparent" stroke="rgba(63,84,92,0.35)" stroke-width="0.8"/>
  <text x="794" y="348.5" fill="rgba(63,84,92,0.75)" font-size="7" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">RESULT</text>
  <text x="820" y="365" fill="#3f545c" font-size="14" font-weight="600"
        font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">티켓 생성</text>

  <!-- ============================================================
       LEGEND strip
       ============================================================ -->
  <line x1="40" y1="496" x2="920" y2="496" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>

  <!-- legend item: focal -->
  <rect x="40" y="508" width="16" height="12" rx="3" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="62" y="518" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.08em">핵심 에이전트</text>

  <!-- legend item: backend -->
  <rect x="188" y="508" width="16" height="12" rx="3" fill="#ffffff" stroke="#122127" stroke-width="1"/>
  <text x="210" y="518" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.08em">처리 에이전트</text>

  <!-- legend item: optional/async -->
  <rect x="336" y="508" width="16" height="12" rx="3"
        fill="rgba(18,33,39,0.02)" stroke="rgba(18,33,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="358" y="518" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.08em">재시도 경로</text>

  <!-- legend item: output/store -->
  <rect x="472" y="508" width="16" height="12" rx="3"
        fill="rgba(18,33,39,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="494" y="518" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.08em">처리 결과</text>

  <!-- legend item: dashed arrow -->
  <line x1="592" y1="514" x2="616" y2="514" stroke="#6c8188" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#2026-10-19-bd9f231a-04-arrow-muted)"/>
  <text x="624" y="518" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.08em">Handoff 복귀</text>

</svg>
</body>
</html>
