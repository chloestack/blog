<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이전트 실행 루프</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .diagram-wrap { display: block; width: 100%; max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="diagram-wrap">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2026-10-13-b98ce030-04-agent-loop-title 2026-10-13-b98ce030-04-agent-loop-desc">
  <title id="2026-10-13-b98ce030-04-agent-loop-title">에이전트 실행 루프 — 컨텍스트 윈도우 관리</title>
  <desc id="2026-10-13-b98ce030-04-agent-loop-desc">작업 개시부터 결과 저장까지 LLM 에이전트의 실행 루프를 보여주는 순서도. 컨텍스트 임계치 초과 시 압축 분기가 발생한다.</desc>

  <defs>
    <!-- 기본 화살표 -->
    <marker id="2026-10-13-b98ce030-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- 강조 화살표 -->
    <marker id="2026-10-13-b98ce030-04-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 경고 화살표 -->
    <marker id="2026-10-13-b98ce030-04-arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a96a08"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ══════════════════════════════════════════
       화살표 (노드보다 먼저 그림)
  ══════════════════════════════════════════ -->

  <!-- INIT → LOOP: 아래로 (x=480, y=108 → y=184) -->
  <path d="M 480,108 L 480,184" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow)"/>

  <!-- LOOP → TOOL: 아래로 (y=232 → y=300) -->
  <path d="M 480,232 L 480,300" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow-accent)"/>

  <!-- TOOL → CHK: 아래로 (y=348 → y=404) -->
  <path d="M 480,348 L 480,404" stroke="#0d5763" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow-accent)"/>

  <!-- CHK 아니오 → DONE: 오른쪽으로 (x=536, y=432 → x=664, y=432) -->
  <path d="M 536,432 L 664,432" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow)"/>
  <!-- 아니오 레이블 -->
  <rect x="572" y="420" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="594" y="430" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- CHK 예 → COMPRESS: 왼쪽으로 (x=424, y=432 → x=220, y=432) 그 후 아래로 -->
  <path d="M 424,432 L 220,432" stroke="#a96a08" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow-warn)"/>
  <!-- 예 레이블 -->
  <rect x="294" y="420" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="306" y="430" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- COMPRESS → DONE: 오른쪽으로 (x=308, y=480 → x=664, y=480) 그 후 위로 DONE 하단에 연결 -->
  <!-- COMPRESS 하단(y=512) → 아래쪽 우회 → DONE 하단(y=460+24=484?) -->
  <!-- COMPRESS 오른쪽 엣지(x=308, y=480) → DONE 하단(y=484) via 수평 + 수직 -->
  <path d="M 308,480 Q 308,508 340,508 L 720,508 Q 752,508 752,480 L 752,460" stroke="#a96a08" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow-warn)"/>

  <!-- DONE 아니오 → LOOP: 오른쪽 → 위로 (DONE 오른쪽 x=800, y=432 → 800, y=208 → LOOP 오른쪽 x=548, y=208) -->
  <path d="M 800,432 Q 832,432 832,404 L 832,208 Q 832,184 800,184 L 548,184" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow)"/>
  <!-- 아니오 레이블 (오른쪽 세로 경로 옆) -->
  <rect x="820" y="296" width="44" height="14" rx="2" fill="#f8fafb"/>
  <text x="842" y="306" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">아니오</text>

  <!-- DONE 예 → SAVE: 아래로 (x=752, y=460 → x=752, y=524) -->
  <path d="M 752,460 L 752,524" stroke="#3f545c" stroke-width="1" fill="none" marker-end="url(#2026-10-13-b98ce030-04-arrow)"/>
  <!-- 예 레이블 -->
  <rect x="730" y="476" width="24" height="14" rx="2" fill="#f8fafb"/>
  <text x="742" y="486" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">예</text>

  <!-- ══════════════════════════════════════════
       노드
  ══════════════════════════════════════════ -->

  <!-- INIT: 작업 개시 (oval, 시작) x=380 y=60 w=200 h=48 -->
  <rect x="380" y="60" width="200" height="48" rx="24" fill="#f8fafb"/>
  <rect x="380" y="60" width="200" height="48" rx="24" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="480" y="80" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">작업 개시</text>
  <text x="480" y="98" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">시스템 프롬프트 설정</text>

  <!-- LOOP: 실행 루프 (focal, accent) x=380 y=184 w=200 h=48 -->
  <rect x="380" y="184" width="200" height="48" rx="6" fill="#f8fafb"/>
  <rect x="380" y="184" width="200" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 태그 -->
  <rect x="388" y="190" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="404" y="199" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
  <text x="480" y="213" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">실행 루프</text>
  <text x="480" y="228" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">모델 호출</text>

  <!-- TOOL: 도구 실행 x=380 y=300 w=200 h=48 -->
  <rect x="380" y="300" width="200" height="48" rx="6" fill="#f8fafb"/>
  <rect x="380" y="300" width="200" height="48" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- 태그 -->
  <rect x="388" y="306" width="32" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="404" y="315" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="480" y="329" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">도구 실행</text>
  <text x="480" y="344" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">결과 수집</text>

  <!-- CHK: 컨텍스트 임계치 초과? (다이아몬드) 중심 x=480, y=432 -->
  <!-- 다이아몬드: top(480,404) right(536,432) bottom(480,460) left(424,432) -->
  <polygon points="480,404 536,432 480,460 424,432" fill="#f8fafb"/>
  <polygon points="480,404 536,432 480,460 424,432" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="480" y="428" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">컨텍스트</text>
  <text x="480" y="442" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">임계치 초과?</text>

  <!-- COMPRESS: 컨텍스트 압축 (warn) x=100 y=456 w=208 h=48 -->
  <rect x="100" y="456" width="208" height="48" rx="6" fill="#f8fafb"/>
  <rect x="100" y="456" width="208" height="48" rx="6" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <!-- 태그 -->
  <rect x="108" y="462" width="40" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.4)" stroke-width="0.8"/>
  <text x="128" y="471" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPRESS</text>
  <text x="204" y="485" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">컨텍스트 압축</text>
  <text x="204" y="499" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">불필요 정보 제거</text>

  <!-- DONE: 작업 완료? (다이아몬드) 중심 x=752, y=432 -->
  <!-- 다이아몬드: top(752,408) right(800,432) bottom(752,456) left(704,432) -->
  <polygon points="752,408 800,432 752,456 704,432" fill="#f8fafb"/>
  <polygon points="752,408 800,432 752,456 704,432" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="752" y="428" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">작업</text>
  <text x="752" y="442" fill="#122127" font-size="10" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">완료?</text>

  <!-- SAVE: 결과 저장 (oval, 종료) x=652 y=524 w=200 h=48 -->
  <rect x="652" y="524" width="200" height="48" rx="24" fill="#f8fafb"/>
  <rect x="652" y="524" width="200" height="48" rx="24" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="752" y="544" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">결과 저장</text>
  <text x="752" y="562" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">컨텍스트 초기화</text>

  <!-- ══════════════════════════════════════════
       범례 (하단 가로 스트립)
  ══════════════════════════════════════════ -->
  <line x1="30" y1="588" x2="930" y2="588" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>

  <!-- 범례 아이템 1: 주요 단계 -->
  <rect x="30" y="594" width="12" height="8" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="48" y="601" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">주요 단계</text>

  <!-- 범례 아이템 2: 압축 분기 -->
  <rect x="160" y="594" width="12" height="8" rx="2" fill="rgba(169,106,8,0.08)" stroke="#a96a08" stroke-width="1"/>
  <text x="178" y="601" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">압축 분기</text>

  <!-- 범례 아이템 3: 시작/종료 -->
  <rect x="290" y="594" width="12" height="8" rx="4" fill="rgba(58,84,143,0.08)" stroke="#3a548f" stroke-width="1"/>
  <text x="308" y="601" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">시작 / 종료</text>

  <!-- 범례 아이템 4: 결과 저장 -->
  <rect x="420" y="594" width="12" height="8" rx="4" fill="rgba(40,109,80,0.08)" stroke="#286d50" stroke-width="1"/>
  <text x="438" y="601" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">정상 완료</text>

  <!-- 범례 아이템 5: 판단 -->
  <polygon points="556,598 564,594 572,598 564,602" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="578" y="601" fill="#6c8188" font-size="9" font-family="'IBM Plex Sans KR', sans-serif">판단 분기</text>

</svg>
</div>
</body>
</html>
