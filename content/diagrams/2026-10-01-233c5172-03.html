<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도구 실행 오류 처리 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f8fafb; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 0; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  viewBox="0 0 960 600"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="2026-10-01-233c5172-03-tool-flow-title 2026-10-01-233c5172-03-tool-flow-desc"
>
  <title id="2026-10-01-233c5172-03-tool-flow-title">도구 실행 오류 처리 흐름</title>
  <desc id="2026-10-01-233c5172-03-tool-flow-desc">LLM 에이전트가 도구를 실행한 뒤 성공 시 구조화된 결과를 반환하고, 실패 시 오류 유형(인자 오류·권한 오류·일시적 오류)에 따라 각각 다른 응답을 생성하여 에이전트 재추론으로 수렴하는 흐름을 보여주는 순서도.</desc>

  <defs>
    <!-- arrow: muted -->
    <marker id="2026-10-01-233c5172-03-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- arrow: accent -->
    <marker id="2026-10-01-233c5172-03-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- arrow: link -->
    <marker id="2026-10-01-233c5172-03-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a548f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f8fafb"/>

  <!-- ===================== ARROWS (drawn before boxes) ===================== -->

  <!-- T → Q (도구 실행 → 성공 여부) -->
  <line x1="172" y1="148" x2="248" y2="148" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>

  <!-- Q → RS (성공) — goes right then turn down to RS at y=96 -->
  <!-- Q center: (288, 148), RS center: (472, 96) -->
  <!-- path: from Q right edge (328,148) → elbow right to x=360, up to y=96, right to RS left edge (400,96) -->
  <path d="M 328 148 L 360 148 Q 368 148 368 140 L 368 104 Q 368 96 376 96 L 400 96"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>
  <!-- label 성공 -->
  <rect x="330" y="104" width="32" height="14" rx="2" fill="#f8fafb"/>
  <text x="346" y="115" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">성공</text>

  <!-- Q → ET (실패) — goes down -->
  <!-- Q bottom: (288, 168), ET center: (288, 252) -->
  <line x1="288" y1="168" x2="288" y2="228" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>
  <!-- label 실패 -->
  <rect x="264" y="186" width="32" height="14" rx="2" fill="#f8fafb"/>
  <text x="280" y="197" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">실패</text>

  <!-- ET → EA (잘못된 인자) — goes left+up to EA at (472, 196) ... wait, we lay out EA/EP/ER on right side -->
  <!-- Layout plan:
       ET center: (288, 268)
       EA center: (532, 188)  — top branch
       EP center: (532, 268)  — middle branch
       ER center: (532, 348)  — bottom branch
       RS center: (532, 96)   — success
       AG center: (780, 268)  — agent
  -->

  <!-- ET → EA (잘못된 인자) right+up -->
  <!-- ET right: (328, 268) → x=360, curve up to y=188 → right to EA left (460, 188) -->
  <path d="M 328 268 L 360 268 Q 368 268 368 260 L 368 196 Q 368 188 376 188 L 460 188"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>
  <!-- label -->
  <rect x="330" y="216" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="360" y="227" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">잘못된 인자</text>

  <!-- ET → EP (권한 없음) right straight -->
  <line x1="328" y1="268" x2="460" y2="268" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>
  <!-- label -->
  <rect x="344" y="252" width="48" height="14" rx="2" fill="#f8fafb"/>
  <text x="368" y="263" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">권한 없음</text>

  <!-- ET → ER (일시적 오류) right+down -->
  <path d="M 328 268 L 360 268 Q 368 268 368 276 L 368 340 Q 368 348 376 348 L 460 348"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>
  <!-- label -->
  <rect x="330" y="296" width="60" height="14" rx="2" fill="#f8fafb"/>
  <text x="360" y="307" fill="#6c8188" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">일시적 오류</text>

  <!-- RS → AG (성공 결과 → 에이전트 재추론) -->
  <!-- RS right: (604, 96) → right to x=780-74=706... AG left: (706, 268) -->
  <!-- path: RS right (604,96) → x=660, down to y=268, right to AG left (706,268) -->
  <path d="M 604 96 L 660 96 Q 668 96 668 104 L 668 260 Q 668 268 676 268 L 706 268"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>

  <!-- EA → AG (인자 오류 → 에이전트) -->
  <!-- EA right: (604, 188) → right to x=628, down to y=268... wait simpler -->
  <!-- EA right (604,188) → x=640, down to y=268 → right to AG left (706,268) -->
  <path d="M 604 188 L 640 188 Q 648 188 648 196 L 648 260 Q 648 268 656 268 L 706 268"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>

  <!-- EP → AG (권한 오류 → 에이전트) -->
  <!-- EP right: (604, 268) → straight to AG left (706, 268) -->
  <line x1="604" y1="268" x2="706" y2="268" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>

  <!-- ER → AG (재시도 → 에이전트) -->
  <!-- ER right: (604, 348) → x=640, up to y=268 → right to AG left (706, 268) -->
  <path d="M 604 348 L 640 348 Q 648 348 648 340 L 648 276 Q 648 268 656 268 L 706 268"
        fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>

  <!-- ===================== NODES ===================== -->

  <!-- T: 도구 실행 — focal (accent) -->
  <!-- center (100, 148), w=144, h=52 -->
  <rect x="28" y="122" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="28" y="122" width="144" height="52" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <!-- type tag -->
  <rect x="36" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="54" y="137" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <!-- label -->
  <text x="100" y="152" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">도구 실행</text>

  <!-- Q: 성공 여부 — decision diamond, accent -->
  <!-- center (288, 148), half-w=40, half-h=28 -->
  <rect x="248" y="120" width="80" height="56" rx="0" fill="#f8fafb"/>
  <polygon points="288,120 328,148 288,176 248,148" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="288" y="145" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">성공</text>
  <text x="288" y="159" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">여부?</text>

  <!-- RS: 구조화된 결과 — store/ok node -->
  <!-- center (532, 96), w=144, h=52 -->
  <rect x="460" y="70" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="460" y="70" width="144" height="52" rx="6" fill="rgba(13,87,99,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="468" y="76" width="36" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.4)" stroke-width="0.8"/>
  <text x="486" y="85" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
  <text x="532" y="99" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">구조화된 결과</text>
  <text x="532" y="114" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">맥락 포함 반환</text>

  <!-- ET: 오류 유형 — decision diamond, accent -->
  <!-- center (288, 268), half-w=40, half-h=28 -->
  <rect x="248" y="240" width="80" height="56" rx="0" fill="#f8fafb"/>
  <polygon points="288,240 328,268 288,296 248,268" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <text x="288" y="265" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">오류</text>
  <text x="288" y="279" fill="#122127" font-size="11" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">유형?</text>

  <!-- EA: 인자 오류 — warn node -->
  <!-- center (532, 188), w=144, h=52 -->
  <rect x="460" y="162" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="460" y="162" width="144" height="52" rx="6" fill="rgba(63,84,92,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="468" y="168" width="36" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.4)" stroke-width="0.8"/>
  <text x="486" y="177" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERROR</text>
  <text x="532" y="191" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">인자 오류</text>
  <text x="532" y="206" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">수정 방법 제시</text>

  <!-- EP: 권한 오류 — warn node -->
  <!-- center (532, 268), w=144, h=52 -->
  <rect x="460" y="242" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="460" y="242" width="144" height="52" rx="6" fill="rgba(63,84,92,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="468" y="248" width="36" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.4)" stroke-width="0.8"/>
  <text x="486" y="257" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERROR</text>
  <text x="532" y="271" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">권한 오류</text>
  <text x="532" y="286" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">대안 도구 제안</text>

  <!-- ER: 재시도 가능 — warn node -->
  <!-- center (532, 348), w=144, h=52 -->
  <rect x="460" y="322" width="144" height="52" rx="6" fill="#f8fafb"/>
  <rect x="460" y="322" width="144" height="52" rx="6" fill="rgba(63,84,92,0.05)" stroke="#3f545c" stroke-width="1"/>
  <rect x="468" y="328" width="44" height="12" rx="2" fill="transparent" stroke="rgba(63,84,92,0.4)" stroke-width="0.8"/>
  <text x="490" y="337" fill="rgba(63,84,92,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
  <text x="532" y="351" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">재시도 가능</text>
  <text x="532" y="366" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">대기 시간 포함</text>

  <!-- AG: 에이전트 재추론 — focal (accent) -->
  <!-- center (780, 268), w=164, h=52 -->
  <rect x="706" y="242" width="164" height="52" rx="6" fill="#f8fafb"/>
  <rect x="706" y="242" width="164" height="52" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="714" y="248" width="44" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.4)" stroke-width="0.8"/>
  <text x="736" y="257" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="788" y="272" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">에이전트</text>
  <text x="788" y="287" fill="#122127" font-size="14" font-weight="600" font-family="'IBM Plex Sans KR', sans-serif" text-anchor="middle">재추론</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="30" y1="526" x2="930" y2="526" stroke="rgba(18,33,39,0.12)" stroke-width="0.8"/>
  <text x="30" y="540" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="100" y="530" width="14" height="14" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="120" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">진입·수렴 노드</text>

  <!-- diamond -->
  <polygon points="222,537 230,531 238,537 230,543" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="246" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">분기 판단</text>

  <!-- error node -->
  <rect x="340" y="530" width="14" height="14" rx="2" fill="rgba(63,84,92,0.05)" stroke="#3f545c" stroke-width="1"/>
  <text x="360" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">오류 처리·결과</text>

  <!-- arrow -->
  <line x1="480" y1="537" x2="504" y2="537" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-10-01-233c5172-03-arrow)"/>
  <text x="512" y="541" fill="#3f545c" font-size="10" font-family="'IBM Plex Sans KR', sans-serif">흐름</text>

</svg>
</body>
</html>
