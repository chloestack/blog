<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassLoader 메모리 구조</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8fafb; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  svg { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 480"
  role="img"
  aria-labelledby="2026-09-21-56d0a588-05-cl-mem-title 2026-09-21-56d0a588-05-cl-mem-desc"
>
  <title id="2026-09-21-56d0a588-05-cl-mem-title">ClassLoader 메모리 구조</title>
  <desc id="2026-09-21-56d0a588-05-cl-mem-desc">ClassLoader 인스턴스가 Metaspace의 클래스 메타데이터와 Heap의 클래스 인스턴스를 가리키며, 강한 참조가 존재하면 GC 불가, 참조가 없으면 GC 대상이 됨을 보여주는 다이어그램.</desc>

  <defs>
    <!-- 기본 화살표 (muted) -->
    <marker id="2026-09-21-56d0a588-05-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3f545c"/>
    </marker>
    <!-- accent 화살표 -->
    <marker id="2026-09-21-56d0a588-05-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d5763"/>
    </marker>
    <!-- 위험 화살표 (GC 불가) -->
    <marker id="2026-09-21-56d0a588-05-arrow-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94382b"/>
    </marker>
    <!-- 허용 화살표 (GC 대상) -->
    <marker id="2026-09-21-56d0a588-05-arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#286d50"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="480" fill="#f8fafb"/>

  <!-- ─── 화살표 (노드보다 먼저) ─── -->

  <!-- REF → CL (강한 참조 존재, GC 불가) -->
  <!-- REF 우측(356,188) → CL 좌측(440,188) -->
  <path d="M 356,188 L 432,188" fill="none" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-09-21-56d0a588-05-arrow-stop)"/>
  <!-- 라벨: GC 불가 -->
  <rect x="358" y="172" width="68" height="14" rx="2" fill="#f8fafb"/>
  <text x="392" y="182" fill="#94382b" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GC 불가</text>

  <!-- NOREF → CL (참조 없음, GC 대상) -->
  <!-- NOREF 우측(356,276) → 꺾어서 CL 좌측(440,220) -->
  <path d="M 356,276 L 400,276 L 400,228 L 432,228" fill="none" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-21-56d0a588-05-arrow-ok)" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 라벨: GC 대상 -->
  <rect x="360" y="260" width="68" height="14" rx="2" fill="#f8fafb"/>
  <text x="394" y="270" fill="#286d50" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GC 대상</text>

  <!-- CL → META (ClassLoader → Metaspace) -->
  <!-- CL 우측(564,196) → META 좌측(624,152) -->
  <path d="M 564,196 L 596,196 L 596,152 L 616,152" fill="none" stroke="#0d5763" stroke-width="1.2" marker-end="url(#2026-09-21-56d0a588-05-arrow-accent)" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CL → HEAP (ClassLoader → Heap) -->
  <!-- CL 우측(564,228) → HEAP 좌측(624,276) -->
  <path d="M 564,228 L 596,228 L 596,276 L 616,276" fill="none" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-05-arrow-muted)" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ─── 노드 ─── -->

  <!-- 강한 참조 존재 (stop) -->
  <!-- x=200, y=156, w=156, h=64 -->
  <rect x="200" y="156" width="156" height="64" rx="6" fill="#f8fafb"/>
  <rect x="200" y="156" width="156" height="64" rx="6" fill="rgba(241,217,212,0.6)" stroke="#94382b" stroke-width="1"/>
  <rect x="208" y="162" width="40" height="12" rx="2" fill="transparent" stroke="rgba(148,56,43,0.40)" stroke-width="0.8"/>
  <text x="228" y="171" fill="rgba(148,56,43,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="278" y="193" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">강한 참조 존재</text>
  <text x="278" y="209" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">strong reference</text>

  <!-- 참조 없음 (ok) -->
  <!-- x=200, y=244, w=156, h=64 -->
  <rect x="200" y="244" width="156" height="64" rx="6" fill="#f8fafb"/>
  <rect x="200" y="244" width="156" height="64" rx="6" fill="rgba(214,233,222,0.6)" stroke="#286d50" stroke-width="1"/>
  <rect x="208" y="250" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,109,80,0.40)" stroke-width="0.8"/>
  <text x="228" y="259" fill="rgba(40,109,80,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="278" y="281" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">참조 없음</text>
  <text x="278" y="297" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">no reference</text>

  <!-- ClassLoader 인스턴스 (focal / accent) -->
  <!-- x=440, y=168, w=124, h=88 -->
  <rect x="440" y="168" width="124" height="88" rx="6" fill="#f8fafb"/>
  <rect x="440" y="168" width="124" height="88" rx="6" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1.2"/>
  <rect x="448" y="174" width="48" height="12" rx="2" fill="transparent" stroke="rgba(13,87,99,0.40)" stroke-width="0.8"/>
  <text x="472" y="183" fill="rgba(13,87,99,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
  <text x="502" y="214" fill="#122127" font-size="13" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">ClassLoader</text>
  <text x="502" y="232" fill="#0d5763" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">인스턴스</text>

  <!-- Metaspace (warn / 클래스 메타데이터) -->
  <!-- x=616, y=116, w=168, h=72 -->
  <rect x="616" y="116" width="168" height="72" rx="6" fill="#f8fafb"/>
  <rect x="616" y="116" width="168" height="72" rx="6" fill="rgba(245,232,204,0.7)" stroke="#a96a08" stroke-width="1"/>
  <rect x="624" y="122" width="56" height="12" rx="2" fill="transparent" stroke="rgba(169,106,8,0.40)" stroke-width="0.8"/>
  <text x="652" y="131" fill="rgba(169,106,8,0.8)" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="700" y="156" fill="#122127" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Metaspace</text>
  <text x="700" y="172" fill="#3f545c" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">클래스 메타데이터</text>

  <!-- Heap (mute / 클래스 인스턴스) -->
  <!-- x=616, y=244, w=168, h=64 -->
  <rect x="616" y="244" width="168" height="64" rx="6" fill="#f8fafb"/>
  <rect x="616" y="244" width="168" height="64" rx="6" fill="rgba(18,33,39,0.04)" stroke="#c3d0d4" stroke-width="1"/>
  <rect x="624" y="250" width="40" height="12" rx="2" fill="transparent" stroke="rgba(99,129,136,0.40)" stroke-width="0.8"/>
  <text x="644" y="259" fill="#6c8188" font-size="7" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="700" y="281" fill="#3f545c" font-size="12" font-weight="600" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">Heap</text>
  <text x="700" y="297" fill="#6c8188" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">클래스 인스턴스</text>

  <!-- ─── 범례 ─── -->
  <line x1="32" y1="412" x2="928" y2="412" stroke="rgba(18,33,39,0.10)" stroke-width="0.8"/>
  <text x="32" y="428" fill="#3f545c" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <!-- focal -->
  <rect x="96" y="420" width="10" height="10" rx="2" fill="rgba(13,87,99,0.08)" stroke="#0d5763" stroke-width="1"/>
  <text x="110" y="429" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">핵심 객체 (focal)</text>

  <!-- warn -->
  <rect x="240" y="420" width="10" height="10" rx="2" fill="rgba(245,232,204,0.7)" stroke="#a96a08" stroke-width="1"/>
  <text x="254" y="429" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">메모리 영역</text>

  <!-- stop -->
  <line x1="376" y1="424" x2="392" y2="424" stroke="#94382b" stroke-width="1.2" marker-end="url(#2026-09-21-56d0a588-05-arrow-stop)"/>
  <text x="398" y="429" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">GC 불가</text>

  <!-- ok -->
  <line x1="480" y1="424" x2="496" y2="424" stroke="#286d50" stroke-width="1.2" marker-end="url(#2026-09-21-56d0a588-05-arrow-ok)"/>
  <text x="502" y="429" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">GC 대상</text>

  <!-- muted -->
  <line x1="580" y1="424" x2="596" y2="424" stroke="#3f545c" stroke-width="1" marker-end="url(#2026-09-21-56d0a588-05-arrow-muted)"/>
  <text x="602" y="429" fill="#3f545c" font-size="9" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">참조 관계</text>

</svg>
</body>
</html>
