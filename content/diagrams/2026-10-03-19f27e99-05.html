<title id="2026-10-03-19f27e99-05-flowchart-title">추론 모델 선택 플로우차트</title>
<desc id="2026-10-03-19f27e99-05-flowchart-desc">작업 유형에 따라 표준 모델(Haiku·Sonnet)과 추론 모델(o3·Opus) 중 하나를 선택하는 의사결정 흐름. 단일 정답 여부와 패턴 매칭 가능 여부, 설계·분석·증명 여부를 순서대로 판단해 모델을 고른다.</desc>
